<style>
  /* Paper cutout, in Hollow: ink, slate, rose-grey and paper white. Everything casts a little shadow. */
  :root {
    --ink: #0f0f1b; --slate: #565a75; --rose: #c6b7be; --paper: #fafbf6;
    --head: 'Shrikhand', Georgia, serif; --body: 'Patrick Hand', 'Comic Sans MS', sans-serif; --type: 'Special Elite', 'Courier New', monospace;
    color-scheme: light;
  }
  html, body { background: var(--rose); color: var(--ink); }
  [hidden] { display: none !important; }
  body {
    margin: 0; font: 17px/1.35 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(10px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
    background-image: radial-gradient(#565a7522 1px, transparent 1.4px); background-size: 9px 9px;
  }
  .wrap { max-width: 1140px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 2px 0 6px; }
  h1 { font: 400 38px/1.05 var(--head); margin: 0; color: var(--paper); text-shadow: 3px 3px 0 var(--ink); transform: rotate(-1.5deg); }
  header p { margin: 0; font-size: 17px; color: var(--slate); }
  header p b { font-weight: 400; color: var(--paper); background: var(--ink); padding: 0 7px; margin-right: 6px; border-radius: 3px; }
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
  @media (max-width: 760px) { .game { grid-template-columns: 1fr; } h1 { font-size: 30px; } }
  main { min-width: 0; }

  /* Cut paper: flat colour, a hard little shadow. */
  .cut { background: var(--paper); box-shadow: 3px 4px 0 #0f0f1b40; border-radius: 3px; }

  .hud { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 14px; align-items: center; margin-bottom: 8px; }
  .meter { position: relative; height: 30px; background: var(--paper); box-shadow: 3px 4px 0 #0f0f1b40; border-radius: 15px; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--slate); border-radius: 15px; transition: width .4s; }
  .meter .tick { position: absolute; top: 5px; bottom: 5px; width: 3px; background: var(--rose); border-radius: 2px; }
  .meter span { z-index: 1; }
  .meter span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 16px; color: var(--ink); white-space: nowrap; }
  .meter span em { font-style: normal; background: #fafbf6dd; padding: 0 6px; border-radius: 8px; }
  @media (max-width: 560px) { .meter span em:last-child { display: none; } .meter span { justify-content: center; } }
  .cash { font: 400 28px/1 var(--head); color: var(--paper); text-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
  .sub { grid-column: 1 / -1; display: flex; gap: 2px 14px; flex-wrap: wrap; align-items: center; font-size: 15px; color: var(--ink); min-height: 20px; }
  .sub b { font-weight: 400; color: var(--paper); background: var(--slate); padding: 0 5px; border-radius: 3px; }

  .stagewrap { position: relative; }
  canvas#stage { display: block; width: 100%; touch-action: none; cursor: pointer; box-shadow: 5px 6px 0 #0f0f1b55; border-radius: 4px; background: var(--rose); -webkit-tap-highlight-color: transparent; user-select: none; }
  canvas#stage:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  .over { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; background: #0f0f1b99; border-radius: 4px; overflow: auto; }
  .panel { max-width: 560px; width: 100%; text-align: center; background: var(--paper); box-shadow: 5px 6px 0 var(--ink); border-radius: 4px; padding: 10px 16px 14px; transform: rotate(-.5deg); }
  .panel h3 { font: 400 26px/1.1 var(--head); margin: 2px 0 6px; color: var(--slate); }
  .panel p { margin: 4px 0 10px; }
  .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .picks { grid-template-columns: 1fr; } }
  .pick { text-align: left; font: 15px/1.3 var(--body); color: var(--ink); background: var(--rose); border: 0; border-radius: 3px; box-shadow: 3px 4px 0 var(--slate); padding: 8px 10px 10px; cursor: pointer; }
  .pick b { display: block; font: 400 19px/1.1 var(--head); color: var(--ink); margin-bottom: 4px; }
  .pick small { display: block; margin-top: 6px; font-size: 14px; color: var(--slate); }
  .pick:hover, .pick:focus-visible { transform: translate(-1px, -2px); box-shadow: 4px 6px 0 var(--slate); outline: none; }
  .bigbtn { font: 400 20px var(--head); color: var(--paper); background: var(--slate); border: 0; border-radius: 4px; box-shadow: 3px 4px 0 var(--ink); padding: 6px 18px; cursor: pointer; margin: 4px; }
  .bigbtn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 2px; }
  /* Kiki's card: a typed index card. */
  .card { text-align: left; font: 15px/1.5 var(--type); background: var(--paper); padding: 12px 16px; margin: 6px 0 10px; box-shadow: inset 0 0 0 1px var(--rose); background-image: repeating-linear-gradient(transparent 0 23px, #c6b7be 23px 24px); }
  .card h4 { font: 400 17px var(--type); margin: 0 0 6px; text-decoration: underline; }
  .card p { margin: 0 0 6px; }
  .card mark { background: var(--ink); color: var(--paper); padding: 0 3px; }
  .card .sig { text-align: right; font-style: italic; }

  .log { position: relative; margin: 14px 2px 0; min-height: 2.7em; font-size: 17px; color: var(--ink); background: var(--paper); border-radius: 3px; padding: 7px 12px; box-shadow: 3px 4px 0 #0f0f1b40; transform: rotate(.3deg); }
  .log b { font: 400 13px var(--body); letter-spacing: 1px; color: var(--paper); background: var(--slate); padding: 1px 6px; margin-right: 7px; border-radius: 3px; text-transform: uppercase; }
  .log.fresh { animation: pop .3s ease-out; }
  @keyframes pop { from { transform: rotate(.3deg) translateY(3px); opacity: .5; } }

  aside { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; scrollbar-width: thin; padding: 2px 6px 8px 2px; }
  @media (max-width: 760px) { aside { position: static; max-height: none; overflow: visible; } }
  aside h2 { font: 400 25px/1 var(--head); margin: 2px 0 9px; color: var(--paper); text-shadow: 2px 2px 0 var(--ink); }
  #afford { font: 400 15px var(--body); text-shadow: none; color: var(--ink); }
  #calls { display: grid; gap: 8px; margin-bottom: 10px; }
  #calls:empty { display: none; }
  .call { text-align: left; font: 15px/1.25 var(--body); color: var(--paper); background: var(--ink); border: 0; border-radius: 3px; box-shadow: 3px 4px 0 var(--slate); padding: 7px 10px 8px; cursor: pointer; animation: nudge 1.6s ease-in-out infinite; }
  .call b { display: block; font: 400 19px/1.1 var(--head); }
  .call:focus-visible { outline: 3px dashed var(--ink); outline-offset: 2px; }
  @keyframes nudge { 50% { transform: translate(-1px, -2px); box-shadow: 4px 6px 0 var(--slate); } }
  #shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  @media (max-width: 760px) and (min-width: 520px) { #shop { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .up {
    position: relative; display: flex; flex-direction: column; min-width: 0; text-align: left; font: 15px/1.15 var(--body); color: var(--slate);
    background: var(--paper); border: 0; border-radius: 3px; box-shadow: 3px 4px 0 #0f0f1b33; padding: 6px 9px 7px; cursor: pointer;
  }
  .up b { font-weight: 400; font-size: 17px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up.can { box-shadow: 3px 4px 0 var(--ink); }
  .up.can em { color: var(--ink); text-decoration: underline wavy var(--slate) 1px; text-underline-offset: 3px; }
  .up[aria-disabled="true"] { cursor: default; }
  .up[aria-disabled="true"]:not(.can) { opacity: .6; }
  .up.later { background: var(--rose); }
  .up.odd { outline: 2px dashed var(--rose); outline-offset: -5px; }
  .up .tag { position: absolute; top: -9px; right: 6px; font: 400 13px var(--head); font-style: normal; color: var(--paper); background: var(--ink); padding: 0 6px 1px; border-radius: 3px; transform: rotate(5deg); }
  .up.new { animation: pulse 1.4s ease-in-out 4; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px #fafbf6; } }
  .up:focus-visible, .bought:focus-visible { outline: 3px dashed var(--ink); outline-offset: 2px; }
  #tip {
    position: fixed; z-index: 50; width: 270px; padding: 9px 13px 11px; pointer-events: none; font: 16px/1.35 var(--body); color: var(--ink);
    background: var(--paper); border-radius: 3px; box-shadow: 5px 6px 0 var(--slate); transform: rotate(-.6deg);
  }
  #tip b { display: block; font: 400 20px/1.1 var(--head); color: var(--slate); margin-bottom: 4px; }
  #tip .fx { display: block; margin-top: 6px; padding: 2px 6px; background: var(--rose); border-radius: 3px; }
  #tip i { display: block; margin-top: 6px; padding-top: 5px; border-top: 2px dotted var(--rose); }
  #tip small { display: block; margin-top: 6px; font: 400 15px var(--head); color: var(--ink); }
  #tip.inline { position: static; width: auto; margin-top: 10px; transform: none; }
  #bought { margin: 12px 0 2px; }
  #bought summary { display: flex; align-items: center; gap: 6px; font: 400 19px/1 var(--head); color: var(--paper); text-shadow: 1px 1px 0 var(--ink); cursor: pointer; list-style: none; padding: 3px 2px; }
  #bought summary::-webkit-details-marker { display: none; }
  #bought summary::before { content: "\25B8"; font-size: 14px; color: var(--ink); text-shadow: none; transition: transform .2s; }
  #bought[open] summary::before { transform: rotate(90deg); }
  #bought summary:focus-visible { outline: 3px dashed var(--ink); outline-offset: 2px; }
  .shelf { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 2px 2px; }
  .bought { max-width: 100%; font: 14px/1.2 var(--body); color: var(--ink); background: var(--paper); border: 0; border-radius: 3px; box-shadow: 2px 3px 0 #0f0f1b33; padding: 2px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bought.odd { outline: 2px dashed var(--rose); outline-offset: -4px; }
  .bought:hover, .bought.on { box-shadow: 2px 3px 0 var(--ink); }

  #ending { margin: 22px auto 0; max-width: 680px; text-align: center; padding: 14px 22px 22px; background: var(--paper); border-radius: 4px; box-shadow: 6px 7px 0 var(--ink); transform: rotate(-.4deg); }
  #ending h2 { font: 400 38px/1.1 var(--head); margin: 0 0 8px; color: var(--slate); }
  #ending p { margin: 8px 0; text-align: left; }
  #ending .memo { font: 14px/1.5 var(--type); background: var(--rose); padding: 8px 12px; border-radius: 3px; }
  #shareBtn, #againBtn { font: 400 20px var(--head); color: var(--paper); background: var(--slate); border: 0; border-radius: 4px; box-shadow: 3px 4px 0 var(--ink); padding: 6px 18px; margin: 12px 4px 0; cursor: pointer; }
  #againBtn { background: var(--rose); color: var(--ink); }
  #shareBtn:focus-visible, #againBtn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .up.new, .call, .log.fresh { animation: none; } .meter i, #bought summary::before { transition: none; } }
</style>

<body>
<div class="wrap">
  <header>
    <h1>Over the Moon</h1>
    <p><b>LIVE</b>from Clover’s kitchen · <span id="where">on the ground</span></p>
  </header>
  <div class="game">
    <main>
      <div class="hud">
        <div class="meter" id="meter" title="How high the kitchen is, on its way to the Moon. The meter climbs by powers of ten; the notches are the rain cloud, the edge of space and the satellites."><i id="meterFill"></i><span><em id="altTxt">0 m up · seen by 12</em><em>→ the Moon, 384,400 km</em></span></div>
        <div class="cash" id="cash" title="Tips, from the onlookers, in the basket on the string">$0.00</div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="stagewrap">
        <canvas id="stage" tabindex="0" aria-label="Clover's kitchen. Umbrellas proof in the crocks on the shelves. When one has puffed up into a full dome, swipe across it (or tap it, or press space) to flick it up to the bouquet over the roof. Every umbrella lifts the kitchen a little higher."></canvas>
        <div class="over" id="over" hidden></div>
      </div>
      <p class="log" id="log" aria-live="polite"></p>
    </main>
    <aside id="side">
      <h2 hidden>The Recipe <span id="afford"></span></h2>
      <div id="calls"></div>
      <div id="shop"></div>
      <details id="bought" hidden><summary>Bought · <span id="boughtN">0</span></summary><div class="shelf" id="shelf"></div></details>
      <div id="tip" role="tooltip" hidden></div>
    </aside>
  </div>
  <section id="ending" hidden>
    <h2>Over the Moon.</h2>
    <p id="endText"></p>
    <p class="memo" id="endMemo"></p>
    <button id="shareBtn" type="button">Share result</button>
  </section>
</div>
<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import { grain } from '/shared/kit/fx.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const fmt = E.fmt, money = E.money;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = { ink: '#0f0f1b', slate: '#565a75', rose: '#c6b7be', paper: '#fafbf6' };
const DEBUG = location.search.includes('debug');

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:18:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
const save = () => { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound: E phrygian, like the band ----------
// Trims measured with npm run mix (music near -24 dBFS RMS, effects peaking near -10; the bubble
// and the sous-chefs' sweep sit about 5-8 dB under on purpose: with a wall of crocks they never stop).
const A = createAudio({ sfxTrim: 2.66, musicTrim: 5 });
const notes = scale('phrygian', 64);
let lastRipe = 0, lastSweep = 0, lastFlop = 0;
const sfx = {
  // The flick: a soft upward pluck, climbing with each umbrella in the swipe.
  flick(i = 0) {
    A.tone({ type: 'pluck', freq: notes(7 + (i % 6)), dur: 0.1, vol: 0.26, glide: 1.06 });
    A.noiseHit('whoosh', { vol: 0.065, dur: 0.16 });
  },
  // Too soon: gravity wins, a soft downward plop.
  flop() { const t = performance.now(); if (t - lastFlop < 250) return; lastFlop = t; A.tone({ type: 'triangle', freq: notes(-2), dur: 0.12, vol: 0.165, glide: 0.7 }); },
  // An umbrella finishes puffing: a tiny bubble. Kept soft: with a wall of crocks it's a constant fizz.
  ripe() { const t = performance.now(); if (t - lastRipe < 600) return; lastRipe = t; A.tone({ type: 'sine', freq: notes(14 + (Math.random() * 3 | 0)), dur: 0.04, vol: 0.101, glide: 1.25 }); },
  // A sous-chef sweeps a shelf: a brush and a little run. Soft, like the bubbles: it's background.
  sweep() { const t = performance.now(); if (t - lastSweep < 1200) return; lastSweep = t; A.noiseHit('shaker', { vol: 0.196, dur: 0.12 }); A.tone({ type: 'pluck', freq: notes(9), dur: 0.08, vol: 0.22 }); },
  // Tips landing in the basket: a coin, now and then.
  tip() { A.tone({ type: 'bell', freq: notes(11), dur: 0.08, vol: 0.135 }); A.tone({ type: 'bell', freq: notes(13), dur: 0.1, vol: 0.105, at: A.now + 0.06 }); },
  buy() { [0, 2, 4, 7].forEach((d, i) => A.tone({ type: 'pluck', freq: notes(d + 7), dur: 0.12, vol: 0.143, at: A.now + i * 0.06 })); },
  unlock() { A.tone({ type: 'bell', freq: notes(9), dur: 0.3, vol: 0.136 }); A.tone({ type: 'bell', freq: notes(11), dur: 0.4, vol: 0.112, at: A.now + 0.12 }); },
  deny() { A.tone({ type: 'triangle', freq: notes(-3), dur: 0.07, vol: 0.188 }); },
  // Passing a sight on the way up: the phrygian turn, B C B.
  landmark() { [4, 5, 4, 7].forEach((d, i) => A.tone({ type: 'bell', freq: notes(d + 7), dur: 0.25, vol: 0.105, at: A.now + i * 0.13 })); },
  // The cloud, decided.
  choice() {
    [0, 2, 4].forEach(d => A.tone({ type: 'pad', freq: notes(d), dur: 1.4, vol: 0.009, attack: 0.3, release: 1, cutoff: 1200 }));
    [7, 9, 11, 14].forEach((d, i) => A.tone({ type: 'bell', freq: notes(d), dur: 0.4, vol: 0.038, at: A.now + 0.2 + i * 0.1 }));
  },
  // Touchdown on the Moon: a soft thump and the chord.
  land() { A.noiseHit('kick', { vol: 0.087 }); [0, 4, 7, 11].forEach((d, i) => A.tone({ type: 'bell', freq: notes(d), dur: 0.8, vol: 0.03, at: A.now + 0.1 + i * 0.08 })); },
  // The card unfolds: paper.
  unfold() { A.noiseHit('whoosh', { vol: 0.168, dur: 0.3 }); A.noiseHit('shaker', { vol: 0.14, dur: 0.2, at: A.now + 0.25 }); },
  // The little umbrella lands in the glass.
  clink() { A.tone({ type: 'bell', freq: notes(21), dur: 0.5, vol: 0.091 }); A.tone({ type: 'bell', freq: notes(23), dur: 0.6, vol: 0.063, at: A.now + 0.03 }); },
  // The ending: the phrygian cadence, F major falling to E, then the toast.
  finale() {
    [1, 3, 5, 8].forEach((d, i) => A.tone({ type: 'pluck', freq: notes(d), dur: 0.3, vol: 0.054, at: A.now + i * 0.11 }));
    [0, 2, 4, 7].forEach((d, i) => A.tone({ type: 'pluck', freq: notes(d), dur: 0.4, vol: 0.054, at: A.now + 0.7 + i * 0.11 }));
    [0, 4, 7].forEach(d => A.tone({ type: 'pad', freq: notes(d - 7), dur: 2.4, vol: 0.009, attack: 0.5, release: 1.6, cutoff: 900, at: A.now + 1.2 }));
    A.tone({ type: 'bell', freq: notes(14), dur: 1.4, vol: 0.039, at: A.now + 1.5 });
  },
};
if (DEBUG) window.__game = { A, sfx, long: ['finale', 'choice', 'land', 'landmark'], S: () => S, E };

// ---------- Music: one bossa nova, arranged per stretch of the trip ----------
let music = null, soundtrack = null;
const phaseKey = () => E.phase(S);
function song() { return (soundtrack ??= createSoundtrack(music.strudel))(phaseKey()); }
createMusic(A, { soundfonts: true, packs: ['vcsl'], song }).then(m => { music = m; music.update(); if (DEBUG) window.__game.music = m; }).catch(e => console.warn('music', e));
const refreshMusic = () => { if (music) music.update(); };

// ---------- Paper ----------
const W = 800, H = 540;
const KIT = { x: 150, y: 204, w: 500, h: 246 };                       // the kitchen, inside the walls
const SH = { x: 166, bottom: 446, colW: 33, rowH: 29, cols: E.PER_SHELF };  // the crock shelves
const CLOVER = { x: 564, y: 446 };
let seed = 18;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
// Scissor-cut: a polygon with its points nudged a little, filled flat, with a hard drop shadow.
function cut(x, color, f, { shadow = 0.25, dx = 2.5, dy = 3 } = {}) {
  if (shadow) { x.save(); x.translate(dx, dy); x.beginPath(); f(); x.fillStyle = `rgba(15,15,27,${shadow})`; x.fill(); x.restore(); }
  x.beginPath(); f(); x.fillStyle = color; x.fill();
}
const jag = (x, pts, j = 0.8) => { pts.forEach(([a, b], i) => { const p = [a + (rnd() - 0.5) * j, b + (rnd() - 0.5) * j]; i ? x.lineTo(...p) : x.moveTo(...p); }); x.closePath(); };
const oval = (x, cx, cy, rx, ry, a0 = 0, a1 = Math.PI * 2) => x.ellipse(cx, cy, rx, ry, 0, a0, a1);

// ---------- The umbrellas: eleven kinds, each one bigger than the last ----------
// shape: dome / flat / peak / square. Stripes alternate a and b.
const TIERS = [
  { a: C.ink, b: C.ink, shape: 'dome', ribs: 6, hook: true },        // a plain black brolly
  { a: C.paper, b: C.slate, shape: 'dome', ribs: 8, hook: true },    // golf

  { a: C.rose, b: C.rose, shape: 'flat', ribs: 8, trim: C.slate },   // patio
  { a: C.slate, b: C.paper, shape: 'square', ribs: 6 },               // market parasol
  { a: C.paper, b: C.paper, shape: 'dome', ribs: 8, scallop: C.slate, finial: true }, // bandstand

function canopyPath(x, t, w, h) {

  const n = t.ribs;

}

  if (t.hook) x.arc(-w * 0.06, w * 0.42, w * 0.06, 0, Math.PI);

  }

}

  b.addEventListener('focus', () => { if (!b.dataset.touch) showTip(b, info()); });
  b.addEventListener('blur', hideTip);
  b.addEventListener('pointerdown', e => { b.dataset.touch = e.pointerType !== 'mouse' ? '1' : ''; });
  b.addEventListener('click', () => {
    if (b.dataset.touch && !explained.has(b.id)) { explained.add(b.id); showTip(b, info()); return; }
    hideTip(); act();
  });
}

// ---------- The Bought shelf (the recipe so far) ----------
const shelfEl = $('bought');
shelfEl.open = !!S.boughtOpen;
shelfEl.addEventListener('toggle', () => {
  if (!shelfEl.open) hideTip(true);
  if (!!S.boughtOpen === shelfEl.open) return;
  S.boughtOpen = shelfEl.open; save();
});
let shelfSig = null;
function renderShelf() {
  const list = S.ended ? [] : E.bought(S);
  const sig = list.map(i => i.id).join('|');
  if (sig === shelfSig) return;
  shelfSig = sig;
  shelfEl.hidden = !list.length;
  $('boughtN').textContent = list.length;
  $('shelf').replaceChildren(...list.map(it => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'bought' + (it.odd ? ' odd' : '');
    b.textContent = it.name; b.dataset.id = it.id;
    b.setAttribute('aria-describedby', 'tip');
    const show = () => { hideTip(true); b.classList.add('on'); showTip(b, { id: 'bought:' + it.id, name: it.name, desc: it.desc, joke: it.joke, foot: it.odd ? 'Bought · does very little' : 'Bought', inline: true }); };
    b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') show(); });
    b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
    b.addEventListener('focus', () => { if (!b.dataset.touch) show(); });
    b.addEventListener('blur', hideTip);
    b.addEventListener('pointerdown', e => { b.dataset.touch = e.pointerType !== 'mouse' ? '1' : ''; });
    b.addEventListener('click', () => { if (tipFor === 'bought:' + it.id && b.dataset.touch) hideTip(true); else show(); });
    return b;
  }));
}
function doBuy(id) {
  if (!E.buy(S, id)) { sfx.deny(); return; }
  delete newUntil[id];
  hideTip();
  sfx.buy();
  const L = E.LINE_BY_ID[id];
  if (L) {
    say('CLOVER', L.joke);
    if (L.kind === 'umbrella') { for (const b of bouquet) if (rnd() < 0.25) b.tier = tierOf(); }
    const spot = { cape: [CLOVER.x, 330], boots: [CLOVER.x, 430], plums: [624, 380], mini: [574, 270], glass: [620, 270], song: [642, 380], card: [500, 380], spoons: [440, 300], skates: [440, 420], whistle: [CLOVER.x, 380] }[id] || (L.kind === 'culture' ? [500, 280] : L.kind === 'umbrella' ? [400, 90] : [CLOVER.x, 300]);
    floats.push({ text: L.kind === 'umbrella' ? 'bigger!' : L.odd ? 'ta-da!' : '✓', x: spot[0], y: spot[1], t: 0, color: C.ink, size: 18 });
  } else {
    const V = E.LEVELS[id];
    say(id === 'chef' ? 'SOUS-CHEF' : 'CLOVER', id === 'crock' ? `“Another crock. That’s ${S.lv.crock}. A kitchen is only as good as its crocks.”` : id === 'chef' ? `A paper doll in a tall hat takes shelf ${S.lv.chef}. “Yes, chef!”` : `“A bigger basket, darlings. For your generosity.” (size ${S.lv.basket})`);
    if (id === 'basket') floats.push({ text: 'clink!', x: 300, y: H - 30, t: 0, size: 16 });
    void V;
  }
  save(); renderShop(); hud();
}

// ---------- Loop ----------
let last = performance.now(), saveAcc = 0, uiAcc = 0, lastFrame = performance.now(), phaseWas = phaseKey(), tipAcc = 0;
let ripeWas = S.cr.map(p => p >= 1);
function step(dt) {
  if (!S.ended && !S.landed) {
    const swept = E.tick(S, dt);
    if (swept.length) { swept.forEach((i, n) => launch(i, n, true)); sfx.sweep(); }
    // Bubbles as umbrellas finish puffing (only the ones that just did).
    for (let i = 0; i < S.cr.length; i++) { const r = S.cr[i] >= 1; if (r && !ripeWas[i]) sfx.ripe(); ripeWas[i] = r; }
    ripeWas.length = S.cr.length;
    if (S.landed) { sfx.land(); save(); say('CLOVER', '“And… touchdown. Darlings, we are live from the Moon. Everyone on Earth can see us. Everyone. Now: the tasting.”'); renderCalls(); renderShop(); hud(); }
    if (E.pulled(S) && !step.pullSaid) { step.pullSaid = true; say('CLOVER', '“Feel that? The Moon’s gravity has us now. No more flicking, darlings. Just hold on to your crocks.”'); }
    checkSights();
    tipAcc += dt;
    if (tipAcc > 4 && E.tipRate(S) > 0.05) { tipAcc = 0; sfx.tip(); floats.push({ text: `+${money(E.tipRate(S) * 4, true)}`, x: 300, y: H - 36, t: 0, size: 14 }); }
  } else if (!S.ended) E.tick(S, dt);
  const ph = phaseKey();
  if (ph !== phaseWas) { phaseWas = ph; refreshMusic(); }
  saveAcc += dt; if (saveAcc > 5) { saveAcc = 0; save(); }
  ambient(dt);
  uiAcc += dt; if (uiAcc > 0.2) { uiAcc = 0; hud(); renderShop(); renderCalls(); }
}
function frame(now) {
  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now; lastFrame = now;
  step(dt);
  clock += dt;
  flourish = Math.max(0, flourish - dt * 3);
  for (const f of flying) f.t += dt * (f.flop ? 2.4 : f.speed || 1.4);
  for (const f of flying) if (!f.flop && f.t >= 1) joinBouquet(f.tier);
  flying = flying.filter(f => f.t < 1);
  for (const f of floats) f.t += dt; floats = floats.filter(f => f.t < 1.2);
  trail = trail.filter(q => clock - q.t < 0.25);
  if (S.choice === 'rain' && !S.landed) {
    if (townUms.length < 14 && rnd() < dt * 3) townUms.push({ x: 40 + rnd() * 720, y: H + 20, v: 40 + rnd() * 50, tier: Math.floor(rnd() * 4), rot: (rnd() - 0.5) * 0.4 });
    for (const u of townUms) u.y -= u.v * dt;
    townUms = townUms.filter(u => u.y > 80);
  }
  if (finale) {
    finale.t += dt;
    if (finale.stage === 'flying' && finale.t >= 0.9) { finale.stage = 'done'; finale.t = 0; S.toasted = true; sfx.clink(); }
    else if (finale.stage === 'done' && finale.t >= 1.4) end(false);
  }
  render();
  requestAnimationFrame(frame);
}
// In a background tab, rAF stops: keep the kitchen going on a timer.
setInterval(() => {
  const now = performance.now();
  if (now - lastFrame < 400) return;
  const dt = Math.min(1, (now - last) / 1000); last = now;
  step(dt);
}, 250);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('resize', layout);

// ---------- Start ----------
// Sprite stills for the sheet.
{
  const a = Sprites.canvas(120, 170), q = a.getContext('2d'); q.translate(60, 160); drawClover(q, 0, {}); Sprites.register('Clover', a);
  const b = Sprites.canvas(120, 170), r = b.getContext('2d'); r.translate(60, 160); drawClover(r, 0, { cape: true, boots: true, whistle: true, glass: 2, flourish: 1 }); Sprites.register('Clover, everything on', b);
  const c = Sprites.canvas(40, 44), s = c.getContext('2d'); s.translate(20, 40); drawChef(s, 0.5, true, true); Sprites.register('sous-chef', c);
  const d = Sprites.canvas(50, 40), u = d.getContext('2d'); u.translate(25, 34); drawGlass(u, 2, 1.3); Sprites.register('the little glass (spoiler)', d);
  const e = Sprites.canvas(60, 30), v = e.getContext('2d'); v.translate(30, 20); drawBasket(v, 20); Sprites.register('tip basket', e);
  const f = Sprites.canvas(120, 30), w = f.getContext('2d'); w.translate(10, 26); ['DORIS', 'KEFIR', 'MOTHER', 'KOJI', 'GINGER', 'BRINE'].forEach((l, i) => { w.save(); w.translate(i * 18, 0); drawJar(w, l, i); w.restore(); }); Sprites.register('culture jars', f);
}
if (Sprites.sheetRequested()) Sprites.showSheet({ zoom: 2 });

layout();
buildBouquet();
// Time away: the sous-chefs kept sweeping (slowly), the onlookers kept tipping.
if (!S.ended && !S.landed && S.savedAt && S.t > 0) {
  const away = (Date.now() - S.savedAt) / 1000;
  const r = E.offline(S, away);
  if (r) {
    const h = Math.floor(away / 3600), m = Math.floor((away % 3600) / 60), span = h ? `${h} h ${m} min` : `${m} min`;
    const capped = E.LANDMARKS.includes(Math.round(S.alt + 1)) ? ' They stopped just short of the next sight: Clover wouldn’t want to miss it.' : '';
    say('WHILE YOU WERE AWAY', r.sent >= 1
      ? `${span}. The sous-chefs kept sweeping, slowly: ${fmt(r.sent)} umbrellas went up, the kitchen rose ${E.height(r.alt)}, and the onlookers tipped ${money(r.tips)}.${capped}`
      : `${span}. Nobody flicked anything (no sous-chefs yet), but the onlookers tipped ${money(r.tips)} anyway.`);
    buildBouquet();
  }
}
sightIdx = SIGHTS.filter(s => S.alt >= s.at).length;
if (S.ended) end(true);
else if (S.landed) { say('CLOVER', '“Welcome back, darlings. We’re live from the Moon, and it’s time for the tasting.”'); }
else if (E.choiceDue(S)) say('CLOVER', '“Welcome back! We’re still stuck in this rain cloud. Decide, darlings: rain it on the town, or bottle it.”');
else if (!S.t) say('CLOVER', '“Welcome to Clover’s Kitchen! Today: Great-Aunt Kiki’s recipe. Ferment the umbrellas, and when one puffs up into a full dome, flick it up. Swipe across the crock. Like so.”');
else if (logT === 0 && !$('log').textContent) say('CLOVER', '“Welcome back to the show. We never went off the air. Flick when they dome.”');
save();
hud(); renderShop(); renderCalls();
document.fonts?.ready.then(layout);
requestAnimationFrame(frame);
</script>

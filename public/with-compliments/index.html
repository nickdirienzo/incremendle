<style>
  /* Stained glass in Nyx8: lead-black, two night blues, the Baron's slate grey, and the castle's warm
     glass (cream, tan, rose, mauve, plum). */
  :root {
    --ink: #08141e; --navy: #0f2a3f; --slate: #20394f; --cream: #f6d6bd; --tan: #c3a38a; --rose: #997577; --mauve: #816271; --plum: #4e495f;
    --goth: 'Grenze Gotisch', Georgia, serif; --fell: 'IM Fell English', Georgia, serif; --sc: 'IM Fell English SC', Georgia, serif;
    color-scheme: dark;
  }
  html, body { background: var(--ink); color: var(--cream); }
  [hidden] { display: none !important; }
  body {
    margin: 0; font: 16px/1.4 var(--fell);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(10px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
    background-image: radial-gradient(ellipse at 20% 0%, #0f2a3f 0%, transparent 60%), radial-gradient(ellipse at 90% 100%, #20394f66 0%, transparent 50%);
  }
  .wrap { max-width: 1140px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 0 0 6px; }
  h1 { font: 700 40px/1 var(--goth); margin: 0; color: var(--cream); letter-spacing: .5px; text-shadow: 0 0 14px #f6d6bd44, 2px 2px 0 var(--ink); }
  header p { margin: 0; font: 17px/1 var(--sc); color: var(--tan); }
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
  @media (max-width: 760px) { .game { grid-template-columns: 1fr; } h1 { font-size: 32px; } }
  @media (max-width: 520px) { .hud { grid-template-columns: 1fr auto; } .meter { grid-column: 1 / -1; order: 3; } .sub { order: 4; } }
  main { min-width: 0; }

  .hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; margin-bottom: 14px; }
  .grey { font: 700 30px/1 var(--goth); color: var(--cream); white-space: nowrap; }
  .grey small { font: 17px/1 var(--sc); color: var(--tan); }
  .meter { position: relative; height: 14px; background: var(--slate); border: 2px solid var(--ink); box-shadow: 0 0 0 1px var(--plum); overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; transition: width .4s;
    background: repeating-linear-gradient(90deg, var(--cream) 0 14px, var(--tan) 14px 28px, var(--rose) 28px 42px, var(--mauve) 42px 56px); }
  .meter i::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 13px, var(--ink) 13px 14px); }
  .crowns { font: 700 26px/1 var(--goth); color: var(--tan); white-space: nowrap; }
  .crowns small { font: 16px/1 var(--sc); }
  .sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 16px; font: 15px/1.15 var(--sc); color: var(--tan); min-height: 18px; }
  .sub b { font-weight: 400; color: var(--cream); }

  .stagewrap { position: relative; }
  canvas#stage { display: block; width: 100%; touch-action: none; cursor: crosshair; background: var(--navy); border: 4px solid var(--ink); box-shadow: 0 0 0 2px var(--plum), 0 0 0 7px var(--ink), 0 12px 30px #0008; -webkit-tap-highlight-color: transparent; user-select: none; border-radius: 4px; }
  canvas#stage:focus-visible { outline: 2px dashed var(--cream); outline-offset: 10px; }

  /* The order book: one card per tenant's order, under the window. Not buttons: the plot is the target. */
  #orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 7px; margin-top: 12px; }
  #orders:empty { display: none; }
  .order { position: relative; padding: 5px 8px 9px; background: var(--slate); border: 2px solid var(--ink); box-shadow: inset 0 0 0 1px var(--plum); font: 14px/1.2 var(--fell); color: var(--cream); min-width: 0; cursor: default; }
  .order.mine { background: #997577; box-shadow: inset 0 0 0 1px var(--tan); }
  .order b { display: block; font: 15px/1.1 var(--sc); color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 64px; }
  .order span { display: block; color: #f6d6bdcc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .order em { font-style: normal; font: 700 17px/1 var(--goth); color: var(--cream); }
  .order .stamp { position: absolute; top: 5px; right: 5px; font: 12px/1 var(--sc); letter-spacing: .5px; padding: 2px 4px; border: 1.5px solid currentColor; transform: rotate(-6deg); color: var(--tan); }
  .order.mine .stamp { color: var(--ink); }
  .order .time { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--ink); }
  .order .time i { position: absolute; inset: 0 auto 0 0; background: var(--cream); }
  .order.late .time i { background: var(--tan); animation: late .5s steps(2) infinite; }
  @keyframes late { 50% { opacity: .3; } }
  .order.hot { box-shadow: inset 0 0 0 2px var(--cream); }

  .log { position: relative; margin: 10px 0 0; min-height: 2.9em; font: 16px/1.4 var(--fell); color: var(--cream); border-left: 4px solid var(--tan); padding: 5px 10px; background: #0f2a3fcc; }
  .log b { font: 14px/1 var(--sc); color: var(--ink); background: var(--tan); padding: 1px 6px 2px; margin-right: 8px; }
  .log b.s { background: var(--mauve); color: var(--cream); }
  .log b.b { background: var(--slate); color: var(--cream); }
  .log b.o { background: var(--cream); }
  .log.fresh span { animation: ink .6s ease-out; }
  @keyframes ink { from { opacity: .15; } }

  aside { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; scrollbar-width: thin; padding: 2px 4px 8px 2px; }
  @media (max-width: 760px) { aside { position: static; max-height: none; overflow: visible; } }
  #calls { display: grid; gap: 8px; margin-bottom: 10px; }
  #calls:empty { display: none; }
  .call { position: relative; text-align: left; font: 15px/1.2 var(--fell); color: var(--ink); background: var(--tan); border: 3px solid var(--ink); box-shadow: 0 0 0 1px var(--cream), 4px 5px 0 1px #0007; padding: 7px 10px 8px; cursor: pointer; }
  .call b { display: block; font: 700 22px/1 var(--goth); }
  .call[aria-disabled="true"] { background: var(--slate); color: var(--tan); cursor: default; }
  .call.can { background: var(--cream); animation: nudge 1.4s ease-in-out infinite; }
  .call.final { background: var(--cream); }
  .call:focus-visible { outline: 2px dashed var(--cream); outline-offset: 4px; }
  @keyframes nudge { 50% { transform: translateY(-2px); } }
  aside h2 { font: 700 26px/1 var(--goth); margin: 2px 0 8px; color: var(--cream); }
  #afford { font: 16px/1 var(--sc); color: var(--tan); }
  #shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  @media (max-width: 760px) and (min-width: 520px) { #shop { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .up {
    position: relative; display: flex; flex-direction: column; min-width: 0; text-align: left; font: 14px/1.15 var(--sc); color: var(--tan);
    background: var(--slate); border: 2px solid var(--ink); box-shadow: inset 0 0 0 1px var(--plum); padding: 5px 8px 6px; cursor: pointer;
  }
  .up b { font: 15px/1.15 var(--fell); color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up.can { background: var(--mauve); box-shadow: inset 0 0 0 1px var(--cream); }
  .up.can em { color: var(--cream); }
  .up[aria-disabled="true"] { cursor: default; }
  .up[aria-disabled="true"]:not(.can) b { color: var(--tan); }
  .up.odd { border-style: dashed; }
  .up.odd b::before, .bought.odd::before { content: '❦ '; color: var(--tan); }
  .up .tag { position: absolute; top: -9px; right: 5px; font: 12px/1 var(--sc); font-style: normal; color: var(--ink); background: var(--cream); padding: 2px 5px; border: 1px solid var(--ink); }
  .up.new { animation: glint 1.1s ease-in-out 6; }
  @keyframes glint { 50% { box-shadow: inset 0 0 0 2px var(--cream), 0 0 12px #f6d6bd88; } }
  .up:focus-visible, .bought:focus-visible { outline: 2px dashed var(--cream); outline-offset: 2px; }
  #tip {
    position: fixed; z-index: 50; width: 280px; padding: 9px 12px 10px; pointer-events: none; font: 15px/1.35 var(--fell); color: var(--cream);
    background: var(--navy); border: 3px solid var(--ink); box-shadow: 0 0 0 1px var(--tan), 0 0 0 5px var(--ink), 6px 8px 0 5px #0006;
  }
  #tip b { display: block; font: 700 22px/1 var(--goth); color: var(--cream); margin-bottom: 4px; }
  #tip .fx { display: block; margin-top: 6px; padding: 3px 6px; color: var(--ink); background: var(--tan); font: 14px/1.3 var(--sc); }
  #tip i { display: block; margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--plum); color: var(--tan); }
  #tip small { display: block; margin-top: 6px; font: 15px/1 var(--sc); color: var(--cream); }
  #tip.inline { position: static; width: auto; margin-top: 10px; }
  #bought { margin: 12px 0 2px; }
  #bought summary { display: flex; align-items: center; gap: 6px; font: 700 21px/1 var(--goth); color: var(--cream); cursor: pointer; list-style: none; padding: 3px 2px; }
  #bought summary::-webkit-details-marker { display: none; }
  #bought summary::before { content: '›'; color: var(--tan); transition: transform .2s; }
  #bought[open] summary::before { transform: rotate(90deg); }
  #bought summary:focus-visible { outline: 2px dashed var(--cream); outline-offset: 2px; }
  .shelf { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 2px 2px; }
  .bought { max-width: 100%; font: 14px/1.1 var(--sc); color: var(--cream); background: var(--slate); border: 2px solid var(--ink); box-shadow: inset 0 0 0 1px var(--plum); padding: 3px 7px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bought.odd { border-style: dashed; }
  .bought:hover, .bought.on { color: var(--ink); background: var(--tan); }

  #ending { margin: 22px auto 0; max-width: 680px; color: var(--cream); background: var(--navy); border: 4px solid var(--ink); box-shadow: 0 0 0 1px var(--tan), 0 0 0 7px var(--ink); padding: 18px 28px 22px; }
  #ending .num { font: 16px/1 var(--sc); color: var(--tan); letter-spacing: 1px; }
  #ending h2 { font: 700 40px/1 var(--goth); margin: 6px 0 10px; color: var(--cream); }
  #ending p { margin: 9px 0; }
  #ending .sig { color: var(--tan); font-style: italic; }
  #shareBtn, #againBtn { font: 700 22px/1 var(--goth); color: var(--ink); background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 0 0 1px var(--tan), 4px 4px 0 1px #0006; padding: 7px 16px; margin: 12px 8px 0 0; cursor: pointer; }
  #againBtn { background: var(--tan); }
  #shareBtn:focus-visible, #againBtn:focus-visible { outline: 2px dashed var(--cream); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .up.new, .call.can, .log.fresh span, .order.late .time i { animation: none; } .meter i, #bought summary::before { transition: none; } }
</style>

<body>
<div class="wrap">
  <header>
    <h1>With Compliments</h1>
    <p id="where">Castle Pardon · the Turnip Fields</p>
  </header>
  <div class="game">
    <main>
      <div class="hud">
        <div class="grey" title="Acres of Baron Brume’s estate still grey. The castle intends to bring this number down to nothing, politely."><span id="grey">100,000</span> <small>grey acres</small></div>
        <div class="meter" title="The estate, in colour so far"><i id="meter"></i></div>
        <div class="crowns" title="The castle’s budget, in crowns. The grant is three a month; the rest comes from orders."><span id="crowns">0</span> <small>crowns</small></div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="stagewrap">
        <canvas id="stage" tabindex="0" aria-label="Castle Pardon and Baron Brume’s grey estate. Press, pull back and let go to lob a rainbow from the tower. Keyboard: arrows aim, space throws."></canvas>
      </div>
      <div id="orders" aria-live="polite"></div>
      <p class="log" id="log" aria-live="polite"></p>
    </main>
    <aside id="side">
      <div id="calls"></div>
      <h2>Requisitions <span id="afford"></span></h2>
      <div id="shop"></div>
      <details id="bought" hidden><summary>Bought · <span id="boughtN">0</span></summary><div class="shelf" id="shelf"></div></details>
      <div id="tip" role="tooltip" hidden></div>
    </aside>
  </div>
  <section id="ending" hidden>
    <div class="num">FORM T-1 · TRANSFER OF TITLE · APPROVED</div>
    <h2>With Compliments</h2>
    <div id="story"></div>
    <button id="shareBtn" type="button">Share result</button>
  </section>
</div>
<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import { grain } from '/shared/kit/fx.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const fmt = E.fmt;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG = location.search.includes('debug');
const C = { ink: '#08141e', navy: '#0f2a3f', slate: '#20394f', cream: '#f6d6bd', tan: '#c3a38a', rose: '#997577', mauve: '#816271', plum: '#4e495f' };
const WARM = [C.cream, C.tan, C.rose, C.mauve];
const BANDS = [C.cream, C.tan, C.rose, C.mauve];          // a rainbow, outside in, in the castle's glass

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:25:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
const save = () => { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound: D dorian, the polka's key ----------
// Trims measured with npm run mix: music near -24 dBFS RMS, effects peaking near -10. LV evens out the
// effects (Spout's throw and his stamp sit a dB or so under the rest: they repeat all game).
const A = createAudio({ sfxTrim: 2.84, musicTrim: 4 });
const LV = { launch: 1.26, land: 0.85, plop: 0.95, paid: 1.03, pin: 1.2, lapse: 1.4, stamp: 1.3, spout: 1.35, buy: 0.92, unlock: 1, deny: 1.12, reach: 0.35, letter: 1.1, finale: 0.58 };
let gainNow = 1;
const T = o => A.tone({ ...o, vol: o.vol * gainNow });
const N = (kind, o = {}) => A.noiseHit(kind, { ...o, vol: (o.vol ?? 0.25) * gainNow });
const notes = scale('dorian', 62);   // D E F G A B C
let lastTick = 0, lastStamp = 0, lastSpout = 0;
const sfx = {
  // Letting go: the light leaves the tower, a little rising glide and a breath of air.
  launch() { N('whoosh', { vol: 0.05, dur: 0.3 }); T({ type: 'triangle', freq: notes(4), dur: 0.22, vol: 0.12, glide: 1.5, cutoff: 2400 }); },
  // A rainbow takes root: a glass chime, higher the further it went.
  land(k = 0) { const d = 7 + Math.min(6, Math.round(k)); T({ type: 'bell', freq: notes(d), dur: 0.14, vol: 0.16 }); T({ type: 'bell', freq: notes(d + 2), dur: 0.18, vol: 0.1, at: A.now + 0.07 }); },
  // Into the moat.
  plop() { T({ type: 'sine', freq: notes(2), dur: 0.1, vol: 0.18, glide: 0.5 }); N('shaker', { vol: 0.04, dur: 0.08 }); },
  // An order delivered: the fee, in a little oom-pah flourish.
  paid() { [0, 2, 4, 7].forEach((d, i) => T({ type: 'pluck', freq: notes(d + 7), dur: 0.1, vol: 0.13, at: A.now + 0.06 + i * 0.06, cutoff: 3200 })); T({ type: 'bell', freq: notes(14), dur: 0.3, vol: 0.07, at: A.now + 0.32 }); },
  // A new order pinned up: a woodblock tick.
  pin() { const t = performance.now(); if (t - lastTick < 400 && !DEBUG) return; lastTick = t; T({ type: 'triangle', freq: notes(11), dur: 0.03, vol: 0.14 }); T({ type: 'triangle', freq: notes(9), dur: 0.03, vol: 0.1, at: A.now + 0.07 }); },
  // An order withdrawn, with regret.
  lapse() { T({ type: 'triangle', freq: notes(4), dur: 0.14, vol: 0.12 }); T({ type: 'triangle', freq: notes(2), dur: 0.2, vol: 0.1, at: A.now + 0.14 }); },
  // Spout's rubber stamp: a soft thud and a click.
  stamp() { const t = performance.now(); if (t - lastStamp < 300 && !DEBUG) return; lastStamp = t; N('kick', { vol: 0.08 }); N('hat', { vol: 0.05, at: A.now + 0.02 }); },
  // Spout lobbing one of his own: a smaller, lower launch.
  spout() { const t = performance.now(); if (t - lastSpout < 500 && !DEBUG) return; lastSpout = t; T({ type: 'triangle', freq: notes(0), dur: 0.16, vol: 0.1, glide: 1.5, cutoff: 1800 }); N('whoosh', { vol: 0.03, dur: 0.2 }); },
  buy() { [0, 2, 4, 6, 7].forEach((d, i) => T({ type: 'pluck', freq: notes(d + 7), dur: 0.1, vol: 0.12, at: A.now + i * 0.055, cutoff: 3200 })); },
  unlock() { T({ type: 'bell', freq: notes(11), dur: 0.25, vol: 0.12 }); T({ type: 'bell', freq: notes(13), dur: 0.35, vol: 0.1, at: A.now + 0.12 }); },
  deny() { T({ type: 'triangle', freq: notes(-2), dur: 0.08, vol: 0.14 }); },
  // The reach extends: a short brass-band cadence (G major, the dorian IV, home to D).
  reach() {
    [[3, 5, 7], [0, 2, 4, 7]].forEach((ch, k) => ch.forEach(d => T({ type: 'keys', freq: notes(d + 7), dur: 0.32, vol: 0.06, at: A.now + k * 0.36 })));
    N('kick', { vol: 0.07, at: A.now }); N('kick', { vol: 0.07, at: A.now + 0.36 });
    T({ type: 'bell', freq: notes(14), dur: 0.5, vol: 0.08, at: A.now + 0.72 });
  },
  // A region in full colour: a letter arrives. Three bells.
  letter() { [7, 9, 11].forEach((d, i) => T({ type: 'bell', freq: notes(d), dur: 0.3, vol: 0.1, at: A.now + i * 0.18 })); },
  // The finale: the stamp, the big rainbow, and a processional cadence ending on D major.
  finale() {
    N('kick', { vol: 0.1 }); N('snare', { vol: 0.04, at: A.now + 0.02 });
    T({ type: 'triangle', freq: notes(0), dur: 1.4, vol: 0.08, glide: 2, cutoff: 2000, at: A.now + 0.5 });
    N('whoosh', { vol: 0.05, dur: 1.2, at: A.now + 0.5 });
    const t0 = A.now + 2;
    [[3, 5, 7], [4, 6, 8], [0, 2, 4]].forEach((ch, k) => ch.forEach(d => T({ type: 'keys', freq: notes(d + 7), dur: 0.5, vol: 0.05, at: t0 + k * 0.55 })));
    // The last chord: D major, F sharp borrowed for the occasion.
    [62, 66, 69, 74].forEach(m => T({ type: 'pad', freq: 440 * Math.pow(2, (m - 69) / 12), dur: 2.2, vol: 0.02, attack: 0.3, release: 1.5, cutoff: 1400, at: t0 + 1.65 }));
    [14, 16, 18, 21].forEach((d, i) => T({ type: 'bell', freq: notes(d), dur: 0.4, vol: 0.07, at: t0 + 1.7 + i * 0.12 }));
  },
};
for (const [name, f] of Object.entries(sfx)) sfx[name] = (...a) => { gainNow = LV[name] ?? 1; try { f(...a); } finally { gainNow = 1; } };
if (DEBUG) window.__game = { A, sfx, long: ['finale', 'reach'], S: () => S, E };

// ---------- Music: one polka, arranged per stretch of the estate ----------
let music = null, soundtrack = null;
const phaseKey = () => E.phase(S);
function song() { return (soundtrack ??= createSoundtrack(music.strudel))(phaseKey()); }
createMusic(A, { soundfonts: true, packs: ['vcsl'], song }).then(m => { music = m; music.update(); if (DEBUG) window.__game.music = m; }).catch(e => console.warn('music', e));
const refreshMusic = () => { if (music) music.update(); };

// ---------- Geometry ----------
const W = E.W, H = E.H, GROUND = E.GROUND;
const MOAT = [158, 196];
const TOWER = { x0: 90, x1: 124 };
const towerTop = (r = S.reach) => r >= 1 ? 118 : 176;

// ---------- Aiming ----------

  if (!fin) return;
  fin.t += dt;
  if (fin.stage === 0 && fin.t > 1.6) { fin.stage = 1; fin.t = 0; flights.push({ x: launchPt().x, y: launchPt().y, ...(() => { const v = spoutV(760); return { vx: v.vx * 1.02, vy: v.vy }; })(), who: 'you', trail: [], big: true }); }
  if (fin.stage === 1 && fin.t > 2.4) { fin.stage = 2; fin.t = 0; say('CASTLE', 'The Baron walked over in the afternoon to object in person. He stood on the mat. He read it.'); }
  if (fin.stage === 2 && fin.t > 5) { fin.stage = 3; fin.t = 0; say('CASTLE', 'He found the key. He let himself in.'); }
  if (fin.stage === 3 && fin.t > 2.5) { fin = null; end(false); }
}
function drawFinale(t) {
  // The form, held up in the sky.
  const a = Math.min(1, (fin.stage > 0 ? 1 : fin.t * 2));
  g.globalAlpha = a; formAt(330, 60, fin.stage >= 0 && (fin.stage > 0 || fin.t > 0.6)); g.globalAlpha = 1;
  // Brume walks from the Hall to the drawbridge.
  if (fin.stage >= 2) {
    const u = fin.stage === 2 ? Math.min(1, fin.t / 4.5) : 1;
    const x = 766 - (766 - 172) * u, bob = reduced ? 0 : Math.abs(Math.sin(u * 40)) * 1.5;
    flushLeads(); g.save(); g.translate(x, Math.min(GROUND, groundY(x)) - bob); g.scale(2, 2); brume(0, 0, 1, fin.stage >= 3); flushLeads(); g.restore();
  }
}
function formAt(x, y, stamped) {
  pane(rectP(x, y, 140, 104), C.cream, 2.4);
  g.fillStyle = C.ink; g.textAlign = 'left';
  g.font = 'bold 13px "Grenze Gotisch", Georgia, serif'; g.fillText('Form T-1', x + 10, y + 18);
  g.font = '9px "IM Fell English SC", Georgia, serif'; g.fillText('TRANSFER OF TITLE', x + 10, y + 30);
  g.font = '8px "IM Fell English", Georgia, serif';
  ['From: Castle Pardon', 'To: B. Brume, Esq.', 'One castle, 100,000 acres', 'of rainbow, one gargoyle'].forEach((l, i) => g.fillText(l, x + 10, y + 44 + i * 10));
  flushLeads();
  if (stamped) {
    g.save(); g.translate(x + 100, y + 90); g.rotate(-0.12);
    g.strokeStyle = C.rose; g.lineWidth = 2; g.strokeRect(-30, -9, 60, 18);
    g.fillStyle = C.rose; g.font = 'bold 11px "IM Fell English SC", Georgia, serif'; g.textAlign = 'center'; g.fillText('APPROVED', 0, 4);
    g.restore();
  }
}
// The finished world: everything in colour, the form on the wall, the Baron at the drawbridge with the key.
function drawEndScene(t) {
  formAt(330, 60, true);
  flushLeads(); g.save(); g.translate(176, GROUND); g.scale(2, 2); brume(0, 0, 1, true); flushLeads(); g.restore();
  if (S.one.basket) basketAt(190, GROUND);
  flushLeads();
  drawSpout(t, 150, 241, 1, { happy: true, still: true });
}

// ---------- The end ----------
function end(resumed) {
  S.ended = true; S.finale = false; S.orders = []; save();
  hideTip(true);
  $('story').innerHTML = '';
  const P1 = [
    'Spout read Form T-1 twice, once with the monocle, and stamped it APPROVED. It was the first thing he had ever approved that wasn’t a funeral.',
    `Castle Pardon hereby gives, with compliments, to Baron B. Brume: one castle; ${S.lv.window} windows; ${fmt(E.TOTAL)} acres of rainbow; one gargoyle (conditions attached); one WELCOME mat, and the key under it.`,
    'The Baron walked over in the afternoon to object in person. He stood on the mat. He read it. He found the key, and let himself in.',
    'He has three crowns a month to keep it all up. He will have to take orders. The tenants have a great many, most of them festive.',
    'The castle considers the matter closed, and its revenge complete. It is very sorry about all of it.',
  ];
  for (const p of P1) { const el = document.createElement('p'); el.textContent = p; $('story').append(el); }
  const sig = document.createElement('p'); sig.className = 'sig'; sig.textContent = '— Castle Pardon (formerly)'; $('story').append(sig);
  $('ending').hidden = false;
  renderShop(); renderCalls(); renderOrders(); hud(); refreshMusic();
  if (!resumed) {
    say('BRUME', '“Sir. I object.” A pause. “To nothing in particular.”');
    $('ending').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
    if (window.DailyGame) DailyGame.finish({ lines: [`⏱ ${Math.floor(S.t / 60)}m${String(Math.floor(S.t % 60)).padStart(2, '0')}s`, `🌈 ${fmt(E.TOTAL)} grey acres, planted`, `📜 ${fmt(S.filled)} orders filled`, '🏰 handed over, with compliments'] });
  }
}
$('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());

// ---------- Loop ----------
let last = performance.now(), lastFrame = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now; lastFrame = now;
  step(dt);
  clock += dt;
  stepFlights(dt); stepFinale(dt);
  for (const f of floats) f.t += dt; floats = floats.filter(f => f.t < 1.3);
  render();
  requestAnimationFrame(frame);
}
// In a background tab rAF stops: keep Spout working on a timer.
setInterval(() => {
  const now = performance.now();
  if (now - lastFrame < 400) return;
  const dt = Math.min(1, (now - last) / 1000); last = now;
  step(dt);
}, 250);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('resize', layout);

// ---------- Sprites: source shapes restyled as glass ----------
const SPR = {};
async function glassSprite(name, file, warm, grey) {
  try {
    const svg = await Sprites.loadSvg(`./art/${file}`);
    const mk = async col => Sprites.outline(await Sprites.svgToCanvas(Sprites.recolor(svg, col), 64), C.ink, 3);
    SPR[name] = { warm: await mk(warm), grey: await mk(grey) };
    Sprites.register(`${name} (glass)`, SPR[name].warm);
    Sprites.register(`${name} (grey)`, SPR[name].grey);
  } catch (e) { console.warn('sprite', name, e); }
}
const spritesReady = Promise.all([
  glassSprite('pig', 'game-icons--pig.svg', C.rose, C.slate),
  glassSprite('basket', 'game-icons--basket.svg', C.tan, C.slate),
  glassSprite('pot', 'game-icons--cauldron.svg', C.mauve, C.slate),
]);
// Hand-drawn pieces for the ?sprites sheet, through the same glass routines.
function sheet() {
  const reg = (name, w, h, f, s = 3) => {
    const c = Sprites.canvas(w * s, h * s), q = c.getContext('2d');
    q.fillStyle = C.navy; q.fillRect(0, 0, c.width, c.height);
    const keep = g; g = q; q.setTransform(s, 0, 0, s, 0, 0); f(); flushLeads(); g = keep;
    Sprites.register(name, c);
  };
  const keepS = JSON.stringify(S);
  reg('Spout', 90, 72, () => drawSpout(0, 34, 68, 1, { still: true }));
  reg('Spout, monocle, happy', 90, 60, () => { S.one.monocle = true; drawSpout(0, 34, 68, 1, { still: true, happy: true }); });
  reg('Baron Brume', 20, 34, () => brume(10, 32, 1, true), 4);
  reg('a planted rainbow, and a double', 70, 40, () => { arch(35, 38, 22, 3.4, 1); arch(35, 38, 30, 2, 0.4); });
  reg('Brume Hall, grey and in colour', 110, 80, () => { const p = { x0: 2, x1: 52 }; drawHall(p, 76, 0); drawHall({ x0: 56, x1: 106 }, 76, 1); }, 3);
  reg('Form T-1', 144, 108, () => formAt(2, 2, true), 2);
  Object.assign(S, JSON.parse(keepS));
  for (const [kk, v] of Object.entries(JSON.parse(keepS))) S[kk] = v;
  // The castle with everything bought.
  const all = () => { S.reach = 4; S.lv.window = 72; S.lv.fee = 8; S.lv.tray = 8; S.lv.board = 3; for (const it of E.ITEMS) if (!it.max) S.one[it.id] = true; };
  reg('Castle Pardon, everything bought', 200, 300, () => { all(); g.translate(0, -150); drawCastle(1); flushLeads(); drawProps(1); }, 2);
  Object.assign(S, JSON.parse(keepS));
  S.one = JSON.parse(keepS).one; S.lv = JSON.parse(keepS).lv;
}

// ---------- Start ----------
layout();
if (DEBUG) Object.assign(window.__game, { fire, launch, landed, end, doFinale, flights: () => flights, vmax, launchPt });
const away = S.savedAt ? (Date.now() - S.savedAt) / 1000 : 0;
if (S.ended) { end(true); say('BRUME', '“Sir. I object.” A pause. “To nothing in particular.”'); }
else if (S.finale) { S.finale = false; doFinale(); }
else if (!S.thrown && !S.shown) say('CASTLE', 'Castle Pardon. Baron Brume’s complaint (ref. B/1: “too colourful; an eyesore”) has reduced its upkeep grant to three crowns a month. The castle has replied, politely, that it will plant a rainbow on every grey acre he owns. Press on the window, pull back, let go.');
else {
  const off = E.offline(S, away);
  if (off) say('WHILE YOU WERE OUT', `${Math.round(off.secs / 60)} minutes. Spout kept at it: ${fmt(off.n)} rainbows, ${fmt(off.acres)} acres no longer grey, ${fmt(off.pay)} crowns in approved orders. “Filed,” he says. “All of it.”`);
  else say('CASTLE', 'The castle resumes its revenge, with apologies for the interruption.');
}
save();
hud(); renderShop(); renderCalls(); renderOrders();
document.fonts?.ready.then(layout);
spritesReady.then(() => { if (Sprites.sheetRequested()) { sheet(); Sprites.showSheet({ zoom: 1 }); } });
requestAnimationFrame(frame);
</script>

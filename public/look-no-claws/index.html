<script type="module">
import { createAudio, scale, midiToHz } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import { halftone, grain } from '/shared/kit/fx.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const fmt = E.fmt, money = E.money;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = { c1: '#6ceded', c2: '#6cb9c9', c3: '#6d85a5', c4: '#6e5181', c5: '#6f1d5c', c6: '#4f1446', c7: '#2e0a30', ink: '#0d001a' };

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:17:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound: G mixolydian, like the band ----------
// Trims measured with npm run mix (music near -24 dBFS RMS, effects peaking near -10).
const A = createAudio({ sfxTrim: 1.64, musicTrim: 3.6 });
const notes = scale('mixolydian', 67);
const sfx = {
  // The claw: a dry little click.
  click() { A.noiseHit('hat', { vol: 0.5, dur: 0.018 }); A.tone({ type: 'square', freq: notes(16), dur: 0.012, vol: 0.16, cutoff: 3200 }); },
  good(s = 0) { A.tone({ type: 'pluck', freq: notes(4 + (s % 5)), dur: 0.12, vol: 0.28 }); },
  perfect(s = 0) {
    const d = Math.min(s, 14) % 8;
    A.tone({ type: 'bell', freq: notes(7 + d), dur: 0.22, vol: 0.17 });
    A.tone({ type: 'pluck', freq: notes(d), dur: 0.12, vol: 0.13, at: A.now + 0.02 });
  },
  miss() { A.tone({ type: 'triangle', freq: notes(-4), dur: 0.09, vol: 0.24, glide: 0.85 }); },
  // Every eight in a row: the flock wheels round.
  flock(s = 8) { [0, 2, 4, 7].forEach((d, i) => A.tone({ type: 'bell', freq: notes(d + 7 + Math.min(4, s / 8 | 0)), dur: 0.2, vol: 0.16, at: A.now + i * 0.06 })); },
  buy() { [0, 2, 4, 7].forEach((d, i) => A.tone({ type: 'pluck', freq: notes(d + 7), dur: 0.12, vol: 0.22, at: A.now + i * 0.06 })); },
  unlock() { A.tone({ type: 'bell', freq: notes(11), dur: 0.35, vol: 0.2 }); A.tone({ type: 'bell', freq: notes(13), dur: 0.45, vol: 0.17, at: A.now + 0.12 }); },
  deny() { A.tone({ type: 'triangle', freq: notes(-2), dur: 0.07, vol: 0.29 }); },
  // The Fold-O-Matic, now and then: a paper rustle and a soft tick.
  // Kept a few dB under the rest: it plays every other beat once Maintenance comes.
  machine() { A.noiseHit('shaker', { vol: 0.1, dur: 0.05 }); A.tone({ type: 'sine', freq: notes(9), dur: 0.03, vol: 0.12 }); },
  demoStart() {
    [[0, 0], [4, 0.14], [7, 0.28]].forEach(([d, at]) => A.tone({ type: 'square', freq: notes(d), dur: 0.1, vol: 0.19, cutoff: 1800, at: A.now + at }));
    A.tone({ type: 'bell', freq: notes(14), dur: 0.5, vol: 0.26, at: A.now + 0.42 });
  },
  count(i) { A.tone({ type: 'bell', freq: notes(i === 3 ? 14 : 7), dur: 0.12, vol: 0.36 }); },
  demoPass() {
    [0, 2, 4, 5, 7, 9, 11, 14].forEach((d, i) => A.tone({ type: 'pluck', freq: notes(d), dur: 0.14, vol: 0.2, at: A.now + i * 0.07 }));
    A.tone({ type: 'bell', freq: notes(14), dur: 0.6, vol: 0.14, at: A.now + 0.6 });
  },
  demoFail() { [4, 3, 2].forEach((d, i) => A.tone({ type: 'triangle', freq: notes(d), dur: 0.22, vol: 0.3, glide: 0.94, at: A.now + i * 0.26 })); },
  gift() { [0, 4, 7].forEach(d => A.tone({ type: 'bell', freq: notes(d + 7), dur: 0.6, vol: 0.1 })); A.tone({ type: 'bell', freq: notes(14), dur: 0.8, vol: 0.1, at: A.now + 0.2 }); },
  handsOff() { A.tone({ type: 'bell', freq: notes(-7), dur: 1.2, vol: 0.17 }); A.tone({ type: 'bell', freq: notes(0), dur: 1, vol: 0.1, at: A.now + 0.05 }); },
  circle() { A.noiseHit('whoosh', { vol: 0.22, dur: 0.45 }); A.tone({ type: 'triangle', freq: notes(2), dur: 0.2, vol: 0.25, glide: 0.8, at: A.now + 0.2 }); },
  // The ending: the motif (B A B G, D E D B) on bells, then the gong, then the long road.
  finale() {
    const m = [2, 1, 2, 0, 4, 5, 4, 2, 6, 5, 4, 7];
    m.forEach((d, i) => A.tone({ type: 'bell', freq: notes(d + 7), dur: 0.4, vol: 0.11, at: A.now + i * 0.24 }));
    [0, 4, 7].forEach(d => A.tone({ type: 'pad', freq: notes(d - 7), dur: 2.6, vol: 0.033, attack: 0.5, release: 1.6, cutoff: 900, at: A.now + 1.4 }));
    A.tone({ type: 'bell', freq: notes(-7), dur: 2, vol: 0.17, at: A.now + 2.9 });
  },
};
if (location.search.includes('debug')) window.__game = { A, sfx, long: ['finale', 'demoPass', 'handsOff', 'demoFail'], S: () => S, E, beat: () => beatNow(), music: () => music, demo: () => demo && { phase: demo.phase, start: demo.start, hits: demo.hits, misses: demo.misses, claimed: [...demo.claimed], calib } };

// ---------- Music: the band's piece, arranged per phase; the beat clock follows it ----------
let music = null, soundtrack = null, demo = null;
const phaseKey = () => S.ended ? 'ending' : S.final ? 'final' : demo ? 'demo' : S.cranes >= 1e10 ? 'late' : S.up.maint ? 'machine' : 'show';
function song() { return (soundtrack ??= createSoundtrack(music.strudel))(phaseKey()); }
createMusic(A, { song }).then(m => { music = m; music.update(); }).catch(e => console.warn('music', e));
const refreshMusic = () => { if (music) music.update(); };

// The beat the player hears. With the band playing, it's read off Strudel's scheduler (the audio
// time each cycle is scheduled for, plus output latency). Without music, a steady clock of our own.
const T0 = performance.now();
function beatNow() {
  const sch = music && music.playing && music.repl && music.repl.scheduler;
  const ctx = A.ctx;
  if (sch && sch.started && sch.seconds_at_cps_change != null && ctx && ctx.state === 'running') {
    const t = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
    return ((t - sch.latency - sch.seconds_at_cps_change) * sch.cps + sch.num_cycles_at_cps_change) * 4;
  }
  return (performance.now() - T0) / 1000 / E.BEAT;
}
// Quiet calibration: the judge drifts toward the player's average offset (at most 90 ms).
let calib = 0;
const learn = off => { calib = Math.max(-0.09, Math.min(0.09, calib + (off - calib) * 0.08)); };

// ---------- Art ----------
const W = 800, H = 500, LANE_Y = 438, HIT_X = 110, PX_BEAT = 150;

// A paper crane, 34 x 24, wings up or down: the comic version of an origami crane.

// Pinchworth: berry shell, eyes on stalks, a bow tie, two claws. `snap` 0..1 closes the right claw.

  for (const s of [-1, 1]) {
    S_(x, () => { x.moveTo(s * 10, -52); x.lineTo(s * 14, -74); }, 4);
    inked(x, C.c1, () => x.arc(s * 14, -78, 8, 0, Math.PI * 2), 2.5);
    x.fillStyle = C.ink; P(x, () => x.arc(s * 14 + look * 3, -78, 3.4, 0, Math.PI * 2));

  S_(x, () => { x.moveTo(-22, -88); x.lineTo(-8, -86); x.moveTo(22, -88); x.lineTo(8, -86); }, 2.5);
  // Testimonials: it's Pinchworth in a moustache.
  if (mo) inked(x, C.ink, () => { x.moveTo(0, -24); x.quadraticCurveTo(-10, -32, -22, -20); x.quadraticCurveTo(-12, -22, 0, -18); x.quadraticCurveTo(12, -22, 22, -20); x.quadraticCurveTo(10, -32, 0, -24); }, 1);

  if (dress && gift('hat')) {
    inked(x, C.c7, () => x.ellipse(0, -58, 15, 4, 0, 0, Math.PI * 2), 2);
    inked(x, C.c7, () => x.rect(-8, -72, 16, 13), 2);
    inked(x, C.c2, () => { x.moveTo(-6, -72); x.lineTo(-3, -90); x.lineTo(3, -90); x.lineTo(6, -72); x.closePath(); }, 2);
    const sw = Math.sin(beatNow() * Math.PI) * 0.6;
    S_(x, () => { x.moveTo(0, -73); x.lineTo(Math.sin(sw) * 16, -73 - Math.cos(sw) * 16); }, 2);
  }

// A four-point twinkle.

  x.restore();

// The Fold-O-Matic: a steel cabinet with dials, a crane chute on top, a little curtain at the back.

  for (const c of flying) {
    c.t += dt * 1.4; const p = Math.min(1, c.t);
    const tx = c.sky ? WIN.x + 40 + (c.sx % 240) : BOX.x + 40, ty = c.sky ? WIN.y + 40 : BOX.y - 120;
    c.x = c.sx + (tx - c.sx) * p; c.y = c.sy + (ty - c.sy) * p - Math.sin(p * Math.PI) * 50;
  }
  flying = flying.filter(c => c.t < 1);
  for (const f of floats) f.t += dt; floats = floats.filter(f => f.t < 1.2);
  for (const q of bursts) q.t += dt; bursts = bursts.filter(q => q.t < 0.7);
  if (reveal) reveal.t += dt;
  render();
  requestAnimationFrame(frame);
}
// In a background tab, rAF stops: keep the machine going on a timer.
setInterval(() => {
  const now = performance.now();
  if (now - lastFrame < 400) return;
  const dt = Math.min(1, (now - last) / 1000); last = now;
  step(dt);
}, 250);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('resize', layout);

layout();
if (S.ended) end(true);
else if (S.final) {
  if (S.final.done) startReveal();
  else say('DIRECTOR', 'Welcome back. We’re live, the sky’s full, and it’s hands off: forty seconds, no claws.');
} else if (E.giftPending(S)) { say('STUDIO AUDIENCE', 'Welcome back. You still have a free gift to choose.'); showGifts(E.giftPending(S)); }
else if (!S.t) say('MANUAL', 'Fold-O-Matic manual, page 4: “Cranes respond to rhythm. Gamelan recommended.” The band is set up. The cranes are loose. Tap on the beat, as each gong reaches CALL NOW, to click your claws and herd them into the boxes.');
else say('DIRECTOR', 'Welcome back to Channel 61. We never went off the air. The band never stopped. Tap on the beat.');
hud(); renderShop(); renderCalls();
document.fonts?.ready.then(layout);
requestAnimationFrame(frame);
</script>

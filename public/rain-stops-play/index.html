<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import { grain } from '/shared/kit/fx.mjs';
import rough from 'roughjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const fmt = E.fmt;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG = location.search.includes('debug');
const C = { paper: '#d2c9a5', paper2: '#d1b187', rule: '#8caba1', ink: '#4b726e', dark: '#4b3d44', red: '#ae5d40', rust: '#c77b58',
  hi: '#b3a555', gold: '#ba9158', plum: '#574852', grey: '#847875', mush: '#ab9b8e', olive: '#77743b', brown: '#4d4539', wine: '#79444a', ochre: '#927441' };

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:27:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
const save = () => { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound: F lydian, the minuet's key (F G A B C D E; the B natural is the lydian lift) ----------
// Trims measured with npm run mix: music near -24 dBFS RMS, effects peaking near -10. LV evens out the effects
// (the rub, the drop and the shine repeat all game, so they sit a couple of dB under the rest; the egg-laying tock is
// a background tick).
const A = createAudio({ sfxTrim: 4.87, musicTrim: 5 });
const LV = { rub: 1.0, drop: 0.9, shine: 1.3, ball: 0.87, call: 1.25, lay: 1.2, hatch: 1.5, crow: 1.52, buy: 0.61, unlock: 0.66, deny: 0.85, dose: 0.25, fixture: 0.35, rain: 1.37, sun: 1.13, finale: 0.35, secret: 1.13 };
let gainNow = 1;
const T = o => A.tone({ ...o, vol: o.vol * gainNow });
const N = (kind, o = {}) => A.noiseHit(kind, { ...o, vol: (o.vol ?? 0.25) * gainNow });
const notes = scale('lydian', 65);   // F4 G A B C D E
const rl = {};
const limit = (k, ms) => { const t = performance.now(); if (t - (rl[k] || 0) < ms && !DEBUG) return false; rl[k] = t; return true; };
let rubStep = 0;
const sfx = {
  // A turn of the pestle: a little harpsichord-ish pluck that walks up the scale and back.
  rub() { if (!limit('rub', 70)) return; const k = [0, 1, 2, 3, 4, 3, 2, 1][rubStep++ % 8]; T({ type: 'pluck', freq: notes(k + 7), dur: 0.06, vol: 0.11, cutoff: 2600 }); N('shaker', { vol: 0.025, dur: 0.05 }); },
  // A drop of oil lands in the jar.
  drop() { if (!limit('drop', 140)) return; T({ type: 'bell', freq: notes(11), dur: 0.1, vol: 0.09 }); T({ type: 'sine', freq: notes(9), dur: 0.06, vol: 0.06, glide: 0.7, at: A.now + 0.05 }); },
  // The ball on the bowler's trousers.
  shine() { if (!limit('shine', 90)) return; N('shaker', { vol: 0.05, dur: 0.07 }); T({ type: 'triangle', freq: notes(14), dur: 0.03, vol: 0.05 }); },
  // A delivery: the run-up thud, the bat, and the crowd.
  ball(k = 0.5) { N('kick', { vol: 0.06 }); T({ type: 'triangle', freq: notes(12), dur: 0.04, vol: 0.12, at: A.now + 0.18 }); N('whoosh', { vol: 0.03 + 0.04 * k, dur: 0.6 + 0.4 * k, at: A.now + 0.25 }); },
  // Reg calls it: two vowels, rounder and softer the more comfortable Reg is.
  call(c = S.comfort) {
    if (!limit('call', 600)) return;
    const f = 1 - c / 10, cut = 700 + 900 * f + 300, type = c >= 7 ? 'triangle' : 'sawtooth';
    T({ type, freq: notes(4), dur: 0.16, vol: 0.05 + 0.03 * f, glide: 1.12, cutoff: cut });
    T({ type, freq: notes(6), dur: 0.26, vol: 0.05 + 0.03 * f, glide: 0.9, cutoff: cut, at: A.now + 0.17 });
  },
  // An egg rolls into the still: a soft low tock, now and then.
  lay() { if (!limit('lay', 2600)) return; T({ type: 'pluck', freq: notes(0), dur: 0.08, vol: 0.06, cutoff: 1400 }); },
  // A chick hatches.
  hatch() { if (!limit('hatch', 1500)) return; T({ type: 'sine', freq: notes(16), dur: 0.07, vol: 0.06, glide: 1.25 }); T({ type: 'sine', freq: notes(17), dur: 0.06, vol: 0.05, glide: 1.2, at: A.now + 0.1 }); },
  // A rooster crows over the commentary (politely, on the scale).
  crow() { if (!limit('crow', 9000)) return; T({ type: 'triangle', freq: notes(7), dur: 0.12, vol: 0.06, glide: 1.5, cutoff: 1800 }); T({ type: 'triangle', freq: notes(11), dur: 0.5, vol: 0.06, glide: 0.8, cutoff: 1800, at: A.now + 0.13 }); },
  buy() { [0, 2, 3, 4, 7].forEach((d, i) => T({ type: 'pluck', freq: notes(d + 7), dur: 0.09, vol: 0.12, at: A.now + i * 0.055, cutoff: 3000 })); },
  unlock() { T({ type: 'bell', freq: notes(10), dur: 0.25, vol: 0.11 }); T({ type: 'bell', freq: notes(13), dur: 0.35, vol: 0.09, at: A.now + 0.12 }); },
  deny() { T({ type: 'triangle', freq: notes(-3), dur: 0.08, vol: 0.12 }); },
  // A dose down Reg's horn: three glugs and a warm chord.

// ---------- Ballpoint ----------
// Every line is drawn with a little wobble, and the wobble "boils" (re-draws) a few times a second,
// like a flip-book of the same doodle.
const W = 800, H = 520;
const cv = $('stage');
let g = cv.getContext('2d');
let seedN = 0, boil = 0;
const hash = (a, b = 0, c = 0) => { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; h ^= h >>> 16; return (h >>> 0) / 4294967296; };
const jr = () => hash(seedN++, boil, 7);
const J = (a = 0.7) => (jr() - 0.5) * 2 * a;
function pen(col = C.ink, w = 1.4) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; }
function line(pts, col = C.ink, w = 1.4, j = 0.7) {
  pen(col, w); g.beginPath();
  pts.forEach(([x, y], i) => i ? g.lineTo(x + J(j), y + J(j)) : g.moveTo(x + J(j), y + J(j)));
  g.stroke();
}
// A curve through points, smoothed.
function curve(pts, col = C.ink, w = 1.4, j = 0.6) {
  pen(col, w); g.beginPath();
  const p = pts.map(([x, y]) => [x + J(j), y + J(j)]);
  g.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length - 1; i++) g.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
  g.lineTo(p.at(-1)[0], p.at(-1)[1]);
  g.stroke();
}
// A doodled ellipse: one loop, overshooting where the pen comes round again.
function oval(x, y, rx, ry, col = C.ink, w = 1.4, { fill = null, over = 0.35, rot = 0, j = 0.6 } = {}) {
  const n = Math.max(10, Math.round((rx + ry) / 2.2)), a0 = jr() * 6.28, pts = [];
  for (let i = 0; i <= n * (1 + over / 6.28); i++) {
    const a = a0 + i / n * 6.28, wob = 1 + J(0.04);
    const px = Math.cos(a) * rx * wob, py = Math.sin(a) * ry * wob;
    pts.push([x + px * Math.cos(rot) - py * Math.sin(rot), y + px * Math.sin(rot) + py * Math.cos(rot)]);
  }
  if (fill) { g.fillStyle = fill; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, 6.29); g.fill(); }
  curve(pts, col, w, j * 0.5);
}
// Hatching inside a path: parallel strokes, clipped.
function hatch(path, x0, y0, x1, y1, col = C.ink, gap = 4, ang = -0.8, w = 1) {
  g.save(); g.clip(path); pen(col, w); g.beginPath();
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + 4;
  const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
  for (let d = -R; d <= R; d += gap) {
    const ox = cx + nx * d, oy = cy + ny * d;
    g.moveTo(ox - dx * R + J(0.8), oy - dy * R + J(0.8)); g.lineTo(ox + dx * R + J(0.8), oy + dy * R + J(0.8));
  }
  g.stroke(); g.restore();
}
const P = () => new Path2D();
function rectP(x, y, w, h) { const p = P(); p.rect(x, y, w, h); return p; }
function ellP(x, y, rx, ry) { const p = P(); p.ellipse(x, y, rx, ry, 0, 0, 6.29); return p; }
function polyP(pts) { const p = P(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath(); return p; }
function box(x, y, w, h, col = C.ink, lw = 1.4) { line([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y - 1]], col, lw); }
function write(text, x, y, size = 18, col = C.dark, align = 'left', weight = 700, rot = 0) {
  g.save(); g.translate(x, y); if (rot) g.rotate(rot);
  g.font = `${weight} ${size}px Caveat, 'Comic Sans MS', cursive`; g.fillStyle = col; g.textAlign = align; g.textBaseline = 'alphabetic';
  g.fillText(text, 0, 0); g.restore();
}

}

function drawReg(t, { hat = true, quiet = false, scale = 1.4 } = {}) {

  const horn = polyP([[-18, -6], [-2, -8], [44, -26], [46, 24], [-2, 8], [-18, 6]]);
  g.fillStyle = '#d1b187'; g.fill(horn);

    g.fillStyle = '#c77b58'; g.fill(hp);
    for (let i = 0; i < 4; i++) line([[-18 + i * 4.5, -9], [-15 + i * 4.5, -19 + Math.abs(i - 1.5) * 2]], C.wine, 1);
    line([[-20, -6], [-17, -18], [-9, -23], [-1, -19], [0, -8]], C.dark, 1.5);
    line([[-21, -6], [1, -8]], C.dark, 2.4);

  }

// A stick cricketer, doodled: head, cap, body, legs. pose 0..1 for the bowler's arm.
function cricketer(x, y, { cap = true, arm = 0, bat = false, hat = false, sc = 1, col = C.dark } = {}) {

// ---------- The match ----------
let ballFly = null;     // a delivery in flight, for the picture
function drawMatch(t) {
  const on = E.season(S) || S.ended;
  if (!on) {
    // No play: the groundsman mows, a chalkboard explains.
    const mx = 400 + (reduced ? 0 : Math.sin(t * 0.3) * 120);
    cricketer(mx, GROUND, { cap: false, sc: 0.9 });
    box(mx + 6, GROUND - 10, 16, 8, C.dark, 1.2); oval(mx + 10, GROUND - 1, 3, 3, C.dark, 1); oval(mx + 19, GROUND - 1, 3, 3, C.dark, 1);
    box(560, 150, 120, 62, C.dark, 1.6);
    g.fillStyle = '#4b3d44'; g.fillRect(562, 152, 116, 58);
    write('NO PLAY', 620, 176, 20, C.paper, 'center');
    write('ANNOUNCER POORLY', 620, 200, 15, C.paper, 'center', 400);
    line([[580, 212], [572, GROUND]], C.dark, 1.4); line([[660, 212], [668, GROUND]], C.dark, 1.4);
    return;
  }
  const rain = E.raining(S) && !S.ended;
  // bunting along the boundary: one string per level
  for (let k = 0; k < (S.lv.bunting || 0); k++) {
    const y0 = 150 + k * 14, pts = [];
    for (let x = 300; x <= 750; x += 10) pts.push([x, y0 + Math.sin((x - 300) / 450 * Math.PI) * 14]);
    curve(pts, C.dark, 1, 0.3);
    for (let i = 0; i < 22; i++) {
      const x = 310 + i * 20, y = y0 + Math.sin((x - 300) / 450 * Math.PI) * 14;
      const f = polyP([[x - 5, y], [x + 5, y], [x, y + 10]]);
      g.fillStyle = [C.red, C.hi, C.ink, C.rust][(i + k) % 4]; g.fill(f);
      line([[x - 5, y], [x, y + 10], [x + 5, y]], C.dark, 0.9, 0.2);
    }
  }
  if (S.one.roller) { // the heavy roller, parked by the pavilion
    oval(300, GROUND - 12, 12, 12, C.dark, 1.6, { fill: '#847875' });
    line([[300, GROUND - 12], [326, GROUND - 34], [334, GROUND - 30]], C.dark, 1.6);
    if (!rain && !reduced) write('(flat)', 300, GROUND + 14, 12, C.grey, 'center', 400);
  }
  if (S.one.board) drawScoreboard();
  // the twelfth man on the boundary, rubbing a ball on his trousers: a stain per level
  if (S.lv.twelfth) {
    const x = 712, y = GROUND, rub = reduced ? 0 : Math.sin(t * 9) * 2;
    cricketer(x, y, { cap: true, sc: 0.95 });
    oval(x + 4 + rub, y - 12, 2.4, 2.4, C.red, 1.2, { fill: C.red });
    for (let i = 0; i < S.lv.twelfth; i++) line([[x + 2 + i * 1.6, y - 10], [x + 1 + i * 1.6, y - 3]], C.red, 1.2, 0.2);
    write('12th', x, y - 44, 12, C.ink, 'center');
  }
  if (rain) {
    // covers on, everyone in the pavilion
    const cov = polyP([[440, GROUND - 2], [452, GROUND - 14], [670, GROUND - 14], [682, GROUND - 2]]);
    g.fillStyle = '#847875'; g.fill(cov); line([[440, GROUND - 2], [452, GROUND - 14], [670, GROUND - 14], [682, GROUND - 2]], C.dark, 1.4);
    write('COVERS ON', 561, GROUND - 4, 14, C.paper, 'center');
    cricketer(UMP.x - 40, GROUND, { cap: false, hat: !!S.one.umpire, sc: 0.95 });
    return;
  }
  // fielders, the umpire, the batsman, the bowler
  for (const [x, s] of [[360, 0.75], [600, 0.8], [740, 0.7], [520, 0.7]]) cricketer(x, GROUND - 2, { sc: s, col: C.ink });
  cricketer(UMP.x, GROUND, { cap: false, hat: !!S.one.umpire });
  cricketer(BAT.x, GROUND, { bat: true, arm: 0.2 });
  const run = S.ballT / E.deliveryEvery(S);
  const bx = BOWLER.x - 40 + Math.min(1, run * 1.2) * 40;
  cricketer(bx, GROUND, { arm: run > 0.85 ? (run - 0.85) / 0.15 : 0.1 });
  // a delivery in flight
  if (ballFly) {
    const u = ballFly.t / 0.5;
    if (u < 1) oval(BOWLER.x + (BAT.x - BOWLER.x) * u, GROUND - 26 + Math.sin(u * Math.PI) * -10 + u * 20, 2.5, 2.5, C.red, 1.2, { fill: C.red });
    else { const v = (ballFly.t - 0.5) / 1.4; if (v < 1) oval(BAT.x - 240 * v * ballFly.k - 30 * v, GROUND - 22 - Math.sin(v * Math.PI) * 90 * ballFly.k, 2.5, 2.5, C.red, 1.2, { fill: C.red }); }
  }

}
function drawBallCallout(t) {

  oval(BALL.x, BALL.y, BALL.r + 9, BALL.r + 9, C.grey, 1, { over: 0.1 });
  const shine = S.finale ? fin.shine : S.shine;
  oval(BALL.x, BALL.y, BALL.r, BALL.r, C.dark, 1.8, { fill: C.red });
  // the seam
  curve([[BALL.x - 6, BALL.y - BALL.r + 2], [BALL.x + 4, BALL.y], [BALL.x - 6, BALL.y + BALL.r - 2]], C.paper, 1.2, 0.2);
  // shine: highlights that grow with each rub
  if (shine > 0) {

function stepRain(dt) {
  const rain = (E.raining(S) && !S.ended) || (S.ended && S.how === 'rain') || (fin && fin.rain);

  while (rainDrops.length < 90) rainDrops.push({ x: Math.random() * 840, y: Math.random() * -520 + (rainDrops.length < 2 ? 0 : Math.random() * 520) });

  if (ballOn && Math.hypot(p.x - BALL.x, p.y - BALL.y) < BALL.r + 34) return 'ball';

cv.addEventListener('keydown', e => {

  restore();
  reg('a hen, a broody, a rooster in a tiny hat', 90, 34, () => { hen(15, 30, 1, 0); hen(45, 30, 1, 0, { brood: true }); hen(74, 30, -1, 0, { rooster: true, hat: true }); });
  reg('Maud, her deckchair, flask and two cups', 90, 60, () => { S.one.deckchair = S.one.cups = true; g.translate(-MAUD.x + 50, -MAUD.y + 56); drawMaud(0); });
  restore();
  reg('the bowler, the umpire in his hat, the batsman', 120, 50, () => { cricketer(20, 46, { arm: 0.7 }); cricketer(60, 46, { cap: false, hat: true }); cricketer(100, 46, { bat: true }); });
  reg('the mortar and the heaviest pestle', 150, 130, () => { S.lv.pestle = 5; g.translate(-MORTAR.x + 75, -MORTAR.y + 80); drawMortar(0); });
  restore();
  reg('the copper still at its biggest', 140, 170, () => { S.lv.still = 4; S.hens = 5; g.translate(-660, -280); drawStillRoom(0); });
  restore();
  reg('the scoreboard and the pigeon', 110, 180, () => { S.one.board = true; g.translate(-300, -66); drawScoreboard(); drawPigeon(380, 140, 0); });
  restore();
  // The whole page with everything bought, mid-season.
  reg('the page with everything bought', 800, 520, () => {
    S.comfort = 10; S.fixture = 3; S.hens = 60; S.broodies = 12; S.roosters = 6; S.rubs = 99; S.balls = 9; S.wt = 10;
    for (const it of E.ITEMS) { if (it.kind === 'lv') S.lv[it.id] = it.max; else if (it.kind !== 'make') S.one[it.id] = true; }
    drawPavilion(); drawGround(0); drawMatch(0); drawMaud(0); drawReg(0); drawCoop(0); drawStillRoom(0); drawWeather(0);
  }, 1);
  restore();
}

// ---------- Start ----------
layout();
if (DEBUG) Object.assign(window.__game, { end, doFinal, doTea, doRub, doShine, fin: () => fin });
const away = S.savedAt ? (Date.now() - S.savedAt) / 1000 : 0;
if (S.ended) end(true);
else if (S.finale) { S.finale = false; doFinal(); }
else if (!S.rubs) say('REG', 'Testing, testing. Reg here, the pavilion loudspeaker, forty seasons and a tiny hat. My throat is raw, and Maud of the Gazette says I sound like a goose in a drainpipe. The almanac says egg oil. The hens are right there. Rub round the mortar, would you?');
else {
  const off = E.offline(S, away);
  if (off) say('WHILE YOU WERE OUT', `${Math.round(off.secs / 60)} minutes away. The coop kept laying, at a gentle pace: ${fmt(off.drops)} drops of oil${off.cheers >= 1 ? `, and the twelfth man kept bowling for ${fmt(off.cheers)} cheers${off.fixtures ? ` (${off.fixtures} match${off.fixtures > 1 ? 'es' : ''} called)` : ''}` : ''}. Nothing hatched: nobody was watching.`);
  else say('REG', 'And we’re back. Reg resumes commentary, with apologies for the interruption, which Reg also commentated.');
}
save();
hud(); renderShop(); renderCalls();
document.fonts?.ready.then(layout);
spritesReady.then(() => { if (Sprites.sheetRequested()) { sheet(); Sprites.showSheet({ zoom: 1 }); } });
requestAnimationFrame(frame);
</script>

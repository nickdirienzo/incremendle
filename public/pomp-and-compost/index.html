<style>
  /* A chalk drawing on the potting-shed blackboard, in Resurrect 32: the board (#0b5e65, rubbed-out #0b8a8f),
     the frame (#966c6c, #625565), white chalk, and the coloured sticks: brass (#fbb954), primrose (#fbff86),
     sky (#8fd3ff), pink (#f68181, #fca790), lilac (#eaaded), leaf (#91db69), mint (#8ff8e2), and red (#e83b3b). */
  :root {
    --board: #0b5e65; --board2: #0b8a8f; --deep: #3e3546; --frame: #966c6c; --frame2: #625565; --chalk: #ffffff;
    --brass: #fbb954; --prim: #fbff86; --sky: #8fd3ff; --pink: #f68181; --peach: #fca790; --lilac: #eaaded; --leaf: #91db69;
    --mint: #8ff8e2; --red: #e83b3b; --sand: #e3c896; --mush: #ab947a; --plum: #6b3e75;
    --hand: 'Gochi Hand', 'Comic Sans MS', cursive; --title: 'Fredericka the Great', Georgia, serif;
    color-scheme: dark;
  }
  html, body { background: var(--deep); color: var(--chalk); }
  [hidden] { display: none !important; }
  body {
    margin: 0; font: 17px/1.3 var(--hand);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(10px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
    background-image: radial-gradient(ellipse at 50% -10%, #625565 0%, transparent 60%);
  }
  .wrap { max-width: 1140px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 0 0 6px; }
  h1 { font: 400 40px/1.05 var(--title); margin: 0; color: var(--prim); letter-spacing: .5px; }
  header p { margin: 0; font: 19px/1.1 var(--hand); color: var(--mush); }
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
  @media (max-width: 760px) { .game { grid-template-columns: 1fr; } h1 { font-size: 32px; } }
  main { min-width: 0; }

  /* The blackboard, in its wooden frame. */
  .board { position: relative; background: var(--board); border: 9px solid var(--frame); border-radius: 4px;
    box-shadow: 0 0 0 2px var(--frame2), inset 0 0 40px #0006, 6px 9px 0 #0004; padding: 8px 10px 8px; }
  .board::after { content: ''; position: absolute; left: 6%; right: 6%; bottom: -9px; height: 6px; background: var(--frame2); border-radius: 2px; }
  .hud { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; align-items: center; margin-bottom: 4px; }
  .res { font: 34px/1 var(--hand); color: var(--prim); white-space: nowrap; }
  .res small { font-size: 20px; color: var(--chalk); }
  .res .rate { display: block; font-size: 16px; color: var(--mint); margin-top: 1px; }
  .goal { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 19px; color: var(--chalk); }
  .goal span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { position: relative; flex: 1; min-width: 50px; height: 14px; border: 2px solid #ffffffcc; border-radius: 8px 5px 9px 6px; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; transition: width .4s; background: repeating-linear-gradient(-55deg, #fbff86cc 0 3px, transparent 3px 7px); }
  .sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0 16px; font-size: 17px; color: #ffffffcc; min-height: 21px; }
  .sub b { font-weight: 400; color: var(--prim); }
  .sub .warn { color: var(--peach); }
  @media (max-width: 520px) { .hud { grid-template-columns: 1fr; } .res { font-size: 30px; } }

  canvas#stage { display: block; width: 100%; max-width: calc((100vh - 350px) * 720 / 560); min-width: min(100%, 520px); margin: 0 auto; aspect-ratio: 720 / 560; touch-action: none; cursor: ew-resize; -webkit-tap-highlight-color: transparent; user-select: none; }
  canvas#stage:focus-visible { outline: 2px dashed var(--prim); outline-offset: 3px; }

  .book { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; margin-top: 6px; }
  .book h3 { margin: 0; font: 400 18px/1 var(--title); color: var(--prim); white-space: nowrap; }
  #cat { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }
  @media (max-width: 520px) { .book { grid-template-columns: 1fr; } #cat { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  #cat canvas { width: 100%; aspect-ratio: 1; display: block; }
  .log { margin: 6px 0 0; min-height: 2.7em; font: 18px/1.3 var(--hand); color: var(--chalk); border-top: 2px dashed #ffffff55; padding: 6px 2px 2px; }
  .log b { font: 400 15px/1 var(--title); color: var(--board); background: var(--prim); padding: 2px 7px 3px; margin-right: 8px; border-radius: 6px 2px 6px 2px; }
  .log b.o { background: var(--peach); }
  .log b.r { background: var(--sky); }
  .log b.w { background: var(--mint); }
  .log.fresh span { animation: dust .8s ease-out; }
  @keyframes dust { from { opacity: .1; filter: blur(1px); } }

  aside { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; scrollbar-width: thin; padding: 2px 4px 8px 2px; }
  @media (max-width: 760px) { aside { position: static; max-height: none; overflow: visible; } }
  .col { background: var(--board); border: 7px solid var(--frame); border-radius: 4px; box-shadow: 0 0 0 2px var(--frame2), inset 0 0 30px #0005, 4px 6px 0 #0004; padding: 10px 10px 8px; }
  #calls { display: grid; gap: 8px; margin-bottom: 10px; }
  #calls:empty { display: none; }
  .call { position: relative; text-align: left; font: 17px/1.15 var(--hand); color: var(--chalk); background: #ffffff14; border: 2.5px solid var(--prim); border-radius: 14px 5px 12px 6px; padding: 6px 10px 8px; cursor: pointer; }
  .call b { display: block; font: 400 22px/1.05 var(--title); color: var(--prim); margin-bottom: 2px; }
  .call.can { background: #fbff8626; animation: nudge 1.6s ease-in-out infinite; }
  .call:focus-visible { outline: 2px dashed var(--prim); outline-offset: 4px; }
  @keyframes nudge { 50% { transform: translateY(-2px) rotate(-.6deg); } }
  aside h2 { font: 400 25px/1 var(--title); margin: 0 0 8px; color: var(--chalk); }
  #afford { font: 18px/1 var(--hand); color: var(--prim); }
  #shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  @media (max-width: 760px) and (min-width: 520px) { #shop { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .up {
    position: relative; display: flex; flex-direction: column; min-width: 0; text-align: left; font: 16px/1.1 var(--hand); color: #ffffff99;
    background: transparent; border: 2px solid #ffffff55; border-radius: 8px 3px 9px 4px; padding: 4px 7px 5px; cursor: pointer;
  }
  .up b { font-weight: 400; font-size: 18px; line-height: 1.1; color: #ffffffbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up.can { border-color: var(--prim); background: #fbff861c; }
  .up.can b { color: var(--chalk); }
  .up.can em { color: var(--prim); }
  .up[aria-disabled="true"] { cursor: default; }
  .up.odd { border-style: dashed; }
  .up.odd b::before, .bought.odd::before { content: '✻ '; color: var(--pink); }
  .up .tag { position: absolute; top: -10px; right: 4px; font: 15px/1 var(--hand); font-style: normal; color: var(--board); background: var(--pink); padding: 1px 6px 2px; border-radius: 6px 2px 6px 2px; transform: rotate(4deg); }
  .up.new { animation: glint 1.1s ease-in-out 6; }
  @keyframes glint { 50% { box-shadow: 0 0 0 3px #f6818188; transform: rotate(-1deg); } }
  .up:focus-visible, .bought:focus-visible { outline: 2px dashed var(--prim); outline-offset: 2px; }
  #tip {
    position: fixed; z-index: 50; width: 280px; padding: 9px 12px 10px; pointer-events: none; font: 17px/1.25 var(--hand); color: var(--chalk);
    background: var(--board); border: 5px solid var(--frame); border-radius: 4px; box-shadow: 0 0 0 2px var(--frame2), inset 0 0 24px #0005, 5px 7px 0 #0005;
  }
  #tip b { display: block; font: 400 22px/1.05 var(--title); color: var(--prim); margin-bottom: 4px; }
  #tip .fx { display: block; margin-top: 6px; padding: 2px 7px 3px; color: var(--board); background: var(--mint); border-radius: 5px 2px 6px 2px; }
  #tip i { display: block; margin-top: 7px; padding-top: 5px; border-top: 2px dashed #ffffff55; color: var(--peach); font-style: normal; }
  #tip small { display: block; margin-top: 5px; font-size: 18px; color: var(--prim); }
  #tip.inline { position: static; width: auto; margin-top: 10px; }
  #bought { margin: 12px 0 2px; }
  #bought summary { display: flex; align-items: center; gap: 6px; font: 400 20px/1 var(--title); color: var(--chalk); cursor: pointer; list-style: none; padding: 3px 2px; }
  #bought summary::-webkit-details-marker { display: none; }
  #bought summary::before { content: '›'; color: var(--prim); transition: transform .2s; }
  #bought[open] summary::before { transform: rotate(90deg); }
  #bought summary:focus-visible { outline: 2px dashed var(--prim); outline-offset: 2px; }
  .shelf { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 2px 2px; }
  .bought { max-width: 100%; font: 16px/1.05 var(--hand); color: var(--chalk); background: transparent; border: 1.5px solid #ffffff66; border-radius: 7px 3px 7px 3px; padding: 3px 7px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bought.odd { border-style: dashed; }
  .bought:hover, .bought.on { background: #fbff8622; border-color: var(--prim); }

  #ending { margin: 22px auto 0; max-width: 700px; color: var(--chalk); background: var(--board); border: 9px solid var(--frame); border-radius: 4px; box-shadow: 0 0 0 2px var(--frame2), inset 0 0 40px #0006, 6px 9px 0 #0004; padding: 18px 26px 22px; }
  #ending .num { font: 400 17px/1 var(--title); color: var(--mint); letter-spacing: 1px; }
  #ending h2 { font: 400 40px/1.05 var(--title); margin: 8px 0 10px; color: var(--prim); }
  #ending p { margin: 9px 0; font-size: 19px; }
  #ending .guide { margin: 14px 0; padding: 8px 14px 10px; border: 2.5px dashed var(--prim); border-radius: 12px 4px 10px 6px; color: var(--prim); font-size: 21px; }
  #ending .guide b { display: block; font: 400 18px/1 var(--title); color: var(--mint); margin-bottom: 4px; }
  #shareBtn, #againBtn { font: 400 22px/1 var(--title); color: var(--board); background: var(--prim); border: 2.5px solid var(--chalk); border-radius: 14px 5px 12px 6px; padding: 8px 18px 9px; margin: 12px 8px 0 0; cursor: pointer; }
  #againBtn { background: transparent; color: var(--chalk); }
  #shareBtn:focus-visible, #againBtn:focus-visible { outline: 2px dashed var(--prim); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .up.new, .call.can, .log.fresh span { animation: none; } .meter i, #bought summary::before { transition: none; } }
</style>

          <div class="goal" title="The attic: forty trunks of royal socks, two centuries deep. Mr Ormsby is emptying them out of the windows, one sock at a time."><span id="trunkTxt">Trunk 1 of 40</span><div class="meter"><i id="attic"></i></div><span id="atticPct">0%</span></div>

<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import rough from 'roughjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const fmt = E.fmt;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG = location.search.includes('debug');
const C = { board: '#0b5e65', board2: '#0b8a8f', deep: '#3e3546', frame: '#966c6c', chalk: '#ffffff', brass: '#fbb954', prim: '#fbff86',
  sky: '#8fd3ff', blue: '#4d9be6', pink: '#f68181', peach: '#fca790', lilac: '#eaaded', leaf: '#91db69', green: '#1ebc73', mint: '#8ff8e2',
  red: '#e83b3b', rose: '#c32454', sand: '#e3c896', mush: '#ab947a', rust: '#cd683d', violet: '#a884f3', plum: '#905ea9', grey: '#625565' };

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:29:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
const save = () => { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound: G mixolydian, the soundtrack's key (G A B C D E F; the F natural is the colour) ----------
const A = createAudio({ sfxTrim: 1, musicTrim: 1 });
const LV = {};
let gainNow = 1;
const T = o => A.tone({ ...o, vol: o.vol * gainNow });
const N = (kind, o = {}) => A.noiseHit(kind, { ...o, vol: (o.vol ?? 0.25) * gainNow });
const notes = scale('mixolydian', 67);   // G4 A B C D E F
const rl = {};
const limit = (k, ms) => { const t = performance.now(); if (t - (rl[k] || 0) < ms && !DEBUG) return false; rl[k] = t; return true; };
let combo = 0;
const sfx = {
  // A sock into the bell: a soft brassy blip that climbs the scale while you keep catching.
  catch() { const d = [0, 1, 2, 3, 4, 5, 6, 7][combo % 8]; T({ type: 'triangle', freq: notes(d), dur: 0.07, vol: 0.13, cutoff: 1800, glide: 1.02 }); T({ type: 'sine', freq: notes(d + 7), dur: 0.05, vol: 0.04, at: A.now + 0.02 }); },
  // An umbrella catches one on its own: higher, smaller.
  brolly() { if (!limit('brolly', 250)) return; T({ type: 'pluck', freq: notes(9), dur: 0.06, vol: 0.08, cutoff: 3000 }); },
  // The heap turns a sock into soil: a soft low tock, now and then.
  soil() { if (!limit('soil', 900)) return; T({ type: 'pluck', freq: notes(-3), dur: 0.08, vol: 0.09, cutoff: 1200 }); },
  // A new kind for the Household Book.
  fresh() { [0, 2, 4, 7].forEach((d, i) => T({ type: 'bell', freq: notes(d + 7), dur: 0.22, vol: 0.07, at: A.now + i * 0.08 })); },
  // A pair, reunited: two notes a third apart.
  pair() { T({ type: 'keys', freq: notes(2), dur: 0.25, vol: 0.08 }); T({ type: 'keys', freq: notes(4), dur: 0.25, vol: 0.07 }); T({ type: 'bell', freq: notes(9), dur: 0.2, vol: 0.05, at: A.now + 0.08 }); },
  // A sock pegged on the line to wait.
  peg() { N('hat', { vol: 0.07, dur: 0.03 }); T({ type: 'pluck', freq: notes(5), dur: 0.05, vol: 0.06, cutoff: 2400 }); },
  // The oldest sock sent back up to the attic.
  bump() { N('whoosh', { vol: 0.05, dur: 0.4 }); T({ type: 'sine', freq: notes(2), dur: 0.2, vol: 0.05, glide: 1.5 }); },
  // A sock lands on the path and a tourist pockets it.
  miss() { if (!limit('miss', 200)) return; T({ type: 'triangle', freq: notes(4), dur: 0.08, vol: 0.08, cutoff: 1400 }); T({ type: 'triangle', freq: notes(1), dur: 0.12, vol: 0.08, cutoff: 1400, at: A.now + 0.1 }); },
  // The velvet rope saves one.
  rope() { N('kick', { vol: 0.05 }); T({ type: 'sine', freq: notes(0), dur: 0.18, vol: 0.06, glide: 2 }); },
  buy() { [0, 2, 4, 6, 7].forEach((d, i) => T({ type: 'pluck', freq: notes(d + 7), dur: 0.09, vol: 0.1, at: A.now + i * 0.055, cutoff: 3200 })); },
  unlock() { T({ type: 'bell', freq: notes(11), dur: 0.25, vol: 0.08 }); T({ type: 'bell', freq: notes(14), dur: 0.35, vol: 0.07, at: A.now + 0.12 }); },
  deny() { T({ type: 'triangle', freq: notes(-4), dur: 0.08, vol: 0.1 }); },
  // A trunk empty: a little fanfare, pomp in four notes.
  trunk() { [0, 4, 7, 9].forEach((d, i) => T({ type: 'sawtooth', freq: notes(d), dur: i === 3 ? 0.3 : 0.09, vol: 0.05, cutoff: 1600, at: A.now + i * 0.11 })); },
  // Rule Two: a drum roll, then F major to G (the mixolydian flat seven, home).
  rule() {
    const t0 = A.now;
    for (let i = 0; i < 10; i++) N('snare', { vol: 0.03 + i * 0.006, at: t0 + i * 0.06 });
    [[-1, 1, 3], [0, 2, 4]].forEach((ch, k) => ch.forEach(d => T({ type: 'sawtooth', freq: notes(d + 7), dur: 0.5, vol: 0.03, cutoff: 1700, at: t0 + 0.7 + k * 0.5 })));
    T({ type: 'bell', freq: notes(14), dur: 0.6, vol: 0.06, at: t0 + 1.25 });
  },
  // The King's trunk opens.
  showdown() { const t0 = A.now; [0, 0, 4, 7, 6, 7].forEach((d, i) => T({ type: 'sawtooth', freq: notes(d + 7), dur: 0.12, vol: 0.05, cutoff: 2000, at: t0 + i * 0.12 })); N('whoosh', { vol: 0.06, dur: 1.2, at: t0 + 0.5 }); },
  // The will, fluttering.
  will() { N('whoosh', { vol: 0.05, dur: 1.4 }); T({ type: 'bell', freq: notes(4), dur: 0.6, vol: 0.06, at: A.now + 0.3 }); },
  // The end: a slow cadence, F to G, and the guide's chime.
  finale() {
    const t0 = A.now;
    [[-1, 1, 3, 5], [0, 2, 4, 7]].forEach((ch, k) => ch.forEach(d => T({ type: 'keys', freq: notes(d + 7), dur: 1, vol: 0.05, at: t0 + k * 0.9 })));
    [7, 9, 11, 14].forEach((d, i) => T({ type: 'bell', freq: notes(d + 7), dur: 0.6, vol: 0.05, at: t0 + 2 + i * 0.16 }));
  },
};
for (const [name, f] of Object.entries(sfx)) sfx[name] = (...a) => { gainNow = LV[name] ?? 1; try { f(...a); } finally { gainNow = 1; } };
if (DEBUG) window.__game = { A, sfx, long: ['rule', 'showdown', 'finale', 'will'], S: () => S, E };

// ---------- Music ----------
let music = null, soundtrack = null;
const phaseKey = () => S.ended ? 'end' : S.phase === 3 ? 'showdown' : S.phase === 2 ? 'pairs' : 'catalogue';
function song() { return (soundtrack ??= createSoundtrack(music.strudel))(phaseKey()); }
createMusic(A, { packs: ['vcsl'], soundfonts: true, song }).then(m => { music = m; music.update(); if (DEBUG) window.__game.music = m; }).catch(e => console.warn('music', e));
const refreshMusic = () => { if (music) music.update(); };

// ---------- Chalk ----------
// Every colour is a stick of chalk: a pattern with the board showing through. Lines wobble a little, the same
// way every frame (seeded), and get a faint dusty second pass.
const W = 720, H = 560;
const cv = $('stage');
let g = cv.getContext('2d');
const PATS = new WeakMap();
let noiseSeed = 1;
const nrand = () => ((noiseSeed = (noiseSeed * 16807) % 2147483647) / 2147483647);
function chalk(col) {
  let m = PATS.get(g); if (!m) PATS.set(g, m = {});

  const c = document.createElement('canvas'); c.width = c.height = 96;
  const q = c.getContext('2d'); q.fillStyle = col; q.fillRect(0, 0, 96, 96);
  const img = q.getImageData(0, 0, 96, 96), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const r = nrand(); d[i + 3] = r < 0.2 ? 0 : r < 0.42 ? 110 : 235; }
  q.putImageData(img, 0, 0);

}
let seedN = 0;
const hash = (a, b = 0) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; h ^= h >>> 16; return (h >>> 0) / 4294967296; };

const J = (a = 0.8) => (hash(seedN++, 3) - 0.5) * 2 * a;
function stroke(col, w) { g.strokeStyle = chalk(col); g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; }
function line(pts, col = C.chalk, w = 2.4, j = 0.7) {
  const p = pts.map(([x, y]) => [x + J(j), y + J(j)]);
  stroke(col, w); g.beginPath(); p.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
  g.globalAlpha *= 0.3; stroke(col, w * 1.9); g.beginPath(); p.forEach(([x, y], i) => i ? g.lineTo(x + 0.6, y + 0.5) : g.moveTo(x + 0.6, y + 0.5)); g.stroke(); g.globalAlpha /= 0.3;
}
function curve(pts, col = C.chalk, w = 2.4, j = 0.6) {

  for (let i = 1; i < p.length - 1; i++) g.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);

}
function oval(x, y, rx, ry, col = C.chalk, w = 2.2, { fill = null, fa = 0.45, a0 = 0, a1 = Math.PI * 2, j = 0.5 } = {}) {
  const n = Math.max(10, Math.round((rx + ry) / 3));

}
function fill(pts, col, a = 0.5) {

}

}

// Hatch a shape with chalk strokes (shading).

  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  g.save(); g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.clip();

// A sock, drawn at the origin, toe to the right. Scale 1 is about 22 px tall.
function drawSock(kind, x, y, rot = 0, sc = 1, { glow = false, ghost = false } = {}) {
  const k = E.KINDS[E.KIND[kind]];
  const s = sc * (k.pat === 'stocking' ? 1.35 : k.pat === 'lace' ? 0.75 : 1);
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  seed(E.KIND[kind] + 40);
  const shape = [[-5, -12], [5, -12], [5, 3], [7, 6], [12, 7], [15, 10], [12, 13], [-1, 13], [-5, 9]];
  if (glow) { g.globalAlpha *= 0.35; oval(3, 0, 17, 17, null, 0, { fill: C.prim, fa: 0.6 }); g.globalAlpha /= 0.35; }
  if (ghost) { line([...shape, shape[0]], '#ffffff', 1.4, 0.4); g.restore(); return; }
  fill(shape, k.col, 0.85);
  const alt = k.alt;
  if (k.pat === 'hoops') for (const yy of [-6, 0]) line([[-5, yy], [5, yy]], alt, 2.4, 0.3);
  if (k.pat === 'tweed') for (let i = 0; i < 7; i++) oval(-3 + (i * 7) % 9, -9 + i * 3, 0.8, 0.8, alt, 1.3);
  if (k.pat === 'argyle') { line([[-5, -6], [0, -10], [5, -6], [0, -2], [-5, -6]], alt, 1.4, 0.2); line([[-5, 2], [0, -2], [5, 2], [0, 6], [-5, 2]], alt, 1.4, 0.2); }
  if (k.pat === 'snow') { line([[-3, -4], [3, 2]], alt, 1.2, 0.1); line([[3, -4], [-3, 2]], alt, 1.2, 0.1); line([[0, -5], [0, 3]], alt, 1.2, 0.1); }
  if (k.pat === 'lace') for (let i = 0; i < 5; i++) oval(-3 + i * 1.6, -11 + (i % 2) * 2, 1, 1, alt, 1);
  if (k.pat === 'toes') for (let i = 0; i < 5; i++) oval(13.5 - i * 0.2, 7.5 + i * 1.3, 1.6, 1, alt, 1.2);
  if (k.pat === 'hole') oval(1, 9, 2.6, 2.2, null, 0, { fill: C.board, fa: 1 });
  if (k.pat === 'message') write('HELP', 0, -3, 6, alt, 'center', 'Gochi Hand', -Math.PI / 2);
  if (k.pat === 'gold') { line([[-2, -4], [-2, 0]], '#ffffff', 1.2, 0.1); line([[-4, -2], [0, -2]], '#ffffff', 1.2, 0.1); line([[2, 4], [5, 4]], C.brass, 1.2, 0.1); }
  if (k.pat === 'fluffy') for (let i = 0; i < 6; i++) oval(-5 + (i % 2) * 10, -10 + i * 4, 1.3, 1.3, alt, 1.2);
  const cuff = k.pat === 'stocking' || k.pat === 'gold' ? '#ffffff' : alt;

  g.restore();
}

// The trumpet, tipped up so its bell faces the sky. x, y is the middle of the bell's rim; the bell widens with the
// bell level (taped-on cones, one chalk band each). The body runs down and to the left: bell tube, slide, leadpipe,
// three valves, and a mouthpiece, all in brass chalk.
function drawTrumpet(x, y, { bw = E.bellWidth(S), happy = 0, tape = vis('bell'), glass = has('glass'), sc = 1 } = {}) {
  g.save(); g.translate(x, y); g.scale(sc, sc);

  oval(-26, 98, 40, 5, null, 0, { fill: '#000000', fa: 0.18 });
  g.save(); g.rotate(-Math.PI / 2 + 0.3);
  const r = bw / 2, L = 22 + r * 0.45;

  tube([[-L - 66, 13], [-L - 30, 13], [-L + 2, 13]]);
  curve([[-L + 2, 13], [-L + 8, 19], [-L + 2, 25]], C.brass, 4, 0.3);
  tube([[-L + 2, 25], [-L - 40, 25], [-L - 84, 25]], 3.6);

  // Three valves with their finger buttons.
  for (const vx of [-L - 22, -L - 32, -L - 42]) {
    fill([[vx - 3.5, -4], [vx + 3.5, -4], [vx + 3.5, 30], [vx - 3.5, 30]], C.brass, 0.85);
    line([[vx - 3.5, -4], [vx - 3.5, 30]], C.prim, 1.3, 0.2); line([[vx + 3.5, -4], [vx + 3.5, 30]], C.prim, 1.3, 0.2);
    line([[vx, -4], [vx, -11]], C.prim, 1.6, 0.2); oval(vx, -12.5, 3.2, 1.8, C.prim, 1.6, { fill: '#ffffff', fa: 0.6 });
  }
  // The bell's flare, rim at the origin.
  const top = [[0, -r], [-L * 0.3, -r * 0.42], [-L * 0.65, -r * 0.14], [-L, -2.5]];
  const bot = top.map(([a, b]) => [a, -b]).reverse();

  for (let i = 0; i < tape; i++) { const xx = -2 - i * 1.9, rr = r * (1 - (i * 1.9) / (L * 0.5)) - 2; if (rr > 4) line([[xx, -rr], [xx, rr]], '#ffffff', 1.1, 0.4); }

  curve([[ex - 7, -3], [ex - 8.5, 0], [ex - 7, 3]], C.deep, 1.5, 0.2);
  g.restore();
  // The magnifying glass, propped on the lawn beside it.
  if (glass) { line([[34, 96], [44, 78]], C.mush, 2.4); oval(47, 71, 8, 8, C.sky, 2.2, { fill: C.sky, fa: 0.22 }); }

  line([[118, 30], [118, 8], [138, 8], [138, 30]], C.chalk, 2.2); line([[582, 30], [582, 8], [602, 8], [602, 30]], C.chalk, 2.2);

  g.globalAlpha = 0.25; hatch([[40, 112], [80, 30], [640, 30], [680, 112]], C.chalk, 9, 0.6, 1); g.globalAlpha = 1;
  const open = E.windows(S);
  WX.forEach((wx, i) => {
    const isOpen = i < open || S.ended;
    box(wx - 28, 46, 56, 56, C.chalk, 2.4, isOpen ? C.deep : C.board2, isOpen ? 0.95 : 0.5);
    line([[wx - 32, 38], [wx, 26], [wx + 32, 38]], C.chalk, 2.2);

    if (vis('labels') > i * 1.5 && S.phase >= 2) write('MATCHING', wx, 110, 10, C.mint);
  });

const spritesReady = Promise.all([
  chalkSprite('crown', 'tabler--crown.svg', 48, C.prim, { fill: C.brass, fillStyle: 'hachure', hachureGap: 4 }),
  chalkSprite('will', 'lucide--scroll-text.svg', 72, C.chalk, { fill: C.sand, fillStyle: 'hachure', hachureGap: 5 }),
]).then(() => { bgSig = ''; });
function sheet() {
  const reg = (name, w, h, f, s = 2) => {
    const c = Sprites.canvas(w * s, h * s), q = c.getContext('2d');
    q.fillStyle = C.board; q.fillRect(0, 0, c.width, c.height);
    const keep = g; g = q; q.setTransform(s, 0, 0, s, 0, 0); f(); g = keep;
    Sprites.register(name, c);
  };
  const keep = JSON.stringify(S);
  const restore = () => { const o = JSON.parse(keep); for (const k of Object.keys(o)) S[k] = o[k]; };
  reg('the trumpet, plain', 90, 120, () => drawTrumpet(45, 14, { bw: 46, tape: 0, glass: false }));
  reg('the trumpet, widest bell, glass, happy', 140, 120, () => drawTrumpet(70, 14, { bw: 110, tape: 8, glass: true, happy: 1 }));
  reg('the twelve royal socks', 300, 50, () => E.KINDS.forEach((k, i) => drawSock(k.id, 14 + i * 24, 24, 0, 1)));
  reg('Mr Ormsby, a footman, Ormsby waiting', 150, 60, () => { drawOrmsby(25, 30, { holding: 'argyle', arm: 0.5 }); drawFootman(80, 30, 1, 0.5); drawOrmsby(120, 30, { wait: true }); });
  reg('the tour, with audio guides', 150, 60, () => { for (let i = 0; i < 4; i++) tourist(20 + i * 36, 44, i, { walk: i, camera: i === 2, sockIn: i === 3 ? 'football' : null }); });
  reg('an umbrella, upside down, with socks', 60, 60, () => umbrella(30, 20, 0, 3));
  reg('gnome, Stop 14a, crest, sign, portrait', 330, 110, () => { gnome(20, 90); post14a(60, 100); post14a(95, 100, true); crest(140, 50); sign(210, 90); portrait(290, 50); });
  reg('the will', 60, 60, () => drawWill(30, 30, 0));
  restore();
  reg('the garden with everything bought', 720, 560, () => {
    S.phase = 2; S.dropped = E.ATTIC_TOTAL * 0.8; S.heap = 30; S.line = ['argyle', 'toe', 'coronation', 'bed', 'holey'];
    for (const it of E.ITEMS) { if (it.kind === 'lv') S.lv[it.id] = E.max(it); else S.one[it.id] = true; }
    const kb = bg.width, kh = bg.height; bg.width = 720; bg.height = 560; drawBg(); g.drawImage(bg, 0, 0); bg.width = kb; bg.height = kh; bgSig = '';
    drawHeap(); for (let i = 0; i < 10; i++) umbrella(UX[i], UMB_Y, i, 1);
    S.line.forEach((kind, i) => { const [px, py] = slotPos(i); drawSock(kind, px, py + 10, 0, 0.8); });
    for (let i = 0; i < 4; i++) i ? drawFootman(WX[i] - 4, 72, i) : drawOrmsby(WX[0] - 6, 70, { holding: 'skating' });
    drawTrumpet(300, BELL_Y, { bw: E.bellWidth(S) });
    for (const p of tour) tourist(p.x, 530, p.i, { camera: p.i === 2 });
  }, 1);
  restore();
}

// ---------- Start ----------
layout();
renderCat();
if (DEBUG) Object.assign(window.__game, { end, handIn, knock, E, socks, aim: x => { target = x; }, tx: () => tx });
const away = S.savedAt ? (Date.now() - S.savedAt) / 1000 : 0;
if (S.ended) end(true);
else if (!S.started) say('GUIDE', 'Welcome to the kitchen garden. Rule One of the palace household (1702): nothing belonging to the Crown shall ever leave the palace. Above you, the attic, full to the rafters with two centuries of royal socks. Beside the heap, a trumpet. Press anywhere on the board to begin.');
else {
  if (S.phase === 3 && S.sd) { S.sd.q = [...(S.sd.air || []), ...S.sd.q]; S.sd.air = []; if (S.sd.will === 1) spawn(null, { will: true }); }
  const off = away > 60 ? E.offline(S, away) : null;
  if (off) say('AWAY', `${Math.round(off.secs / 60) >= 120 ? 'Two hours and more' : Math.round(off.secs / 60) + ' minutes'} away. ${S.lv.umbrella ? `The umbrellas caught ${fmt(off.socks)} sock${off.socks === 1 ? '' : 's'} at a gentle pace while you were out, and` : 'Nobody was under the windows, so Mr Ormsby waited, but'} the heap kept rotting: +${fmt(off.soil)} soil.`, 'w');
  else say('GUIDE', S.phase === 3 ? 'King Humphrey’s trunk, still pouring. Please resume catching.' : 'Welcome back to the kitchen garden. Mr Ormsby has kept your place.');
}
held = S.phase < 3 ? E.pickKind(S) : null;
save();
hud(); renderShop(); renderCalls();
document.fonts?.ready.then(() => { layout(); bgSig = ''; renderCat(); });
spritesReady.then(() => { if (Sprites.sheetRequested()) { sheet(); Sprites.showSheet({ zoom: 1 }); } });
requestAnimationFrame(frame);
</script>
</body>
</html>

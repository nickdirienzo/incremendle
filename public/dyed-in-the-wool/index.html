  :root {

  html, body { background: var(--bg); color: var(--ink); }

  .up.new { animation: pulse 1.6s ease-in-out 4; }

  #tip b { display: block; font: 400 20px var(--sc); border-bottom: 2px solid var(--k); margin-bottom: 4px; }
  #tip span { white-space: pre-line; }
  #tip small { display: block; white-space: pre-line; margin-top: 6px; font-size: 15px; color: var(--night); }
  #tip i { display: block; margin-top: 6px; font-size: 15px; border-top: 1.5px dashed var(--k); padding-top: 5px; }

  #ending h2 { font: 400 34px/1.1 var(--sc); margin: 0 0 8px; }

  #ending p { margin: 9px 0; font-size: 18px; }
  #shareBtn, #againBtn { margin: 4px; }
  @media (prefers-reduced-motion: reduce) { .up.new, .cell.new, .log.fresh { animation: none; } .bar i, #bought summary::before { transition: none; } }
</style>

<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import * as Fx from '/shared/kit/fx.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const DEBUG = location.search.includes('debug');
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:28:save';
let S = E.newState();
try { const raw = localStorage.getItem(KEY); if (raw) S = E.load(JSON.parse(raw)); } catch (e) {}
const save = () => { S.lastSeen = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = { k: '#000000', paper: '#c5ccb8', grey: '#9a9a97', dgrey: '#6f6776', plum: '#8b5580', pink: '#c38890', lilac: '#a593a5', violet: '#666092',
  red: '#9a4f50', salmon: '#c28d75', sky: '#7ca1c0', blue: '#416aa3', rose: '#8d6268', ochre: '#be955c', teal: '#68aca9', dteal: '#387080',
  taupe: '#6e6962', olive: '#93a167', green: '#6eaa78', dgreen: '#557064', khaki: '#9d9f7f', sage: '#7e9e99', slate: '#5d6872', night: '#433455' };
const FELL = "'IM Fell English', Georgia, serif", SC = "'IM Fell English SC', 'IM Fell English', Georgia, serif";
const fmt = E.fmt, fs = E.fmtShort;
const pick = a => a[Math.floor(Math.random() * a.length)];
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const per = x => x < 10 ? (Math.round(x * 100) / 100).toString() : x < 100 ? x.toFixed(1) : fmt(x);

// ---------- Sound: everything on A hirajoshi (A B C E F), the steel band's five notes ----------
const A = createAudio({ sfxTrim: 4, musicTrim: 8 });
const N = scale('hirajoshi', 57);
const sfx = {
  // The pot coming up to heat: soft plucks that climb the scale as the shade deepens.
  bubble(i = 0) { A.tone({ type: 'pluck', freq: N(i), dur: 0.06, vol: 0.06, cutoff: 1800 }); },
  // Into the just-right band: one clear bell.
  ready() { A.tone({ type: 'bell', freq: N(10), dur: 0.22, vol: 0.09 }); },
  // Lift the yarn out: a pan pair, a chord if it was just right, a soft low thud if it stewed.
  lift(q = 1) {
    if (q > 1) { [5, 7, 9].forEach((d, i) => A.tone({ type: 'bell', freq: N(d), dur: 0.14, vol: 0.09, at: A.now + i * 0.045 })); }
    else if (q >= 0.6 && q < 0.7) { A.tone({ type: 'triangle', freq: N(-3), dur: 0.12, vol: 0.12, cutoff: 700 }); A.tone({ type: 'pluck', freq: N(1), dur: 0.08, vol: 0.06, at: A.now + 0.06 }); }
    else { A.tone({ type: 'pluck', freq: N(3), dur: 0.09, vol: 0.1 }); A.tone({ type: 'pluck', freq: N(5), dur: 0.09, vol: 0.07, at: A.now + 0.06 }); }
  },
  coin(k = 0) { A.tone({ type: 'bell', freq: N(12 + (k % 3)), dur: 0.06, vol: 0.05 }); },
  // A colour nobody's seen: a little steel-band flourish.
  discover() { [0, 2, 4, 5, 7, 9].forEach((d, i) => A.tone({ type: 'bell', freq: N(d + 3), dur: 0.12, vol: 0.08, at: A.now + i * 0.07 })); A.tone({ type: 'pad', freq: N(-5), dur: 0.8, vol: 0.04, attack: 0.05, at: A.now + 0.1 }); },
  // The kettles, simmering on their own: a soft whistle now and then.
  kettle(k = 0) { A.tone({ type: 'sine', freq: N(9 + (k % 3)), dur: 0.18, vol: 0.035, attack: 0.05 }); },

function steepLine(r) {

  if (r.word === 'pale') return pick([`A bit pale. ${n}, but whispered.`, `Out too soon: ${n}, faintly. Hold on a little longer.`]);
  if (r.word === 'nearly') return pick([`Nearly. A respectable ${n}.`, `${n}, nearly there. A shade more and it’d sing.`]);
  return pick([`${n}, just right. The lemon is very pleased with itself, which is allowed.`, `Just right! ${n}, deep and bright, the way only a squeeze of lemon does it.`, `${n}! Somebody across the road says “ooh”.`, `Just right. ${fmt(r.yd)} yards of ${n} onto the stall.`]);
}
function discovered(k) {

}

let tipFor = null, tipMoved = 0;
function tipWire(b, tipOf, act, { firstTapShows = true } = {}) {
  b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showTip(b, tipOf()); });
  b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
  b.addEventListener('focus', () => { if (!b.dataset.touch) showTip(b, tipOf()); });
  b.addEventListener('blur', hideTip);
  b.addEventListener('pointerdown', e => { b.dataset.touch = e.pointerType !== 'mouse' ? '1' : ''; });
  // On touch the first tap shows what it does; the second does it.
  b.addEventListener('click', () => {
    const t = tipOf();
    if (firstTapShows && b.dataset.touch && tipFor !== t.id) { showTip(b, t); return; }
    act();
    if (tipFor || (b.dataset.touch && !firstTapShows)) showTip(b, tipOf());
  });
}
function showTip(b, it) {

  tip.querySelector('b').textContent = it.name;
  tip.querySelector('span').textContent = it.desc;
  tip.querySelector('i').textContent = it.joke || ''; tip.querySelector('i').hidden = !it.joke;
  tip.querySelector('small').textContent = it.foot || ''; tip.querySelector('small').hidden = !it.foot;
  const inline = !!it.inline && innerWidth <= 760;
  tip.classList.toggle('inline', inline);
  if (!it.inline) for (const o of document.querySelectorAll('.bought.on')) o.classList.remove('on');
  if (inline) { if (tip.previousElementSibling !== $('bought')) $('bought').after(tip); } else if (tip.parentElement !== $('side')) { $('side').append(tip); tipMoved = performance.now(); }
  tip.hidden = false;
  if (inline) { tip.style.left = tip.style.top = ''; tip.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' }); return; }
  const r = b.getBoundingClientRect(), t = tip.getBoundingClientRect();
  if (b.closest('aside') && innerWidth > 760) {
    const col = $('side').getBoundingClientRect();
    tip.style.left = `${col.left - t.width - 10}px`;
    tip.style.top = `${Math.max(8, Math.min(innerHeight - t.height - 8, r.top + r.height / 2 - t.height / 2))}px`;
  } else {

    tip.style.left = `${left}px`; tip.style.top = `${top}px`;
  }
}
function hideTip(force) {

  $('clockBar').classList.toggle('late', !S.fair && !S.ended && E.timeLeft(S) <= 30);
  $('perSteep').textContent = fmt(E.potYards(S));
  $('perYard').textContent = per(E.pricePerYard(S));
  $('purse').textContent = fmt(S.pennies);
  $('kettleBox').hidden = !S.up.kettle;
  $('kettleRate').textContent = per(E.kettleYards(S));
  $('ribbonBox').hidden = !S.ribbonsTotal;
  $('ribbons').textContent = fmt(S.ribbons);
}
const STAT_TIPS = {
  steepBox: () => ({ id: 'stat:steep', name: 'A steep', desc: `The ${E.POTS[S.pot].name.toLowerCase()}: ${fmt(E.POTS[S.pot].yd)} yards a ball, ${fmt(S.balls)} ball${S.balls > 1 ? 's' : ''}${E.lv(S, 'prize') ? `, ×${fmt(E.prizeMult(S))} for the prize ribbons` : ''}. Let go in the just-right band for half as much again; too pale or stewed makes less.`, foot: `${fmt(E.potYards(S))} yards a steep · a steep takes ${E.steepTime(S).toFixed(2)}s to the deepest good shade` }),
  priceBox: () => ({ id: 'stat:price', name: 'A yard of ' + E.CROSS[S.sel].name, desc: `What Vine Street pays for a yard of the colour in the pot. Every colour has its own price, and the street changes its mind. Brew one colour long enough and Vi copies it, and its price sinks.${E.lv(S, 'stall') ? ` Your stall adds ×${per(E.stallMult(S))}.` : ''}`, foot: `${per(E.pricePerYard(S))}p a yard now` }),
  purseBox: () => ({ id: 'stat:purse', name: 'This summer’s takings', desc: 'Pennies from the stall. Spend them on pots, wool and kettles. At the Fair the committee takes the takings for the Street Fund (bunting, mostly), so spend them.', foot: `${fmt(S.pennies)}p in the purse · ${fmt(S.earned)}p this summer` }),
  kettleBox: () => ({ id: 'stat:kettles', name: 'The kettles', desc: `${fmt(S.kettles)} kettles on the windowsill, each steeping 3% of a pot every second, in whatever colour is in the big pot. They keep going at a low heat while you’re away (a quarter speed, up to four hours).`, foot: `${per(E.kettleYards(S))} yards a second, on their own` }),
  ribbonBox: () => ({ id: 'stat:ribbons', name: 'Prize ribbons', desc: 'Won at the Vine Street Fair at the end of every summer: the more yards you steeped that summer, the more ribbons. Ribbons are kept for good. Spend them in the Ribbons tab.', foot: `${fmt(S.ribbons)} to spend · ${fmt(S.ribbonsTotal)} won` }),
};
for (const [id, f] of Object.entries(STAT_TIPS)) {
  const el = $(id);
  el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showTip(el, f()); });
  el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
  el.addEventListener('focus', () => showTip(el, f()));
  el.addEventListener('blur', hideTip);
  el.addEventListener('click', () => { if (tipFor === f().id) hideTip(); else showTip(el, f()); });
}

// ---------- The Fair ----------
const VERDICT = [
  y => `${fmt(y)} yards. For a newcomer. I’ll say no more. Except: it was quite bright.`,
  y => `${fmt(y)} yards, and not a sour note among them. I have written that down, and then crossed it out, and then written it again.`,
  y => `${fmt(y)} yards. My cardigan is one of yours. I didn’t know that when I bought it. I’m keeping it.`,
  y => `${fmt(y)} yards. The committee would like it noted that the pots on the pavement are a nuisance, and also that the committee is very warm.`,
  y => `${fmt(y)} yards. People are driving in from the town to look at the lampposts. We have had to put out a sign.`,
  y => `${fmt(y)} yards. I went up the Downs for some fresh air and they were wearing stripes. Is this you? It’s you.`,
  y => `${fmt(y)} yards. I have not needed a coat since March. I am wearing three jumpers, all yours. I am perfectly comfortable. Perfectly.`,
];
function showFair() {
  const card = $('fair');
  card.hidden = !(S.fair && !S.ended);
  if (card.hidden) return;
  $('fairWho').textContent = `THE VINE STREET FAIR · SUMMER ${S.season}`;
  $('fairHead').textContent = `Mrs Marrow judges the yarn`;
  $('fairQuote').textContent = VERDICT[Math.min(VERDICT.length - 1, Math.floor((S.season - 1) / 2))](S.lastYards);
  $('fairTally').textContent = `+${fmt(S.lastRibbons)} prize ribbons. The takings go to the Street Fund and the pavement is cleared. You keep the ribbons, the dye garden, the chart and the kettles. Spend your ribbons, then start summer ${S.season + 1}.`;
}
function fairCame() {
  if (holding) { holding = false; charge = 0; }
  sfx.fair();
  say(`That’s the summer! Mr Pepper’s steel band strikes up, and Mrs Marrow walks the street with her clipboard. ${fmt(S.lastYards)} yards. +${fmt(S.lastRibbons)} ribbons.`, 8);
  S.shopTab = 'r'; freshTab.r = false;
  hideTip(true); showFair(); renderShop(); hud(); renderBoard(); save();
}
$('nextBtn').addEventListener('click', () => {
  if (!E.nextSummer(S)) return;
  S.shopTab = 'p'; hornDone = false;
  sfx.summer();
  const shed = E.lv(S, 'shed');
  say(`Summer ${S.season}! ${mmss(E.summerLength(S))} on the clock until the Fair.${shed ? ` The ${E.POTS[S.pot].name.toLowerCase()} comes out of the shed.` : ''} The kettles are still on the sill. Hold the pot!`, 5);
  showFair(); renderShop(); hud(); renderBoard(); save();
});
let hornDone = false;

// ---------- The ending ----------
let endT = -1;
function end(resumed) {
  if (holding) { holding = false; charge = 0; }
  if (!S.ended) { S.endedAt = S.t; }
  E.finishAll(S); save();
  endT = resumed ? -1 : T; bg = null;
  hideTip(true);
  $('ending').hidden = false; $('fair').hidden = true; $('tabs').hidden = true; $('shopHead').hidden = true;
  $('endText').textContent = 'It worked far too well. Vine Street, then the town, then the Downs, then the clouds, then the coast, and then one Tuesday in August the whole Earth was in a jumper, in every colour on the chart. It was 41° in the shade, and there was no shade: the shade had been knitted. The porch thermometer gave up with a small pop. Then the doorbell went. It was Mrs Marrow, in shorts, and behind her the whole street, red in the face, very proud of their jumpers. The lemon had the big jug ready. “Lemonade?” Mrs Marrow drank two glasses, put down her clipboard, and said: “Not sour at all. Just right.” Next door, Vi was already casting on something for the Moon.';
  const tt = S.endedAt ?? S.t, h = Math.floor(tt / 3600), m = Math.floor(tt / 60) % 60;
  const time = h ? `${h}h${String(m).padStart(2, '0')}m` : `${m}m`;
  $('endStats').textContent = tt > 1 ? `${time} · ${S.season} summers · ${Object.keys(S.found).length} colours found · ${fmt(S.ribbonsTotal)} ribbons` : '';
  chartSig = ''; renderChart(); hud(); renderShop(); renderBoard();
  if (music) music.update();
  if (!resumed) {
    sfx.finale();
    say('A hundred quadrillion yards. The Earth is in a jumper. It is very, very warm. Somebody is at the door.', 30);
    if (window.DailyGame) DailyGame.finish({ lines: ['🍋 The Earth in a jumper: 100 quadrillion yards', `⏱ ${time} · ☀️ ${S.season} summers`, '🥤 Not sour. Just right.'] });
  }
  setTimeout(() => $('ending').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' }), resumed ? 0 : 2500);
}
$('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());

// ---------- Loop ----------
let last = performance.now(), hudT = 0, saveT = 0, dripT = 0, dripK = 0, histT = 0, stage = E.cosyStage(S);
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now; T += dt;
  if (layout()) hud();
  pop = Math.max(0, pop - dt * 2.5);
  if (!S.ended) {
    if (holding) {
      charge += dt / E.steepTime(S);
      bubbleT += dt;
      if (bubbleT > 0.16) { bubbleT = 0; sfx.bubble(Math.min(9, Math.floor(charge * 7))); }
      if (!readyRung && charge >= E.zone(S)[0]) { readyRung = true; sfx.ready(); }
      if (charge >= E.BOIL) release();
    }
    const wasFair = S.fair;
    for (const ev of E.tick(S, dt)) {
      if (ev.type === 'copy') { sfx.vi(); if (T > holdT - 3) say(pick([`Vi’s at the fence. Ten minutes later there’s ${E.CROSS[ev.k].name} on her stall, a penny cheaper. Lime juice is an acid too, it turns out.`, `Over the fence: Vi, on a bucket, taking notes. ${E.CROSS[ev.k].name} is on her stall by teatime.`, `Vi is selling ${E.CROSS[ev.k].name}. Hers is very slightly greener. The price is sinking. Try something she hasn’t seen.`]), 4); renderChart(); }
    }
    if (S.fair && !wasFair) fairCame();
    if (!S.fair && !hornDone && E.timeLeft(S) <= 30) { hornDone = true; say('Thirty seconds to the Fair! Mr Pepper is tuning up. Get those last steeps in!', 4); }
    // income that ticks in on its own: a soft whistle now and then
    dripT += dt;
    if (dripT > 5 && E.kettleYards(S) > 0 && !S.fair && !holding) { dripT = 0; sfx.kettle(dripK++); pops.push({ text: `+${fmt(E.kettleYards(S) * 5)} yd 🫖`, x: 360, y: 236, t: 0, life: 1.4, c: C.dteal }); }
    if (E.cosyStage(S) > stage) { stage = E.cosyStage(S); if (stage <= E.COSY.length - 1) { sfx.cosy(); sayLater(`The Big Cosy: ${E.COSY[stage - 1][1]} ${stage === 1 ? 'has' : 'have'} been knitted a cosy in your yarn. ${['', 'The gate looks very snug.', 'Number 9 is wearing a jumper. So is the lemon’s front door.', 'The lampposts are in stripes. The pigeons approve.', 'All of Vine Street is wrapped up. Even Vi’s.', 'The town has caught it now. The church spire has a bobble.', 'The Downs are knitted, from the chalk to the sky.', 'The clouds. Somehow, the clouds.', 'The coast. The cliffs are in cable-knit.'][stage]}`, 6); } bg = null; }
    if (S.total >= E.TARGET && !S.ended) end(false);
  }
  for (const p of pops) p.t += dt;
  for (let k = pops.length - 1; k >= 0; k--) if (pops[k].t > pops[k].life) pops.splice(k, 1);
  histT += dt; if (histT > 6) { histT = 0; for (const k of Object.keys(S.market)) hist[k] = E.marketM(S, k); }
  const mk = musicKey(); if (mk !== lastKey) { lastKey = mk; if (music) music.update(); }
  logT += dt; ambT += dt;
  if (queue.length && T >= holdT) say(...queue.shift());
  if (logT > 9 && ambT > 22 && !S.ended && !S.fair && T >= holdT) {
    ambT = 0;
    const opts = AMBIENT.map(f => f()).filter(Boolean);
    if (opts.length) say(pick(opts));
  }
  hudT += dt; if (hudT > 0.25) { hudT = 0; hud(); renderShop(); renderBoard(); renderChart(); }
  saveT += dt; if (saveT > 4) { saveT = 0; save(); }
  fit(); draw();
  requestAnimationFrame(frame);
}
// Away (a hidden tab or a closed one): the summer waits, and the kettles keep simmering at a low heat.
function welcomeBack(away) {
  const got = S.t > 5 ? E.offline(S, away) : null;
  if (!got || got.yards < 1) return false;
  const hrs = away / 3600, t = hrs >= 1 ? `${hrs.toFixed(1)} hours` : `${Math.round(away / 60)} minutes`;
  say(`Welcome back to Vine Street! While you were out (${t}${got.capped ? ', though the kettles only kept going for four hours of it' : ''}), the kettles simmered at a low heat: ${fmt(got.yards)} yards of ${E.CROSS[S.sel].name}, ${fmt(got.pennies)}p in the purse. The summer waited for you.`, 8);
  hud(); return true;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { release(); save(); }
  else { const away = S.lastSeen ? (Date.now() - S.lastSeen) / 1000 : 0; last = performance.now(); if (away > 60) welcomeBack(away); }
});
addEventListener('pagehide', save);

// ---------- Start ----------
try { await Promise.all([document.fonts.load(`20px ${FELL}`), document.fonts.load(`20px ${SC}`)]); } catch (e) {}
await makeSprites();
makePaper();
layout();
if (Sprites.sheetRequested()) Sprites.showSheet();
fit();
for (const k of Object.keys(S.market)) hist[k] = E.marketM(S, k);
if (S.ended) { end(true); say('Vine Street, the morning after. Everybody is still in a jumper. There is a little lemonade left in the jug.'); }
else {
  const away = S.lastSeen ? (Date.now() - S.lastSeen) / 1000 : 0;
  if (!(away > 60 && welcomeBack(away))) say(S.t > 5 ? (S.fair ? 'Fair Day on Vine Street. Mrs Marrow is still holding the clipboard.' : 'Vine Street. The pot is where you left it, and so is Vi.')
    : 'Number 9 Vine Street. The lemon has just moved in, and Mrs Marrow from number 7 has already said, over the wall, that lemons are “a bit sour”. Well. Hold the pot to steep some yarn, and let go when it’s just right.');
  if (S.fair) showFair();
}
if (DEBUG) Object.assign(window.__game, { hud, renderShop, steepOnce: (c = 0.9) => { startHold(); charge = c; release(); } });
renderChart(); renderBoard(); hud(); renderShop();
requestAnimationFrame(frame);
</script>
</body>
</html>

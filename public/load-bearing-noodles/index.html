<style>
  /* Rustic GB: #2c2137 #764462 #a96868 #edb4a1. A two-block woodcut: plum key block, rose and mauve tint blocks, peach paper. */
  :root {
    --plum: #2c2137; --mauve: #764462; --rose: #a96868; --peach: #edb4a1;
    --bg: var(--peach); --ink: var(--plum);
    --fell: 'IM Fell English', Georgia, serif; --sc: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
    color-scheme: light;
  }
  html, body { background: var(--bg); color: var(--ink); }
  /* Keep this: any display rule (flex, grid) would otherwise override the hidden attribute. */
  [hidden] { display: none !important; }
  body {
    margin: 0; font: 17px/1.35 var(--fell);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(14px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
    /* Paper: faint gouge marks, like the grain of the block printing through. */
    background-image:
      repeating-linear-gradient(97deg, #2c213708 0 1px, transparent 1px 7px),
      repeating-linear-gradient(3deg, #76446206 0 2px, transparent 2px 13px);
  }
  .wrap { max-width: 1140px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin: 2px 0 8px; }
  header h1 { font: 400 clamp(28px, 5vw, 42px)/1 var(--sc); margin: 0; color: var(--plum); letter-spacing: .5px; }
  header p { margin: 0; color: var(--mauve); font-size: 16px; font-style: italic; }
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .game { grid-template-columns: 1fr; } }
  /* A printed frame: a heavy key-block line with a thin rule inside. */
  .frame { position: relative; border: 3px solid var(--plum); box-shadow: inset 0 0 0 2px var(--peach), inset 0 0 0 3.5px var(--plum); background: var(--peach); }
  .stagebox { position: relative; max-width: min(100%, calc(64vh * 820 / 500)); padding: 6px; }
  .stagebox.tall { max-width: 100%; }
  .stage { position: relative; }
  canvas#stage { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
  canvas#stage:focus-visible { outline: 2px dashed var(--mauve); outline-offset: 3px; }
  #rooms { position: absolute; inset: 0; pointer-events: none; }
  .room { position: absolute; pointer-events: auto; background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer; border-radius: 1px; -webkit-tap-highlight-color: transparent; }
  .room[aria-disabled="true"] { cursor: help; }
  .room:focus-visible { outline: 2px dashed var(--rose); outline-offset: -3px; }
  .room.hot { box-shadow: inset 0 0 0 2px var(--rose); }
  .stats { display: flex; flex-wrap: wrap; gap: 2px 18px; margin: 8px 2px 0; font-size: 17px; color: var(--mauve); }
  .stats b { color: var(--plum); font-weight: 400; font-family: var(--sc); font-size: 19px; }
  .stats small { font-size: 14px; color: var(--rose); }
  .stats .tipped { cursor: help; }
  .stats .tipped:focus-visible { outline: 2px dashed var(--mauve); outline-offset: 2px; }
  .meter { margin: 5px 2px 0; }
  .meter .label { display: flex; justify-content: space-between; gap: 10px; font-size: 16px; color: var(--mauve); }
  .meter .label b { color: var(--plum); font-weight: 400; font-family: var(--sc); }
  .bar { position: relative; height: 11px; border: 2px solid var(--plum); overflow: hidden; background: var(--peach); }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(120deg, var(--plum) 0 2px, var(--mauve) 2px 5px); transition: width .5s; }
  .log { margin: 8px 2px 0; min-height: 2.8em; font-size: 17px; font-style: italic; color: var(--plum); }
  .log.fresh { animation: fresh 1.1s ease-out; }
  @keyframes fresh { from { color: var(--rose); } }
  /* The column stays in view and scrolls on its own, so nothing on it is ever below the fold. */
  aside { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain;
          padding: 8px 8px 8px; scrollbar-width: thin; scrollbar-color: var(--mauve) transparent; }
  @media (max-width: 760px) { aside { position: static; max-height: none; overflow: visible; } }
  aside h2 { font: 400 23px var(--sc); margin: 2px 0 6px; color: var(--plum); }
  #afford { font: 15px var(--fell); color: var(--rose); font-style: italic; }
  .tabs { display: flex; gap: 6px; margin: 0 0 8px; }
  .tabs button { font: 17px var(--sc); color: var(--mauve); background: none; border: 0; border-bottom: 3px solid transparent; padding: 1px 6px; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--plum); border-bottom-color: var(--plum); }
  .tabs button small { font: 13px var(--fell); color: var(--rose); }
  .tabs button.fresh::after { content: " ●"; color: var(--rose); font-size: 11px; vertical-align: middle; }
  .tabs button:focus-visible { outline: 2px dashed var(--mauve); }
  #shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  @media (max-width: 760px) and (min-width: 520px) { #shop { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  /* Two to a row, name over price, cut like a little block print: plum when you can afford it. */
  .up {
    position: relative; display: flex; flex-direction: column; min-width: 0; text-align: left; font: 16px/1.2 var(--fell); color: var(--plum);
    background: var(--peach); border: 2px solid var(--plum); padding: 5px 9px 4px; cursor: pointer;
  }

  .up.can { background: var(--plum); color: var(--peach); box-shadow: 3px 3px 0 var(--rose); }

  .up[aria-disabled="true"] { cursor: default; }

  .up.odd { border-style: dashed; }
  .up .tag { position: absolute; top: -9px; right: 7px; font: 13px var(--sc); padding: 0 5px; background: var(--rose); color: var(--peach); font-style: normal; }
  .up.new { animation: pulse 1.6s ease-in-out 4; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 3px var(--rose); } }
  .up:focus-visible { outline: 2px dashed var(--mauve); outline-offset: 2px; }
  .none { font-style: italic; color: var(--mauve); font-size: 15px; margin: 2px 0 0; grid-column: 1 / -1; }
  #tip {
    position: fixed; z-index: 50; width: 250px; padding: 9px 12px 10px; pointer-events: none; font: 16px/1.32 var(--fell); color: var(--peach);
    background: var(--plum); box-shadow: 4px 4px 0 var(--rose);
    background-image: repeating-linear-gradient(100deg, #edb4a10d 0 1px, transparent 1px 6px);
  }
  #tip b { display: block; font: 400 19px var(--sc); color: var(--peach); border-bottom: 2px solid var(--rose); margin-bottom: 4px; }
  #tip span { white-space: pre-line; }
  #tip small { display: block; white-space: pre-line; margin-top: 6px; font: 15px var(--fell); color: #edb4a1d0; }
  #tip i { display: block; margin-top: 6px; font-size: 15px; color: #edb4a1c0; border-top: 1.5px dashed #a96868; padding-top: 5px; }
  #tip.inline { position: static; width: auto; margin-top: 10px; }
  #bought { margin: 12px 0 2px; }
  #bought summary { display: flex; align-items: center; gap: 6px; font: 17px var(--sc); color: var(--mauve); cursor: pointer; list-style: none;
                    padding: 3px 9px; border: 2px dashed var(--mauve); }
  #bought summary::-webkit-details-marker { display: none; }
  #bought summary::before { content: "\25B8"; color: var(--rose); transition: transform .2s; }
  #bought[open] summary::before { transform: rotate(90deg); }
  #bought summary:focus-visible { outline: 2px dashed var(--mauve); outline-offset: 2px; }
  .shelf { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .bought { max-width: 100%; font: 14px/1.2 var(--fell); color: var(--plum); background: var(--peach); border: 1.5px solid var(--mauve); padding: 3px 8px;
            cursor: help; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bought.odd { border-style: dashed; }
  .bought:hover, .bought.on { background: var(--plum); color: var(--peach); }
  .bought:focus-visible { outline: 2px dashed var(--mauve); outline-offset: 2px; }
  #ending { margin: 24px auto 10px; max-width: 700px; text-align: center; padding: 22px 26px; }
  #ending h2 { font: 400 38px/1.1 var(--sc); margin: 0 0 10px; color: var(--plum); }
  #ending p { margin: 9px 0; }
  #ending .stamp { display: inline-block; margin: 6px 0 12px; padding: 5px 14px; border: 3px double var(--rose); color: var(--rose); font: 17px var(--sc); transform: rotate(-2deg); letter-spacing: 1px; }
  .btn { font: 19px var(--sc); color: var(--peach); background: var(--plum); border: 0; padding: 8px 16px; cursor: pointer; box-shadow: 3px 3px 0 var(--rose); }
  .btn:focus-visible { outline: 2px dashed var(--mauve); outline-offset: 2px; }
  #shareBtn, #againBtn { margin: 4px; }
  @media (prefers-reduced-motion: reduce) { .up.new, .log.fresh { animation: none; } .bar i, #bought summary::before { transition: none; } }
</style>

<body>
<div class="wrap">

  <div class="game">
    <main>
      <div class="stagebox frame" id="stagebox">
        <div class="stage">
          <canvas id="stage" width="820" height="500" tabindex="0" aria-label="A woodcut of Marrow Court cut away like a doll's house, its walls packed with tangled noodles. On the left, Mona the monstera in her pot, a knot of noodles on the wall behind her, and the party wall where the neighbours gossip. Hold the knot to tug noodles loose (Space works too); hold the party wall to listen (L)."></canvas>
          <div id="rooms"></div>
        </div>
      </div>
      <div class="stats">
        <span id="noodBox" class="tipped" tabindex="0" aria-describedby="tip">🍜 <b id="nood">0</b> noodles <small id="noodRate"></small></span>
        <span id="dirtBox" class="tipped" tabindex="0" aria-describedby="tip" hidden>🤫 <b id="dirt">0</b> dirt <small id="dirtRate"></small></span>
        <span>🌿 Rooms <b id="roomsN">1</b><small id="roomsOf"></small></span>
      </div>
      <div class="meter">
        <div class="label"><span>Mona’s comfort · <b id="comfortLabel">root-bound</b></span><span id="comfortVal">0%</span></div>
        <div class="bar"><i id="comfortFill"></i></div>

        <button type="button" role="tab" id="tabN" aria-selected="true">Noodles <small id="tabNc"></small></button>
        <button type="button" role="tab" id="tabD" aria-selected="false">Dirt <small id="tabDc"></small></button>
      </div>
      <div id="shop"></div>
      <details id="bought" hidden><summary>Bought · <span id="boughtN">0</span></summary><div class="shelf" id="shelf"></div></details>

<script type="module">
import { createAudio, scale, midiToHz } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const DEBUG = location.search.includes('debug');
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:12:save';
let S = E.newState();
try { const raw = localStorage.getItem(KEY); if (raw) S = E.load(JSON.parse(raw)); } catch (e) {}
const save = () => { S.lastSeen = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = { plum: '#2c2137', mauve: '#764462', rose: '#a96868', peach: '#edb4a1' };
const FELL = "'IM Fell English', Georgia, serif", SC = "'IM Fell English SC', Georgia, serif";
const fmt = E.fmt;

// ---------- Sound ----------
// Everything on D in-sen (D Eb G A C), the soundtrack's scale.
const A = createAudio({ sfxTrim: 1, musicTrim: 12.5 });
const N = scale('in-sen', 62);
const sfx = {
  // The strand stretching: a rubbery step up the scale as the charge fills.
  stretch(c = 0) { A.tone({ type: 'triangle', freq: N(Math.round(c * 7)), dur: 0.06, vol: 0.06, cutoff: 2200 }); },
  // A strand comes free: a plucked pair, higher for a fuller tug.
  pop(c = 1) {
    const s = Math.round(c * 5);
    A.tone({ type: 'pluck', freq: N(s + 2), dur: 0.12, vol: 0.16 });
    A.tone({ type: 'pluck', freq: N(s + 5), dur: 0.16, vol: 0.11, at: A.now + 0.05 });
  },
  full() { A.tone({ type: 'bell', freq: N(10), dur: 0.12, vol: 0.05 }); },
  grow(l = 1) { A.tone({ type: 'pluck', freq: N(2 + (l % 8)), dur: 0.1, vol: 0.14 }); A.tone({ type: 'keys', freq: N(7 + (l % 5)), dur: 0.1, vol: 0.06, at: A.now + 0.04 }); },
  // A new room: the root breaks through and the room appears.
  reach() { [0, 2, 4, 5].forEach((d, i) => A.tone({ type: 'pluck', freq: N(d + 3), dur: 0.12, vol: 0.13, at: A.now + i * 0.07 })); A.tone({ type: 'bell', freq: N(10), dur: 0.4, vol: 0.06, at: A.now + 0.3 }); },
  buy() { [0, 2, 4].forEach((d, i) => A.tone({ type: 'keys', freq: N(d + 5), dur: 0.14, vol: 0.13, at: A.now + i * 0.065 })); },
  unlock() { A.tone({ type: 'bell', freq: N(9), dur: 0.3, vol: 0.08 }); A.tone({ type: 'bell', freq: N(11), dur: 0.35, vol: 0.07, at: A.now + 0.12 }); },
  deny() { A.tone({ type: 'triangle', freq: N(1), dur: 0.07, vol: 0.11 }); A.tone({ type: 'triangle', freq: N(0), dur: 0.11, vol: 0.1, at: A.now + 0.08 }); },
  // Salt swept out: a brushy run down the scale.
  sweep() { [9, 8, 7, 6, 5, 4].forEach((d, i) => A.tone({ type: 'triangle', freq: N(d), dur: 0.06, vol: 0.09, cutoff: 3000, at: A.now + i * 0.045 })); A.tone({ type: 'pluck', freq: N(2), dur: 0.2, vol: 0.12, at: A.now + 0.3 }); },
  // Listening: a tiny whisper tick that speeds up as the gossip gets juicier.
  whisper(j = 0) { A.tone({ type: 'sine', freq: N(8 + (Math.round(j * 2) % 3)), dur: 0.03, vol: 0.05, cutoff: 3500 }); },
  glance() { A.tone({ type: 'triangle', freq: N(6), dur: 0.08, vol: 0.12 }); A.tone({ type: 'triangle', freq: N(7), dur: 0.1, vol: 0.12, at: A.now + 0.09 }); },
  dirt() { A.tone({ type: 'pluck', freq: N(5), dur: 0.1, vol: 0.12 }); A.tone({ type: 'pluck', freq: N(3), dur: 0.1, vol: 0.1, at: A.now + 0.07 }); A.tone({ type: 'bell', freq: N(8), dur: 0.2, vol: 0.05, at: A.now + 0.14 }); },
  caught() { [4, 2, 1, 0].forEach((d, i) => A.tone({ type: 'triangle', freq: N(d - 5), dur: 0.16, vol: 0.12, at: A.now + i * 0.11 })); },
  // Income that ticks in on its own: a soft harpsichord-ish drip.
  drip(k = 0) { A.tone({ type: 'pluck', freq: N(5 + (k % 5)), dur: 0.08, vol: 0.05, cutoff: 2600 }); },
  vine() {
    [0, 2, 3, 5, 7].forEach((d, i) => A.tone({ type: 'pluck', freq: N(d), dur: 0.15, vol: 0.13, at: A.now + i * 0.1 }));
    [5, 7, 9].forEach(d => A.tone({ type: 'keys', freq: N(d), dur: 0.6, vol: 0.06, at: A.now + 0.55 }));
  },
  creak(c = 0) { A.tone({ type: 'triangle', freq: N(-5 + Math.round(c * 4)), dur: 0.2, vol: 0.1, cutoff: 900 }); },
  collapse() {
    for (let i = 0; i < 18; i++) A.tone({ type: 'pluck', freq: N(14 - i), dur: 0.14, vol: 0.1, at: A.now + i * 0.17 });
    A.tone({ type: 'pad', freq: N(-10), dur: 3.4, vol: 0.06, attack: 0.4, at: A.now + 0.2 });
  },
  finale() {
    const tune = [0, 2, 3, 5, 7, 5, 3, 2, 4, 5, 7, 9, 10];
    tune.forEach((s, i) => A.tone({ type: 'pluck', freq: N(s), dur: 0.2, vol: 0.12, at: A.now + i * 0.13 }));
    [0, 3, 5].forEach(s => A.tone({ type: 'pad', freq: N(s - 5), dur: 3, vol: 0.05, attack: 0.6, at: A.now + 1.2 }));
    A.tone({ type: 'bell', freq: N(10), dur: 1.4, vol: 0.08, at: A.now + 1.7 });
  },
};
// Per-effect levels, measured with npm run mix so every effect peaks near -10 dBFS.
// The rapid ones (the stretch, the whisper ticks, the drip of income) sit a few dB under on purpose.
const LEVEL = { stretch: 4.68, pop: 2.99, full: 5.31, grow: 3.2, reach: 2.66, buy: 1.33, unlock: 3.94, deny: 4.52, sweep: 2.82, whisper: 4.79, glance: 3.8, dirt: 3.8, caught: 2.07, drip: 15, vine: 1.55, creak: 3.55, collapse: 2.88, finale: 2.88 };
for (const k of Object.keys(sfx)) {
  const fn = sfx[k];
  sfx[k] = (...a) => {
    const tone = A.tone, m = LEVEL[k] || 1;
    A.tone = o => tone({ ...o, vol: (o.vol ?? 0.3) * m });
    try { fn(...a); } finally { A.tone = tone; }
  };
}
if (DEBUG) window.__game = { A, sfx, long: ['finale', 'collapse', 'vine'], S: () => S, E };

// The game owns playback; music.mjs arranges the composed invention per phase.
const musicKey = () => E.phase(S);
let music = null, soundtrack = null, lastKey = musicKey();
const PHASE_GAIN = {};
const phased = new Map();
function song() {
  soundtrack ||= createSoundtrack(music.strudel);
  const [k, pat, cps] = soundtrack(musicKey());
  if (!PHASE_GAIN[k]) return [k, pat, cps];
  if (!phased.has(k)) phased.set(k, pat.mul(music.strudel.gain(PHASE_GAIN[k])));
  return [k, phased.get(k), cps];
}
createMusic(A, { soundfonts: true, song }).then(m => { music = m; music.update(); if (DEBUG) Object.assign(window.__game, { music: m, song }); }).catch(e => console.warn('music', e));

// ---------- Layout ----------
// Wide: the knot and the party wall stacked on the left, the building on the right.
// Narrow (phones): the two panels side by side on top, the building below, with bigger rooms.
const cv = $('stage'), g = cv.getContext('2d');
let L = null;
function layout() {
  const narrow = $('stagebox').clientWidth < 600;
  if (L && L.narrow === narrow) return false;
  if (narrow) L = { narrow, W: 400, H: 650, knot: [0, 0, 196, 178], party: [204, 0, 196, 178], bx: 4, by: 196, cw: 78.4, ch: 75 };
  else L = { narrow, W: 820, H: 500, knot: [0, 0, 232, 244], party: [0, 252, 232, 248], bx: 246, by: 38, cw: 114, ch: 76 };
  $('stagebox').classList.toggle('tall', narrow);
  cv.width = L.W; cv.height = L.H; dpr = 0;
  placeRooms(); bg = null;
  return true;
}
let dpr = 0;
function fit() {
  const d = Math.min(2, devicePixelRatio || 1), r = cv.getBoundingClientRect();
  const w = Math.round((r.width || L.W) * d);

function drawEpilogue(s) {
  const t = endT < 0 ? 99 : T - endT;
  g.setTransform(s, 0, 0, s, 0, 0);
  paper(g, L.W, L.H);
  const W = L.W, H = L.H, gy = H * 0.72;
  if (t < 7.5 && !reduced) {
    // The collapse: the building folds, top to bottom, like a soufflé when the oven opens.
    for (let i = 0; i < E.N_ROOMS; i++) {
      const [rx, ry, rw, rh] = cell(i), row = E.rowOf(i);
      const start = (5 - row) * 0.35 + (E.colOf(i) % 2) * 0.12;
      const k = Math.max(0, t - start), fall = Math.min(1, k * k * 0.25);
      const ty = ry + (gy - ry - rh * 0.4 - (5 - row) * 6) * fall, rot = fall * (((i * 37) % 7) - 3) * 0.06;
      g.save(); g.translate(rx + rw / 2, ty + rh / 2); g.rotate(rot); g.scale(1, 1 - fall * 0.55);
      g.fillStyle = i % 3 ? C.mauve : C.plum; g.fillRect(-rw / 2, -rh / 2, rw, rh);
      tangle(g, 0, 0, rw * 0.9, rh * 0.9, i * 13 + 3, '#edb4a1aa', 1.2, 6);
      g.strokeStyle = C.plum; g.lineWidth = 1.5; g.strokeRect(-rw / 2, -rh / 2, rw, rh);
      g.restore();
    }
    if (t > 2) { g.fillStyle = '#edb4a1'; g.globalAlpha = Math.min(0.85, (t - 2) / 5); g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
    if (t > 5.5) { g.globalAlpha = (t - 5.5) / 2; garden(t); g.globalAlpha = 1; }
    return;
  }
  garden(t);
}
function garden(t) {
  const W = L.W, H = L.H, gy = H * 0.72, n = L.narrow;
  // sun, carved
  const sx = W * 0.82, sy = H * 0.16;
  g.fillStyle = C.rose; g.beginPath(); g.arc(sx, sy, n ? 24 : 34, 0, 7); g.fill();
  g.strokeStyle = C.rose; g.lineWidth = 2;
  for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8 + t * 0.05; g.beginPath(); g.moveTo(sx + Math.cos(a) * 42, sy + Math.sin(a) * 42); g.lineTo(sx + Math.cos(a) * 58, sy + Math.sin(a) * 58); g.stroke(); }
  // ground
  g.fillStyle = C.mauve; g.fillRect(0, gy, W, H - gy);
  hatch(g, 0, gy, W, H - gy, 6, '#2c213755', 1);
  // the heap: forty years of noodles, and flowers already
  const hx = W * (n ? 0.3 : 0.32), hw = W * (n ? 0.5 : 0.4), hh = H * 0.24;
  g.fillStyle = C.plum; g.beginPath(); g.moveTo(hx - hw / 2, gy + 2); g.quadraticCurveTo(hx, gy - hh * 1.6, hx + hw / 2, gy + 2); g.closePath(); g.fill();
  g.save(); g.beginPath(); g.moveTo(hx - hw / 2, gy + 2); g.quadraticCurveTo(hx, gy - hh * 1.6, hx + hw / 2, gy + 2); g.closePath(); g.clip();
  tangle(g, hx, gy - hh * 0.4, hw, hh * 1.1, 91, '#edb4a1cc', 1.4, 22); g.restore();
  for (let k = 0; k < 9; k++) {
    const fx = hx - hw * 0.4 + k * hw * 0.1, fy = gy - Math.sin((k + 0.5) / 9 * Math.PI) * hh * 0.75 - 4;
    g.strokeStyle = C.plum; g.lineWidth = 1.5; g.beginPath(); g.moveTo(fx, fy + 8); g.lineTo(fx, fy); g.stroke();
    g.fillStyle = k % 2 ? C.rose : C.peach; g.beginPath(); g.arc(fx, fy - 2, 3 + (k % 3), 0, 7); g.fill();
  }
  // Mona, planted in the ground at last, much bigger
  const mx = W * (n ? 0.74 : 0.6), my = gy + 6;
  g.save(); g.translate(mx, my);
  g.strokeStyle = C.plum; g.lineWidth = 4;
  const sway = Math.sin(t * 0.9) * 0.05;
  for (const [a, len] of [[-0.6, 70], [-1.2, 84], [-1.9, 86], [-2.5, 74], [-1.55, 60]]) {
    const ex = Math.cos(a + sway) * 50, ey = Math.sin(a + sway) * 80;
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(ex * 0.3, ey * 0.6, ex, ey); g.stroke();
    leaf(g, ex, ey, n ? len * 0.62 : len * 0.85, a + sway, 0, a === -1.55 ? C.mauve : C.plum);
  }
  // roots spreading in the soil
  g.strokeStyle = '#2c2137aa'; g.lineWidth = 2;
  for (let k = 0; k < 7; k++) { g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo((k - 3) * 20, 30, (k - 3) * 45, 20 + k * 5, (k - 3) * 60, 50 + (k % 3) * 12); g.stroke(); }
  // face, contented
  g.fillStyle = C.plum; g.beginPath(); g.arc(-7, -18, 2.6, 0, 7); g.arc(7, -18, 2.6, 0, 7); g.fill();
  g.lineWidth = 1.8; g.beginPath(); g.arc(0, -12, 5, 0.2, Math.PI - 0.2); g.stroke();
  if (S.up.hat) { g.fillStyle = C.rose; g.strokeStyle = C.plum; g.beginPath(); g.ellipse(14, -30, 12, 4, -0.25, 0, 7); g.fill(); g.stroke(); }
  g.restore();
  // tables of tenants and Auntie Ko ladling from the heap
  const ty = gy + (n ? 40 : 52);
  const seats = n ? ['Auntie Ko', 'Mrs. Vale', 'Pim', 'the Fennick twins'] : ['Auntie Ko', 'Mrs. Vale', 'Pim', 'the Fennick twins', 'Dot', 'the Okafors', 'Señor Ruiz', 'Mr. Duda'];
  seats.forEach((w, k) => {
    const x0 = (n ? 30 : 40) + k * (n ? 46 : 62), bob = Math.sin(t * 2 + k) * 1.5;
    drawTenant(g, x0, ty + bob, w, n ? 0.62 : 0.8, Math.sin(t * 0.7 + k) > 0.6 ? -1 : 1);
    if (w !== 'Auntie Ko') { g.fillStyle = C.peach; g.beginPath(); g.ellipse(x0 + 12, ty + 22, 7, 3, 0, 0, 7); g.fill(); }
    else { g.strokeStyle = C.peach; g.lineWidth = 1.2; for (let s2 = 0; s2 < 3; s2++) { g.beginPath(); g.moveTo(x0 + 18 + s2 * 4, ty + 6); g.quadraticCurveTo(x0 + 22 + s2 * 4 + Math.sin(t * 3 + s2) * 3, ty - 4, x0 + 18 + s2 * 4, ty - 14); g.stroke(); } }
  });
  g.fillStyle = C.plum; g.fillRect(n ? 18 : 28, ty + 24, seats.length * (n ? 46 : 62) - 10, 4);
  // Pettibone, sweeping up his salt
  drawPettibone(g, W * (n ? 0.9 : 0.86), gy + (n ? 26 : 34), t);
  g.fillStyle = C.peach; for (let k = 0; k < 14; k++) g.fillRect(W * (n ? 0.9 : 0.86) + 22 + (k % 5) * 3, gy + (n ? 22 : 30) - Math.floor(k / 5) * 2, 2, 2);
  // the epilogue keeps playing itself: Mona's roots still untangling, the count still going up
  epiTug += 1 / 60;
  if (epiTug > 2.6) { epiTug = 0; epiN += Math.max(1e12, E.rate(S) * 3); if (!document.hidden && T - lastEpiSound > 2) { lastEpiSound = T; sfx.drip(dripK++); } }
  g.fillStyle = C.plum; g.font = `${n ? 13 : 16}px ${SC}`; g.textAlign = 'left'; g.textBaseline = 'top';
  g.fillText(`noodles untangled: ${fmt(S.total + epiN, true)}`, 10, 10);
  // the credits roll up the right side, round and round
  const cxr = n ? W * 0.5 : W * 0.86, top = n ? 34 : 28, bottom = n ? gy - 120 : gy - 70, lh = n ? 15 : 18;
  g.save(); g.beginPath(); g.rect(cxr - (n ? 110 : 110), top, n ? 220 : 220, bottom - top); g.clip();
  const total = CREDITS.length * lh, off = (t * 16) % total;
  g.textAlign = 'center';
  for (let rep = 0; rep < 2; rep++) CREDITS.forEach((line, k) => {
    const y = bottom - off + k * lh + rep * total;
    if (y < top - lh || y > bottom + lh) return;
    const head = k === 0 || CREDITS[k - 1] === '';
    g.fillStyle = head ? C.plum : C.mauve; g.font = head ? `${n ? 14 : 17}px ${SC}` : `italic ${n ? 12 : 14}px ${FELL}`;
    g.fillText(line, cxr, y);
  });
  g.restore();
}
let lastEpiSound = 0;

function finish() {
  if (S.ended) return;
  hideTip(true);
  S.ended = true; S.endedAt = S.t;
  end(false);
}
function end(resumed) {
  S.ended = true; E.finishAll(S); save();
  endT = resumed ? -1 : T;
  $('ending').hidden = false; $('tabs').hidden = true; $('shopHead').hidden = true;
  for (const b of roomBtns) b.hidden = true;
  const tt = S.endedAt ?? S.t, h = Math.floor(tt / 3600), m = Math.floor(tt / 60) % 60;
  const time = h ? `${h}h${String(m).padStart(2, '0')}m` : `${m}m`;
  $('endText').textContent = 'On the afternoon of the culture festival, with every tenant out admiring Pim’s noodle sculpture, Mona found the Mother Knot and gave it one long, gentle pull. Marrow Court sighed, and folded: slowly, the way a soufflé does when you open the oven, the roof garden first, then the floors, landing by landing, into one soft heap of forty years of noodles. Nobody was home. Nobody was hurt. When the tenants came back that evening there was a garden where the building had been, Mona in the middle of it with her roots in real ground at last, and Auntie Ko already ladling ramen from the heap. Mr. Pettibone swept up his salt. Mrs. Vale said she’d always known.';
  $('endStats').textContent = tt > 1 ? `${time} · ${fmt(S.total, true)} noodles untangled · ${fmt(S.dirtTotal)} dirt heard · comfort 100%` : '';
  hud(); renderShop();
  if (music) music.update();
  if (!resumed) {
    sfx.collapse();
    setTimeout(() => sfx.finale(), 6200);
    say('Did you HEAR? Marrow Court fell down. Beautifully. Nobody was in. There’s a garden now, and noodles, and a very relaxed plant.', 30);
    if (window.DailyGame) DailyGame.finish({ lines: ['🌿 Mona got comfy', `🍜 ${fmt(S.total, true)} noodles · ⏱ ${time}`, '🏚️ Marrow Court: load-bearing no more'] });
  }
  setTimeout(() => $('ending').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' }), resumed ? 0 : 9000);
}
$('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());

// ---------- Loop ----------
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now; T += dt;
  if (layout()) hud();
  if (!S.ended) {
    E.step(S, dt);
    if (tugging) {
      const final = E.canFinish(S);
      tugT += dt; tugC = Math.min(1, tugT / (final ? E.FINAL_HOLD : E.chargeTime(S)));
      const step = Math.floor(tugC * (final ? 8 : 6));
      if (step !== tugStep) { tugStep = step; final ? sfx.creak(tugC) : sfx.stretch(tugC); if (tugC >= 1) sfx.full(); }
      if (final && tugC >= 1) { tugging = false; finish(); }
    }
    if (listening) {
      listenT += dt;
      if (Math.floor(listenT * 5) !== Math.floor((listenT - dt) * 5)) sfx.whisper(listenT);
      if (!glanced && listenT >= noticeAt - E.warnTime(S)) { glanced = true; glanceT = T; sfx.glance(); }
      if (listenT >= noticeAt) {
        listening = false; glanced = false; E.caught(S); caughtT = T; sfx.caught();
        const who = E.ROOMS[speakerOf()]?.who || 'Somebody';
        say(`${cap(who)} turns round. “That plant is STARING at me.” Mona wilts with shame. (No dirt. Let go when they glance over.)`, 4);
        gossipCache = { sp: -1, line: '' };
        setTimeout(pickSpeaker, 1500);
      }
    }
    // income that ticks in on its own: a soft drip now and then, and a line in the log once in a while
    dripT += dt;
    if (dripT > 5 && E.rate(S) > 0 && !tugging && !listening) { dripT = 0; sfx.drip(dripK++); }
  }
  for (const p of pops) p.t += dt;
  for (let k = pops.length - 1; k >= 0; k--) if (pops[k].t > pops[k].life) pops.splice(k, 1);
  const mk = musicKey(); if (mk !== lastKey) { lastKey = mk; if (music) music.update(); }
  logT += dt; ambT += dt;
  if (pending && T >= holdT) { const m = pending; pending = null; say(m); }
  if (logT > 22 && ambT > 22 && !S.ended) {
    ambT = 0;
    const r = Math.random();
    if (S.vine && r < 0.35) say(`${pick(['Overheard through the wall', 'Through the plaster', 'Down the grapevine'])}: ${cap(pick(E.speakers(S).map(i => E.ROOMS[i].who)) || 'someone')} is talking about ${pick(['the landing that dips', 'Pettibone’s salt', 'the festival', 'that plant in 3B', 'whose turn it is', 'the basement'])} again. (+dirt, slowly)`);
    else if (S.rooted > 2 && r < 0.65) say(`${pick(WALLS)} (+${fmt(E.rate(S))} noodles a second)`);
    else say(pick(AMBIENT));
  }
  hudT += dt; if (hudT > 0.2) { hudT = 0; hud(); renderShop(); }
  saveT += dt; if (saveT > 4) { saveT = 0; save(); }
  fit(); draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);

// ---------- Start ----------
try { await Promise.all([document.fonts.load(`14px ${FELL}`), document.fonts.load(`14px ${SC}`), document.fonts.load(`italic 14px ${FELL}`)]); } catch (e) {}
await makeSprites();
layout();
if (Sprites.sheetRequested()) Sprites.showSheet();
fit();
if (S.ended) { end(true); say('The garden, a while later. The ramen is still going. So is the gossip.'); }
else {
  const away = S.lastSeen ? (Date.now() - S.lastSeen) / 1000 : 0;
  const got = S.t > 5 ? E.offline(S, away) : null;
  if (got && (got.noodles > 0 || got.dirt > 0)) {
    const hrs = away / 3600, t = hrs >= 1 ? `${hrs.toFixed(1)} hours` : `${Math.round(away / 60)} minutes`;
    say(`Did you hear? While you were away (${t}${got.capped ? ', though the roots only remember three hours' : ''}), the roots kept at it, slowly: +${fmt(got.noodles, true)} noodles${got.dirt >= 1 ? ` and +${fmt(got.dirt)} dirt overheard` : ''}.`, 8);
  } else say(S.t > 5 ? 'Marrow Court, flat 3B. Mona’s roots are right where you left them.' : 'Marrow Court, flat 3B. Mona is root-bound and anxious, and the wall behind her pot is stuffed with forty years of tangled noodles. Hold the knot on the left to tug a strand loose; let go when the ring is full.');
}
if (DEBUG) Object.assign(window.__game, { hud, renderShop });
if (S.vine && speakerOf() < 0) pickSpeaker();
hud(); renderShop();
requestAnimationFrame(frame);
</script>

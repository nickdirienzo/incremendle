<style>
  /* Curiosities, printed as a risograph: cream paper, purple, teal, aqua, peach and coral inks. */
  :root {
    --paper: #ffeecc; --ink: #46425e; --teal: #15788c; --aqua: #00b9be; --peach: #ffb0a3; --coral: #ff6973;
    --head: 'Bricolage Grotesque', 'Arial Black', sans-serif; --type: 'Courier Prime', 'Courier New', monospace;
    color-scheme: light;
  }
  html, body { background: var(--paper); color: var(--ink); }
  [hidden] { display: none !important; }
  body {
    margin: 0; font: 15px/1.4 var(--type);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(10px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
    background-image: radial-gradient(#15788c14 1px, transparent 1.4px); background-size: 7px 7px;
  }
  .wrap { max-width: 1140px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 2px 0 8px; }
  h1 { position: relative; font: 800 36px/1 var(--head); margin: 0; letter-spacing: -0.5px; color: var(--teal); text-shadow: 2px 1px 0 #ff697399; }
  header p { margin: 0; font: 13px var(--type); text-transform: uppercase; letter-spacing: 1px; color: var(--teal); }
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .game { grid-template-columns: 1fr; } h1 { font-size: 30px; } }
  main { min-width: 0; }

  /* The station's paperwork: the quota (the drive), chits, nerves. */
  .hud { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; margin-bottom: 8px; }
  .meter { position: relative; height: 26px; border: 2px solid var(--ink); background: #fff8e6; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(90deg, var(--aqua) 0 9px, #00b9becc 9px 10px); mix-blend-mode: multiply; transition: width .4s; }
  .meter span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 9px; font: 700 14px var(--type); white-space: nowrap; }
  @media (max-width: 560px) { .meter span em:first-child { display: none; } .meter span { justify-content: center; } }
  .counts { display: flex; gap: 14px; align-items: baseline; white-space: nowrap; }
  .counts b { font: 800 26px/1 var(--head); color: var(--coral); text-shadow: 1px 1px 0 #46425e55; }
  .counts small { font-size: 13px; }
  .sub { grid-column: 1 / -1; display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: center; font: 13px var(--type); min-height: 18px; }
  .nerves { display: inline-flex; align-items: center; gap: 6px; }
  .nerves s { position: relative; display: inline-block; width: 80px; height: 8px; border: 1.5px solid var(--ink); text-decoration: none; }
  .nerves s::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--n, 30%); background: var(--coral); }
  .sub .ep { color: var(--teal); }

  /* Boats in the fog: contract slips. */
  .board { display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; min-height: 64px; }
  @media (max-width: 560px) { .board { grid-template-columns: repeat(3, minmax(0, 1fr)); } .board > :first-child { grid-column: 1 / -1; } }
  .slip, .order, #handover {
    position: relative; display: flex; flex-direction: column; justify-content: center; min-width: 0; text-align: left; font: 13px/1.25 var(--type); color: var(--ink);
    background: #fffaf0; border: 2px solid var(--ink); padding: 5px 8px 8px; box-shadow: 3px 2px 0 var(--peach);
  }
  .slip { cursor: pointer; }
  .slip b, .order b { font: 800 15px/1.1 var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slip em, .order em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slip .bar, .order .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; }
  .slip .bar i, .order .bar i { position: absolute; inset: 0 auto 0 0; background: var(--teal); }
  .slip:hover, .slip:focus-visible { box-shadow: 3px 2px 0 var(--coral); outline: none; transform: translate(-1px, -1px); }
  .slip .k, .order .k { position: absolute; top: -9px; right: 6px; font: 700 11px var(--type); color: var(--paper); background: var(--teal); padding: 0 5px; }
  .slip .k.soup, .order .k.soup { background: var(--coral); }
  .slip .k.lifeboat, .order .k.lifeboat { background: var(--ink); }
  .slip .key { position: absolute; top: 4px; right: 6px; font-size: 11px; opacity: .55; }
  .order { background: #d9f3ef; box-shadow: 3px 2px 0 var(--aqua); }
  .order .bar i { background: var(--coral); }
  .order.late .bar i { animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .empty { align-self: center; font: italic 13px var(--type); opacity: .7; }
  #handover { grid-column: 1 / -1; font: 800 20px/1.1 var(--head); color: var(--paper); background: var(--coral); cursor: pointer; text-align: center; box-shadow: 4px 3px 0 var(--ink); animation: nudge 1.8s ease-in-out infinite; }
  #handover small { font: 13px var(--type); }
  @keyframes nudge { 50% { transform: translate(-1px, -2px); box-shadow: 5px 5px 0 var(--ink); } }

  .stagewrap { position: relative; }
  canvas#stage { display: block; width: 100%; touch-action: none; cursor: pointer; border: 2px solid var(--ink); box-shadow: 4px 3px 0 var(--peach); background: var(--paper); }
  canvas#stage:focus-visible { outline: 3px dashed var(--coral); outline-offset: 3px; }
  .log { margin: 10px 2px 0; min-height: 2.8em; font: 15px/1.4 var(--type); }
  .log b { font: 700 12px var(--type); color: var(--paper); background: var(--teal); padding: 0 5px; margin-right: 6px; letter-spacing: 1px; }
  .log.fresh { animation: inkin .45s ease-out; }
  @keyframes inkin { from { opacity: 0; transform: translateX(-3px); } }

  /* Requisitions: sticky, never taller than the window. */
  aside { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; scrollbar-width: thin; padding: 2px 5px 8px 2px; }
  @media (max-width: 760px) { aside { position: static; max-height: none; overflow: visible; } }
  aside h2 { font: 800 24px/1 var(--head); margin: 2px 0 10px; color: var(--teal); }
  #afford { font: 13px var(--type); color: var(--ink); }
  #shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 760px) and (min-width: 520px) { #shop { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .up {
    position: relative; display: flex; flex-direction: column; min-width: 0; text-align: left; font: 13px/1.2 var(--type); color: var(--ink);
    background: #fffaf0; border: 2px solid #46425e88; padding: 5px 8px 6px; cursor: pointer;
  }
  .up b { font: 800 14px/1.15 var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up.can { border-color: var(--ink); box-shadow: 3px 2px 0 var(--aqua); }
  .up.can em { color: var(--teal); font-weight: 700; }
  .up[aria-disabled="true"] { cursor: default; }
  .up[aria-disabled="true"]:not(.can) { opacity: .62; }
  .up.odd { border-style: dashed; }
  .up .tag { position: absolute; top: -9px; right: 6px; font: 700 11px var(--type); font-style: normal; color: var(--paper); background: var(--coral); padding: 0 5px; transform: rotate(4deg); }
  .up.new { animation: pulse 1.5s ease-in-out 4; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px #ff697366; } }
  .up:focus-visible, .bought:focus-visible, #handover:focus-visible { outline: 3px dashed var(--coral); outline-offset: 2px; }
  #tip {
    position: fixed; z-index: 50; width: 250px; padding: 9px 12px 10px; pointer-events: none; font: 14px/1.35 var(--type); color: var(--ink);
    background: #fffaf0; border: 2px solid var(--ink); box-shadow: 5px 4px 0 var(--peach);
  }
  #tip b { display: block; font: 800 19px/1.05 var(--head); color: var(--teal); margin-bottom: 4px; }
  #tip i { display: block; margin-top: 6px; padding-top: 5px; border-top: 1.5px dashed #46425e66; font-size: 13px; }
  #tip small { display: block; margin-top: 6px; font: 700 12px var(--type); color: var(--coral); }
  #tip.inline { position: static; width: auto; margin-top: 10px; box-shadow: 3px 2px 0 var(--peach); }
  #bought { margin: 12px 0 2px; }
  #bought summary { display: flex; align-items: center; gap: 6px; font: 800 18px/1 var(--head); color: var(--teal); cursor: pointer; list-style: none; padding: 3px 2px; }
  #bought summary::-webkit-details-marker { display: none; }
  #bought summary::before { content: "\25B8"; font-size: 13px; color: var(--coral); transition: transform .2s; }
  #bought[open] summary::before { transform: rotate(90deg); }
  #bought summary:focus-visible { outline: 3px dashed var(--coral); outline-offset: 2px; }
  .shelf { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 2px 2px; }
  .bought { max-width: 100%; font: 12px/1.2 var(--type); color: var(--ink); background: #fffaf0; border: 1.5px solid #46425e88; padding: 2px 7px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bought.odd { border-style: dashed; }
  .bought:hover, .bought.on { border-color: var(--coral); box-shadow: 2px 1px 0 var(--peach); }

  #ending { margin: 20px auto 0; max-width: 680px; text-align: center; padding: 16px 20px 22px; background: #fffaf0; border: 2px solid var(--ink); box-shadow: 6px 5px 0 var(--aqua); }
  #ending h2 { font: 800 32px/1.05 var(--head); margin: 0 0 8px; color: var(--teal); text-shadow: 2px 1px 0 #ff697388; }
  #ending p { margin: 8px 0; text-align: left; }
  #ending .memo { font: 13px var(--type); border: 1.5px dashed #46425e88; padding: 8px 10px; text-align: left; }
  #shareBtn, #againBtn { font: 800 18px var(--head); color: var(--paper); background: var(--teal); border: 2px solid var(--ink); box-shadow: 3px 2px 0 var(--coral); padding: 7px 16px; margin: 12px 4px 0; cursor: pointer; }
  #againBtn { background: #fffaf0; color: var(--ink); }
  #shareBtn:focus-visible, #againBtn:focus-visible { outline: 3px dashed var(--coral); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .up.new, #handover, .log.fresh, .order.late .bar i { animation: none; } .meter i, #bought summary::before { transition: none; } }
</style>

<div class="wrap">

  </header>
  <div class="game">
    <main>
      <div class="hud">
        <div class="meter" title="The season's quota: dumplings served"><i id="meterFill"></i><span><em>Season quota</em><em id="quotaTxt">0 / 720</em></span></div>
        <div class="counts"><span><b id="chits">0</b> <small>chits</small></span></div>
        <div class="sub" id="sub">
          <span class="nerves" title="How nervous the lighthouse is: it makes the basket and the stack tremble">Nerves <s id="nervesBar"></s></span>
          <span id="rate"></span>
          <span id="epTxt" class="ep" hidden></span>
        </div>
      </div>
      <div class="board" id="board" aria-label="Boats waiting in the fog"></div>
      <div class="stagewrap"><canvas id="stage" tabindex="0" aria-label="The gallery of Skerry Light: tap, click or press space to drop the swinging steamer basket onto the stack"></canvas></div>
      <p class="log" id="log" aria-live="polite"></p>

    <aside id="side">

  </section>
</div>
<script type="module">
import { createAudio, scale, midiToHz } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import { grain, halftone } from '/shared/kit/fx.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const fmt = E.fmt;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = { paper: '#ffeecc', ink: '#46425e', teal: '#15788c', aqua: '#00b9be', peach: '#ffb0a3', coral: '#ff6973' };

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:11:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound: everything in D harmonic minor, like the music ----------
const A = createAudio({ sfxTrim: 1.55, musicTrim: 9 });
const notes = scale('harmonic minor', 62);
let lastFold = 0;
const sfx = {
  fold(n = 1) { const t = A.now; if (t - lastFold < 0.18) return; lastFold = t; A.tone({ type: 'sine', freq: notes(7 + (n % 5)), dur: 0.03, vol: 0.15 }); },
  tok(h = 0) {
    A.tone({ type: 'triangle', freq: notes(-7 + Math.min(h, 12)), dur: 0.05, vol: 0.32, release: 0.07 });
    A.noiseHit('hat', { vol: 0.06, dur: 0.02 });
  },
  perfect(s = 1) {
    const d = Math.min(s, 8);
    A.tone({ type: 'pluck', freq: notes(7 + d), dur: 0.18, vol: 0.32 });
    A.tone({ type: 'bell', freq: notes(14 + d), dur: 0.2, vol: 0.08, at: A.now + 0.04 });
  },
  miss() { A.noiseHit('whoosh', { vol: 0.194, dur: 0.35 }); A.tone({ type: 'sine', freq: notes(2), dur: 0.25, vol: 0.324, glide: 0.4, at: A.now + 0.3 }); },
  topple() {
    [6, 4, 2, 0, -2, -4].forEach((d, i) => A.tone({ type: 'triangle', freq: notes(d), dur: 0.06, vol: 0.301, at: A.now + i * 0.07 }));
    A.noiseHit('whoosh', { vol: 0.192, dur: 0.6, at: A.now + 0.2 });
  },
  reject() { A.tone({ type: 'square', freq: notes(1), dur: 0.08, vol: 0.27, cutoff: 900 }); A.tone({ type: 'square', freq: notes(0), dur: 0.12, vol: 0.27, cutoff: 900, at: A.now + 0.12 }); },
  accept() { A.noiseHit('shaker', { vol: 0.118, dur: 0.06 }); A.tone({ type: 'pluck', freq: notes(4), dur: 0.12, vol: 0.266, at: A.now + 0.03 }); },
  slip() { A.tone({ type: 'pluck', freq: notes(9), dur: 0.1, vol: 0.315 }); },
  deliver() {
    [0, 2, 4, 7].forEach((d, i) => A.tone({ type: 'pluck', freq: notes(d + 7), dur: 0.14, vol: 0.23, at: A.now + i * 0.07 }));
    A.tone({ type: 'bell', freq: notes(16), dur: 0.3, vol: 0.0805, at: A.now + 0.3 });
  },
  buy() { [0, 4, 2, 7].forEach((d, i) => A.tone({ type: 'pluck', freq: notes(d + 7), dur: 0.12, vol: 0.254, at: A.now + i * 0.06 })); },
  // Eastpoint buys the same thing: the same arpeggio across the bay, quieter, slightly out of tune.
  copy() { [0, 4, 2, 7].forEach((d, i) => A.tone({ type: 'pluck', freq: notes(d + 7), dur: 0.12, vol: 0.242, detune: -35, pan: 0.7, at: A.now + i * 0.06 })); },
  unlock() { A.tone({ type: 'bell', freq: notes(11), dur: 0.35, vol: 0.216 }); A.tone({ type: 'bell', freq: notes(13), dur: 0.45, vol: 0.18, at: A.now + 0.12 }); },
  deny() { A.tone({ type: 'triangle', freq: notes(-2), dur: 0.07, vol: 0.32 }); },
  gone() { A.tone({ type: 'pad', freq: notes(-7), dur: 0.5, vol: 0.3, attack: 0.08, release: 0.5, cutoff: 600 }); },
  eastpoint() { [4, 6, 7].forEach((d, i) => A.tone({ type: 'bell', freq: notes(d + 7), dur: 0.35, vol: 0.34, pan: 0.6, at: A.now + i * 0.2 })); },
  quota() {
    [0, 2, 4, 7, 9, 11, 14].forEach((d, i) => A.tone({ type: 'pluck', freq: notes(d + 7), dur: 0.16, vol: 0.257, at: A.now + i * 0.08 }));
    A.tone({ type: 'bell', freq: notes(21), dur: 0.6, vol: 0.0858, at: A.now + 0.6 });
  },
  crate(h = 0) { A.tone({ type: 'triangle', freq: notes(-9 + h), dur: 0.07, vol: 0.324, release: 0.1 }); A.noiseHit('snare', { vol: 0.0432, dur: 0.05 }); },
  // The ending: the motif resolves to D major. The rule is undone, and that's fine.
  finale() {
    const m = [62, 66, 69, 74, 73, 69, 66, 69, 74, 78];
    m.forEach((n, i) => A.tone({ type: 'pluck', freq: midiToHz(n), dur: 0.4, vol: 0.221, at: A.now + i * 0.26 }));
    [50, 57, 62, 66].forEach(n => A.tone({ type: 'pad', freq: midiToHz(n), dur: 2.6, vol: 0.0431, attack: 0.5, release: 1.6, cutoff: 900, at: A.now + 1.2 }));
    A.tone({ type: 'bell', freq: midiToHz(86), dur: 1, vol: 0.0738, at: A.now + 2.7 });
  },
};
if (location.search.includes('debug')) window.__game = { A, sfx, long: ['finale', 'quota'], S: () => S, E, clock: () => clock };

// The game owns playback; music.mjs arranges the score per phase.
let music = null, soundtrack = null;
function song() { return (soundtrack ??= createSoundtrack(music.strudel))(E.phase(S)); }
createMusic(A, { packs: ['vcsl'], song }).then(m => { music = m; music.update(); }).catch(e => console.warn('music', e));

// ---------- Risograph art ----------
// Every piece is drawn as flat ink layers, each a little out of register, multiplied onto the paper.
const W = 800, H = 540, SEA = 456, TRAY = { x: 480, y: 440 }, BW = 96, BH = 30, JIB = 54;
let seed = 18;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
// One ink pass: draws `fn` in `color`, offset by the plate's misregistration.
const PLATES = { [C.ink]: [0, 0], [C.teal]: [1.6, 0.8], [C.aqua]: [-1.2, 1], [C.coral]: [1, -1.3], [C.peach]: [-0.8, -0.6] };
function ink(x, color, fn, alpha = 1) {
  const [dx, dy] = PLATES[color] || [0, 0];
  x.save(); x.globalCompositeOperation = color === '#ffffff' ? 'source-over' : 'multiply'; x.globalAlpha = alpha; x.translate(dx, dy);
  x.fillStyle = color; x.strokeStyle = color; fn(x); x.restore();
}
const P = (x, f) => { x.beginPath(); f(); x.fill(); };
function rr(x, l, t, w, h, r) { x.beginPath(); x.roundRect(l, t, w, h, r); }

// Skerry Light, 170 x 420: a striped tower, a gallery, the lamp room (the face goes on live).
function drawLighthouse(tint = false) {
  const c = Sprites.canvas(170, 420), x = c.getContext('2d'), m = 85;
  // Tower: tapered, coral bands on cream.
  const top = 150, bot = 410, wt = 34, wb = 58;
  const tw = y => wt + (wb - wt) * (y - top) / (bot - top);
  ink(x, tint ? C.peach : C.peach, q => P(q, () => { q.moveTo(m - wt, top); q.lineTo(m + wt, top); q.lineTo(m + wb, bot); q.lineTo(m - wb, bot); q.closePath(); }), 0.55);
  for (let i = 0; i < 4; i++) {
    const y0 = top + 18 + i * 64, y1 = y0 + 30;
    ink(x, C.coral, q => P(q, () => { q.moveTo(m - tw(y0), y0); q.lineTo(m + tw(y0), y0); q.lineTo(m + tw(y1), y1); q.lineTo(m - tw(y1), y1); q.closePath(); }));
  }
  // Shading down the right side, in halftone.
  const sh = Sprites.canvas(170, 420), sx = sh.getContext('2d');
  const g = sx.createLinearGradient(m, 0, m + wb, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.75)');

    b.textContent = it.name; b.dataset.id = it.id;
    b.setAttribute('aria-describedby', 'tip');
    const show = () => { hideTip(true); b.classList.add('on'); showTip(b, { id: 'bought:' + it.id, name: it.name, desc: it.desc, joke: it.joke, foot: it.silly ? 'Bought · does very little' : 'Bought', inline: true }); };
    b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') show(); });
    b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
    b.addEventListener('focus', () => { if (!b.dataset.touch) show(); });
    b.addEventListener('blur', hideTip);
    b.addEventListener('pointerdown', e => { b.dataset.touch = e.pointerType !== 'mouse' ? '1' : ''; });
    b.addEventListener('click', () => { if (tipFor === 'bought:' + it.id && b.dataset.touch) hideTip(true); else show(); });
    return b;
  }));
}

function doBuy(id) {
  const u = E.BY_ID[id];
  if (!E.buy(S, id)) { sfx.deny(); return; }
  delete newUntil[id];
  hideTip();
  sfx.buy();
  say('REQUISITION', u.joke);
  save(); renderShop(); hud();
}

// ---------- The finale ----------
function startFinal() {
  if (!E.startFinal(S)) return;
  hideTip(true);
  say('FORM 99', `Signed in triplicate. The kitchen goes to Eastpoint in ${S.final.crates.length} crates. Stack them for the tender: tap to drop.`);
  if (music) music.update();
  save(); renderBoard(); renderShop(); hud();
  cv.focus({ preventScroll: true });
}
function end(resumed) {
  S.ended = true; S.final = S.final ? { ...S.final, done: true } : null; save();
  finaleAnim = null;
  $('ending').hidden = false;
  $('endText').textContent = `The whole kitchen went across the bay: the clockwork, the baskets${E.has(S, 'cardigan') ? ', the cardigan' : ''}${E.lvl(S, 'gull') ? ', the gulls' : ''}. Eastpoint steamed its first batch at nine. One dumpling came undone in the steamer: seventeen pleats. The skipper of the Adequate ate it anyway and said it tasted the same. Skerry Light stopped trembling, turned its lamp back on, and about ten o'clock the fog lifted.`;
  $('endMemo').textContent = `HARBOUR BOARD · Re: Form 18-B${E.has(S, 'form18b') ? '' : ' (not filed)'}. Regulation 18 is struck. Nobody else was counting. Dumplings may be folded however they come out.` + (S.served ? ` Season total: ${fmt(S.served)} dumplings served to ${S.delivered} boats, ${S.perfects} perfect drops. Eastpoint fed ${fmt(S.epServed)}.` : '');
  if (!resumed) {
    sfx.finale();
    if (window.DailyGame) {
      const m = Math.floor(S.t / 60), s = String(Math.floor(S.t % 60)).padStart(2, '0');
      DailyGame.finish({ lines: [`⏱ ${m}m${s}s`, `🥟 ${fmt(S.served)} dumplings`, `🏮 tallest stack ${S.bestStack}`, '📋 Regulation 18: struck'] });
    }
    setTimeout(() => $('ending').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' }), 600);
  } else setTimeout(() => $('ending').scrollIntoView({ behavior: 'auto', block: 'nearest' }), 300);
  if (music) music.update();
  hud(); renderBoard(); renderShop();
}
$('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());

// ---------- Input ----------
cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.focus({ preventScroll: true }); doDrop(); });
document.addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = document.activeElement?.tagName;
  if ((e.key === ' ' || e.key === 'Enter') && (document.activeElement === cv || tag === 'BODY' || !tag)) { e.preventDefault(); doDrop(); }
  else if (/^[1-3]$/.test(e.key) && tag !== 'INPUT') { const b = S.board[Number(e.key) - 1]; if (b) accept(b.id); }
});

// ---------- Loop ----------
function handle(ev) {
  for (const e of ev) {
    if (e.folded) sfx.fold(e.folded);
    else if (e.latch && !e.latch.empty) { const h = hookPos(); afterDrop(e.latch, h, S.stack.length - 1, 0); }
    else if (e.deliver) {
      const d = e.deliver;
      sfx.deliver();
      departing = { b: { id: d.boat.length, ...d }, stack: Array.from({ length: Math.min(6, Math.ceil(d.delivered / E.stats(S).cap)) }, () => ({ x: 0 })), t: 0 };
      float(645, SEA - 120, `+${d.pay} chits`, C.coral, true);
      say(d.kind === 'lifeboat' ? 'LIFEBOAT' : 'LOG', d.slosh ? `${d.delivered} soup dumplings to the ${d.boat}. The stack leaned; the soup sloshed. Paid half: ${d.pay} chits.` : `${d.delivered} dumplings delivered to the ${d.boat}. ${d.pay} chits, signed for. The boat turns for harbour, following its nose.`);
    } else if (e.expired) { sfx.gone(); say('INCIDENT', `The ${e.expired.boat} sailed before its stack was ready.${S.ep ? ' Eastpoint fed it instead.' : ''} Form 7 filed. Nerves noted.`); }
    else if (e.gone) { sfx.gone(); if (Math.random() < 0.6) say(S.ep ? 'EASTPOINT' : 'LOG', S.ep ? `The ${e.gone.boat} got tired of waiting. Eastpoint fed it. Eastpoint would like that noted.` : `The ${e.gone.boat} drifted off into the fog, unfed. The lighthouse feels awful about it.`); }
    else if (e.slip) sfx.slip();
    else if (e.eastpoint) {
      sfx.eastpoint();
      say('BOARD NOTICE', 'An automatic light has been commissioned at Eastpoint, across the bay. It has been instructed to learn from you. It will serve any boat you leave waiting.');
      if (music) music.update();
    } else if (e.copied) { sfx.copy(); say('EASTPOINT', `Eastpoint has also acquired ${E.COPY_NAMES[e.copied] || 'one of those'}.`); }
    else if (e.quota) { sfx.quota(); say('HARBOUR BOARD', `Season quota met: ${E.QUOTA} dumplings. Form 99 has arrived: transfer of catering duties to Eastpoint. Sign it when you're ready.`); }
  }
}
let last = performance.now(), saveAcc = 0, ambAcc = 0, uiAcc = 0, phaseWas = E.phase(S), lastFrame = performance.now();
function step(dt) {
  const ev = S.ended ? [] : E.tick(S, dt);
  clock = S.t;
  if (ev.length) handle(ev);
  const ph = E.phase(S);
  if (ph !== phaseWas) { phaseWas = ph; if (music) music.update(); }
  saveAcc += dt; if (saveAcc > 5) { saveAcc = 0; save(); }
  ambAcc += dt; if (ambAcc > 0.25) { ambAcc = 0; ambient(); }
  uiAcc += dt; if (uiAcc > 0.2) { uiAcc = 0; hud(); renderBoard(); renderShop(); }
}
function frame(now) {
  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now; lastFrame = now;
  step(dt);
  if (S.ended) clock += dt;
  // Animation bits.
  fogT += dt; blinkT -= dt; if (blinkT < 0) blinkT = 1.5 + Math.random() * 3 + (S.ended ? 2 : 0);
  look += dt * (0.8 + S.nerves * 5);
  arrive = Math.min(1, arrive + dt * 0.8);
  if (departing) { departing.t += dt; if (departing.t > 1.6) departing = null; }
  for (const f of floats) f.t += dt; floats = floats.filter(f => f.t < 1.6);
  for (const s of steam) { s.t += dt; s.y -= dt * 14; } steam = steam.filter(s => s.t < s.life);
  if (S.stack.length && Math.random() < dt * 1.2) steam.push({ x: scrX(E.topX(S)) + (Math.random() - 0.5) * 50, y: stackTopY() - 4, t: 0, life: 1.6, p: Math.random() * 6 });
  for (const d of drops) { d.vy += 600 * dt; d.y += d.vy * dt; d.r += d.vr * dt; } drops = drops.filter(d => d.y < H + 40);
  for (const g of gullsFly) { g.t += dt; const p = Math.min(1, g.t / 1.2); g.x += (g.tx - g.x) * p * 0.08; g.y += (g.ty - g.y) * p * 0.08 + (g.t > 1.3 ? -6 : 0); } gullsFly = gullsFly.filter(g => g.t < 3.2);
  // Eastpoint's stack copies yours three seconds late.
  epHist.push({ t: now, s: S.stack.map(b => ({ x: b.x })) });
  while (epHist.length > 1 && now - epHist[1].t > 3000) epHist.shift();
  ghost = epHist[0].s;
  if (finaleAnim) finaleAnim.t += dt;
  render();
  requestAnimationFrame(frame);
}
// In a background tab, rAF stops: keep the kitchen going on a timer.
setInterval(() => {
  const now = performance.now();
  if (now - lastFrame < 400) return;
  const dt = Math.min(1, (now - last) / 1000); last = now;
  step(dt);
}, 250);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('resize', layout);

layout();
if (S.ended) end(true);
else if (S.final) {
  if (S.final.done) startHandoverAnim();
  say('FORM 99', 'Welcome back. The handover is in progress: keep stacking the crates for Eastpoint’s tender.');
} else if (!S.t) say('LOG', 'Fog season. The beam can’t reach the boats, but the smell of dumplings can. The basket is filling: tap to drop it on the stack.');
else say('LOG', 'Welcome back to Skerry Light. The fog is still in. The boats are still hungry.');
hud(); renderBoard(); renderShop();
document.fonts?.ready.then(layout);
requestAnimationFrame(frame);
</script>

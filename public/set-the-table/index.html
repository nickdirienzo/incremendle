  const box = $('forkOpts'); box.innerHTML = '';
  for (const o of F.options) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn';
    b.innerHTML = `${o.name}<small>${k === 'tower' ? `×${o.mult}${o.id === 'tall' ? ', falls' : ', steady'}` : o.id === 'palms' ? 'slow her down' : 'ride her wind'}</small>`;
    b.setAttribute('aria-describedby', 'tip');
    hookTip(b, () => forkInfo(k, o), () => choose(k, o));
    box.append(b);
  }
  if (S.started) sfx.unlock();
}
function choose(k, o) {
  E.choose(S, k, o.id); hideTip(true); sfx.fork();
  const lines = {
    tall: 'Tall, then. The towers go up and up, thin as candles, and Wilhelmina eyes them from over the sea. When a gust knocks one down, tap it to stack it up again.',
    squat: 'Squat, then. The towers go up wide and low and sensible, like a good aunt. Wilhelmina blows at them and nothing happens. She is furious.',
    palms: 'Palms, then. A row of them goes up between the sea and the table, and the helpers work in the shade. Wilhelmina has to blow around them, which takes her a long while.',
    kite: 'Kites, then. Every tower gets a kite, and the harder Wilhelmina blows, the faster the lemons go up. She has not thought this through.',
  };
  say('AND SO IT WAS', lines[o.id]);
  forkSig = ''; renderShop(); renderHud(); save();
}

// ---------- The Bought shelf ----------
const shelfEl = $('bought');
shelfEl.open = !!S.boughtOpen;
shelfEl.addEventListener('toggle', () => {
  if (!shelfEl.open) hideTip(true);
  if (!!S.boughtOpen === shelfEl.open) return;
  S.boughtOpen = shelfEl.open; save();
});
let shelfSig = null;
function renderShelf() {
  const list = S.ended ? [] : E.bought(S);
  const sig = list.map(i => i.id).join('|');
  if (sig === shelfSig) return;
  shelfSig = sig;
  shelfEl.hidden = !list.length;
  $('boughtN').textContent = list.length;
  $('shelf').replaceChildren(...list.map(it => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'bought' + (it.kind === 'odd' ? ' odd' : '');
    b.textContent = it.name; b.dataset.id = it.id;
    b.setAttribute('aria-describedby', 'tip');
    const show = () => { hideTip(true); b.classList.add('on'); showTip(b, { id: 'bought:' + it.id, hd: it.kind === 'odd' ? 'ON THE BEACH, FOR GOOD' : 'BOUGHT', name: it.name, desc: it.desc, joke: it.joke, foot: it.kind === 'odd' ? 'for the picture' : 'bought', inline: true }); };
    b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') show(); });
    b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
    b.addEventListener('focus', () => { if (!b.dataset.touch) show(); });
    b.addEventListener('blur', () => hideTip());
    b.addEventListener('pointerdown', e => { b.dataset.touch = e.pointerType !== 'mouse' ? '1' : ''; });
    b.addEventListener('click', () => { if (tipFor === 'bought:' + it.id && b.dataset.touch) hideTip(true); else show(); });
    return b;
  }));
}
function doBuy(id) {
  const it = E.BY_ID[id], first = isProd(it) && S.own[id] === 0;
  if (!E.buy(S, id)) { sfx.deny(); return; }
  hideTip(true); sfx.buy();
  if (isProd(it)) { if (first || Math.random() < 0.25) say(first ? 'HELP ARRIVES' : 'MORE HELP', first ? it.desc + ' ' + it.joke : pick([`Another ${it.one} joins the table.`, `One more ${it.one}. The lemons go up a little faster.`, `A ${it.one} reports for duty, sourly saluted by Bumpkin.`])); }
  else say(it.kind === 'odd' ? 'FOR THE PICTURE' : 'BOUGHT', `${it.name}: ${it.joke}`);
  renderShop(); renderHud(); save();
}

// ---------- The clock ----------
let stretchesNow = E.stretchesSet(S), phaseNow = E.phaseOf(S), nextGust = 18 + Math.random() * 10, dripAcc = 0, helperLogT = performance.now();
const STRETCH_LINES = [
  'The Family End is set: rolls, pie, the good gravy. The aunts sit down. "Very nice," they say, "and the rest of the coast?" The beach offers to help.',
  "The Cousins' Corner is set. The cousins argue about the cranberry sauce, which proves it is real cranberry sauce again.",
  'The Snack Hut is set. Nobody has ever eaten a Thanksgiving dinner at the Snack Hut before. Nobody is going to start now, but it is set.',
  'The Boardwalk is set, all the way to the photo booth.',
  'The Pier is set. The fish below look up, hopefully.',
  'Palm Row is set. Bumpkin looks at its own tower, small and sour beside the beach\'s, and climbs the lifeguard chair to supervise. From now on it will mostly be blowing a whistle.',
  'The Mini Golf is set, with a turkey on the windmill hole. Out at sea, Wilhelmina breathes in.',
  'The Neon Arcade is set. The claw machine is full of peas, which is where peas go, apparently.',
  'The Marina is set. Every boat has a pie on it. One more stretch.',
];
function tick(dt) {
  if (S.ended || ending) return;
  const before = S.total;
  const ev = E.step(S, dt);
  const gained = S.total - before;
  if (gained > 0 && E.beachRate(S) > 0) { dripAcc += dt; if (dripAcc > 2.2) { dripAcc = 0; sfx.drip(); } }
  for (const id of ev.restacked) pop('stacked', SLOTS[id], TABLE - 70, C.white);
  if (ev.blew) {
    sfx.blow(); wind = { t: 0, dur: 4, power: 1.4 };
    say('THE GALE', S.fork.tower === 'tall'
      ? `Wilhelmina blows with everything she has. Every tall tower on the coast goes over, the helpers tumble about, and for ${E.SLOW_SECS} seconds nobody stacks anything properly. Then she starts gathering herself again.`
      : `Wilhelmina blows with everything she has. The squat towers stand, but the helpers are blown about and for ${E.SLOW_SECS} seconds nobody stacks anything properly. Then she starts gathering herself again.`);
  }
  // Wilhelmina's gusts
  nextGust -= dt;
  if (nextGust <= 0) {
    nextGust = E.gustGap(S) * (0.7 + Math.random() * 0.6);
    wind = { t: 0, dur: 2.6, power: 1 };
    sfx.gust();
    const id = E.gust(S);
    if (id) { sfx.fall(); if (performance.now() - lastSay > 4000) say('A GUST', `Wilhelmina puffs, and the ${E.BY_ID[id].name.toLowerCase()}' tower goes over. Tap it to stack it up again, or it will take ${E.RESTACK_SECS} seconds to sort itself out.`); }
    else if (!told.has('gust') && E.handActive(S)) { told.add('gust'); S.told = [...told]; say('A GUST', 'Wilhelmina the West Wind puffs across the table. She has never forgiven Bumpkin for the summer final. A falling lemon blows sideways in a gust; aim into the wind.'); }
  }
  const st = E.stretchesSet(S);
  if (st > stretchesNow) {
    stretchesNow = st; sfx.stretch();
    if (st < 10) say(`${E.STRETCHES[st - 1].name.toUpperCase()} · SET`, STRETCH_LINES[st - 1]);
  }
  const ph = E.phaseOf(S);
  if (ph !== phaseNow) {
    phaseNow = ph; fall = null;
    if (ph === 3) { S.tower = []; setTimeout(() => say('THE WEST WIND', 'Out over the sea, Wilhelmina has begun gathering a gale, to blow the whole Long Table into the water before supper. Her meter is up top. Set the Far End before it blows.'), 6000); }
    refreshMusic();
  }
  if (E.done(S)) startEnding();
  // now and then, the helpers get a mention
  if (E.beachRate(S) > 0 && performance.now() - helperLogT > 50000 && performance.now() - lastSay > 25000) {
    helperLogT = performance.now();
    const ids = E.PRODUCERS.filter(p => S.own[p.id]).map(p => p.id), id = pick(ids);
    const lines = {
      crab: [`The hermit crabs carry lemons up the table legs, ${rate(E.rateOf(S, 'crab'))} dishes a second. They hand them over and move back into their own shells, a little reluctantly.`],
      flam: [`The flamingos stand very still, lemons on their heads, ${rate(E.rateOf(S, 'flam'))} dishes a second. A gull lands on one. It does not move.`],
      atlas: [`The Atlases hold their globes of lemons up, ${rate(E.rateOf(S, 'atlas'))} dishes a second. One of them hums.`],
      dolph: [`The dolphins leap, nose up, lemon high, ${rate(E.rateOf(S, 'dolph'))} dishes a second, and wait for applause after every one.`],
      ball: [`The parade balloons bob over the table, nets full, ${rate(E.rateOf(S, 'ball'))} dishes a second. Very high. Very remembered.`],
    };
    say('ON THE TABLE', pick(lines[id]));
  }
}
function startEnding() {
  if (ending) return;
  ending = { t: 0 }; hideTip(true); fall = null;
  S.finishedAt = S.time;
  $('col').hidden = true;
  say('THE FAR END · SET', 'The last dish is set at the Far End, and then, for the first time anybody can remember, the sun begins to go down.');
  refreshMusic(); sfx.finale();
}
let lastFrame = performance.now(), logicT = performance.now(), saveT = 0;
function frame(now) {
  const real = Math.min(0.25, Math.max(0, (now - lastFrame) / 1000)), dt = Math.min(0.05, real); lastFrame = now; t += dt;
  // physics
  if (E.handActive(S) && !S.ended && !ending) bounceA += E.bounceSpeed(S) * dt;
  if (reload > 0) reload -= dt;
  if (wind) { wind.t += dt; if (wind.t >= wind.dur) wind = null; }
  if (fall) {
    const g = hand();
    fall.vy += 1500 * g.s * dt;
    if (wind) fall.x += 110 * wind.power * g.s * Math.min(1, Math.min(wind.t, wind.dur - wind.t) * 2) * dt;
    fall.y += fall.vy * dt; fall.rot += dt * 0.6;
    if (fall.y >= towerTopY() - g.lh / 2) { fall.y = towerTopY() - g.lh / 2; landLemon(); }
  }
  for (let i = bits.length - 1; i >= 0; i--) { const b = bits[i]; b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.flat ? 0 : b.vy * dt; b.rot += b.vr * dt; b.life -= dt * (b.flat ? 1 : 0.8); if (b.life <= 0 || b.y > H + 40) bits.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].y -= 30 * dt; pops[i].life -= dt; if (pops[i].life <= 0) pops.splice(i, 1); }
  if (ending) { ending.t += real; if (ending.t > 9.5) end(false); }
  draw();
  requestAnimationFrame(frame);
}
// The economy runs on a timer so the beach keeps working in a background tab.
setInterval(() => {
  const now = performance.now(), dt = Math.min(5, (now - logicT) / 1000); logicT = now;
  if (!S.ended && S.started) tick(dt);
  renderHud(); renderShop();
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
}, 200);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);

// ---------- The end ----------
function finishedWorld() {
  // A finished save draws the whole beach, everything built.
  const typical = { crab: 50, flam: 42, atlas: 34, dolph: 26, ball: 17 };
  for (const p of E.PRODUCERS) S.own[p.id] = Math.max(S.own[p.id] || 0, typical[p.id]);
  for (const u of E.UPGRADES) S.up[u.id] = true;
  S.total = Math.max(S.total, E.GOAL);
}
function end(resumed) {
  const firstTime = !S.ended;
  ending = null; S.ended = true; finishedWorld(); S.toppled = {}; S.slow = 0;
  if (S.finishedAt == null) S.finishedAt = S.time;
  save();
  $('col').hidden = true; hideTip(true);
  const mins = Math.max(1, Math.round((S.finishedAt || 0) / 60));
  const gales = S.gales || 0;
  const story = [
    `The Far End was set at last: four billion dishes, every one a lemon that had been held up high enough to remember what it was. Then, for the first time in the history of Palm Grove, the sun went down. It had been waiting for suppertime.`,
    `Wilhelmina's gale ${gales ? `had blown ${gales === 1 ? 'once' : `${gales} times`}, and ` : ''}arrived to find nothing left to blow away. She sat down on the sea in a huff.`,
    `But the beach was not finished. "One more," said the hermit crabs. The flamingos stood on the crabs, the Atlases stood on the flamingos, the dolphins balanced on the Atlases and the balloons held the top steady, until the tallest tower in the history of the coast stood on the Long Table, lit by lasers, wreathed in pink fog, with a very short ladder leaning against the bottom. At the very top they set down Bumpkin, who had been lemon-yellow and sour since the summer final, because a cursed thing held up high remembers what it was too.`,
    `And Bumpkin, held higher than anything had ever been held, remembered. It was a volleyball. It had always been a volleyball. It turned white again, and everyone agreed it had been worth it.`,
    `After dinner there was a game on the sand, and Wilhelmina was invited. She cheated, a little. Everybody let her.`,
  ];
  $('story').replaceChildren(...story.map(s => { const p = document.createElement('p'); p.textContent = s; return p; }));
  $('ending').hidden = false;
  say('THE END', 'The sun is down, the table is set, and Bumpkin is a volleyball.');
  renderHud(); refreshMusic();
  if (!resumed && firstTime && window.DailyGame) {
    const lines = [
      `🏐 Set the Table in ${mins} min`,
      `🍋 4 billion lemons held up high`,
      gales ? `🌬️ blown about ${gales}× and still beat the West Wind` : '🌬️ beat the West Wind without a gale',
      `${S.fork.tower === 'squat' ? '🧱 squat' : '🗼 tall'} · ${S.fork.wind === 'palms' ? '🌴 palms' : '🪁 kites'}`,
    ];
    DailyGame.finish({ lines });
  }
  if (!resumed) $('ending').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
}
$('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());

// ---------- Start ----------
makeSprites().then(() => {
  if (S.ended) end(true);
  else if (S.lastLog) say(S.lastLog[0], S.lastLog[1]);
  else say('ONCE UPON A THANKSGIVING', 'Bumpkin, a cursed volleyball, has turned every dish on the Long Table into a lemon. Luckily, a lemon held up high remembers what it was. Tap to drop the lemon onto the tower; land it in the middle.');
  phaseNow = E.phaseOf(S); stretchesNow = E.stretchesSet(S);
  lastPhase = phaseKey();
  renderHud(); renderShop();
  requestAnimationFrame(t0 => { lastFrame = t0; requestAnimationFrame(frame); });
});
// The first tap starts the clock (and the music, which the adapter starts on the first gesture).
cv.addEventListener('pointerdown', () => { if (!S.started && !S.ended) { S.started = true; save(); } }, { capture: true });
</script>
</body>

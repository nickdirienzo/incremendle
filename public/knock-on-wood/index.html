<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack, phases as MUSIC } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import * as FX from '/shared/kit/fx.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = { ink: '#3d003d', night: '#44355d', dusk: '#464969', plum: '#5b3374', mauve: '#804085', rose: '#af5d8b', pink: '#d37b86',
  wine: '#942c4b', wood: '#7b334c', wood2: '#a14d55', clay: '#c77369', peach: '#e3a084', sand: '#f2cb9b', paper: '#ffffe0',
  bone: '#dcdac9', grey: '#b8b4b2', slate: '#887d8d', mint: '#b6f5db', sky: '#89d9d9', blue: '#72b6cf', steel: '#5c8ba8',
  red: '#c7424f', orange: '#e06b51', gold: '#f2a561', lemon: '#fcef8d', leaf: '#80b878', moss: '#658d78', deep: '#412051', berry: '#621748' };

// ---------- Save ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:37:save';
let S;
try { S = E.load(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { S = E.fresh(); }
const save = () => { try { S.lastSeen = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let rng = Math.random;

// ---------- Sound ----------
const A = createAudio({ sfxTrim: 1.25, musicTrim: 6.4 });
const HM = scale('harmonic minor', 64);   // E harmonic minor, the music's scale
const pick = a => a[Math.floor(Math.random() * a.length)];
let music = null;
const marimba = (deg, { vol = 0.5, at = 0 } = {}) => {
  // The music's own marimba when it's loaded; a synth pluck on the same note otherwise.
  if (music) music.hit({ s: 'marimba', note: Math.round(69 + 12 * Math.log2(HM(deg) / 440)), gain: vol * 2, duration: 0.5 }, at);
  else A.tone({ type: 'pluck', freq: HM(deg), dur: 0.12, vol: vol * 0.35, at: A.now + at });
};
const sfx = {
  // A knock on wood: a dull thump and a marimba note, rising through the bar.
  knock(slot = 0, perfect = false) {
    A.noiseHit('kick', { vol: 0.26 });
    A.tone({ type: 'triangle', freq: 120, dur: 0.05, vol: 0.22, glide: 0.6, cutoff: 900 });
    marimba([0, 2, 4, 7, 4, 2, 7, 9][slot % 8] + (perfect ? 7 : 0), { vol: perfect ? 0.62 : 0.5 });
  },
  dud() { A.tone({ type: 'sine', freq: 90, dur: 0.06, vol: 0.34, glide: 0.7, cutoff: 500 }); },
  hands() { A.tone({ type: 'triangle', freq: 150, dur: 0.03, vol: 0.35, glide: 0.7, cutoff: 700 }); },
  cup() { const d = pick([7, 9, 11, 14]); A.tone({ type: 'bell', freq: HM(d), dur: 0.12, vol: 0.3 }); A.tone({ type: 'bell', freq: HM(d + 2) * 1.003, dur: 0.1, vol: 0.15, at: A.now + 0.05 }); },
  wrong() { A.tone({ type: 'sine', freq: HM(-3), dur: 0.22, vol: 0.32, glide: 0.94, cutoff: 900 }); },
  ghost() { [0, 2, 4].forEach((d, i) => A.tone({ type: 'sine', freq: HM(d + 7), dur: 0.3, vol: 0.12, attack: 0.04, at: A.now + i * 0.07 })); },
  buy() { [0, 2, 4, 7].forEach((d, i) => { marimba(d + 7, { vol: 0.5, at: i * 0.06 }); A.tone({ type: 'pluck', freq: HM(d + 7), dur: 0.1, vol: 0.32, at: A.now + i * 0.06 }); }); },
  unlock() { [4, 7, 11].forEach((d, i) => A.tone({ type: 'bell', freq: HM(d + 7), dur: 0.2, vol: 0.25, at: A.now + i * 0.09 })); },
  fix() { A.noiseHit('whoosh', { vol: 0.12, dur: 0.4 }); [0, 4, 6, 7].forEach((d, i) => marimba(d, { vol: 0.5, at: 0.1 + i * 0.1 })); },
  lend() { [7, 6, 4, 2, 0].forEach((d, i) => { marimba(d + 7, { vol: 0.5, at: i * 0.07 }); A.tone({ type: 'pluck', freq: HM(d + 7), dur: 0.1, vol: 0.34, at: A.now + i * 0.07 }); }); },
  milestone() { [0, 4, 7, 11, 14].forEach((d, i) => { marimba(d, { vol: 0.3, at: i * 0.08 }); A.tone({ type: 'bell', freq: HM(d + 7), dur: 0.3, vol: 0.08, at: A.now + i * 0.08 }); }); },
  deny() { A.tone({ type: 'sine', freq: 110, dur: 0.08, vol: 0.38, cutoff: 500 }); },
  finale() {
    [0, 2, 4, 7, 6, 7, 11, 14].forEach((d, i) => marimba(d, { vol: 0.4, at: i * 0.14 }));
    [7, 11, 14, 18].forEach((d, i) => A.tone({ type: 'bell', freq: HM(d), dur: 0.6, vol: 0.1, at: A.now + 1.2 + i * 0.18 }));
  },
};
if (location.search.includes('debug')) window.__game = { A, sfx, long: ['finale', 'milestone'], get S() { return S; }, get music() { return music; }, beat: () => beatNow(), marked: k => marked(k) };

// ---------- Music ----------
let soundtrack = null;
const phaseKey = () => E.phaseOf(S);
const bpmNow = () => MUSIC[phaseKey()].bpm;
createMusic(A, { packs: ['vcsl'], song: () => (soundtrack ??= createSoundtrack(music.strudel))(phaseKey()) })
  .then(m => { music = m; music.update(); }).catch(() => {});

// ---------- The beat ----------
// One Strudel cycle is one bar. When the music is playing the knocks follow its scheduler (minus the output latency,
// so the markers line up with what you hear); otherwise a clock of our own at the same tempo.
let own = { t: performance.now() / 1000, b: 0, bpm: 92 };
function beatNow() {
  const sch = music && music.playing && music.repl && music.repl.scheduler;
  if (sch && sch.started) {
    const lat = (A.ctx && (A.ctx.outputLatency || A.ctx.baseLatency)) || 0;
    const b = (sch.now() - lat * sch.cps) * 4;
    own = { t: performance.now() / 1000, b, bpm: sch.cps * 240 };
    return b;
  }
  const t = performance.now() / 1000;
  if (own.bpm !== bpmNow()) own = { t, b: own.b + (t - own.t) * own.bpm / 60, bpm: bpmNow() };
  return own.b + (t - own.t) * own.bpm / 60;
}
const doorRoom = () => E.ROOMS[Math.max(0, S.open - 1)];
const pattern = () => doorRoom().pattern;
const marked = k => pattern()[((k % 16) + 16) % 16] === 'x';
const hitSlots = new Set();
let lastTapBeat = -9, swing = 0, flash = [];
function tryKnock() {
  if (S.ended || S.balanced) return;
  if (!S.started) { S.started = true; }
  const b = beatNow(), spb = 60 / own.bpm;
  const k0 = Math.round(b * 2);
  let best = null;
  for (const k of [k0 - 1, k0, k0 + 1]) {
    if (!marked(k) || hitSlots.has(k)) continue;
    const dt = Math.abs(b - k / 2) * spb;
    if (dt <= E.hitWindow(S) && (!best || dt < best.dt)) best = { k, dt };
  }
  swing = 1; lastTapBeat = b;
  if (!best) { sfx.dud(); pop('door', 'off the beat', C.slate, 0.7); return; }
  hitSlots.add(best.k);
  if (hitSlots.size > 64) for (const k of [...hitSlots].slice(0, 32)) hitSlots.delete(k);
  const perfect = best.dt <= E.perfectWindow(S);
  const v = E.knock(S, perfect);
  sfx.knock(((best.k % 16) + 16) % 16, perfect);
  burst(perfect ? 'KNOCK KNOCK!' : 'KNOCK!', perfect, v);
  if (S.tapped === 1) say('KNOCK!', 'Somebody heard that. Keep knocking in time: every knock that lands on a marker counts, and one right on it counts double.');
  if (S.tapped === 6 && !S.ghosts) say('SOMETHING STIRS', 'Behind the door, something is listening. Spend knocks on the right to call a ghost: a ghost who answers will go and fetch a cup.');
}

// ---------- Sprites ----------
const SP = {};
async function art(name, color, size, px = 2) {
  const svg = Sprites.recolor(await Sprites.loadSvg(`./art/${name}`), color);
  return Sprites.outline(await Sprites.svgToCanvas(svg, size), C.ink, px);
}
function drawGhost(x, w, { tag = false, lantern = false, look = 0, alpha = 1 } = {}) {
  // A sheet ghost: round head, wavy hem, two eyes. Drawn around (0,0), w wide.
  const h = w * 1.15;
  x.save(); x.globalAlpha *= alpha;
  x.beginPath();
  x.moveTo(-w / 2, 0); x.arc(0, 0, w / 2, Math.PI, 0); x.lineTo(w / 2, h * 0.55);
  for (let i = 0; i < 4; i++) { const xa = w / 2 - (i + 0.5) * w / 4; x.quadraticCurveTo(xa + w / 8, h * (i % 2 ? 0.48 : 0.7), xa - w / 8 + 0.01, h * 0.55); }
  x.closePath();
  x.fillStyle = C.mint; x.fill(); x.lineWidth = Math.max(1.5, w / 12); x.strokeStyle = C.ink; x.stroke();
  x.fillStyle = C.ink;
  x.beginPath(); x.ellipse(-w * 0.17 + look * w * 0.05, -w * 0.02, w * 0.07, w * 0.11, 0, 0, 7); x.ellipse(w * 0.17 + look * w * 0.05, -w * 0.02, w * 0.07, w * 0.11, 0, 0, 7); x.fill();
  if (tag) { x.fillStyle = C.paper; x.fillRect(-w * 0.28, h * 0.2, w * 0.56, h * 0.16); x.lineWidth = Math.max(1, w / 20); x.strokeRect(-w * 0.28, h * 0.2, w * 0.56, h * 0.16); x.fillStyle = C.red; x.fillRect(-w * 0.28, h * 0.2, w * 0.56, h * 0.05); }
  if (lantern) { x.fillStyle = C.lemon; x.beginPath(); x.arc(w * 0.55, h * 0.3, w * 0.13, 0, 7); x.fill(); x.lineWidth = 1; x.stroke(); }
  x.restore();
}
function drawCup(x, s, { pattern = true } = {}) {
  // A teacup from the Cobwell service: cream, a willow-blue band, a handle. Origin at its base centre.
  x.save(); x.lineWidth = Math.max(1, s / 9); x.strokeStyle = C.ink;
  x.beginPath(); x.ellipse(0, 0, s * 0.62, s * 0.14, 0, 0, 7); x.fillStyle = C.bone; x.fill(); x.stroke();          // saucer
  x.beginPath(); x.moveTo(-s * 0.42, -s * 0.62); x.quadraticCurveTo(-s * 0.4, -s * 0.02, 0, -s * 0.04); x.quadraticCurveTo(s * 0.4, -s * 0.02, s * 0.42, -s * 0.62); x.closePath();
  x.fillStyle = C.paper; x.fill(); x.stroke();
  if (pattern) { x.fillStyle = C.blue; x.fillRect(-s * 0.36, -s * 0.5, s * 0.72, s * 0.12); }
  x.beginPath(); x.arc(s * 0.48, -s * 0.38, s * 0.13, -1.4, 1.6); x.stroke();
  x.restore();
}
function drawLedger(x, s, { tilt = 0, cosy = false, brass = false, lion = false, blink = false, mouth = 0, red = false } = {}) {
  // The ledger: a fat book stood on end, cover facing us, page edges showing. Origin at its feet, s tall.
  const w = s * 0.72;
  x.save(); x.rotate(tilt);
  x.lineJoin = 'round'; x.strokeStyle = C.ink; x.lineWidth = Math.max(2, s / 34);
  x.fillStyle = C.sand; x.beginPath(); x.moveTo(w / 2, -s + 4); x.lineTo(w / 2 + s * 0.12, -s + 10); x.lineTo(w / 2 + s * 0.12, -6); x.lineTo(w / 2, 0); x.closePath(); x.fill(); x.stroke();
  for (let i = 1; i < 6; i++) { x.beginPath(); x.moveTo(w / 2 + 2, -s + 8 + i * (s - 16) / 6); x.lineTo(w / 2 + s * 0.11, -s + 12 + i * (s - 16) / 6); x.lineWidth = 1; x.stroke(); }
  x.lineWidth = Math.max(2, s / 34);
  x.fillStyle = C.wine; x.fillRect(-w / 2, -s, w, s); x.strokeRect(-w / 2, -s, w, s);
  x.fillStyle = C.wood; x.fillRect(-w / 2, -s, w * 0.16, s); x.strokeRect(-w / 2, -s, w * 0.16, s);            // spine edge
  x.fillStyle = C.gold; x.fillRect(-w / 2 + w * 0.02, -s * 0.86, w * 0.12, s * 0.05); x.fillRect(-w / 2 + w * 0.02, -s * 0.2, w * 0.12, s * 0.05);
  x.fillStyle = C.lemon; x.fillRect(-w * 0.18, -s * 0.88, w * 0.56, s * 0.15); x.strokeRect(-w * 0.18, -s * 0.88, w * 0.56, s * 0.15);
  x.fillStyle = C.ink; x.font = `400 ${s * 0.11}px Bangers`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('LEDGER', w * 0.1, -s * 0.8);
  // eyes and mouth
  const ey = -s * 0.52;
  for (const ex of [-w * 0.02, w * 0.24]) {
    x.fillStyle = C.paper; x.beginPath(); x.ellipse(ex, ey, w * 0.1, blink ? s * 0.012 : s * 0.075, 0, 0, 7); x.fill(); x.stroke();
    if (!blink) { x.fillStyle = C.ink; x.beginPath(); x.arc(ex + w * 0.03, ey + s * 0.01, w * 0.04, 0, 7); x.fill(); }
  }
  x.beginPath(); x.lineWidth = Math.max(2, s / 40);
  if (mouth > 0) { x.fillStyle = C.berry; x.ellipse(w * 0.11, -s * 0.33, w * 0.08, s * 0.04 * mouth + 2, 0, 0, 7); x.fill(); x.stroke(); }
  else { x.moveTo(w * 0.02, -s * 0.34); x.quadraticCurveTo(w * 0.11, -s * 0.29, w * 0.2, -s * 0.34); x.stroke(); }
  if (red) { x.fillStyle = C.red; x.font = `700 ${s * 0.07}px 'Comic Neue'`; x.fillText('YES', w * 0.1, -s * 0.12); }
  if (brass) {
    x.fillStyle = C.gold; x.lineWidth = 1.5;
    for (const [cx, cy, dx, dy] of [[w / 2, -s, -1, 1], [w / 2, 0, -1, -1], [-w / 2 + w * 0.16, -s, 1, 1], [-w / 2 + w * 0.16, 0, 1, -1]]) {
      x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + dx * s * 0.13, cy); x.lineTo(cx, cy + dy * s * 0.13); x.closePath(); x.fill(); x.stroke();
    }
  }
  if (lion) {
    x.fillStyle = C.gold; x.lineWidth = 2; x.beginPath(); x.arc(w / 2 - 2, -s * 0.5, s * 0.1, 0, 7); x.fill(); x.stroke();
    x.fillStyle = C.orange; x.beginPath(); x.arc(w / 2 - 2, -s * 0.5, s * 0.06, 0, 7); x.fill();
    x.fillStyle = C.ink; x.beginPath(); x.arc(w / 2 - 5, -s * 0.52, 1.5, 0, 7); x.arc(w / 2 + 1, -s * 0.52, 1.5, 0, 7); x.fill();
    x.beginPath(); x.arc(w / 2 - 2, -s * 0.42, s * 0.045, 0, Math.PI); x.strokeStyle = C.ink; x.stroke();
  }
  if (cosy) {
    // a knitted tea cosy, worn as a hat, with a pompom
    x.lineWidth = Math.max(2, s / 34);
    x.beginPath(); x.moveTo(-w / 2 - 4, -s + 2); x.quadraticCurveTo(-w / 2, -s - s * 0.34, w * 0.1, -s - s * 0.36); x.quadraticCurveTo(w / 2 + 2, -s - s * 0.34, w / 2 + 6, -s + 2); x.closePath();
    x.fillStyle = C.pink; x.fill(); x.stroke();
    x.save(); x.clip(); x.fillStyle = C.sand; for (let i = 0; i < 3; i++) x.fillRect(-w, -s - s * 0.08 - i * s * 0.1, w * 2, s * 0.035); x.restore();
    x.fillStyle = C.paper; x.beginPath(); x.arc(w * 0.1, -s - s * 0.38, s * 0.06, 0, 7); x.fill(); x.stroke();
  }
  x.restore();
}
function drawHand(x, s, knock = 0) {
  if (!SP.hand) return;
  x.save(); x.rotate(-0.3 + knock * 0.35); x.drawImage(SP.hand, -s / 2, -s / 2, s, s); x.restore();
}
async function makeSprites() {
  try {
    SP.cupArt = Sprites.register('teacup (pinhead, restyled)', await art('pinhead--handled-teacup.svg', C.paper, 40));
    SP.hand = Sprites.register('wallpaper hand', Sprites.shadow(await art('mdi--hand-back-right.svg', C.peach, 44), C.deep, 2, 2));
    SP.lantern = Sprites.register('lantern', await art('mingcute--lantern-fill.svg', C.gold, 36));
    SP.glasses = Sprites.register('spectacles', await art('mdi--glasses.svg', C.ink, 40, 0));
    SP.compass = Sprites.register('compass that works', await art('mdi--compass.svg', C.steel, 40));
    SP.yarn = Sprites.register('ball of string', await art('akar-icons--yarn-fill.svg', C.red, 30));
    SP.trolley = Sprites.register('tea trolley', await art('material-symbols--trolley.svg', C.gold, 64));
    SP.mapGhost = Sprites.register('map ghost', await art('mdi--ghost.svg', C.mint, 18, 1));
  } catch (e) { /* art is decoration; the game still plays */ }
  const mk = (name, w, h, fn) => { const c = Sprites.canvas(w, h); fn(c.getContext('2d')); return Sprites.register(name, c); };
  mk('the ledger', 120, 150, x => { x.translate(50, 140); drawLedger(x, 100, {}); });
  mk('the ledger, fully kitted', 130, 190, x => { x.translate(55, 180); drawLedger(x, 110, { cosy: true, brass: true, lion: true, red: true }); });
  mk('ghost', 60, 70, x => { x.translate(30, 26); drawGhost(x, 40, {}); });
  mk('ghost with name tag and lantern', 70, 70, x => { x.translate(30, 26); drawGhost(x, 40, { tag: true, lantern: true }); });
  mk('cup (drawn)', 40, 36, x => { x.translate(18, 30); drawCup(x, 26); });
  // Halftone shading for the hall wallpaper, made once.
  const g = Sprites.canvas(220, 220), gx = g.getContext('2d');
  const grd = gx.createRadialGradient(110, 60, 10, 110, 110, 160); grd.addColorStop(0, '#fff'); grd.addColorStop(1, '#777'); gx.fillStyle = grd; gx.fillRect(0, 0, 220, 220);
  SP.dots = Sprites.register('wallpaper halftone', FX.halftone(g, { cell: 7, color: C.plum }));
}

// ---------- Canvases ----------
const cvs = { door: $('door'), map: $('map'), dresser: $('dresser') };
const ctx = Object.fromEntries(Object.entries(cvs).map(([k, c]) => [k, c.getContext('2d')]));
const size = { door: [820, 250], map: [520, 330], dresser: [290, 330] };
function fit() {
  const narrow = $('doorP').clientWidth < 560;
  size.door = narrow ? [560, 320] : [820, 250];
  size.dresser = [290, 330];
  for (const [k, c] of Object.entries(cvs)) {
    const [w, h] = size[k], cw = c.parentElement.clientWidth - 0 || w;
    const dpr = Math.min(2, devicePixelRatio || 1), k2 = cw / w;
    c.width = Math.round(cw * dpr); c.height = Math.round(h * k2 * dpr);
    c.style.height = `${h * k2}px`;
    c.__k = k2 * dpr;
  }
}

// ---------- Effects in the scene ----------
const pops = [];
function pop(where, text, color = C.ink, life = 1.2, x = null, y = null) {
  if (pops.length > 30) pops.shift();
  pops.push({ where, text, color, t: 0, life, x, y });
}
function burst(text, big, v) { flash.push({ text, big, t: 0, v, rot: (Math.random() - 0.5) * 0.4 }); if (flash.length > 4) flash.shift(); }

function frame(t) {
  const now = t / 1000, dt = Math.min(0.1, now - (frame.last || now)); frame.last = now;
  for (const p of pops) p.t += dt;
  for (let i = pops.length - 1; i >= 0; i--) if (pops[i].t > pops[i].life) pops.splice(i, 1);
  for (const f of flash) f.t += dt;
  flash = flash.filter(f => f.t < 0.6);
  swing = Math.max(0, swing - dt * 5);
  drawDoor(now); drawMap(now); drawDresser(now);
  requestAnimationFrame(frame);
}
function begin(k) { const c = ctx[k], s = cvs[k].__k || 1; c.setTransform(s, 0, 0, s, 0, 0); return c; }
function ink(x, w = 3) { x.strokeStyle = C.ink; x.lineWidth = w; x.lineJoin = 'round'; x.lineCap = 'round'; }
function text(x, str, px, y, { size = 14, font = 'Comic Neue', weight = 700, color = C.ink, align = 'center', stroke = null, sw = 4 } = {}) {
  x.font = `${weight} ${size}px '${font}'`; x.textAlign = align; x.textBaseline = 'middle';
  if (stroke) { x.lineWidth = sw; x.strokeStyle = stroke; x.lineJoin = 'round'; x.strokeText(str, px, y); }
  x.fillStyle = color; x.fillText(str, px, y);
}
function starburst(x, cx, cy, r, n, fill) {
  x.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * Math.PI * 2, rr = i % 2 ? r * 0.62 : r; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
  x.closePath(); x.fillStyle = fill; x.fill(); ink(x, 2.5); x.stroke();
}
function caption(x, str, px, py, { bg = C.lemon, size = 13, maxW = 300 } = {}) {
  x.font = `700 ${size}px 'Comic Neue'`;
  const w = Math.min(maxW, x.measureText(str).width + 14);
  x.fillStyle = bg; x.fillRect(px, py, w, size + 10); ink(x, 2); x.strokeRect(px, py, w, size + 10);
  x.fillStyle = C.ink; x.textAlign = 'left'; x.textBaseline = 'middle'; x.fillText(str, px + 7, py + (size + 10) / 2, maxW - 14);
}

// ---------- The door panel ----------
function drawDoor(now) {
  const x = begin('door'), [W, H] = size.door, narrow = W < 700;
  const b = beatNow(), beatFrac = b - Math.floor(b), pulse = Math.max(0, 1 - beatFrac * 3);
  const floorY = H - 34, doorW = narrow ? 120 : 132, doorX = W - doorW - (narrow ? 34 : 70), doorTop = narrow ? 92 : 50;
  const ending = S.ended || S.cellar > 0;
  // wallpaper
  x.fillStyle = ending ? C.dusk : C.mauve; x.fillRect(0, 0, W, H);
  if (SP.dots) { x.globalAlpha = 0.55; for (let px = 0; px < W; px += 220) for (let py = 0; py < H; py += 220) x.drawImage(SP.dots, px, py); x.globalAlpha = 1; }
  x.strokeStyle = C.rose; x.lineWidth = 2; x.globalAlpha = 0.6;
  for (let px = 30; px < W; px += 60) { x.beginPath(); for (let py = 0; py < floorY; py += 8) x.lineTo(px + Math.sin(py / 14) * 5, py); x.stroke(); }
  x.globalAlpha = 1;
  // floorboards and skirting
  x.fillStyle = C.wood; x.fillRect(0, floorY, W, H - floorY); x.fillStyle = C.berry; x.fillRect(0, floorY - 10, W, 10);
  ink(x, 3); x.beginPath(); x.moveTo(0, floorY - 10); x.lineTo(W, floorY - 10); x.moveTo(0, floorY); x.lineTo(W, floorY); x.stroke();
  x.strokeStyle = C.berry; x.lineWidth = 1.5; for (let px = 40; px < W; px += 90) { x.beginPath(); x.moveTo(px, floorY + 2); x.lineTo(px - 20, H); x.stroke(); }

  // grandfather clock: the pendulum swings on the beat
  const clockX = narrow ? 20 : 26;
  if (S.up.clock) {
    drawClock(x, clockX, floorY, b);
    const sw = Math.sin(b * Math.PI) * 0.35;
    x.save(); x.translate(clockX + 38, floorY - 92); x.rotate(sw); ink(x, 2); x.beginPath(); x.moveTo(0, 0); x.lineTo(0, 44); x.stroke();
    x.fillStyle = C.gold; x.beginPath(); x.arc(0, 46, 7, 0, 7); x.fill(); x.stroke(); x.restore();
  }
  // portrait of Cornelius: the eyes look at the floor
  const porX = narrow ? 120 : 170;
  if (S.up.portrait) {
    x.fillStyle = C.gold; x.fillRect(porX - 4, 22, 84, 100); ink(x, 3); x.strokeRect(porX - 4, 22, 84, 100);
    x.fillStyle = C.dusk; x.fillRect(porX + 6, 32, 64, 80); x.strokeRect(porX + 6, 32, 64, 80);
    face(x, porX + 38, 70, 24, { look: ending ? 0 : 1, kind: ending });
    caption(x, 'C. COBWELL', porX + 6, 104, { size: 9, bg: C.sand, maxW: 64 });
  }
  // wallpaper hands, knocking on the beat (up to 18 drawn, then a count)
  if (S.hands) {
    const slots = handSlots(W, floorY, narrow), n = Math.min(S.hands, slots.length);
    for (let i = 0; i < n; i++) {
      const [hx, hy] = slots[i], ph = (b + i * 0.37) % 1, kn = ph < 0.15 ? 1 - ph / 0.15 : 0;
      x.fillStyle = C.deep; x.beginPath(); x.ellipse(hx, hy + 8, 9, 4, 0, 0, 7); x.fill();               // the rip it comes out of
      x.save(); x.translate(hx, hy); drawHand(x, 26, kn); x.restore();
    }
    if (S.hands > n) caption(x, `×${S.hands} hands`, slots[n - 1][0] - 20, slots[n - 1][1] + 16, { size: 11 });
  }
  // saucer of milk by the skirting: always empty
  if (S.up.milk) {
    const mx = narrow ? 200 : 300;
    x.fillStyle = C.bone; x.beginPath(); x.ellipse(mx, floorY - 2, 22, 6, 0, 0, 7); x.fill(); ink(x, 2); x.stroke();
    x.fillStyle = C.paper; x.beginPath(); x.ellipse(mx, floorY - 3, 13, 3, 0, 0, 7); x.fill();
    x.fillStyle = C.ink; x.beginPath(); x.ellipse(mx + 34, floorY - 12, 7, 4, 0, 0, 7); x.fill();       // the crack in the skirting
    x.fillStyle = C.paper; x.beginPath(); x.arc(mx + 32, floorY - 13, 1.4, 0, 7); x.arc(mx + 36, floorY - 13, 1.4, 0, 7); x.fill();
  }
  // the door
  const room = doorRoom(), open = ending ? 1 : doorOpen;
  x.fillStyle = C.berry; x.fillRect(doorX - 12, doorTop - 14, doorW + 24, floorY - doorTop + 14); ink(x, 3); x.strokeRect(doorX - 12, doorTop - 14, doorW + 24, floorY - doorTop + 14);
  x.fillStyle = C.ink; x.fillRect(doorX, doorTop, doorW, floorY - doorTop);
  if (open > 0.02) { // a ghost behind the door
    x.save(); x.beginPath(); x.rect(doorX, doorTop, doorW, floorY - doorTop); x.clip();
    x.fillStyle = C.deep; x.fillRect(doorX, doorTop, doorW, floorY - doorTop);
    x.save(); x.translate(doorX + doorW * 0.55, floorY - 80 + Math.sin(now * 3) * 4); drawGhost(x, 58, { tag: !!S.up.tags, lantern: !!S.up.lantern, look: -1, alpha: Math.min(1, open * 1.5) }); x.restore();
    x.restore();
  }
  const dw = doorW * (1 - open * 0.75);
  x.fillStyle = C.wood2; x.fillRect(doorX, doorTop, dw, floorY - doorTop); ink(x, 3); x.strokeRect(doorX, doorTop, dw, floorY - doorTop);
  if (dw > 40) {
    x.fillStyle = C.wood;
    for (const [py, ph] of [[0.08, 0.36], [0.52, 0.4]]) { x.fillRect(doorX + dw * 0.14, doorTop + (floorY - doorTop) * py, dw * 0.72, (floorY - doorTop) * ph); x.strokeRect(doorX + dw * 0.14, doorTop + (floorY - doorTop) * py, dw * 0.72, (floorY - doorTop) * ph); }
    x.fillStyle = C.gold; x.beginPath(); x.arc(doorX + dw * 0.86, doorTop + (floorY - doorTop) * 0.5, 6, 0, 7); x.fill(); x.stroke();
    if (S.up.cards) { x.save(); x.translate(doorX + dw * 0.5, doorTop + (floorY - doorTop) * 0.47); x.rotate(0.12); x.fillStyle = C.paper; x.fillRect(-22, -9, 44, 22); ink(x, 2); x.strokeRect(-22, -9, 44, 22);
      text(x, 'THE LEDGER', 0, -1, { size: 7, weight: 700 }); text(x, 'says Yes', 0, 7, { size: 6, color: C.red }); x.restore(); }
  }
  // the plaque over the door: the room, as Cornelius has it, corrected in red pencil
  x.fillStyle = C.sand; x.fillRect(doorX - 6, doorTop - 40, doorW + 12, 24); ink(x, 2.5); x.strokeRect(doorX - 6, doorTop - 40, doorW + 12, 24);
  text(x, ending ? 'THE CELLAR' : room.name.toUpperCase(), doorX + doorW / 2, doorTop - 28, { size: 15, font: 'Bangers', weight: 400, color: S.open > 1 && !ending ? C.red : C.ink });
  // lantern beside the door
  if (S.up.lantern && SP.lantern) { const lx = doorX + doorW + 22; ink(x, 2); x.beginPath(); x.moveTo(lx, 0); x.lineTo(lx, doorTop + 20); x.stroke(); x.drawImage(SP.lantern, lx - 16, doorTop + 18, 32, 32);
    x.fillStyle = C.lemon; x.globalAlpha = 0.18 + pulse * 0.08; x.beginPath(); x.arc(lx, doorTop + 36, 34, 0, 7); x.fill(); x.globalAlpha = 1; }
  // the WELCOME mat (LEAVE, from inside)
  if (S.up.mat) {
    const mx = doorX - 98, mw = 120;
    x.fillStyle = C.clay; x.beginPath(); x.moveTo(mx + 12, floorY + 4); x.lineTo(mx + mw - 12, floorY + 4); x.lineTo(mx + mw, floorY + 26); x.lineTo(mx, floorY + 26); x.closePath(); x.fill(); ink(x, 2); x.stroke();
    text(x, 'WELCOME', mx + mw / 2, floorY + 19, { size: 12, font: 'Bangers', weight: 400, color: C.ink });
    x.save(); x.translate(mx + mw / 2, floorY + 9); x.rotate(Math.PI); text(x, 'LEAVE', 0, 0, { size: 8, font: 'Bangers', weight: 400, color: C.berry }); x.restore();
  }
  // the ledger: leans into the door and knocks with its cover
  const lx = doorX - 46, tilt = ending ? 0 : swing * 0.32 + pulse * 0.02;
  x.save(); x.translate(lx, floorY + 6 - (S.up.mat ? 4 : 0));
  drawLedger(x, narrow ? 104 : 112, { tilt, cosy: !!S.up.cosy, brass: !!S.up.brass, lion: !!S.up.lion, red: !!S.up.ink, blink: (now % 4) < 0.12, mouth: swing });
  x.restore();
  // the knock bursts at the door
  for (const f of flash) {
    const k = Math.min(1, f.t * 8), a = 1 - Math.max(0, f.t - 0.35) / 0.25;
    x.save(); x.globalAlpha = Math.max(0, a); x.translate(doorX + 30, doorTop + 60 - f.t * 30); x.rotate(f.rot); x.scale(k, k);
    starburst(x, 0, 0, f.big ? 46 : 36, 11, f.big ? C.lemon : C.paper);
    text(x, f.text, 0, -4, { size: f.big ? 19 : 18, font: 'Bangers', weight: 400, color: C.red, stroke: C.ink, sw: 1.5 });
    text(x, `+${fmtN(f.v)}`, 0, 14, { size: 12, weight: 700, color: C.ink });
    x.restore();
  }
  if (!ending && !S.balanced) drawLane(x, W, narrow, doorX, b);

  }
  doorOpen = Math.max(0, doorOpen - dt * 0.7);
  if (E.balanceShown(S) && !S.balanceSaid) { S.balanceSaid = true; sfx.unlock(); say('ELEVEN CUPS', `Every room on the map is empty, and the dresser still has eleven empty hooks. The ledger checks its pages. All eleven were lent to the same borrower, on eleven different dates: "C.". Cornelius is very interested in the ceiling.`); }
}
function startFinale() {
  S.finishedAt ??= S.time;
  sfx.finale();
  say('PAID IN FULL', 'The ledger pays every ghost back, a knock each and more, and closes every account but one. Then it turns to the last page, and holds it up to the map.');
  const steps = [
    [2400, () => say('C. OWES', `${S.owed} right turns, in red, five to a gate. Cornelius reads it, upside down, then the right way up. A map's whole job is being right. He pays.`)],
    [5200, () => { if (!S.cellar) { S.cellar = E.CELLAR; S.home += E.CELLAR; } say('THE CELLAR', 'He draws it in, with a steady hand, the room he never drew: the Cellar, under the Scullery. Eleven cups on a shelf, every one marked "C.". The first one is cup No. 1, lent in 1887, to Cornelius Cobwell, who drew the house, and couldn\'t bear to leave it.'); }],
    [8400, () => end(false)],
  ];
  for (const [ms, fn] of steps) setTimeout(fn, ms);
  save();
}

// ---------- Input ----------
const doorP = $('doorP');
doorP.addEventListener('pointerdown', e => { e.preventDefault(); tryKnock(); });
addEventListener('keydown', e => {
  if (e.repeat) return;
  if ((e.code === 'Space' || e.code === 'Enter') && (e.target === document.body || e.target === doorP)) { e.preventDefault(); tryKnock(); }
});

// ---------- Offline ----------
function welcomeBack() {
  if (!S.lastSeen || S.ended || S.balanced || !S.started) return;
  const away = (Date.now() - S.lastSeen) / 1000;
  if (away < 60) return;
  const r = E.offline(S, away, rng);
  if (!r.cups && !r.wrong && r.knocks < 1) return;
  const h = Math.floor(r.secs / 3600), m = Math.floor(r.secs % 3600 / 60);
  const el = $('away'); el.hidden = false;
  el.innerHTML = '<b>WHILE YOU WERE AWAY</b><span></span><br><button class="btn" type="button">Back to the door</button>';
  el.querySelector('span').textContent = `${h ? `${h}h ` : ''}${m}m away${away > E.OFFLINE_CAP ? ' (the ghosts stop at 8 hours)' : ''}. ` +
    `The ghosts carried on at half pace and brought home ${r.cups} cup${r.cups === 1 ? '' : 's'} (${S.home} on the dresser). Cornelius sent them wrong ${r.wrong} times; it's all written down.` +
    (r.knocks >= 1 ? ` The hands knocked ${Math.floor(r.knocks)} times. Nobody was holding the pen, so the column only filled to ${E.OFFLINE_KNOCKS}.` : '') +
    (E.target(S) < 0 ? ' Every open room is empty now: correct the map.' : '');
  el.querySelector('button').addEventListener('click', () => { el.hidden = true; });
  save();
}

// ---------- The end ----------
function end(resumed) {
  const first = !S.ended;
  S.ended = true; E.finishWorld(S);
  save(); hideTip(true);
  const mins = Math.max(1, Math.round((S.finishedAt || S.time || 0) / 60));
  const story = [
    'Every one of the 99 cups is home, on its hook, and the ledger has written "returned" next to every loan it ever made, in red.',
    `Cornelius paid ${S.owed ? `his ${S.owed} right turns` : 'every right turn he owed'}, and then, because a map pays its debts with interest, he kept on paying: he redrew himself true, room by room, in a steady hand. The Parlour is a parlour. North is up. There is one staircase. He has signed the Cellar.`,
    'He kept the cups, he says, because people only knock when they want something back, and nobody had knocked on Cobwell House in a hundred years. Then the ledger came knocking, in time, every day.',
    'He is on the ledger\'s side now. When a ghost asks to borrow a cup, and they still do, and the ledger still says yes, Cornelius tells it exactly where the cup will be.',
  ];
  $('story').replaceChildren(...story.map(s => { const p = document.createElement('p'); p.textContent = s; return p; }));
  $('ending').hidden = false; $('col').hidden = true; $('fixBtn').hidden = true;
  renderHud(); music && music.update();
  say('PAID IN FULL', 'Every cup is home, and Cornelius is on the ledger\'s side. The ghosts still knock, now and then, to borrow a cup. The ledger still says yes.');
  if (!resumed && first && window.DailyGame) {
    const h = Math.floor(mins / 60), mm = mins % 60;
    DailyGame.finish({ lines: [
      `📒 Knock on Wood: 99/99 cups home`,
      `⏱ ${h ? `${h}h ` : ''}${mm}m of knocking`,
      `🗺️ Cornelius owed ${S.owed} right turns`,
      `🙋 said yes ${S.lends} time${S.lends === 1 ? '' : 's'}`,
    ] });
  }
  if (!resumed) $('ending').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
}
$('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());

// ---------- Start ----------
fit(); addEventListener('resize', () => { fit(); handCache = null; });
setInterval(() => {
  const now = performance.now(), dt = Math.min(1, (now - (tick.t || now)) / 1000); tick.t = now;
  if (!S.ended && !S.balanced && S.started) tick(dt);
  renderHud(); renderShop(); refreshTip();
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
}, 100);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { welcomeBack(); } });
addEventListener('pagehide', save);
makeSprites().then(() => {
  if (Sprites.sheetRequested()) Sprites.showSheet();
  if (S.ended) end(true);
  else if (S.balanced) startFinale();
  else {
    welcomeBack();
    if (S.lastLog) say(...S.lastLog);
    else say('COBWELL HOUSE', 'The ledger of Cobwell House can\'t say no, so over 140 years it lent every one of the house\'s 99 teacups to whoever asked, mostly the dead. Cornelius, the house map, has dared it to get them all back. It couldn\'t say no to that either. Knock on the door, in time.');
  }
  renderHud(); renderShop();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>

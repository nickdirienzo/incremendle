<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import * as FX from '/shared/kit/fx.mjs';

const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG = location.search.includes('debug');
// Island Joy 16
const C = {
  white: '#ffffff', mint: '#6df7c1', teal: '#11adc1', slate: '#606c81', night: '#393457', green: '#1e8875', leaf: '#5bb361', lime: '#a1e55a',
  yellow: '#f7e476', orange: '#f99252', rose: '#cb4d68', plum: '#6a3771', mag: '#c92464', pink: '#f48cb6', peach: '#f7b69e', khaki: '#9b9c82',
};
const SHADOW = 'rgba(26,20,40,0.38)';

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:36:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
const save = () => { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound: D minor pentatonic (D F G A C), the gamelan's scale ----------
const A = createAudio({ sfxTrim: 1, musicTrim: 4.8 });
// Per-effect levels, measured with npm run mix (each peaks near -10 dBFS; the hatch clink, desk catches and stamps sit a little under).
const LV = { arrive: 4, jar: 6, mat: 4.17, pick: 6.17, wrong: 4.95, place: 3.39, turn: 4.3, catch: 5.8, swap: 7.08, stamp: 4.5, bonk: 2.8, suspend: 3.55, buy: 2.0, unlock: 5.9, deny: 8.3, kind: 2.79, jingle: 4.6, talk: 1.86, finale: 1.46 };
let gainNow = 1;
const T = o => A.tone({ ...o, vol: o.vol * gainNow });
const N = (kind, o = {}) => A.noiseHit(kind, { ...o, vol: (o.vol ?? 0.25) * gainNow });
const notes = scale('minor pentatonic', 62);
const rl = {};
const limit = (k, ms) => { const t = performance.now(); if (t - (rl[k] || 0) < ms && !DEBUG) return false; rl[k] = t; return true; };
const sfx = {
  // A marble clinks through the hatch.
  arrive() { if (!limit('arrive', 140)) return; T({ type: 'bell', freq: notes(8 + Math.floor(Math.random() * 3)), dur: 0.03, vol: 0.035, cutoff: 3400 }); },
  // Into its own jar: a glassy plink, higher for fancier marbles.
  jar(k = 0) { if (!limit('jar', 70)) return; T({ type: 'pluck', freq: notes(5 + k * 2 + Math.floor(Math.random() * 2)), dur: 0.08, vol: 0.12, cutoff: 3600 }); },
  // Onto the mat: a soft bump on the rug.
  mat() { if (!limit('mat', 120)) return; T({ type: 'triangle', freq: notes(-2), dur: 0.08, vol: 0.12, glide: 0.7, cutoff: 900 }); },
  // Picked up by hand.
  pick() { T({ type: 'sine', freq: notes(7), dur: 0.04, vol: 0.08 }); },
  // The wrong jar: the marble hops back out.
  wrong() { T({ type: 'triangle', freq: notes(1), dur: 0.06, vol: 0.1, glide: 1.3, cutoff: 1400 }); T({ type: 'triangle', freq: notes(0), dur: 0.08, vol: 0.08, at: A.now + 0.07, cutoff: 1200 }); },
  // A piece put down on the floor: a cardboard knock.
  place() { T({ type: 'pluck', freq: notes(-3), dur: 0.08, vol: 0.16, cutoff: 1800 }); N('snare', { vol: 0.03, dur: 0.04 }); },
  // A piece turned round.
  turn() { T({ type: 'pluck', freq: notes(3), dur: 0.05, vol: 0.1, cutoff: 2400 }); },
  // A desk catches a marble.
  catch(n = 1) { if (!limit('catch', 90)) return; T({ type: 'sine', freq: notes(2 + n), dur: 0.05, vol: 0.06 }); },
  // Live on air: a little bonang flourish.
  swap(k = 0) { if (!limit('swap', 160)) return; const t0 = A.now; [0, 2, 4].forEach((d, i) => T({ type: 'bell', freq: notes(5 + k * 2 + d), dur: 0.1, vol: 0.05, at: t0 + i * 0.07 })); T({ type: 'sine', freq: notes(-5 + k), dur: 0.5, vol: 0.06, at: t0 + 0.2 }); },
  // Mrs. Pettigrew stamps a form: a padded thump.
  stamp() { if (!limit('stamp', 150)) return; T({ type: 'sine', freq: notes(-5), dur: 0.08, vol: 0.1, glide: 0.6 }); N('snare', { vol: 0.02, dur: 0.04 }); },
  // Gamp stamps one itself (falls on it).
  bonk() { T({ type: 'sine', freq: notes(-5), dur: 0.12, vol: 0.12, glide: 0.6 }); T({ type: 'pluck', freq: notes(0), dur: 0.08, vol: 0.1 }); },
  // Swaps suspended: two low notes, sternly.
  suspend() { T({ type: 'triangle', freq: notes(0), dur: 0.2, vol: 0.12, cutoff: 900 }); T({ type: 'triangle', freq: notes(-2), dur: 0.35, vol: 0.12, at: A.now + 0.22, cutoff: 900 }); },
  // Dead air while Gamp builds, then the purchase chime.
  buy() { const t0 = A.now; N('whoosh', { vol: 0.03, dur: 0.18, at: t0 }); [0, 2, 4].forEach((d, i) => T({ type: 'keys', freq: notes(d + 5), dur: 0.09, vol: 0.08, at: t0 + 0.12 + i * 0.07 })); },
  unlock() { T({ type: 'bell', freq: notes(9), dur: 0.25, vol: 0.06 }); T({ type: 'bell', freq: notes(11), dur: 0.35, vol: 0.05, at: A.now + 0.12 }); },
  deny() { T({ type: 'square', freq: notes(-3), dur: 0.06, vol: 0.04, cutoff: 700 }); },
  // A new kind of marble turns up: a gong and a run.
  kind() { const t0 = A.now; T({ type: 'sine', freq: notes(-10), dur: 1.6, vol: 0.12, at: t0 }); [5, 6, 7, 8, 9].forEach((d, i) => T({ type: 'bell', freq: notes(d), dur: 0.14, vol: 0.05, at: t0 + 0.1 + i * 0.08 })); },
  // The Recorder plays the station jingle.
  jingle() { const t0 = A.now; [5, 6, 7, 6, 5, 8].forEach((d, i) => T({ type: 'triangle', freq: notes(d), dur: i === 5 ? 0.5 : 0.16, vol: 0.09, attack: 0.03, at: t0 + i * 0.18, cutoff: 2200 })); },
  // Someone talks Gamp out of it.
  talk(i = 0) { const t0 = A.now; [0, 2, 4].forEach(d => T({ type: 'keys', freq: notes(d + i), dur: 0.5, vol: 0.05, at: t0 })); T({ type: 'bell', freq: notes(7 + i), dur: 0.3, vol: 0.05, at: t0 + 0.25 }); },
  // The finale: the whole cupboard comes on air.
  finale() {
    const t0 = A.now;
    T({ type: 'sine', freq: notes(-10), dur: 2.5, vol: 0.14, at: t0 });
    for (let i = 0; i < 11; i++) T({ type: 'bell', freq: notes(i), dur: 0.25, vol: 0.045, at: t0 + 0.2 + i * 0.11 });
    [[0, 2, 4], [1, 3, 5], [0, 2, 4, 7]].forEach((ch, k) => ch.forEach(d => T({ type: 'keys', freq: notes(d), dur: 1.1, vol: 0.04, at: t0 + 1.6 + k * 1.1 })));
    [5, 6, 7, 6, 5, 8].forEach((d, i) => T({ type: 'triangle', freq: notes(d + 5), dur: 0.16, vol: 0.06, attack: 0.03, at: t0 + 5 + i * 0.18, cutoff: 2600 }));
    T({ type: 'sine', freq: notes(-10), dur: 3, vol: 0.12, at: t0 + 6.2 });
  },
};
for (const [name, f] of Object.entries(sfx)) sfx[name] = (...a) => { gainNow = LV[name] ?? 1; try { f(...a); } finally { gainNow = 1; } };
if (DEBUG) window.__game = { A, sfx, long: ['finale', 'jingle', 'kind'], S: () => S, E };

// ---------- Music ----------
const phaseKey = () => S.ended || S.talk > 0 || E.done(S) ? 'end' : S.record >= 200 ? 'rush' : S.own.desk > 0 ? 'run' : 'hand';
let music = null, soundtrack = null, makeSoundtrack = null;

function drawGamp(x, cx, top, bottom, o = {}) {
  const h = bottom - top;
  // the metal tip (the aerial), then the furled canopy, widest low down
  cutRect(x, cx - 2, top - 26, 4, 30, C.slate, 500, 2);

    cutCircle(x, cx + 7, fy, 7.5, C.night, 508, 1, 8);

// ---------- Input ----------
function canvasPoint(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
const inR = (px, py, R) => px >= R.x && px <= R.x + R.w && py >= R.y && py <= R.y + R.h;
function gridAt(px, py) { const c = Math.floor((px - GX) / CELL), r = Math.floor((py - GY) / CELL); return c >= 0 && c < E.COLS && r >= 0 && r < E.ROWS ? [c, r] : [-1, -1]; }
function jarAt(px, py) { if (py < JAR_Y - 10 || py > JAR_Y + JAR_H + 6) return -1; const c = Math.floor((px - GX) / CELL); return c >= 1 && c < E.COLS ? c : -1; }
function matAt(px, py) {
  if (py < MAT.y - 10 || py > MAT.y + MAT.h + 10) return -1;
  let best = -1, bd = 26;
  S.mat.forEach((_, i) => { const [mx, my] = matSlot(i); const d = Math.hypot(px - mx, py - my); if (d < bd) { bd = d; best = i; } });
  return best;
}
cv.addEventListener('pointerdown', e => {
  if (S.ended || E.done(S)) return;
  if (!S.started) { S.started = true; save(); }
  const [px, py] = canvasPoint(e);
  cv.setPointerCapture?.(e.pointerId);
  const mi = matAt(px, py);
  if (mi >= 0) { drag = { type: 'marble', idx: mi, x: px, y: py, sx: px, sy: py, moved: false }; sfx.pick(); return; }
  const jc = jarAt(px, py);
  if (jc >= 0 && selected >= 0) { tryJar(selected, jc); selected = -1; return; }
  if (inR(px, py, { x: TRAY.x, y: TRAY.y - 30, w: TRAY.w, h: TRAY.h + 50 }) && S.tray > 0) { stampByHand(); return; }
  for (const p of E.PIECES) if (inR(px, py, slotRect(SLOT(p.id))) && E.spare(S, p.id) > 0) {
    drag = { type: 'piece', t: p.id, g: p.id === 'ruler' ? { t: 'ruler', d: 1 } : { t: p.id, k: p.id === 'comb' ? 0 : 0, n: 0, busy: 0 }, x: px, y: py, sx: px, sy: py, moved: false }; return;
  }
  const [c, r] = gridAt(px, py);
  if (c >= 0 && S.grid[E.cell(c, r)]) { drag = { type: 'placed', from: [c, r], g: S.grid[E.cell(c, r)], x: px, y: py, sx: px, sy: py, moved: false }; return; }
  selected = -1;
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const [px, py] = canvasPoint(e);
  drag.x = px; drag.y = py;
  if (!drag.moved && Math.hypot(px - drag.sx, py - drag.sy) > 8) drag.moved = true;
});
cv.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  const [px, py] = canvasPoint(e);
  if (d.type === 'marble') {
    if (!d.moved) { selected = selected === d.idx ? -1 : d.idx; return; }
    const jc = jarAt(px, py);
    if (jc >= 0) tryJar(d.idx, jc); else selected = -1;
    return;
  }
  const [c, r] = gridAt(px, py);
  if (d.type === 'piece') {
    if (!d.moved) { say('THE TRAY', 'Drag a piece out of the tray and drop it on a square of the floor.'); return; }
    if (c >= 0 && E.place(S, d.t, c, r)) { sfx.place(); firstPlace(d.t); save(); } else sfx.deny();
    return;
  }
  if (d.type === 'placed') {
    const [c0, r0] = d.from;
    if (!d.moved || (c === c0 && r === r0)) { E.turn(S, c0, r0); sfx.turn(); explainTurn(S.grid[E.cell(c0, r0)]); save(); return; }
    if (c >= 0) { if (E.move(S, c0, r0, c, r)) sfx.place(); else sfx.deny(); }
    else { E.remove(S, c0, r0); sfx.turn(); once('removed', 'BACK IN THE TRAY', 'Dropped off the floor, a piece goes back in the tray for later.'); }
    save();
  }
});
cv.addEventListener('pointercancel', () => { drag = null; });
function tryJar(idx, col) {

      say('ON AIR', pick([`"${E.KINDS[k].name[0].toUpperCase() + E.KINDS[k].name.slice(1)}, found by ${pick(KIDS)} behind the climbing frame. Into the jar."`, `"You're listening to Radio Rummage, the only station broadcasting from under the coats."`, `"That's a ${E.KINDS[k].name}. Don't touch the dial."`]));
  } else if (ev === false) {

    if (!E.kindOpen(S, col - 1)) say('NOT YET', `Nobody's found a ${E.KINDS[col - 1].name} yet. That jar opens when the record reaches ${E.OPEN_AT[col - 1]}.`);

}

}
$('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());

// ---------- Start ----------
fit(); addEventListener('resize', fit);
document.fonts?.ready.then(() => { staticSig = ''; });
makeSprites().then(() => {
  if (Sprites.sheetRequested()) Sprites.showSheet();
  if (S.ended) end(true);
  else if (S.lastLog) say(S.lastLog[0], S.lastLog[1]);
  else say('RADIO RUMMAGE', 'Gamp the umbrella lost a bet and has to keep shut until the whole school knows its name. It said nothing about radio. Marbles drop through the Lost Property hatch: drag each one into its own jar to read it out on air.');
  if (E.done(S) && !S.ended) { finaleSaid = true; renderTalk(); }
  lastPhase = phaseKey() + (S.up.recorder ? '+r' : '');
  renderHud(); renderShop();
  requestAnimationFrame(t0 => { lastFrame = t0; requestAnimationFrame(frame); });
});
cv.addEventListener('pointerdown', () => { if (!S.started && !S.ended) { S.started = true; save(); } }, { capture: true });
</script>

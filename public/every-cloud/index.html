  :root {

  }

<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const fmt = E.fmt;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG = location.search.includes('debug');
const C = { ink: '#2c1b2e', navy: '#2f2b5c', violet: '#4b3b9c', blue: '#457cd6', mint: '#8fcccb', teal: '#449489', deep: '#285763',
  cream: '#fff4e0', gold: '#f2b63d', orange: '#d46e33', red: '#e34262', wine: '#94353d', plum: '#57253b', mauve: '#9c656c',
  tan: '#d1b48c', olive: '#b4ba47', green: '#6d8c32' };

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:30:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
const save = () => { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound: D phrygian, the soundtrack's key (D Eb F G A Bb C; the Eb is the colour) ----------
const A = createAudio({ sfxTrim: 4, musicTrim: 5.6 });
// Per-effect levels, from npm run mix (each effect peaking near -10 dBFS).
const LV = { paint: 3, tea: 2.6, win: 0.4, unlock: 1.5, deny: 1.4, go: 1.6, big: 2, finale: 1.1 };
let gainNow = 1;
const T = o => A.tone({ ...o, vol: o.vol * gainNow });
const N = (kind, o = {}) => A.noiseHit(kind, { ...o, vol: (o.vol ?? 0.25) * gainNow });
const notes = scale('phrygian', 62);   // D4 Eb F G A Bb C
const rl = {};
const limit = (k, ms) => { const t = performance.now(); if (t - (rl[k] || 0) < ms && !DEBUG) return false; rl[k] = t; return true; };
const sfx = {
  // Scratching the lining: a soft papery hiss, and a glassy note that climbs as the cloud clears.
  scratch(frac = 0) {
    if (!limit('scratch', 90)) return;
    N('shaker', { vol: 0.05, dur: 0.06 });
    if (limit('scratchNote', 260)) T({ type: 'pluck', freq: notes(Math.floor(frac * 7) + 7), dur: 0.05, vol: 0.05, cutoff: 3600 });
  },
  // A clean release: D F A, and a drip.
  release() { [0, 2, 4].forEach((d, i) => T({ type: 'bell', freq: notes(d + 7), dur: 0.18, vol: 0.07, at: A.now + i * 0.06 })); T({ type: 'sine', freq: notes(11), dur: 0.08, vol: 0.06, glide: 0.5, at: A.now + 0.2 }); },
  // Houston releases one on her own: smaller, lower, further off.
  hers() { if (!limit('hers', 400)) return; T({ type: 'pluck', freq: notes(4), dur: 0.08, vol: 0.07, cutoff: 2400 }); T({ type: 'sine', freq: notes(9), dur: 0.06, vol: 0.04, glide: 0.5, at: A.now + 0.09 }); },
  // Hail: a clatter on the roof, then a bright chime.
  hail() { const t0 = A.now; for (let i = 0; i < 7; i++) N('hat', { vol: 0.12, dur: 0.03, at: t0 + i * 0.045 + Math.random() * 0.02 }); [7, 9, 11, 14].forEach((d, i) => T({ type: 'bell', freq: notes(d + 7), dur: 0.2, vol: 0.06, at: t0 + 0.3 + i * 0.07 })); },
  // A lost thing: four notes leaning on the Eb.
  find() { [0, 1, 4, 7].forEach((d, i) => T({ type: 'bell', freq: notes(d + 7), dur: 0.3, vol: 0.07, at: A.now + i * 0.13 })); },
  // The cook's brush.
  paint() { if (!limit('paint', 600)) return; N('whoosh', { vol: 0.03, dur: 0.35 }); },
  // Watering Houston: a glug and a leafy rustle.
  water() { T({ type: 'sine', freq: notes(2), dur: 0.12, vol: 0.1, glide: 0.7 }); T({ type: 'sine', freq: notes(0), dur: 0.12, vol: 0.08, glide: 0.7, at: A.now + 0.1 }); N('shaker', { vol: 0.06, dur: 0.2, at: A.now + 0.2 }); T({ type: 'pluck', freq: notes(11), dur: 0.1, vol: 0.06, at: A.now + 0.26 }); },
  buy() { [0, 2, 4, 6, 7].forEach((d, i) => T({ type: 'pluck', freq: notes(d + 7), dur: 0.09, vol: 0.09, at: A.now + i * 0.05, cutoff: 3400 })); },
  unlock() { T({ type: 'bell', freq: notes(11), dur: 0.25, vol: 0.07 }); T({ type: 'bell', freq: notes(14), dur: 0.35, vol: 0.06, at: A.now + 0.12 }); },
  deny() { T({ type: 'triangle', freq: notes(-3), dur: 0.08, vol: 0.09 }); },
  tea() { T({ type: 'sine', freq: notes(14), dur: 0.3, vol: 0.04, glide: 1.06 }); },
  // Mission control: three countdown beeps and a go.
  go() { const t0 = A.now; [0, 0, 0].forEach((d, i) => T({ type: 'sine', freq: notes(7), dur: 0.08, vol: 0.08, at: t0 + i * 0.35 })); T({ type: 'sine', freq: notes(11), dur: 0.3, vol: 0.09, at: t0 + 1.05 }); },
  win() { const t0 = A.now; [0, 2, 4, 7, 9, 11, 14].forEach((d, i) => T({ type: 'pluck', freq: notes(d + 7), dur: 0.12, vol: 0.08, at: t0 + i * 0.07 })); [[0, 4, 7]].forEach(ch => ch.forEach(d => T({ type: 'keys', freq: notes(d + 7), dur: 0.8, vol: 0.05, at: t0 + 0.55 }))); },
  fail() { [4, 2, 1, 0].forEach((d, i) => T({ type: 'triangle', freq: notes(d + 7), dur: 0.14, vol: 0.07, cutoff: 1800, at: A.now + i * 0.12 })); },
  // The hold: a soft low pulse, each second.
  tick() { T({ type: 'sine', freq: notes(-7), dur: 0.09, vol: 0.12 }); },
  // The Big One rolls in.
  big() { const t0 = A.now; N('whoosh', { vol: 0.06, dur: 1.6, at: t0 }); [[1, 3, 5], [0, 2, 4]].forEach((ch, k) => ch.forEach(d => T({ type: 'pad', freq: notes(d), dur: 1.1, vol: 0.03, attack: 0.3, at: t0 + 0.4 + k * 1.1 }))); },
  // The end: Eb to D (the phrygian cadence), and the stars.
  finale() {
    const t0 = A.now;
    [[1, 3, 5, 8], [0, 2, 4, 7]].forEach((ch, k) => ch.forEach(d => T({ type: 'pad', freq: notes(d), dur: 1.4, vol: 0.035, attack: 0.25, at: t0 + k * 1.4 })));
    [7, 9, 11, 14, 16].forEach((d, i) => T({ type: 'bell', freq: notes(d + 7), dur: 0.5, vol: 0.05, at: t0 + 2.6 + i * 0.18 }));
  },
};
for (const [name, f] of Object.entries(sfx)) sfx[name] = (...a) => { gainNow = LV[name] ?? 1; try { f(...a); } finally { gainNow = 1; } };
if (DEBUG) window.__game = { A, sfx, long: ['finale', 'big', 'win', 'go'], S: () => S, E };

// ---------- Music ----------
let music = null, soundtrack = null;
let M = null;            // the mission in progress (not saved: a reload stands it down)
const phaseKey = () => S.ended ? 'end' : S.hold != null ? 'hold' : M ? 'mission' : 'sky';
function song() { return (soundtrack ??= createSoundtrack(music.strudel))(phaseKey()); }
createMusic(A, { song }).then(m => { music = m; music.update(); if (DEBUG) window.__game.music = m; }).catch(e => console.warn('music', e));
const refreshMusic = () => { if (music) music.update(); };

// ---------- Canvas, geometry ----------
const W = 720, H = 660;
const cv = $('stage');
let g = cv.getContext('2d');
let clock = 0;
// The diorama: a slab of hilltop in isometric. u runs to the lower right, v to the lower left.
const ISO = { cx: 360, cy: 548, hw: 196, hh: 98, side: 30 };
const iso = (u, v, z = 0) => [ISO.cx + (u - v) * ISO.hw, ISO.cy - ISO.hh + (u + v) * ISO.hh - z];
// Houston's height on screen: a diorama, not to scale.
const ALT_Y = [[0, 404], [150, 318], [300, 240], [450, 165], [600, 108]];
function yOfAlt(a) {
  for (let i = 1; i < ALT_Y.length; i++) if (a <= ALT_Y[i][0]) { const [a0, y0] = ALT_Y[i - 1], [a1, y1] = ALT_Y[i]; return y0 + (y1 - y0) * (a - a0) / (a1 - a0); }
  return ALT_Y[ALT_Y.length - 1][1];
}
const LAYER_Y = [362, 283, 205, 130];
const BIG = { x: 165, y: 12, w: 430, h: 80 };

// Seeded noise, for stars and dents.
let seedN = 1;
const srand = () => { seedN = (seedN * 16807) % 2147483647; return seedN / 2147483647; };
const STARS = []; seedN = 7; for (let i = 0; i < 70; i++) STARS.push([srand() * W, srand() * 400, srand() < 0.15 ? 1.6 : 0.9, srand() * 6]);
const DENTS = []; seedN = 11; for (let i = 0; i < 40; i++) DENTS.push([0.05 + srand() * 0.9, 0.1 + srand() * 0.8]);

// ---------- Drawing helpers ----------
function poly(pts, fill, stroke = C.ink, lw = 1.2) {
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.lineJoin = 'round'; g.stroke(); }
}
function isoBox(u, v, du, dv, z, h, top, left, right) {
  const p = (a, b, zz) => iso(a, b, zz);
  poly([p(u, v + dv, z + h), p(u + du, v + dv, z + h), p(u + du, v + dv, z), p(u, v + dv, z)], left);
  poly([p(u + du, v, z + h), p(u + du, v + dv, z + h), p(u + du, v + dv, z), p(u + du, v, z)], right);
  poly([p(u, v, z + h), p(u + du, v, z + h), p(u + du, v + dv, z + h), p(u, v + dv, z + h)], top);
}
function circle(x, y, r, fill, stroke = null, lw = 1.2) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }

  g.font = `${weight} ${size}px '${font}', system-ui, sans-serif`; g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText(s, x, y);
}

// ---------- Sky ----------
function drawSky() {
  const gr = g.createLinearGradient(0, 0, 0, 470);
  gr.addColorStop(0, C.ink); gr.addColorStop(0.55, C.navy); gr.addColorStop(1, C.violet);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (const [x, y, r, ph] of STARS) { g.globalAlpha = 0.45 + 0.35 * Math.sin(clock * 0.8 + ph); circle(x, y, r, C.cream); }
  g.globalAlpha = 1;
  drawMoon(650, 58, S.ended ? 26 : 20);
  // The altimeter, down the right edge.
  g.globalAlpha = 0.55;
  for (let a = 100; a <= 600; a += 100) { const y = yOfAlt(a); line([[W - 14, y], [W - 4, y]], C.mint, 1); text(`${a}`, W - 18, y, 10, C.mint, 'right', 'Space Mono', 400); }
  g.globalAlpha = 1;
  // Layer names, on the left: lit if in reach.
  E.LAYERS.forEach((L, i) => {
    const inReach = E.height(S) >= L.reach || S.ended;
    g.globalAlpha = inReach ? 0.55 : 0.25;
    text(L.short.toUpperCase(), 8, LAYER_Y[i] - 34, 9, inReach ? C.mint : C.mauve, 'left', 'Space Mono', 400);
  });
  g.globalAlpha = 1;
}
// A waxing gibbous moon, 87% lit (the night of 21 November), lit on the right.
function drawMoon(x, y, r) {
  const glow = g.createRadialGradient(x, y, r * 0.5, x, y, r * 3.2);
  glow.addColorStop(0, '#fff4e033'); glow.addColorStop(1, '#fff4e000');
  g.fillStyle = glow; g.fillRect(x - r * 3.3, y - r * 3.3, r * 6.6, r * 6.6);
  circle(x, y, r, C.cream);
  const k = 0.87, rx = r * (2 * k - 1);
  g.beginPath(); g.arc(x, y, r, Math.PI / 2, Math.PI * 1.5); g.ellipse(x, y, rx, r, 0, Math.PI * 1.5, Math.PI / 2, true); g.closePath();
  g.fillStyle = '#4b3b9ccc'; g.fill();
  circle(x + r * 0.3, y - r * 0.25, r * 0.16, '#d1b48c66'); circle(x + r * 0.05, y + r * 0.35, r * 0.12, '#d1b48c66');
}

// ---------- The diorama ----------
function drawSlab() {
  const { side } = ISO;
  const L = iso(0, 1), R = iso(1, 0), B = iso(1, 1), Tp = iso(0, 0);
  // Sides: turf, soil, rock.
  poly([L, B, [B[0], B[1] + side], [L[0], L[1] + side]], C.plum);
  poly([B, R, [R[0], R[1] + side], [B[0], B[1] + side]], C.ink);
  poly([L, B, [B[0], B[1] + 7], [L[0], L[1] + 7]], C.green, null);
  poly([B, R, [R[0], R[1] + 7], [B[0], B[1] + 7]], '#4f6a26', null);
  g.globalAlpha = 0.5; line([[L[0], L[1] + 18], [B[0], B[1] + 18]], C.wine, 2); line([[B[0], B[1] + 18], [R[0], R[1] + 18]], C.plum, 2); g.globalAlpha = 1;
  // The top: grass, with a checker of lighter turf.
  poly([Tp, R, B, L], C.green);
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) if ((i + j) % 2 === 0) poly([iso(i / 8, j / 8), iso((i + 1) / 8, j / 8), iso((i + 1) / 8, (j + 1) / 8), iso(i / 8, (j + 1) / 8)], '#7a9a36', null);
  poly([Tp, R, B, L], null, C.ink, 1.5);
  // The path from the door to Houston's bed.
  for (let i = 0; i < 5; i++) { const [x, y] = iso(0.5 + i * 0.035, 0.3 + i * 0.065); g.beginPath(); g.ellipse(x, y, 7, 3.5, 0, 0, Math.PI * 2); g.fillStyle = C.tan; g.fill(); }
}
function drawHut() {

  isoBox(u, v, du, dv, 0, h, C.tan, C.mauve, C.plum);

  const w0 = iso(u + 0.1, v + dv, 16), w1 = iso(u + 0.2, v + dv, 16), w2 = iso(u + 0.2, v + dv, 34), w3 = iso(u + 0.1, v + dv, 34);

  line([[(w0[0] + w1[0]) / 2, (w0[1] + w1[1]) / 2], [(w2[0] + w3[0]) / 2, (w2[1] + w3[1]) / 2]], C.ink, 1.2);

  // Door on the right wall.
  const d = [iso(u + du, v + 0.1, 0), iso(u + du, v + 0.19, 0), iso(u + du, v + 0.19, 32), iso(u + du, v + 0.1, 32)];
  poly(d, C.wine);

  if (vis('patch')) { const [x, y] = iso(u + du, v + 0.145, 25); g.beginPath(); g.ellipse(x, y, 6, 7, -0.45, 0, Math.PI * 2); g.fillStyle = C.navy; g.fill(); g.strokeStyle = C.gold; g.lineWidth = 1.5; g.stroke(); circle(x - 1, y + 1, 2.2, C.cream); circle(x + 2, y - 2, 1.2, C.olive); }
  // Roof: back slope, front slope, gable.
  const e = 0.025, rh = 30;
  const pf0 = iso(u - e, v + dv + e, h), pf1 = iso(u + du + e, v + dv + e, h), r0 = iso(u - e, v + dv / 2, h + rh), r1 = iso(u + du + e, v + dv / 2, h + rh);
  const pb0 = iso(u - e, v - e, h), pb1 = iso(u + du + e, v - e, h);

    g.beginPath(); g.ellipse(x + 0.6, y + 0.5, 1.4, 0.8, -0.45, 0, Math.PI * 2); g.fillStyle = '#ff7a90'; g.fill();

  // The gutter.
  line([pf1, iso(u + du + e + 0.01, v + dv + e, h - 4)], C.ink, 2);
  // Radio on the sill.
  if (vis('radio')) { const [x, y] = iso(u + 0.13, v + dv + 0.015, 16); g.fillStyle = C.orange; g.fillRect(x - 6, y - 9, 12, 8); g.strokeStyle = C.ink; g.lineWidth = 1; g.strokeRect(x - 6, y - 9, 12, 8); circle(x - 2, y - 5, 2, C.tan); line([[x + 4, y - 9], [x + 9, y - 19]], C.ink, 0.8); if (!reduced && Math.sin(clock * 3) > 0.3) text('♪', x + 12, y - 16, 9, C.mint); }
  if (found('rock')) { const [x, y] = iso(u + 0.17, v + dv + 0.015, 16); g.globalAlpha = 0.5 + 0.3 * Math.sin(clock * 2); circle(x, y - 3, 7, '#f2b63d55'); g.globalAlpha = 1; circle(x, y - 3, 3.4, C.violet, C.ink, 1); circle(x - 1, y - 4, 1, C.gold); }
}
function drawCockerel(x, y) {
  line([[x, y], [x, y - 14]], C.ink, 1.5);
  const a = Math.sin(clock * 0.7) * 0.9;
  g.save(); g.translate(x, y - 16); g.scale(Math.cos(a) || 0.1, 1);
  poly([[-7, 0], [-2, -5], [3, -6], [5, -9], [7, -5], [5, -1], [8, 2], [-5, 2]], C.gold, C.ink, 1);

}

// Garden things, by place.
function drawGarden() {

  if (vis('loofah')) {
    const n = lvl('loofah');
    const a = iso(0.11, 0.39, 0), b = iso(0.11, 0.39, 52), c = iso(0.2, 0.39, 52), d = iso(0.2, 0.39, 0);
    for (let i = 0; i <= 3; i++) line([[a[0] + (d[0] - a[0]) * i / 3, a[1] + (d[1] - a[1]) * i / 3], [b[0] + (c[0] - b[0]) * i / 3, b[1] + (c[1] - b[1]) * i / 3]], C.tan, 1.2);
    for (let j = 1; j <= 3; j++) line([[a[0], a[1] - j * 15], [d[0], d[1] - j * 15]], C.tan, 1.2);
    for (let i = 0; i < 9; i++) { const t = i / 8; circle(a[0] + (d[0] - a[0]) * t + Math.sin(i) * 3, a[1] + (d[1] - a[1]) * t - 8 - (i * 17 % 40), 3.5, i % 2 ? C.green : C.olive); }
    for (let i = 0; i < n; i++) { const t = 0.2 + i * 0.3; const x = a[0] + (d[0] - a[0]) * t, y = a[1] + (d[1] - a[1]) * t - 18 - i * 6; g.beginPath(); g.ellipse(x, y, 3, 8, 0.1, 0, Math.PI * 2); g.fillStyle = C.olive; g.fill(); g.strokeStyle = C.ink; g.lineWidth = 1; g.stroke(); }

  for (let i = 0; i < lvl('butt'); i++) {
    const [x, y] = iso(...[[0.5, 0.03], [0.5, 0.095], [0.575, 0.03], [0.575, 0.095]][i], 0);
    g.beginPath(); g.ellipse(x, y - 8, 12, 9, 0, 0, Math.PI * 2); g.fillStyle = C.orange; g.fill(); g.strokeStyle = C.ink; g.lineWidth = 1.2; g.stroke();
    line([[x - 5, y - 15], [x - 6, y - 2]], C.wine, 1); line([[x + 5, y - 15], [x + 6, y - 2]], C.wine, 1);
    if (won('evap')) { g.beginPath(); g.ellipse(x, y - 16, 9, 3.4, 0, 0, Math.PI * 2); g.fillStyle = C.mauve; g.fill(); g.stroke(); circle(x, y - 18, 1.6, C.ink); }
    else { g.beginPath(); g.ellipse(x, y - 15, 6, 2.2, 0, 0, Math.PI * 2); g.fillStyle = C.blue; g.fill(); }
  }
  // Bamboo at the back corner: a clump per brush level.

    for (let k = 0; k < 3; k++) { const xx = x + k * 4 - 4, hh = 70 + k * 12 - i * 6; line([[xx, y], [xx + 2, y - hh]], C.olive, 2.5); for (let j = 1; j < 4; j++) line([[xx - 1, y - hh * j / 4], [xx + 3, y - hh * j / 4]], C.green, 1); line([[xx + 2, y - hh], [xx + 10, y - hh + 4]], C.green, 2); }

// Where the sunflower looks: a hail cloud if there is one, else the moon.
function shiny() {
  const h = clouds.find(c => c.state === 'lined' && c.prize?.hail);
  return h ? [h.x + h.w / 2, h.y + h.h / 2] : [650, 58];
}

// ---------- Houston ----------
function drawHouston(ty, { tendrilsOut = true } = {}) {
  const by = BASE.y;
  // The cane: lengths of bamboo, lashed.
  for (let y = by; y > ty + 6; y -= 34) { const y1 = Math.max(ty + 6, y - 34); line([[BASE.x - 2, y], [BASE.x - 2, y1]], C.tan, 3); line([[BASE.x - 5, y1 + 2], [BASE.x + 1, y1 + 2]], C.mauve, 1.6); }
  // The vine, twining round it.
  const pts = [];
  for (let y = by; y >= ty; y -= 3) pts.push([stalkX(y) + Math.sin(y * 0.16) * 4.5, y]);
  line(pts, C.ink, 4.4); line(pts, C.green, 2.6);
  // Leaves, flowers, pods.
  let k = 0;
  for (let y = by - 12; y > ty + 10; y -= 19, k++) {
    const side = k % 2 ? 1 : -1, x = stalkX(y) + side * 2, s = 1 - Math.max(0, (by - y) / 2400);
    leaf(x, y, side, s * (k % 3 === 0 ? 1.1 : 0.9));
    if (k % 3 === 1) { circle(x - side * 6, y - 3, 2.6, C.red); circle(x - side * 9, y, 2.2, C.red); circle(x - side * 6, y + 3, 2, C.wine); }
    if (k % 5 === 3) line([[x - side * 3, y + 2], [x - side * 6, y + 18]], C.olive, 2.6);
  }
  // Her tendrils, curled on the stalk while they wait for a cloud: one per level.
  const nt = S.ended ? 6 : S.lv.tendril;
  for (let i = 0; i < nt; i++) {
    const y = by - 40 - (by - ty - 60) * (i + 0.5) / Math.max(1, nt), x = stalkX(y), sd = i % 2 ? 1 : -1;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + sd * 10, y - 6, x + sd * 12, y - 12);
    g.arc(x + sd * 9, y - 12, 3, 0, Math.PI * 1.5, sd < 0); g.strokeStyle = C.olive; g.lineWidth = 1.4; g.stroke();
  }
  // The growing tip.
  const tx = stalkX(ty);
  line([[tx, ty + 4], [tx + 3, ty - 4], [tx + 7, ty - 5], [tx + 8, ty - 1], [tx + 5, ty]], C.green, 2);
  leaf(tx - 2, ty + 6, -1, 0.8);
  if (vis('hat')) drawHat(tx + 2, ty - 6);
  if (found('kite')) drawKite(tx, ty);
}
function leaf(x, y, side, s = 1) {
  g.save(); g.translate(x, y); g.scale(side * s, s);
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(6, -10, 16, -6); g.quadraticCurveTo(13, 3, 0, 0); g.fillStyle = C.green; g.fill(); g.strokeStyle = C.ink; g.lineWidth = 0.9; g.stroke();
  g.beginPath(); g.moveTo(2, -1); g.quadraticCurveTo(8, -6, 14, -5); g.strokeStyle = C.olive; g.lineWidth = 0.8; g.stroke();
  g.restore();
}
function drawHat(x, y) {
  g.fillStyle = C.cream; g.strokeStyle = C.ink; g.lineWidth = 1;

  }
  // Rain.
  for (const d of drops) { d.y += d.v * dt; d.life += dt; }
  for (let i = drops.length - 1; i >= 0; i--) if (drops[i].y > 480 || drops[i].life > 3) drops.splice(i, 1);
  for (const f of floats) { f.age += dt; f.y -= 18 * dt; }
  for (let i = floats.length - 1; i >= 0; i--) if (floats[i].age > 1.6) floats.splice(i, 1);
}

// ---------- Input: scratching ----------
let pointer = null, lastPt = null, playerCloud = null, pointerPos = [W / 2, 260];
function toScene(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
function start() {
  if (S.started || S.ended) return;
  S.started = true; save();
  say('KITCHEN', 'Kitchen to Houston. Lining’s on that one. Scratch it through, and let’s see what’s inside a cloud.');
}
function scratchAt(x0, y0, x1, y1) {
  if (S.ended || climb) return;
  const r = E.radius(S);
  let any = false;
  for (const c of clouds) {
    if (c.state !== 'lined' || !inReach(c)) continue;
    if (!hitTest(c, Math.min(x0, x1), Math.min(y0, y1), r + Math.abs(x1 - x0)) && !hitTest(c, x1, y1, r)) continue;
    const hit = scratchSeg(c, x0, y0, x1, y1, r);
    if (!hit) continue;
    any = true;
    if (c.kind === 'big') { bigHit(c); continue; }
    playerCloud = c;
    sfx.scratch(frac(c));
    if (frac(c) >= RELEASE_AT) releaseCloud(c, 'me');
  }
  if (any) lastScratch = clock;
}
// Scratching the Big One: it rains a little, and Houston slips back.
function bigHit(c) {
  sfx.scratch(0.2);
  if (clock - lastBigHit < 0.5) return;
  lastBigHit = clock;
  // The lining is thick: it heals over most of what you scratch.
  if (frac(c) > 0.3) { c.clear.fill(0); c.cleared = 0; lineIt(c); }
  const r = Math.round(15 * E.rainMult(S));
  S.rain += r; S.total += r;
  rainFrom(c, 14); float(`+${r} L`, pointerPos[0], pointerPos[1], C.mint, 16);
  if (S.hold != null) {
    S.hold = Math.min(E.HOLD_SECS, S.hold + 3);
    say('LOG', pick(['Contact with the Big One. It rains a little. Houston slips back. Hold.', 'That’s a scratch. +3 seconds. Kitchen, hands in pockets.', 'It rains. It’s lovely rain. Houston has slipped back a bit. Hold.']), 'l');
  }
  after(false);
}
cv.addEventListener('pointerdown', e => {
  start();
  pointer = e.pointerId; lastPt = toScene(e); pointerPos = lastPt;
  cv.setPointerCapture?.(e.pointerId);
  scratchAt(lastPt[0] - 1, lastPt[1], lastPt[0] + 1, lastPt[1]);
});
cv.addEventListener('pointermove', e => {
  const p = toScene(e); pointerPos = p;
  if (pointer !== e.pointerId || !lastPt) return;
  scratchAt(lastPt[0], lastPt[1], p[0], p[1]);
  lastPt = p;
});
const up = e => { if (pointer === e.pointerId) { pointer = null; lastPt = null; } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
// Keyboard: space or enter scratches the nearest lined cloud, one stroke across it.
let kbRow = 0;
cv.addEventListener('keydown', e => {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  e.preventDefault(); start();
  const c = clouds.filter(c => c.state === 'lined' && inReach(c) && c.kind !== 'big').sort((a, b) => b.x - a.x)[0];
  if (!c) return;
  kbRow = (kbRow + 1) % 3;
  const y = c.y + c.yb * (0.3 + kbRow * 0.25);
  scratchAt(c.x, y, c.x + c.w, y);
});

// ---------- Rendering ----------
function layout() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = Math.max(360, Math.round(r.width * dpr));
  if (cv.width !== w) { cv.width = w; cv.height = Math.round(w * H / W); }
}
function render() {
  const k = cv.width / W;
  g.setTransform(k, 0, 0, k, 0, 0);
  drawSky();
  for (const c of clouds) if (c.state === 'dim') drawCloud(c);
  drawSlab();
  drawHut();
  drawGarden();
  // Houston, and her top: during the hold she climbs; at the end she's out above the Big One.
  const big = bigCloud();
  let want = S.ended ? 26 : yOfAlt(E.height(S));
  if (S.hold != null && !S.ended) want = 108 - 40 * (1 - S.hold / E.HOLD_SECS);
  if (climb) want = 70 - 44 * Math.min(1, climb.t / 4);
  topY += (want - topY) * Math.min(1, 0.08);
  drawHouston(topY);
  for (const c of clouds) if (c.state !== 'dim' && c.kind !== 'big') drawCloud(c);
  if (big) drawCloud(big);
  if (S.ended) drawTopOut();
  drawTendrils();
  // The cook: in the basket, painting; on the ground for the hold and the end.
  if (S.hold != null || S.ended) { const [x, y] = iso(0.52, 0.34, 0); drawCook(x, y, { up: true, torch: won('dark') }); }
  else drawBasket(stalkX(topY + 40) - 20, topY + 40, paintTarget && paintTarget.state === 'painting' ? paintTarget : null);
  if (plane) { g.save(); g.translate(plane.x, plane.y); g.rotate(-0.2); poly([[-8, 0], [8, -3], [-2, 4]], C.cream, C.ink, 1); g.restore(); }
  else if (found('plane')) { const [x, y] = iso(0.44, 0.38, 46); poly([[x - 7, y - 2], [x + 7, y - 5], [x - 1, y + 1]], C.cream, C.ink, 1); }
  for (const d of drops) { if (d.hail) circle(d.x, d.y, 2, C.cream); else line([[d.x, d.y], [d.x - 1, d.y + 6]], C.mint, 1.3); }
  for (const f of floats) { g.globalAlpha = Math.max(0, 1 - f.age / 1.6); text(f.t, f.x, f.y, f.size, f.color); g.globalAlpha = 1; }
  // Missions: the moonless dark, and the clock.
  if (M) {
    if (M.id === 'dark') {
      g.save(); g.beginPath(); g.rect(0, 0, W, H); g.arc(pointerPos[0], pointerPos[1], 82, 0, Math.PI * 2, true); g.fillStyle = '#0d080fee'; g.fill('evenodd'); g.restore();
      const gr = g.createRadialGradient(pointerPos[0], pointerPos[1], 50, pointerPos[0], pointerPos[1], 84); gr.addColorStop(0, '#0000'); gr.addColorStop(1, '#0d080fee');
      g.fillStyle = gr; g.beginPath(); g.arc(pointerPos[0], pointerPos[1], 84, 0, Math.PI * 2); g.fill();
    }
    const left = Math.max(0, M.secs - Math.max(0, M.t));
    g.fillStyle = '#2c1b2ecc'; g.fillRect(W / 2 - 150, 10, 300, 30);
    text(M.t < 0 ? `MISSION ${E.MISSION[M.id].name.toUpperCase()} · STAND BY` : `${E.MISSION[M.id].name.toUpperCase()} · T-${Math.ceil(left)} · ${M.got}/${M.need}`, W / 2, 25, 15, M.t < 0 ? C.gold : C.mint);
  }
  if (S.hold != null && !S.ended && !climb) {
    g.fillStyle = '#2c1b2ecc'; g.fillRect(W / 2 - 110, 112, 220, 30);
    const paused = clock - lastScratch <= 0.6;
    text(paused ? `HOLD · T-${Math.ceil(S.hold)} · PAUSED` : `HOLD · T-${Math.ceil(S.hold)}`, W / 2, 127, 16, paused ? C.red : C.gold);
  }
  if (S.ended) {
    const tx = stalkX(topY) + 18, ty = topY + 4;
    g.fillStyle = C.cream; g.strokeStyle = C.ink; g.lineWidth = 1.2;
    g.beginPath(); g.roundRect?.(tx + 6, ty - 16, 150, 24, 4); g.fill(); g.stroke();
    poly([[tx + 10, ty + 4], [tx, ty + 8], [tx + 16, ty + 6]], C.cream, null);
    text('We have a view.', tx + 81, ty - 4, 14, C.ink);
  }
}
// The end: Houston's top, out above the Big One in the moonlight.
function drawTopOut() {
  const tx = stalkX(topY);
  const pts = []; for (let y = 80; y >= topY; y -= 3) pts.push([stalkX(y) + Math.sin(y * 0.16) * 4.5, y]);
  line(pts, C.ink, 4.4); line(pts, C.green, 2.6);
  leaf(tx, topY + 26, 1, 1); leaf(tx, topY + 14, -1, 0.9);
  circle(tx - 6, topY + 22, 2.6, C.red); circle(tx - 9, topY + 25, 2.2, C.red);
  if (vis('hat')) drawHat(tx + 2, topY - 6);
  if (found('kite')) drawKite(tx, topY);
}

// ---------- Ticking ----------
let saveT = 0, climbDone = false;
function step(dt) {
  clock += dt;
  if (S.ended) { stepSky(dt); return; }
  if (S.started) S.t += dt;
  if (M) stepMission(dt);
  if (S.hold != null) stepHold(dt);
  if (climb) {
    climb.t += dt;
    const big = bigCloud();
    if (big && climb.t > 2.5 && big.coatQ) { big.coatQ.save(); big.coatQ.globalCompositeOperation = 'destination-out'; big.coatQ.fillStyle = '#000'; big.coatQ.globalAlpha = 0.08; big.coatQ.fillRect(-4, -4, big.w + 8, big.h + 8); big.coatQ.restore(); }
    if (climb.t > 6 && !climbDone) { climbDone = true; end(false); }
  }
  stepSky(dt);
  stepTendrils(dt);
  saveT += dt;
  if (saveT > 4) { saveT = 0; save(); hud(); renderCalls(); renderShop(); }
}

// ---------- The end ----------
function end(resumed) {
  if (S.ended && !resumed) return;
  S.ended = true; S.hold = null; save();
  hideTip(true); M = null;
  tendrils.length = 0;
  const big = bigCloud() || (arriveBig(true), bigCloud());
  big.x = BIG.x; big.state = 'gone'; big.fade = 0;
  topY = 26;
  const total = S.mine + S.hers;
  const story = [
    'The Big One has sat over the hill since before the hut was built. Nobody ever lined it. Tonight it was lined, every inch, and then nobody scratched it: Kitchen held, and Houston climbed in alone.',
    'What is inside a cloud, it turns out, is mostly more cloud: cold and grey and wet, like the inside of a steamer. Then the top. And above the top, the whole night, the hill like a crumb below, and the moon, three nights from full.',
    `Over the night, Kitchen released ${total ? S.mine : 'a great many'} clouds. Houston released ${total ? S.hers : 'a good many more than anyone was counting'} on her own, with tendrils nobody taught her to use, and the last and biggest one without touching it at all.`,
  ];
  $('story').innerHTML = '';
  for (const p of story) { const el = document.createElement('p'); el.textContent = p; $('story').append(el); }
  const rd = document.createElement('div'); rd.className = 'radio';
  rd.innerHTML = '<b>INCOMING · HOUSTON</b><span>“Kitchen, this is Houston. We have a view.”</span>';
  $('story').append(rd);
  const last = document.createElement('p');
  last.textContent = 'It is the first thing she has ever said. The cook, who has talked to her every day, says nothing at all for quite a long time, and listens.';
  $('story').append(last);
  $('ending').hidden = false;
  after(!resumed); refreshMusic();
  if (resumed) say('HOUSTON', 'Kitchen, this is Houston. Still here. Still a view.', 'h');
  else {
    sfx.finale();
    say('HOUSTON', 'Kitchen, this is Houston. We have a view.', 'h');
    $('ending').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
    const m = Math.max(1, Math.round(S.t / 60));
    if (window.DailyGame) DailyGame.finish({ lines: [`⏱ ${m}m`, `☁️ ${total} linings scratched (🌱 ${S.hers} by Houston)`, `🧊 ${S.dents} hail dent${S.dents === 1 ? '' : 's'} in the roof`, `🤫 held back for ${Math.round(S.held)}s`] });
  }
}
$('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());

// ---------- Loop ----------
let last = performance.now(), hiddenAt = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(0.2, (now - last) / 1000)); last = now;
  if (!document.hidden) step(dt);
  render();
  requestAnimationFrame(frame);
}
// Away in another tab: the cook is off the radio, but Houston's tendrils keep at it, at half pace.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); return; }
  if (!hiddenAt) return;
  const secs = (Date.now() - hiddenAt) / 1000; hiddenAt = 0; last = performance.now();
  welcomeBack(secs);
});
function welcomeBack(secs) {
  if (S.ended || secs < 20 || !S.lv.tendril || M || S.hold != null) return;
  const mins = Math.min(15, secs / 60);
  const n = Math.floor(E.tendrilPerMin(S) * mins * 0.5);
  if (!n) return;
  let rain = 0;
  for (let i = 0; i < n; i++) { const p = E.roll(S, E.pickLayer(S)); p.find = null; E.collect(S, p, 'her'); rain += p.rain; }
  say('AWAY', `${Math.round(secs / 60)} min off the radio${secs > 900 ? ' (Houston logs a quarter of an hour at most)' : ''}. Houston kept at it, at half pace: ${n} cloud${n === 1 ? '' : 's'}, +${fmt(rain)} L.`, 'w');
  after(true);
}
addEventListener('pagehide', save);
addEventListener('resize', layout);

// ---------- Sprite sheet: everything is drawn live, so the sheet draws each piece ----------
function sheet() {
  const reg = (name, w, h, f, s = 2) => {
    const c = Sprites.canvas(w * s, h * s), q = c.getContext('2d');
    q.fillStyle = C.navy; q.fillRect(0, 0, c.width, c.height);
    const keep = g; g = q; q.setTransform(s, 0, 0, s, 0, 0); try { f(); } finally { g = keep; }
    Sprites.register(name, c);
  };
  const keep = JSON.stringify(S), keepClouds = clouds.slice();
  const restore = () => { const o = JSON.parse(keep); for (const k of Object.keys(o)) S[k] = o[k]; clouds.length = 0; clouds.push(...keepClouds); };
  reg('the cook, in the basket', 60, 60, () => drawBasket(30, 45, null));
  reg('the cook, on the ground with the head-torch', 30, 40, () => drawCook(15, 35, { up: true, torch: true }));
  reg('Houston, top, with hat and kite', 120, 80, () => { S.one.hat = true; S.finds.kite = true; drawTopOutAt(40, 40); });
  reg('the moon, 87%', 60, 60, () => drawMoon(30, 30, 20));
  reg('the six finds', 180, 30, () => E.FINDS.forEach((f, i) => drawFindIcon(f.id, 15 + i * 30, 15)));
  reg('a cockerel weathervane, a kite', 80, 60, () => { drawCockerel(20, 50); drawKite(10, 40); });
  reg('chef’s hat', 24, 24, () => drawHat(12, 16));
  const mkC = (L, st) => { const c = makeCloud(L, { x: 4, y: 4, painted: st !== 'raw' }); clouds.pop(); c.speed = 0; if (st === 'half') { c.prize = { L, rain: 12, hail: false, find: null }; scratchSeg(c, 4, 24, 4 + c.w, 24, 16); } if (st === 'hail') { c.prize = { L, rain: 60, hail: true, find: null }; scratchSeg(c, 4, 30, 4 + c.w, 30, 18); } return c; };
  reg('a cloud: unlined, lined, half scratched, hail', 640, 80, () => { const a = mkC(0, 'raw'); drawCloud(a); const b = mkC(1, 'lined'); b.x = 150; drawCloud(b); const c = mkC(0, 'half'); c.x = 320; drawCloud(c); const d = mkC(2, 'hail'); d.x = 480; drawCloud(d); }, 1.5);
  reg('the hilltop with everything bought', 720, 660, () => {
    for (const it of E.ITEMS) { if (it.kind === 'lv') S.lv[it.id] = it.max; else S.one[it.id] = true; }
    for (const f of E.FINDS) S.finds[f.id] = true;
    for (const m of E.MISSIONS) S.won[m.id] = true;
    S.lv.water = 26; S.dents = 14;
    const kt = topY; topY = yOfAlt(E.height(S));
    drawSky(); drawSlab(); drawHut(); drawGarden(); drawHouston(topY); drawBasket(stalkX(topY + 40) - 20, topY + 40, null);
    topY = kt;
  }, 1);
  restore();
}
function drawTopOutAt(x, y) { const k = BASE.x; BASE.x = x; const kt = topY; topY = y; drawHat(stalkX(y) + 2, y - 6); drawKite(stalkX(y), y); leaf(stalkX(y), y + 20, 1, 1); BASE.x = k; topY = kt; }

// ---------- Start ----------
layout();
syncTendrils();
if (DEBUG) Object.assign(window.__game, { end, E, clouds, startMission, startHold, arriveBig, scratchAt });
const away = S.savedAt ? (Date.now() - S.savedAt) / 1000 : 0;
if (S.ended) end(true);
else {
  if (S.lv.water >= E.WATER_MAX) arriveBig(true);
  // The first cloud of the night is already over the hut, lined.
  const first = makeCloud(0, { x: 150, painted: true }); first.y = LAYER_Y[0] - first.h / 2;
  makeCloud(0, { x: -40 });
  if (!S.started) say('LOG', 'The hut on the hill, 21:40. Moon: waxing, 87%. Wind: light. Every cloud has a silver lining, they say. None of these do, so Kitchen has painted one on. Press and drag across it to scratch the lining off.', 'l');
  else if (S.hold != null) say('LOG', `Final mission resumes. Hold. T-${Math.ceil(S.hold)}. Do not scratch.`, 'l');
  else if (away > 60 && S.lv.tendril) welcomeBack(away);
  else say('KITCHEN', `Kitchen back on the radio. Houston at ${E.height(S)} m. Lining the next one.`);
}
// npm run mix measures the mission music with a save carrying {"__mission": id} (?debug only).
if (DEBUG && raw?.__mission && !S.ended) { delete S.__mission; startMission(raw.__mission); }
save();
hud(); renderCalls(); renderShop();
document.fonts?.ready.then(layout);
if (Sprites.sheetRequested()) { sheet(); Sprites.showSheet({ zoom: 1 }); }
requestAnimationFrame(frame);
</script>
</body>
</html>

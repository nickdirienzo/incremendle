<style>
  /* 1-bit classic Mac in JustParchment8: everything is ink (#292418) on paper (#e6ceac), greys are dither patterns.
     The desktop behind the windows is the palette's tan, checkered a pixel at a time. */
  :root {
    --ink: #292418; --paper: #e6ceac; --tan: #bda583; --tan2: #cdba94;

    padding-block: max(8px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));

  .bar { position: relative; display: flex; align-items: center; justify-content: center; height: 22px; border-bottom: 2px solid var(--ink);
    background: repeating-linear-gradient(var(--paper) 0 3px, var(--ink) 3px 4px) 0 4px / 100% calc(100% - 8px) no-repeat, var(--paper); }
  .bar::before { content: ''; position: absolute; left: 9px; top: 4px; width: 11px; height: 11px; border: 2px solid var(--ink); background: var(--paper); box-shadow: 0 0 0 3px var(--paper); }
  .bar h1, .bar h2 { margin: 0; padding: 0 10px; background: var(--paper); font: 600 15px/22px var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 60px); }

  #tip i { display: block; margin-top: 7px; padding-top: 5px; border-top: 2px dotted var(--ink); font-style: normal; }
  #tip small { display: block; margin-top: 6px; font: 12px/1.2 var(--tiny); }

  #bought { margin: 12px 0 0; }

<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG = location.search.includes('debug');
const INK = '#292418', PAPER = '#e6ceac';

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:34:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
const save = () => { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound: whole tone on D, the soundtrack's scale ----------
const A = createAudio({ sfxTrim: 1, musicTrim: 1 });
const LV = {};
let gainNow = 1;
const T = o => A.tone({ ...o, vol: o.vol * gainNow });
const N = (kind, o = {}) => A.noiseHit(kind, { ...o, vol: (o.vol ?? 0.25) * gainNow });
const notes = scale('whole tone', 62);   // D E F# G# A# C
const rl = {};
const limit = (k, ms) => { const t = performance.now(); if (t - (rl[k] || 0) < ms && !DEBUG) return false; rl[k] = t; return true; };
let popStep = 0;
const sfx = {
  // The beam on a noodle: a soft wobbling hum, a step down the scale as it shrinks.
  zap() { if (!limit('zap', 160)) return; T({ type: 'sine', freq: notes(10 - (popStep % 6)), dur: 0.12, vol: 0.05, glide: 0.94, cutoff: 1800 }); },
  // Shrunk to bite size: a little plink, walking up the whole-tone scale.
  pop() { if (!limit('pop', 70)) return; popStep++; T({ type: 'pluck', freq: notes(6 + (popStep % 6)), dur: 0.08, vol: 0.1, cutoff: 3200 }); },
  // A sous-saucer's pop, while you're busy: quieter, higher.
  drone() { if (!limit('dr', 240)) return; T({ type: 'bell', freq: notes(12 + Math.floor(Math.random() * 6)), dur: 0.06, vol: 0.035 }); },
  // Into the sink with the turkey: a splash and a sad slide.
  splash() { if (!limit('sp', 250)) return; N('whoosh', { vol: 0.09, dur: 0.25 }); T({ type: 'triangle', freq: notes(3), dur: 0.25, vol: 0.08, glide: 0.5 }); },
  // A boil-over cleared: three rising notes.
  wave() { [0, 2, 4].forEach((d, i) => T({ type: 'keys', freq: notes(d + 6), dur: 0.1, vol: 0.06, at: A.now + i * 0.08 })); },
  buy() { [0, 1, 2, 3, 5].forEach((d, i) => T({ type: 'pulse', freq: notes(d + 6), dur: 0.05, vol: 0.04, cutoff: 3000, at: A.now + i * 0.05 })); },
  unlock() { T({ type: 'bell', freq: notes(13), dur: 0.25, vol: 0.06 }); T({ type: 'bell', freq: notes(15), dur: 0.35, vol: 0.05, at: A.now + 0.12 }); },
  deny() { T({ type: 'square', freq: notes(-2), dur: 0.07, vol: 0.05, cutoff: 700 }); },
  // That's a wrap: a clapperboard and a little sting.
  wrap() { const t0 = A.now; N('snare', { vol: 0.12, at: t0 }); [0, 2, 4, 6, 9].forEach((d, i) => T({ type: 'keys', freq: notes(d), dur: 0.3, vol: 0.06, at: t0 + 0.12 + i * 0.1 })); },
  // The doorbell: two notes a whole tone apart, of course.
  bell() { T({ type: 'bell', freq: notes(9), dur: 0.5, vol: 0.08 }); T({ type: 'bell', freq: notes(7), dur: 0.7, vol: 0.08, at: A.now + 0.45 }); },
  // The end: a whole-tone cloud settling, and one last plink.
  finale() {
    const t0 = A.now;
    [0, 1, 2, 3, 4, 5, 6, 7, 8].forEach((d, i) => T({ type: 'bell', freq: notes(d + 3), dur: 0.4, vol: 0.05, at: t0 + i * 0.14 }));
    [[0, 2, 4], [1, 3, 5], [0, 2, 4, 6]].forEach((ch, k) => ch.forEach(d => T({ type: 'pad', freq: notes(d - 6), dur: 1.3, vol: 0.025, attack: 0.3, at: t0 + 0.4 + k * 1.2 })));
    T({ type: 'pluck', freq: notes(12), dur: 0.2, vol: 0.08, at: t0 + 4.2 });
  },
};
for (const [name, f] of Object.entries(sfx)) sfx[name] = (...a) => { gainNow = LV[name] ?? 1; try { f(...a); } finally { gainNow = 1; } };
if (DEBUG) window.__game = { A, sfx, long: ['finale', 'wrap', 'bell'], S: () => S, E };

// ---------- Music ----------
const phaseKey = () => S.ended ? 'end' : S.day >= 6 ? 'sunday' : S.day >= 4 ? 'late' : S.day >= 2 ? 'mid' : 'early';
let music = null, soundtrack = null, makeSoundtrack = null;
function song() { return (soundtrack ??= makeSoundtrack(music.strudel))(phaseKey()); }
import('./music.mjs').then(m => { makeSoundtrack = m.createSoundtrack; return createMusic(A, { song }); })
  .then(m => { music = m; music.update(); if (DEBUG) window.__game.music = m; }).catch(e => console.warn('music', e));
let lastPhase = phaseKey();
const refreshMusic = () => { const k = phaseKey(); if (k !== lastPhase) { lastPhase = k; if (music) music.update(); } };

// ---------- Log ----------
const logEl = $('log');
function say(tag, text) {
  logEl.innerHTML = '<b></b><span></span>';
  logEl.querySelector('b').textContent = tag;
  logEl.querySelector('span').textContent = text;
  S.lastLog = [tag, text];
}
const pick = a => a[Math.floor(Math.random() * a.length)];
const fmt = n => Math.floor(n).toLocaleString('en-US');
const cm = n => n >= 1e5 ? `${E.short(n / 100)} m` : `${fmt(n)} cm`;
const POP_LINES = ['And, pop: bite-sized. Lovely.', 'Here\'s one I shrank earlier. And here\'s one I shrank just now.', 'Into the bowl it goes. Don\'t be shy with the ray.',
  'See how it firms up? That\'s what we\'re after.', 'Gently, gently... and done. Peppercorn-plate size.', 'A little zap, a little patience. That\'s the whole secret, viewers.'];
const WAVE_LINES = ['Boil-over #, done and dusted. Not a drop in the sink.', 'That\'s boil-over # cleared. Ooh, aren\'t we good.', 'Boil-over #, shrunk to the last strand. And the pot rumbles again...',
  'Boil-over # done. If yours went a bit soggy, don\'t worry: nobody at home can tell.'];
const SPLASH_LINES = ['Oh dear: one\'s gone in the sink with the turkey. We\'ll take that boil-over again from the top.', 'Splash. A noodle in the turkey\'s water. Back to the start of that boil-over, viewers, nobody saw.',
  'And one gets away, into the sink. The turkey doesn\'t mind. The running order does. Again!'];
const CREW_LINES = ['The sous-saucers have shrunk # on their own. Teamwork, viewers.', '# noodles shrunk by the crew while Wibble wasn\'t looking. Wibble pretends it was.', 'Behind the camera, the sous-saucers zap away: # done. They hum while they work.'];

// ---------- Canvas & 1-bit drawing ----------
const cv = $('stage'), ctx = cv.getContext('2d');
const W = 760, H = 470, F = E.FIELD;
function fit() { const d = Math.min(2, window.devicePixelRatio || 1); cv.width = W * d; cv.height = H * d; }
fit(); addEventListener('resize', fit);
// MacPaint patterns, one ink on paper.
const pats = {};
function pat(name) {
  if (pats[name]) return pats[name];
  const rows = {
    p50: ['10', '01'], p25: ['1000', '0000', '0010', '0000'], p12: ['10000000', '00000000', '00001000', '00000000'], p75: ['01', '11'],
    diag: ['1000', '0100', '0010', '0001'], hline: ['1', '0', '0'], tile: ['1111111111111111', ...Array(7).fill('1000000000000000')],
    brick: ['11111111', '10000000', '10000000', '10000000', '11111111', '00001000', '00001000', '00001000'], wave: ['1100', '0011', '0000', '0000'],
    grid: ['111111', '100000', '100000', '100000', '100000', '100000'],
  }[name];
  const c = Sprites.canvas(rows[0].length, rows.length), x = c.getContext('2d');
  x.fillStyle = PAPER; x.fillRect(0, 0, c.width, c.height); x.fillStyle = INK;
  rows.forEach((r, j) => [...r].forEach((b, i) => { if (b === '1') x.fillRect(i, j, 1, 1); }));
  return (pats[name] = ctx.createPattern(c, 'repeat'));
}
// Fill a path in a pattern (or paper) and outline it in ink, crisp.
function shape(x, path, fill = PAPER, lw = 2) {

function tick(dt) {
  if (S.ended) return;
  if (ending) { ending.t += dt; ending.wx += (240 - ending.wx) * Math.min(1, dt * 1.5); ending.wy += (262 - ending.wy) * Math.min(1, dt * 1.5); if (ending.t > 6) end(false); return; }
  if (!S.started) return;
  S.time += dt;
  // steering: keys move the target; the autopilot takes over when you let go
  if (keys.size) {
    const v = E.speed(S) * dt; let [tx, ty] = target;
    if (keys.has('ArrowLeft') || keys.has('a')) tx -= v; if (keys.has('ArrowRight') || keys.has('d')) tx += v;
    if (keys.has('ArrowUp') || keys.has('w')) ty -= v; if (keys.has('ArrowDown') || keys.has('s')) ty += v;
    target = E.clampSpot([tx, ty]); lastSteer = now;
  } else if (E.lv(S, 'auto') && now - lastSteer > 2 && !steering) {
    const n = E.fattest(B); if (n) target = E.clampSpot([n.big ? n.x : n.x + 20, n.y]);
  }
  pos = E.fly(S, pos, target, dt);
  const j = E.jitter(S);
  jit = [jit[0] * 0.6 + (Math.random() - 0.5) * j * 0.8, jit[1] * 0.6 + (Math.random() - 0.5) * j * 0.5];
  const spot = [pos[0] + jit[0] * 0.6, pos[1] + jit[1] * 0.6];
  const ev = E.step(S, B, dt, spot, now);
  lastZaps.clear(); for (const [i, id] of ev.zaps) lastZaps.set(i, id);
  if (B.noodles.some(n => n.hit > 0.1)) sfx.zap();
  for (const p of ev.pops) {
    pops.push({ x: p.x, y: p.y, t: 0 }); floats.push({ x: p.x, y: p.y - 14, s: `+${E.short(p.b)}`, t: 0 });
    bpsAcc += p.b;
    const byBeam = Math.hypot(p.x - spot[0], p.y - spot[1]) < E.radius(S) + 20;
    if (byBeam) sfx.pop(); else { sfx.drone(); crewPops++; }
  }
  if (ev.pops.length && now - popLogT > 40 && Math.random() < 0.3) { popLogT = now; say('CHEF WIBBLE', pick(POP_LINES)); }
  if (crewPops >= 12 && now - lastCrewLog > 70) { lastCrewLog = now; say('BEHIND THE CAMERA', pick(CREW_LINES).replace('#', fmt(crewPops))); crewPops = 0; }
  if (ev.escapes) { sfx.splash(); for (let i = 0; i < ev.escapes; i++) splashes.push({ t: 0 }); signT = S.odd.sign ? 1.6 : 0; }
  if (ev.failed) { say(S.odd.sign ? 'APPLAUSE (WRONG SWITCH)' : 'SPLASH', pick(SPLASH_LINES)); if (!swellHint && S.wave >= 4) { swellHint = true; } }
  if (ev.cleared) { sfx.wave(); if (now - waveLogT > 20) { waveLogT = now; say('BOIL-OVER CLEARED', pick(WAVE_LINES).replace('#', ev.cleared)); } if (S.best === E.quota(S) && S.day < 6) say('RUNNING ORDER', `That's today's running order done: boil-over ${E.quota(S)}. Wrap the episode (top of the Props Dept.) for Fan Mail, or keep going: the further you get today, the more mail.`); }
  if (!swellHint && B.noodles.some(n => n.L > n.L0 * 1.6)) { swellHint = true; say('TIP', 'See that one going fat and dotty? Noodles left on the counter drink and swell. Get to the soggy ones first.'); }
  // Sunday's Big One, and the doorbell on the dot
  if (B.bigOne) {
    if (!S.big) { say('SUNDAY', 'The pot gives one last enormous heave... and out comes THE BIG ONE. The inspector is due any moment. Shrink, Wibble, shrink!'); sfx.bell && null; }
    S.big += dt;
    if (S.big >= BIG_SECS) startEnding();
  }
  bpsT += dt; if (bpsT >= 10) { const r = bpsAcc / bpsT; S.bps = S.bps ? S.bps * 0.7 + r * 0.3 : r; bpsAcc = 0; bpsT = 0; }
}
function startEnding() {
  // The game ends itself: the doorbell goes, the ray switches off, and nobody is steering any more.
  S.record = B.bigOne.L;
  ending = { t: 0, wx: pos[0] + jit[0], wy: Math.min(pos[1] - 112, 250) };
  sfx.bell();
  say('DING DONG', 'The doorbell. Sunday, on the dot. Someone switches the ray off at the wall, and Wibble drifts down, very slowly, to the counter.');
  save();
}

function frame() {
  const t = performance.now();
  const dt = Math.min(0.1, (t - T0) / 1000); T0 = t; now += dt;
  signT = Math.max(0, signT - dt);
  for (const a of [pops, floats, splashes]) { for (const p of a) p.t += dt; while (a.length && a[0].t > 1) a.shift(); if (a.length > 40) a.splice(0, a.length - 40); }
  draw();
  requestAnimationFrame(frame);
}
let T0 = performance.now();
let last = performance.now(), saveT = 0, uiT = 0;
setInterval(() => {
  const t = performance.now(); const dt = Math.min(30, (t - last) / 1000); last = t;
  for (let left = dt; left > 0; left -= 0.05) tick(Math.min(0.05, left));
  saveT += dt; if (saveT > 3) { saveT = 0; save(); }
  uiT += dt; if (uiT > 0.25) { uiT = 0; refreshMusic(); renderHud(); renderShop(); }
}, 50);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);

// ---------- The end ----------
function finishedSet() {
  // A finished save that never played: the whole week's set, everything on it.
  S.day = 6; S.wraps = Math.max(S.wraps, 6);
  for (const id of ['hat', 'sign', 'water', 'ruler', 'frame', 'crayon']) S.odd[id] = 1;
  S.perm = Object.assign({ club: 8, tips: 4, order: 3, crew: 3, night: 2 }, S.perm);
  S.lv = Object.assign({ ray: 30, drone: 6, lens: 25, beam: 5, chop: 14, rinse: 3, nerve: 3, auto: 1 }, S.lv);
  if (!S.record) S.record = E.waveSpec(E.BIG_WAVE).L * 8 * 2.4;
  if (!S.shrunk) S.shrunk = 4.2e7;
}
function end(resumed) {
  const first = !S.ended;
  S.ended = true; ending = null;
  if (first && !resumed) sfx.finale();
  if (!S.time || !S.record) finishedSet();
  B = E.battle();
  hideTip(true); refreshMusic(); renderShop(); renderHud(); save();
  say('THAT\'S A WRAP', 'Inspector Eunice, Galactic Book of Records, unrolls her tape measure along the Big One. It takes her quite a while.');
  const m = Math.floor(S.time / 60), hm = m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}m` : `${m}m`;
  $('story').innerHTML = `
    <p>Sunday, on the dot, the doorbell went. Inspector Eunice was tall, kind and very precise, and she was carrying a tape measure, not a clipboard. On her badge: <b>G.B.R.</b> The Galactic Book of Records.</p>
    <p>"Your viewers wrote to us," she said. "Hundreds of them. They said you'd grown the longest noodle anyone has ever seen. I came to certify it." Wibble looked at the bowl of ${fmt(S.noodles || 0)} tiny noodles, shrunk one by one all week, ${cm(S.shrunk || 0)} of noodle in all, and then at the ruler, and then at the letter in its frame, with the little trophy at the top. It had never been a health inspection. It was never meant to shrink them at all.</p>
    <p>But it hadn't finished the Big One. The doorbell had seen to that.</p>
    <div class="cert"><div><small>THE GALACTIC BOOK OF RECORDS · CERTIFIED</small><strong>Longest Noodle Ever Grown</strong><strong>${cm(S.record || 0)}</strong><small>grown live on television in a borrowed Earth kitchen by Wibble, a flying saucer (nervous)</small></div></div>
    <p>Eunice wrote out a second certificate too, for the most noodles ever shrunk on live television, because she was kind and because it was true. Wibble didn't jitter once. The pot, finally, was turned off. The turkey, finally, was thawed.</p>
    ${S.time ? `<p>${cm(S.shrunk || 0)} shrunk · ${fmt(S.noodles || 0)} noodles · ${fmt(S.splashes || 0)} in the sink · ${hm} on air</p>` : ''}`;
  $('ending').hidden = false;
  if (first && !resumed && window.DailyGame) {
    DailyGame.finish({ lines: [`⏱ ${hm} on air`, `📏 Longest noodle ever: ${cm(S.record)}`, `🛸 ${cm(S.shrunk)} shrunk for nothing`] });
  }
}
$('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());

// ---------- Start ----------
makeSprites();
if (S.ended) end(true);
else {
  const away = S.savedAt ? E.away(S, (Date.now() - S.savedAt) / 1000) : null;
  if (away && away.bites >= 1) {
    const h = Math.floor(away.secs / 3600), mm = Math.round((away.secs % 3600) / 60);
    say('WHILE YOU WERE OUT', `${h ? `${h} h ` : ''}${mm} min off air. ${E.drones(S) ? 'The sous-saucers kept the counter clear' : 'The pot simmered and a few noodles shrank in the draught'}: +${E.short(away.bites)} bites. (Nobody was steering, so it went slowly.)`);
  } else if (S.lastLog) say(...S.lastLog);
  else say('WIBBLE\'S LITTLE KITCHEN', 'Noodle week! Wibble knocked the shrink ray to GROW on the pot, live, and the dial snapped off. The inspector comes Sunday. Steer the saucer over the noodles to shrink them back to bite size.');
  if (S.started && S.day === 6 && S.wave >= E.BIG_WAVE && S.big >= BIG_SECS) { S.record = S.record || E.waveSpec(E.BIG_WAVE).L * 8; end(false); }
  E.reveal(S);
}
renderHud(); renderShop();
requestAnimationFrame(frame);
if (DEBUG) Object.assign(window.__game, { end, doWrap, B: () => B });
</script>
</body>
</html>

<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG = location.search.includes('debug');
const C = { white: '#ffffff', cyan: '#0ce6f2', sky: '#0098db', blue: '#1e579c', navy: '#203562', ink: '#252446', deep: '#201533', soft: '#cfe9f7' };
const TAU = Math.PI * 2;
const hash = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };

// Numbers in words, the way the campers say them.
function fmt(n) {
  n = Math.floor(n);
  if (n < 1e4) return n.toLocaleString('en-US');
  const u = [[1e9, 'billion'], [1e6, 'million'], [1e3, 'thousand']];
  for (const [v, w] of u) if (n >= v) { const x = n / v; return `${x >= 100 ? Math.floor(x) : x >= 10 ? x.toFixed(1) : x.toFixed(2)} ${w}`; }
  return String(n);
}
const short = n => { n = Math.floor(n); if (n < 1e4) return n.toLocaleString('en-US'); const u = [[1e9, 'B'], [1e6, 'M'], [1e3, 'k']]; for (const [v, w] of u) if (n >= v) { const x = n / v; return `${x >= 100 ? Math.floor(x) : x >= 10 ? x.toFixed(1) : x.toFixed(2)}${w}`; } return String(n); };

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:26:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
const save = () => { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound: D in-sen (D E♭ G A C), plucked yarn and little bells ----------
// Trims measured with npm run mix: music near -24 dBFS RMS, effects peaking near -10.
const A = createAudio({ sfxTrim: 2.2, musicTrim: 1.15 });
const notes = scale('in-sen', 62);   // D4 Eb4 G4 A4 C5, D5 ...
const gate = {};
const every = (k, ms) => { const t = performance.now(); if (!DEBUG && t - (gate[k] || 0) < ms) return false; gate[k] = t; return true; };
// Per-effect levels, measured with npm run mix so every effect peaks near -10 dBFS (the little frequent ones a
// few dB under). Each effect's notes are scaled by its level while it plays.
const LEVEL = { thread: 6, launch: 1.5, lit: 2, sync: 1.2, shout: 2.6, gossip: 3, caught: 2.1, home: 4, find: 1.5, buy: 1.25, unlock: 2.3, deny: 1.8, zone: 2.5, finale: 2.4 };
let lvl = 1;
const T = o => A.tone({ ...o, vol: (o.vol ?? 0.3) * lvl });
const N = (k, o = {}) => A.noiseHit(k, { ...o, vol: (o.vol ?? 0.25) * lvl });
const pl = (d, o = {}) => T({ type: 'pluck', freq: notes(d), dur: 0.12, vol: 0.14, ...o });
const sfx = {
  // The thread pays out as you draw: a soft pluck every little way, climbing.
  thread(i = 0) { if (!every('thread', 60)) return; pl(3 + (i % 8), { vol: 0.08, dur: 0.09 }); },
  // The lid flicks: a felt thwop and a little rising pair.
  launch() { N('hat', { vol: 0.05, dur: 0.03 }); T({ type: 'triangle', freq: notes(-3), dur: 0.05, vol: 0.12, glide: 1.6 }); pl(5, { vol: 0.1, at: A.now + 0.05 }); pl(7, { vol: 0.09, at: A.now + 0.11 }); },
  // A window lights up.
  lit() { if (!every('lit', 120)) return; T({ type: 'bell', freq: notes(10), dur: 0.14, vol: 0.09 }); T({ type: 'bell', freq: notes(12), dur: 0.2, vol: 0.06, at: A.now + 0.06 }); },
  // A ring of fireflies blinking together: all three bells at once.
  sync() { [10, 12, 14].forEach(d => T({ type: 'bell', freq: notes(d), dur: 0.3, vol: 0.07 })); },
  // LIGHTS OUT! A comic little horn, down a step.
  shout() { if (!every('shout', 260)) return; const o = { type: 'sawtooth', dur: 0.12, vol: 0.075, cutoff: 900, release: 0.08 }; T({ ...o, freq: notes(-2) }); T({ ...o, freq: notes(-4), dur: 0.2, at: A.now + 0.15 }); },
  // Gossip coming in on its own: whispering, and a tiny pluck.
  gossip() { if (!every('gossip', 2600)) return; for (let i = 0; i < 3; i++) N('shaker', { vol: 0.025, dur: 0.035, at: A.now + i * 0.07 }); pl(8 + Math.floor(Math.random() * 4), { vol: 0.05, at: A.now + 0.22, dur: 0.06 }); },
  // Caught in the jam jar.
  caught() { if (!every('caught', 300)) return; T({ type: 'bell', freq: notes(16), dur: 0.05, vol: 0.08 }); T({ type: 'triangle', freq: notes(0), dur: 0.08, vol: 0.1, at: A.now + 0.05 }); },
  // A firefly home in the bin.
  home() { if (!every('home', 400)) return; T({ type: 'sine', freq: notes(7), dur: 0.1, vol: 0.05, glide: 0.8, release: 0.1 }); },
  // Something found in the dark.
  find() { [5, 7, 9, 10, 12].forEach((d, i) => pl(d, { vol: 0.1, at: A.now + i * 0.07 })); T({ type: 'bell', freq: notes(15), dur: 0.4, vol: 0.06, at: A.now + 0.4 }); },
  buy() { T({ type: 'pad', freq: notes(0), dur: 0.16, vol: 0.035, attack: 0.02, cutoff: 1500 }); [5, 7, 10].forEach((d, i) => pl(d, { vol: 0.11, at: A.now + i * 0.05 })); },
  unlock() { T({ type: 'bell', freq: notes(12), dur: 0.2, vol: 0.08 }); T({ type: 'bell', freq: notes(14), dur: 0.3, vol: 0.07, at: A.now + 0.12 }); },
  deny() { T({ type: 'triangle', freq: notes(-4), dur: 0.08, vol: 0.12 }); },
  // A new part of the park: the shanty's call, on bells.
  zone() { [0, 3, 4, 5, 3, 5].forEach((d, i) => T({ type: 'bell', freq: notes(d + 5), dur: 0.16, vol: 0.06, at: A.now + i * 0.16 })); },
  // The end: the whole call and its answer, and a pad on the open fifth.

    felt(g, rrect(x - 30, y - 34, 30, 6, 3), C.sky, { stitch: 'rgba(255,255,255,0.5)', shadow: 2 });
    const [wx, wy] = P(E.TG.b2.x, E.TG.b2.y); glow(g, wx, wy, 6, 0.8 + 0.2 * Math.sin(t * 2));
  }
}

// ---------- Loop ----------
let last = performance.now(), lastFrame = performance.now(), saveAcc = 0, uiAcc = 0, phaseWas = E.phaseKey(S), reachWas = E.reachName(S), tellAcc = 0;
function step(dt) {
  if (S.ended) return;
  const ev = E.tick(S, dt);
  for (const id of ev.lit) { sfx.lit(); if (Math.random() < 0.12 && every('litline', 20000)) say('OVERHEARD', LIT[Math.floor(Math.random() * LIT.length)](E.TG[id].name)); }
  for (const id of ev.sync) { sfx.sync(); const tg = E.TG[id]; floats.push({ x: tg.x, y: tg.y - 24, text: '⟳ ×2', t: 0, col: 'rgba(12,230,242,A)' }); }
  for (const s of ev.shout) {
    sfx.shout();
    const tg = E.TG[s.id]; floats.push({ x: tg.x, y: tg.y - 40, text: `+${short(s.b)}`, t: 0 });
    if (S.shouts === 1) say('DOBBIN', '“LIGHTS OUT! LIGHTS! OUT!” Mr Dobbin, landlord, in his tartan dressing gown, at the shower block. Their light was off. It was off the whole time. The campers are AWAKE now. Every one of them. Talking.');
    else if ((tellAcc += 1) >= 7 && Math.random() < 0.35) { tellAcc = 0; say('OVERHEARD', SHOUTED[Math.floor(Math.random() * SHOUTED.length)](tg.name)); }
  }
  if (ev.caught) { sfx.caught(); if (!S.told.caught || (Math.random() < 0.2 && every('caughtline', 30000))) { S.told.caught = 1; say('OVERHEARD', CAUGHT[S.caught % CAUGHT.length]); } }
  if (ev.home) sfx.home();
  if (ev.gain > 0 && Object.keys(S.lit).length) sfx.gossip();
  for (const id of ev.finds) {
    sfx.find(); const fd = E.FIND[id];
    floats.push({ x: fd.x, y: fd.y - 18, text: '✦ found', t: 0, col: 'rgba(12,230,242,A)' });
    say('OVERHEARD', fd.text + (id === 'notebook' && !S.told.sync ? ' (Draw a thread that crosses itself before the window, and see.)' : ' Everyone’s talking about it: all gossip ×1.25.'));
    if (id === 'notebook') S.told.sync = 1;
  }
  if (ev.sync.length && !S.told.syncSeen) { S.told.syncSeen = 1; if (!S.finds.includes('notebook')) say('OVERHEARD', 'Did you SEE that one? Went round in a ring, and then the whole window blinked in TIME. Like the ones in the Smoky Mountains on the telly. Twice the talk, that.'); }
  if (ev.zone != null && ev.zone > 0) { sfx.zone(); say('OVERHEARD', ZONE_LINES[ev.zone]); renderShop(); }
  if (ev.finale) startFinale();
  const rn = E.reachName(S);
  if (rn !== reachWas) { reachWas = rn; const ln = REACH_LINES[rn]; if (ln) say(ln[0], ln[1]); }
  const ph = E.phaseKey(S);
  if (ph !== phaseWas) { phaseWas = ph; refreshMusic(); }
  saveAcc += dt; if (saveAcc > 5) { saveAcc = 0; save(); }
  uiAcc += dt; if (uiAcc > 0.25) { uiAcc = 0; hud(); renderShop(); }
}
function frame(now) {
  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now; lastFrame = now;
  step(dt);
  clock += dt;
  lidFlip = Math.max(0, lidFlip - dt * 4);
  for (const f of floats) f.t += dt;
  for (let i = floats.length - 1; i >= 0; i--) if (floats[i].t >= 1.6) floats.splice(i, 1);
  compose(clock);
  requestAnimationFrame(frame);
}
// In a background tab rAF stops: keep the park ticking on a timer.
setInterval(() => {
  const now = performance.now();
  if (now - lastFrame < 400) return;
  const dt = Math.min(1, (now - last) / 1000); last = now;
  step(dt);
}, 250);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('resize', () => { const w = cv.parentElement.clientWidth; if (Math.abs(w / k - VW) > 1) layout(); });

// ---------- Start ----------
layout();
loadArt().then(() => {
  if (!Sprites.sheetRequested()) return;
  const reg = (name, w, h, f) => { const c = Sprites.canvas(w * 2, h * 2), q2 = c.getContext('2d'); q2.fillStyle = C.navy; q2.fillRect(0, 0, c.width, c.height); q2.scale(2, 2); f(q2); Sprites.register(name, c); };
  const keep = JSON.stringify(S);
  Object.assign(S.one, { hat: 1, cap: 1, hike: 1, onsign: 1, lid: 1 }); S.lv = { ...S.lv, bait: 30, range: 8, fan: 6, mega: 30, wind: 5, notes: 3, coffee: 8 }; S.n = 6;
  reg('the bin, everything bought', 120, 110, q2 => drawBin(q2, 60, 70, 0.5));
  reg('the bin, new', 120, 110, q2 => { const o = S.one, l = S.lv; S.one = {}; S.lv = {}; drawBin(q2, 60, 70, 0.5); S.one = o; S.lv = l; });
  reg('Dobbin, all dressed up', 70, 80, q2 => drawDobbin(q2, 35, 52, 0, false, false));
  reg('Dobbin, shouting', 70, 80, q2 => drawDobbin(q2, 35, 52, 0, true, true));
  for (const kd of ['tent', 'caravan', 'yurt']) { Sprites.register(`${kd}, dark`, dwelling(kd, false, 0)); Sprites.register(`${kd}, lit, crowded`, dwelling(kd, true, 4)); }
  for (const p of ['fire', 'post', 'gnome', 'chair', 'cushion', 'mug']) Sprites.register(`prop: ${p}`, prop(p));
  for (const id of Object.keys(FIND_ICON)) reg(`find: ${id}`, 40, 40, q2 => { q2.translate(20, 22); FIND_ICON[id](q2); });
  for (const [n, c] of Object.entries(ART)) Sprites.register(`${n} (restyled Phosphor icon)`, c);
  Object.assign(S, JSON.parse(keep));
  Sprites.showSheet({ zoom: 2 });
});
// Away: the campers kept talking, more quietly.
if (!S.ended && !S.finale && S.savedAt) {
  const r = E.away(S, (Date.now() - S.savedAt) / 1000);
  if (r && r.g >= 1) say('WHILE YOU WERE AWAY', `${r.sec >= 5400 ? `${Math.round(r.sec / 3600)} hours` : `${Math.max(1, Math.round(r.sec / 60))} minutes`} away, and the park never stopped talking: ${fmt(r.g)} more gossip${r.sec >= E.AWAY_CAP ? ' (they ran out of things to say after six hours)' : ''}. Every firefly is home in the bin.`);
}
if (S.ended) { endGame(S.choice, true); say('OVERHEARD', S.choice === 'lid' ? 'Dobbin’s light is still on. Nobody is shouting. It is very strange and very nice.' : 'The bin is landlord. Dobbin is in his deck chair. Every light in the park is on.'); }
else if (S.finale) startFinale();
else if (!S.launches) say('OVERHEARD', 'Psst. Dobbin’s Hollow, just after ten. Mr Dobbin has screwed his LIGHTS OUT AT 10 sign to the bin by the taps. The bin is full of fireflies. The bin is VERY sure of its aim. Drag from the bin to a dark window.');
else if (!$('log').textContent) say('OVERHEARD', 'Back at the taps. The park’s dark, Dobbin’s doing his rounds, and the bin has that look again.');
save();
hud(); renderShop();
document.fonts?.ready.then(() => { layout(); });
if (DEBUG) {
  Object.assign(window.__game, { endGame, startFinale, send });
  // A path in page coordinates from the bin to a window, for test scripts that draw it with a real pointer.
  window.__pathTo = id => { const r = cv.getBoundingClientRect(); const p = E.autoPath(S, id, { loop: false }) || [[E.BIN.x, E.BIN.y], [E.TG[id].x, E.TG[id].y]]; return p.map(([x, y]) => { const [vx, vy] = P(x, y); return [r.left + vx * r.width / VW, r.top + vy * r.height / VH]; }); };
}
requestAnimationFrame(frame);
</script>
</body>

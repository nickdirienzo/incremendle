<style>
  /* Soft clay on an autumn night, in CRYPTIC OCEAN: plum dark, indigo and slate clay, steel twigs, mint for charge and light. */
  :root {
    --deep: #2a173b; --plum: #3f2c5f; --indigo: #443f7b; --slate: #4c5c87; --steel: #69809e; --mint: #95c5ac;
    --pale: #cfe3dc; --ink: #e6efec;
    --clay: 'Fredoka', ui-rounded, system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--deep); color: var(--ink); }
  [hidden] { display: none !important; }
  body {
    margin: 0; font: 15px/1.45 var(--clay);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(10px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
    background-image: radial-gradient(ellipse at 30% -10%, #443f7b 0, transparent 60%);
    background-repeat: no-repeat;
  }
  .wrap { max-width: 1140px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 0 0 6px; }
  h1 { font-weight: 600; font-size: 40px; line-height: 1; margin: 0; color: var(--pale); text-shadow: 0 2px 0 var(--slate), 0 5px 10px #12081d; letter-spacing: .5px; }
  header p { margin: 0; font-size: 16px; color: var(--steel); }
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
  @media (max-width: 760px) { .game { grid-template-columns: 1fr; } h1 { font-size: 34px; } }
  main { min-width: 0; }

  .hud { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; margin-bottom: 6px; }
  .seed { font-weight: 600; font-size: 28px; line-height: 1; color: var(--pale); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .seed small { font-weight: 400; font-size: 15px; color: var(--steel); }
  .house { display: grid; grid-template-columns: 50fr 100fr 110fr 70fr; gap: 4px; }
  .room { position: relative; height: 22px; border-radius: 11px; background: var(--deep); box-shadow: inset 0 2px 4px #0008, 0 1px 0 #ffffff14; overflow: hidden; }
  .room i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 11px; background: linear-gradient(#b8dccb, var(--mint) 60%, #6f9c87); box-shadow: inset 0 -2px 3px #0003; transition: width .5s; }
  .room span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-shadow: 0 1px 2px var(--deep); }
  .room.done span { color: var(--deep); text-shadow: none; }
  .room.locked span { color: var(--slate); }
  .sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0 14px; font-size: 13px; color: var(--steel); min-height: 19px; }
  .sub b { font-weight: 500; color: var(--pale); }

  canvas#stage { display: block; width: 100%; touch-action: none; cursor: crosshair; background: var(--deep); border-radius: 18px; box-shadow: 0 0 0 3px var(--plum), 0 10px 26px #0009; }
  canvas#stage:focus-visible { outline: 3px dashed var(--mint); outline-offset: 6px; }

  .clutch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 10px 0 0; }
  .clutch .cell { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--steel); background: var(--plum); border-radius: 12px; padding: 4px 6px 4px 10px; box-shadow: inset 0 -3px 0 #0003, 0 2px 4px #0006; min-height: 30px; }
  .clutch .cell b { font-weight: 600; font-size: 17px; color: var(--pale); font-variant-numeric: tabular-nums; }
  .clutch .cell em { font-style: normal; }
  .pack { font: 500 14px/1 var(--clay); color: var(--deep); background: var(--mint); border: 0; border-radius: 9px; padding: 6px 9px; cursor: pointer; box-shadow: inset 0 -3px 0 #0003, 0 2px 0 #0005; }
  .pack[aria-disabled="true"] { background: var(--slate); color: var(--steel); cursor: default; }
  .pack:focus-visible { outline: 2px dashed var(--mint); outline-offset: 2px; }

  .log { margin: 10px 0 0; min-height: 3em; font-size: 15.5px; line-height: 1.45; color: var(--ink); border-left: 4px solid var(--mint); padding: 5px 12px; background: #3f2c5f99; border-radius: 0 12px 12px 0; font-style: italic; }
  .log b { font-style: normal; font-weight: 500; font-size: 12px; letter-spacing: 1.5px; color: var(--deep); background: var(--mint); padding: 1px 7px; margin-right: 8px; border-radius: 8px; }
  .log b.p { background: var(--pale); }
  .log b.d { background: var(--steel); }
  .log.fresh span { animation: rise .5s ease-out; }
  @keyframes rise { from { opacity: 0; } }

  aside { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; scrollbar-width: thin; padding: 2px 4px 8px 2px; }
  @media (max-width: 760px) { aside { position: static; max-height: none; overflow: visible; } }
  #calls:empty { display: none; }
  .feast { width: 100%; text-align: left; font: 500 15px/1.25 var(--clay); color: var(--deep); background: var(--mint); border: 0; border-radius: 16px; padding: 9px 13px 10px; margin-bottom: 10px; cursor: pointer; box-shadow: inset 0 -4px 0 #0003, 0 3px 0 #0006, 0 0 18px #95c5ac66; animation: breathe 2s ease-in-out infinite; }
  .feast b { display: block; font-weight: 600; font-size: 22px; }
  .feast:focus-visible { outline: 2px dashed var(--pale); outline-offset: 3px; }
  @keyframes breathe { 50% { box-shadow: inset 0 -4px 0 #0003, 0 3px 0 #0006, 0 0 30px #95c5acaa; } }
  .flock { background: var(--plum); border-radius: 16px; padding: 8px 10px 9px; margin-bottom: 12px; box-shadow: inset 0 -4px 0 #0003, 0 3px 8px #0006; }
  .flock h3 { margin: 0 0 4px; font-weight: 500; font-size: 17px; color: var(--pale); display: flex; justify-content: space-between; align-items: baseline; }
  .flock h3 small { font-weight: 400; font-size: 13px; color: var(--steel); }
  .job { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: 5px; padding: 2px 0; }
  .job .nm { font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: help; border-radius: 6px; }
  .job .nm small { color: var(--steel); font-size: 12px; }
  .job .nm:focus-visible { outline: 2px dashed var(--mint); }
  .job output { min-width: 22px; text-align: center; font-weight: 600; color: var(--pale); font-variant-numeric: tabular-nums; }
  .job button { width: 30px; height: 28px; font: 600 17px/1 var(--clay); color: var(--deep); background: var(--steel); border: 0; border-radius: 9px; cursor: pointer; box-shadow: inset 0 -3px 0 #0003; }
  .job button:not([aria-disabled="true"]):hover { background: var(--mint); }
  .job button[aria-disabled="true"] { opacity: .4; cursor: default; }
  .job button:focus-visible { outline: 2px dashed var(--mint); outline-offset: 1px; }
  .job.locked { opacity: .45; }
  aside h2 { font-weight: 500; font-size: 22px; line-height: 1; margin: 2px 0 8px; color: var(--pale); }
  #afford { font-size: 14px; font-weight: 400; color: var(--steel); }
  #shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  @media (max-width: 760px) and (min-width: 520px) { #shop { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .up {
    position: relative; display: flex; flex-direction: column; min-width: 0; text-align: left; font: 13px/1.2 var(--clay); color: var(--steel);
    background: var(--plum); border: 0; border-radius: 12px; padding: 6px 9px 7px; cursor: pointer; box-shadow: inset 0 -3px 0 #0003, 0 2px 4px #0006;
  }
  .up b { font-weight: 500; font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up.can { background: var(--indigo); box-shadow: inset 0 -3px 0 #0003, 0 2px 4px #0006, 0 0 0 2px var(--mint); }
  .up.can em { color: var(--mint); }
  .up[aria-disabled="true"] { cursor: default; }
  .up[aria-disabled="true"]:not(.can) b { color: var(--steel); }
  .up.odd b::before, .bought.odd::before { content: '✿ '; color: var(--mint); }
  .up .tag { position: absolute; top: -8px; right: 6px; font-size: 11px; font-style: normal; letter-spacing: 1px; color: var(--deep); background: var(--pale); padding: 0 6px; border-radius: 7px; box-shadow: 0 2px 0 #0005; }
  .up.new { animation: newglow 1.1s ease-in-out 6; }
  @keyframes newglow { 50% { background: var(--slate); } }
  .up:focus-visible, .bought:focus-visible { outline: 2px dashed var(--mint); outline-offset: 2px; }
  #tip {
    position: fixed; z-index: 50; width: 280px; padding: 10px 13px 11px; pointer-events: none; font: 14px/1.4 var(--clay); color: var(--ink);
    background: var(--plum); border-radius: 16px; box-shadow: inset 0 -4px 0 #0003, 0 10px 24px #000a, 0 0 0 2px var(--slate);
  }
  #tip b { display: block; font-weight: 600; font-size: 18px; line-height: 1.15; color: var(--pale); margin-bottom: 4px; }
  #tip .fx { display: block; margin-top: 7px; padding: 4px 8px; color: var(--deep); background: var(--mint); border-radius: 9px; font-weight: 500; }
  #tip i { display: block; margin-top: 7px; padding-top: 6px; border-top: 2px dotted var(--slate); color: var(--pale); opacity: .85; }
  #tip small { display: block; margin-top: 6px; font-size: 15px; color: var(--mint); }
  #tip.inline { position: static; width: auto; margin-top: 10px; }
  #bought { margin: 12px 0 2px; }
  #bought summary { display: flex; align-items: center; gap: 6px; font-size: 17px; color: var(--pale); cursor: pointer; list-style: none; padding: 3px 2px; }
  #bought summary::-webkit-details-marker { display: none; }
  #bought summary::before { content: '›'; color: var(--steel); transition: transform .2s; }
  #bought[open] summary::before { transform: rotate(90deg); }
  #bought summary:focus-visible { outline: 2px dashed var(--mint); outline-offset: 2px; }
  .shelf { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 2px 2px; }
  .bought { max-width: 100%; font: 13px/1.2 var(--clay); color: var(--ink); background: var(--plum); border: 0; border-radius: 10px; padding: 4px 9px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: inset 0 -2px 0 #0003; }
  .bought:hover, .bought.on { color: var(--deep); background: var(--mint); }

  #ending { margin: 22px auto 0; max-width: 680px; color: var(--ink); background: var(--plum); border-radius: 22px; box-shadow: inset 0 -5px 0 #0003, 0 12px 30px #000a; padding: 18px 28px 22px; }
  #ending .num { font-size: 14px; color: var(--steel); letter-spacing: 2px; }
  #ending h2 { font-weight: 600; font-size: 40px; line-height: 1.05; margin: 6px 0 10px; color: var(--pale); }
  #ending p { margin: 9px 0; }
  #ending .sig { color: var(--steel); font-style: italic; }
  #shareBtn, #againBtn { font: 500 18px/1 var(--clay); color: var(--deep); background: var(--mint); border: 0; border-radius: 13px; box-shadow: inset 0 -4px 0 #0003, 0 3px 0 #0006; padding: 10px 18px 12px; margin: 8px 8px 0 0; cursor: pointer; }
  #againBtn { background: var(--steel); }
  #shareBtn:focus-visible, #againBtn:focus-visible { outline: 2px dashed var(--pale); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .up.new, .feast, .log.fresh span { animation: none; } .room i, #bought summary::before { transition: none; } }
</style>

<body>
<div class="wrap">
  <header>
    <h1>Nest Egg</h1>
    <p id="where">in the gutter · late autumn</p>
  </header>
  <div class="game">
    <main>
      <div class="hud">
        <div class="seed" title="Seed in Priya’s feeder. She fills it for every quiet night. It holds 999; the squirrels get the rest."><span id="seed">0</span> <small>seed</small></div>
        <div class="house" id="house" title="Every room of the house that chirps. Feed a room’s mouths enough times and it goes quiet, and the next room’s chirping carries up to the gutter."></div>
        <div class="sub" id="sub"></div>
      </div>
      <canvas id="stage" tabindex="0" aria-label="An empty nest in the gutter of a house at night, and the house below in cross-section. Trace the glowing rune over the nest to fill a battery. Tap anything in the house that chirps to feed it a battery. Keyboard: Enter traces the rune, F feeds the next chirp."></canvas>
      <div class="clutch" id="clutch"></div>
      <p class="log" id="log" aria-live="polite"></p>
    </main>
    <aside id="side">
      <div id="calls"></div>
      <div class="flock" id="flock" hidden>
        <h3>The flock <small id="flockN"></small></h3>
        <div id="jobs"></div>
      </div>
      <h2>Feeder <span id="afford"></span></h2>
      <div id="shop"></div>
      <details id="bought" hidden><summary>Bought · <span id="boughtN">0</span></summary><div class="shelf" id="shelf"></div></details>
      <div id="tip" role="tooltip" hidden></div>
    </aside>
  </div>
  <section id="ending" hidden>
    <div class="num">THE FIRST FROST · GONE SOUTH</div>
    <h2>Every mouth fed.</h2>
    <div id="story"></div>
    <button id="shareBtn" type="button">Share result</button>
  </section>
</div>
<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import { grain } from '/shared/kit/fx.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG = location.search.includes('debug');
const C = { deep: '#2a173b', plum: '#3f2c5f', indigo: '#443f7b', slate: '#4c5c87', steel: '#69809e', mint: '#95c5ac', pale: '#cfe3dc', ink: '#e6efec' };
const TAU = Math.PI * 2;
const fmt = n => Math.floor(n).toLocaleString('en-US');

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:24:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
const save = () => { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound: A harmonic minor, on a little handheld's pulse and triangle ----------
// Trims measured with npm run mix: music near -24 dBFS RMS, effects peaking near -10.
const A = createAudio({ sfxTrim: 3.5, musicTrim: 1.3 });
const notes = scale('harmonic minor', 57);   // A3 B3 C4 D4 E4 F4 G#4, A4 ...
const gate = {};
const every = (k, ms) => { const t = performance.now(); if (!DEBUG && t - (gate[k] || 0) < ms) return false; gate[k] = t; return true; };
const blip = (d, { vol = 0.12, at = A.now, dur = 0.07, type = 'pulse', cutoff = 3200 } = {}) => A.tone({ type, freq: notes(d), dur, vol, at, cutoff, release: 0.08 });
const sfx = {
  // Each stretch of the rune you cover: a soft step up the scale.
  trace(i = 0) { if (!every('trace', 70)) return; blip(7 + (i % 7), { vol: 0.065, dur: 0.035, type: 'triangle' }); },
  // A rune cast: the twigs crackle and a little run goes up.
  cast() { A.noiseHit('hat', { vol: 0.05, dur: 0.04 }); [7, 9, 11, 14].forEach((d, i) => blip(d, { vol: 0.11, at: A.now + i * 0.045, dur: 0.05 })); },
  // A cell fills right up.
  cell() { if (!every('cell', 300)) return; A.tone({ type: 'bell', freq: notes(14), dur: 0.12, vol: 0.12 }); A.tone({ type: 'bell', freq: notes(16), dur: 0.16, vol: 0.085, at: A.now + 0.07 }); },
  // Something in the house chirps: the low-battery chirp, softened.
  chirp() { if (!every('chirp', 900)) return; A.tone({ type: 'sine', freq: notes(18), dur: 0.05, glide: 1.12, release: 0.05, vol: 0.13 }); },
  // A mouth fed: a pluck down and up, and seed rattling into the feeder.
  feed() { blip(9, { vol: 0.14, type: 'pluck', dur: 0.12 }); blip(11, { vol: 0.13, type: 'pluck', dur: 0.14, at: A.now + 0.08 }); for (let i = 0; i < 4; i++) A.noiseHit('shaker', { vol: 0.04, dur: 0.02, at: A.now + 0.16 + i * 0.035 }); },
  // A carrying bird lands one: quieter, and not every time.
  carry() { blip(11, { vol: 0.13, type: 'pluck', dur: 0.12 }); blip(14, { vol: 0.08, type: 'pluck', dur: 0.1, at: A.now + 0.06 }); },
  // Small batteries packed into a big one.
  pack() { if (!every('pack', 500)) return; A.noiseHit('hat', { vol: 0.07, dur: 0.03 }); blip(2, { vol: 0.12, type: 'square', dur: 0.05, cutoff: 1400 }); blip(4, { vol: 0.1, type: 'square', dur: 0.06, at: A.now + 0.06, cutoff: 1400 }); },
  // Dad got there first.
  gone() { if (!every('gone', 2000)) return; blip(4, { vol: 0.12, type: 'triangle', dur: 0.12 }); blip(0, { vol: 0.12, type: 'triangle', dur: 0.2, at: A.now + 0.12 }); },
  buy() { [0, 2, 4, 7].forEach((d, i) => blip(d + 7, { vol: 0.15, at: A.now + i * 0.05, dur: 0.06 })); },
  unlock() { A.tone({ type: 'bell', freq: notes(11), dur: 0.2, vol: 0.12 }); A.tone({ type: 'bell', freq: notes(14), dur: 0.3, vol: 0.1, at: A.now + 0.12 }); },
  room() { [0, 2, 4, 6, 7].forEach((d, i) => blip(d + 7, { vol: 0.03, at: A.now + i * 0.09, dur: 0.1 })); A.tone({ type: 'bell', freq: notes(14), dur: 0.5, vol: 0.03, at: A.now + 0.5 }); },
  assign() { blip(5, { vol: 0.13, type: 'triangle', dur: 0.05 }); },
  deny() { A.tone({ type: 'triangle', freq: notes(-3), dur: 0.08, vol: 0.14 }); },
  // The flock takes off: wings, then the theme with a major third at last.
  finale() {
    for (let i = 0; i < 8; i++) A.noiseHit('whoosh', { vol: 0.04, dur: 0.3, at: A.now + i * 0.18 });
    [0, 2, 4, 7, 9, 11, 14].forEach((d, i) => blip(d, { vol: 0.08, at: A.now + 0.4 + i * 0.12, dur: 0.12 }));
    const cs = 440 * Math.pow(2, 4 / 12);   // C#5: A major, finally
    [notes(7), cs, notes(11)].forEach((f, i) => A.tone({ type: 'pad', freq: f / 2, dur: 2.4, vol: 0.02, attack: 0.4, release: 1.6, cutoff: 1200, at: A.now + 1.3 + i * 0.02 }));
    A.tone({ type: 'bell', freq: cs * 2, dur: 0.8, vol: 0.08, at: A.now + 1.6 });
  },
};
if (DEBUG) window.__game = { A, sfx, long: ['finale', 'room'], S: () => S, E };

// ---------- Music ----------
let music = null, soundtrack = null;
function song() { return (soundtrack ??= createSoundtrack(music.strudel))(E.phaseKey(S)); }
createMusic(A, { song }).then(m => { music = m; music.update(); if (DEBUG) window.__game.music = m; }).catch(e => console.warn('music', e));
const refreshMusic = () => { if (music) music.update(); };

// ---------- Layout ----------
// Two arrangements of one scene: wide (nest at the left end of the gutter, house beside it) and tall (phones:
// nest on top, house underneath). The house is drawn in its own 640×340 frame and placed by the layout.
const cv = $('stage'), cx = cv.getContext('2d');
let W = 860, H = 560, L = null, dpr = 1, k = 1;
function layout() {
  const tall = cv.parentElement.clientWidth < 600;
  W = tall ? 420 : 860; H = tall ? 676 : 560;
  L = tall
    ? { tall, nest: { x: 210, y: 262, s: 1.1 }, pad: { x: 210, y: 160, r: 128 }, house: { x: 10, y: 440, s: 0.625 } }
    : { tall, nest: { x: 158, y: 198, s: 1 }, pad: { x: 158, y: 118, r: 106 }, house: { x: 212, y: 226, s: 1 } };
  dpr = Math.min(2, devicePixelRatio || 1);
  const cssW = cv.parentElement.clientWidth;
  k = cssW / W;
  cv.style.height = `${H * k}px`;
  cv.width = Math.round(W * k * dpr); cv.height = Math.round(H * k * dpr);
  bg = null;
}
const hx = (x, y) => ({ x: L.house.x + x * L.house.s, y: L.house.y + y * L.house.s });

// ---------- Clay ----------
// Every shape is a lump of clay: a soft drop shadow, the base colour, a highlight up and to the left,
// a shade underneath, and a darker seam.
function clay(g, path, col, box, { lift = 3, shine = 0.3, seam = 0.35 } = {}) {
  const [x, y, w, h] = box;
  g.save();
  g.shadowColor = 'rgba(18,6,28,0.55)'; g.shadowBlur = 7; g.shadowOffsetY = lift;
  path(g); g.fillStyle = col; g.fill();
  g.restore();
  g.save();
  path(g); g.clip();
  const r = Math.max(w, h);
  const hi = g.createRadialGradient(x + w * 0.32, y + h * 0.22, 0, x + w * 0.32, y + h * 0.22, r * 0.75);
  hi.addColorStop(0, `rgba(255,255,255,${shine})`); hi.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = hi; g.fillRect(x - 2, y - 2, w + 4, h + 4);
  const lo = g.createLinearGradient(0, y + h * 0.45, 0, y + h);
  lo.addColorStop(0, 'rgba(20,6,30,0)'); lo.addColorStop(1, 'rgba(20,6,30,0.32)');
  g.fillStyle = lo; g.fillRect(x - 2, y - 2, w + 4, h + 4);
  g.restore();
  if (seam) { g.save(); path(g); g.strokeStyle = `rgba(20,6,30,${seam})`; g.lineWidth = 1.2; g.stroke(); g.restore(); }
}
// A wobbly rounded rectangle: clay never comes out square.
function blob(x, y, w, h, r = 6, seed = 1) {
  const j = i => Math.sin(seed * 12.9898 + i * 78.233) * 0.9;
  return g => {
    g.beginPath();
    g.moveTo(x + r, y + j(1));
    g.lineTo(x + w - r, y + j(2));
    g.quadraticCurveTo(x + w + j(3), y, x + w + j(3), y + r);
    g.lineTo(x + w + j(4), y + h - r);
    g.quadraticCurveTo(x + w, y + h + j(5), x + w - r, y + h + j(5));
    g.lineTo(x + r, y + h + j(6));
    g.quadraticCurveTo(x + j(7), y + h, x + j(7), y + h - r);
    g.lineTo(x + j(8), y + r);
    g.quadraticCurveTo(x, y + j(1), x + r, y + j(1));
    g.closePath();
  };
}
const ell = (x, y, rx, ry, rot = 0) => g => { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); };
const lump = (g, x, y, w, h, col, r = 6, seed = 1, o) => clay(g, blob(x, y, w, h, r, seed), col, [x, y, w, h], o);
const ball = (g, x, y, rx, ry, col, o) => clay(g, ell(x, y, rx, ry), col, [x - rx, y - ry, rx * 2, ry * 2], o);

// ---------- Sprites: restyled icons (the car, the cat) and the hand-made pieces ----------
const ART = {};
async function clayIcon(file, col, w, h) {
  const svg = Sprites.recolor(await Sprites.loadSvg(`./art/${file}`), col);
  const src = await Sprites.svgToCanvas(svg, w, h);
  const c = Sprites.canvas(w + 8, h + 8), g = c.getContext('2d');
  g.drawImage(Sprites.silhouette(src, 'rgba(18,6,28,0.6)'), 4, 7);
  g.filter = 'blur(0.6px)'; g.drawImage(src, 4, 4); g.filter = 'none';
  // Shine and shade, only where the icon is.
  g.globalCompositeOperation = 'source-atop';
  const hi = g.createRadialGradient(w * 0.35, h * 0.2, 0, w * 0.35, h * 0.2, w * 0.8);
  hi.addColorStop(0, 'rgba(255,255,255,0.35)'); hi.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = hi; g.fillRect(0, 0, c.width, c.height);
  const lo = g.createLinearGradient(0, h * 0.5, 0, h + 8);
  lo.addColorStop(0, 'rgba(20,6,30,0)'); lo.addColorStop(1, 'rgba(20,6,30,0.4)');
  g.fillStyle = lo; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'source-over';
  return c;
}
async function loadArt() {
  try {
    ART.car = await clayIcon('ph--car-profile-fill.svg', C.steel, 120, 120);
    ART.cat = await clayIcon('ph--cat-fill.svg', C.slate, 46, 46);

}

  const br = Math.min(S.jobs.brood, 28);
  for (let i = 0; i < br; i++) { const p = perch('brood', i, br); drawBird(g, p.x, p.y + Math.sin(t * 2 + i) * 0.6, i, { s: sc, flip: p.flip }); }
  if (S.jobs.brood > 28) label(g, `+${S.jobs.brood - 28}`, L.nest.x - 140 * L.nest.s, L.nest.y - 40);
  const pk = Math.min(S.jobs.pack, 16);
  for (let i = 0; i < pk; i++) { const p = perch('pack', i, pk); drawBird(g, p.x, p.y + (Math.sin(t * 6 + i * 2) > 0.7 ? -2 : 0), i + 3, { s: sc * 0.9, flip: i % 2 === 1 }); }
  if (S.jobs.pack) {
    // The packing pile: rubber bands and the batteries being squeezed.
    const p = hx(278, -64);
    for (let i = 0; i < Math.min(S.lv.bands, 21); i++) { g.strokeStyle = [C.mint, C.pale, C.steel][i % 3]; g.lineWidth = 2; g.beginPath(); g.ellipse(p.x + (i % 7) * 4 - 12, p.y + Math.floor(i / 7) * 3, 5, 2.5, i, 0, TAU); g.stroke(); }
  } else if (S.lv.bands) { const p = hx(278, -64); for (let i = 0; i < Math.min(S.lv.bands, 21); i++) { g.strokeStyle = [C.mint, C.pale, C.steel][i % 3]; g.lineWidth = 2; g.beginPath(); g.ellipse(p.x + (i % 7) * 4 - 12, p.y + Math.floor(i / 7) * 3, 5, 2.5, i, 0, TAU); g.stroke(); } }
  const id = Math.min(E.idle(S), 8) + Math.max(0, S.jobs.carry - S.trips.length > 0 ? 0 : 0);
  for (let i = 0; i < id; i++) { const p = perch('idle', i, id); drawBird(g, p.x, p.y, i + 5, { s: sc * 0.85, flip: p.flip }); }
  // Carriers waiting for a chirp sit on the gutter by the drainpipe.
  const wait = Math.min(S.jobs.carry - S.trips.length, 10);
  for (let i = 0; i < wait; i++) { const p = hx(14 + i * 15, -10); drawBird(g, p.x, p.y, i + 7, { s: sc * 0.85, flip: false }); }
}
function label(g, text, x, y) { g.font = '500 13px Fredoka, sans-serif'; g.textAlign = 'center'; g.fillStyle = C.pale; g.fillText(text, x, y); }
// The feast: birds swarm in, take hold, and lift the nest up past the moon (about seven seconds).
function drawFeast(g, t) {
  const u = Math.min(1, feastT / 7), n = Math.min(S.feast ? S.feast.birds : 48, 40);
  const lift = Math.max(0, (u - 0.45) / 0.55);
  const ox = -lift * (L.tall ? 60 : 120), oy = -lift * (L.nest.y + 80);
  g.save(); g.translate(ox, oy);
  drawNest(g, t, true); drawNest(g, t, false);
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, settle = Math.min(1, u / 0.45);
    const home = { x: L.nest.x + Math.cos(a) * 120 * L.nest.s, y: L.nest.y - 40 + Math.sin(a) * 30 };
    const from = { x: L.nest.x + Math.cos(a) * 500, y: L.nest.y - 200 + Math.sin(a * 3) * 80 };
    const x = from.x + (home.x - from.x) * settle, y = from.y + (home.y - from.y) * settle;
    drawBird(g, x, y + Math.sin(t * 12 + i) * 2, i, { s: L.tall ? 0.8 : 1, flip: Math.cos(a) > 0, flap: Math.sin(t * 22 + i) * 0.7 });
  }
  g.restore();
  if (feastT > 7.5 && !S.ended) endGame(false);
}
// The finished world: the house asleep, the batteries on the sill, the nest and its flock small against the moon.
function drawGone(g, t) {
  const mx = L.tall ? 360 : 790, my = L.tall ? 60 : 62;
  g.save(); g.translate(mx - 70 + Math.sin(t * 0.3) * 6, my + 30); g.scale(0.22, 0.22);
  g.translate(-L.nest.x, -L.nest.y);
  drawNest(g, t, true); drawNest(g, t, false);
  for (let i = 0; i < 24; i++) { const a = i / 24 * TAU; drawBird(g, L.nest.x + Math.cos(a) * 130, L.nest.y - 40 + Math.sin(a) * 34, i, { flap: Math.sin(t * 14 + i) * 0.7 }); }
  g.restore();
  lump(g, L.nest.x - 140 * L.nest.s, L.nest.y + 34 * L.nest.s, L.tall ? 280 : 200, 12, C.steel, 4, 70, { shine: 0.35 });
}
function compose(t) {
  const g = cx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (!bg) background();
  g.drawImage(bg, 0, 0);
  g.setTransform(k * dpr, 0, 0, k * dpr, 0, 0);
  drawHouse(g, t);
  if (S.ended) drawGone(g, t);
  else if (S.feast) drawFeast(g, t);
  else {
    drawNest(g, t, true);
    drawFlock(g, t);
    drawNest(g, t, false);
    drawRune(g, t);
    drawFlights(g, t);
  }
  for (const s of sparks) {
    if (s.t < 0) continue;
    const u = Math.min(1, s.t), x = s.x + (s.tx - s.x) * u * u, y = s.y + (s.ty - s.y) * u * u;
    g.fillStyle = s.seed ? C.pale : C.mint; g.globalAlpha = 1 - u * 0.5;
    g.beginPath(); g.arc(x, y, s.seed ? 1.8 : 2.4, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  for (const f of floats) { g.globalAlpha = Math.max(0, 1 - f.t / 1.4); g.fillStyle = f.color; g.font = '600 15px Fredoka, sans-serif'; g.textAlign = 'center'; g.fillText(f.text, f.x, f.y - f.t * 24); }
  g.globalAlpha = 1;
}

// ---------- Loop ----------
let last = performance.now(), saveAcc = 0, uiAcc = 0, lastFrame = performance.now(), phaseWas = E.phaseKey(S), roomWas = E.room(S), tellAcc = 0;
function step(dt) {
  if (!S.ended && !S.feast) {
    const ev = E.tick(S, dt);
    if (ev.aa > 0) sfx.cell();
    if (ev.chirp.length) { sfx.chirp(); if (!S.chirpTold) { S.chirpTold = 1; say('NARRATOR', `Listen: from the house below, a chirp. It is ${E.DEV[ev.chirp[0]].name}, and its battery is low. The nest, which has a terrible memory for faces, hears a chick. Tap it to feed it a battery.`); } }
    for (const f of ev.fed) fedFx(f.id, f.seed, true);
    if (ev.packed.length) sfx.pack();
    for (const id of ev.gone) { sfx.gone(); if (!S.goneTold || Math.random() < 0.15) { S.goneTold = 1; say('NARRATOR', `Too late for ${E.DEV[id].name}: at dawn, Dad changed the battery himself, from a packet. The nest takes this personally.`); } }
    if (ev.fed.length && (tellAcc += ev.fed.length) >= 12 && Math.random() < 0.3) { tellAcc = 0; say('NARRATOR', `The carrying birds go down the drainpipe and come back up without a word. ${S.fed} mouths fed so far. Nobody has asked them to stop.`); }
  } else if (S.feast && !S.ended) feastT += dt;
  const R = E.room(S);
  if (R !== roomWas && !S.ended) {
    roomWas = R; sfx.room();
    const lines = [, 'The living room is quiet. And then, from upstairs, a new sound: the smoke alarms. Big devices want big batteries: the nest will have to pack them. The flock can pack, and carry, now.',
      'The hallway sleeps. From the garage, a lantern flickers and begins to chirp. Lantern batteries: four 9-volts, packed square. The nest is confident about this.',
      'The garage is quiet. Out on the driveway, the first frost is on the windscreen, and the car will not start. Car batteries: five lanterns. The flock looks at each other.'];
    say('NARRATOR', lines[R]); hud();
  }
  const ph = E.phaseKey(S);
  if (ph !== phaseWas) { phaseWas = ph; refreshMusic(); }
  saveAcc += dt; if (saveAcc > 5) { saveAcc = 0; save(); }
  uiAcc += dt; if (uiAcc > 0.25) { uiAcc = 0; hud(); renderShop(); }
}
function frame(now) {
  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now; lastFrame = now;
  step(dt);
  clock += dt;
  if (autoTrace) {
    autoTrace.u += dt / 1.4;
    const { out } = runeSamples(), i = Math.min(out.length - 1, Math.floor(autoTrace.u * out.length));
    traceMove({ ...out[i] });
    if (autoTrace.u >= 1) { finishTrace(); autoTrace = null; }
  }
  if (trace?.done) { trace.fade -= dt * 2.5; if (trace.fade <= 0) trace = null; }
  castFx = Math.max(0, castFx - dt * 2.2);
  for (const s of sparks) s.t += dt * 1.8;
  for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].t >= 1) sparks.splice(i, 1);
  for (const f of floats) f.t += dt;
  for (let i = floats.length - 1; i >= 0; i--) if (floats[i].t >= 1.4) floats.splice(i, 1);
  compose(clock);
  requestAnimationFrame(frame);
}
// In a background tab rAF stops: keep the house ticking on a timer.
setInterval(() => {
  const now = performance.now();
  if (now - lastFrame < 400) return;
  const dt = Math.min(1, (now - last) / 1000); last = now;
  step(dt);
}, 250);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('resize', () => { const w = cv.parentElement.clientWidth; if (Math.abs(w / k - W) > 1) { layout(); RS = null; } });

// ---------- Start ----------
layout();
loadArt().then(() => {
  if (!Sprites.sheetRequested()) return;
  const reg = (name, w, h, f) => { const c = Sprites.canvas(w * 2, h * 2), q = c.getContext('2d'); q.fillStyle = C.deep; q.fillRect(0, 0, c.width, c.height); q.scale(2, 2); f(q); Sprites.register(name, c); };
  const keep = JSON.stringify(S);
  const all = () => { Object.assign(S.one, { scarf: true, tags: true, luggage: true, postcard: true, handles: true, drawing: true }); S.lv.lining = 20; S.lv.lullaby = 3; S.rune = 3; S.stock = { aa: 9, v9: 4, lan: 2, car: 1 }; };
  all();
  reg('the nest, everything bought', 300, 140, q => { q.translate(150 - L.nest.x, 80 - L.nest.y); const s0 = L.nest.s; L.nest.s = 1; drawNest(q, 0, true); drawNest(q, 0, false); L.nest.s = s0; });
  for (let i = 0; i < 5; i++) reg(`bird ${i + 1}${i === 4 ? ' (with name tag)' : ''}`, 40, 30, q => drawBird(q, 20, 17, i, { tag: i === 4 }));
  reg('carrying a 9-volt', 44, 34, q => drawBird(q, 18, 16, 1, { carry: 'v9', flap: 0.5 }));
  for (const t of E.TIERS) reg(E.TIER[t].name, 46, 40, q => drawBattery(q, 23, 22, t, 1));
  reg('feeder (level 14)', 80, 80, q => { const f = S.lv.feeder, sd = S.seed; S.lv.feeder = 14; S.seed = 600; q.translate(-412, -20); drawFeeder(q, 0); S.lv.feeder = f; S.seed = sd; });
  reg('Priya', 50, 70, q => drawPriya(q, 25, 22, 0));
  reg('a chirp (wants a lantern battery)', 70, 60, q => { const st = S.dev.lantern; S.dev.lantern = { c: 1, left: 30, q: 0 }; q.translate(35, 30); q.scale(1, 1); const hs = L.house; L.house = { x: 0, y: 0, s: 1 }; drawChirp(q, E.DEV.lantern, 0, 40, 0); L.house = hs; S.dev.lantern = st; });
  if (ART.car) Sprites.register('the car (restyled Phosphor icon)', ART.car);
  if (ART.cat) Sprites.register('the cat (restyled Phosphor icon)', ART.cat);
  Object.assign(S, JSON.parse(keep));
  Sprites.showSheet({ zoom: 2 });
});
// Away: the flock keeps working, slowly (they're resting up for the flight).
if (!S.ended && !S.feast && S.savedAt) {
  const r = E.away(S, (Date.now() - S.savedAt) / 1000);
  if (r && (r.fed || r.aa > 0)) say('WHILE YOU WERE AWAY', `${r.sec >= 5400 ? `${Math.round(r.sec / 3600)} hours` : `${Math.max(1, Math.round(r.sec / 60))} minutes`} away. The birds kept on, slowly: ${r.fed ? `${r.fed} mouths fed for ${fmt(r.seed)} seed` : 'nothing fed'}${r.missed ? `, ${r.missed} left to Dad` : ''}${r.aa > 0 ? `, ${r.aa} more cells warmed` : ''}.`);
}
if (S.ended) { endGame(true); say('NARRATOR', 'The gutter is empty. It is, for once, supposed to be.'); }
else if (S.feast) { feastT = 7; }
else if (!S.casts) say('NARRATOR', 'Here, in the gutter of a house on a cold autumn night, an empty nest. Its chicks flew south in September. It cannot remember their faces. It still wants to feed something. Trace the rune in its twigs.');
else if (!$('log').textContent) say('NARRATOR', 'Back in the gutter. The house below is breathing, and somewhere in it, something is about to chirp.');
save();
hud(); renderShop();
document.fonts?.ready.then(() => { layout(); RS = null; });
if (DEBUG) {
  Object.assign(window.__game, { doCast, startFeast, endGame, tapChirp });
  // The rune's path in page coordinates, for test scripts that trace it with a real pointer.
  window.__runePath = () => { const r = cv.getBoundingClientRect(); return runePts().map(p => [r.left + p.x * r.width / W, r.top + p.y * r.height / H]); };
}
requestAnimationFrame(frame);
</script>

<style>
  /* Watercolor, in Citrink: indigo night washes on white paper, citrus stars, lime and green ink. */
  :root {
    --white: #ffffff; --yellow: #fcf660; --lime: #b2d942; --green: #52c33f; --teal: #166e7a; --blue: #254d70; --indigo: #252446; --deep: #201533;

  }
  html, body { background: var(--deep); color: var(--white); }
  [hidden] { display: none !important; }
  body {
    margin: 0; font: 16px/1.4 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(10px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
    background-image: radial-gradient(ellipse at 20% 0%, #254d7055 0, transparent 55%), radial-gradient(ellipse at 90% 30%, #166e7a33 0, transparent 50%);
  }
  .wrap { max-width: 1140px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 2px 0 8px; }
  h1 { font: 400 36px/1.05 var(--head); margin: 0; color: var(--yellow); letter-spacing: .5px; text-shadow: 2px 3px 0 #25244699; transform: rotate(-1.2deg); }
  header p { margin: 0; font-size: 15px; color: var(--lime); }
  header p b { color: var(--white); font-weight: 800; }
  .onair { display: inline-block; font: 800 11px/1 var(--body); letter-spacing: 1.5px; color: var(--deep); background: var(--yellow); padding: 3px 6px 2px; border-radius: 3px; margin-right: 6px; vertical-align: 2px; }
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 292px; gap: 18px; align-items: start; }
  @media (max-width: 760px) { .game { grid-template-columns: 1fr; } h1 { font-size: 29px; } }
  main { min-width: 0; }

  /* Paper cards with a soft watercolor edge. */
  .paper { background: var(--paper); color: var(--deep); border-radius: 10px 14px 9px 13px; box-shadow: 0 0 0 2px #b2d94255, 3px 4px 0 #0000004d; }

  .hud { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; margin-bottom: 8px; }
  .meter { position: relative; height: 30px; background: var(--indigo); border-radius: 15px; overflow: hidden; box-shadow: inset 0 0 0 2px var(--blue); }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 15px; transition: width .6s;
    background: linear-gradient(90deg, #166e7acc, #52c33fcc 60%, #b2d942); }

  .meter span { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font: 700 14px var(--body); white-space: nowrap; color: var(--white); text-shadow: 0 1px 2px var(--deep); }
  @media (max-width: 560px) { .hud { grid-template-columns: 1fr; } .meter span em:last-child { display: none; } .meter span { justify-content: center; } }
  .meter span em { font-style: normal; }
  .cash { display: flex; gap: 14px; align-items: baseline; font: 400 22px/1 var(--head); white-space: nowrap; }
  .cash .st { color: var(--white); }
  .cash .sr { color: var(--yellow); }
  .sub { grid-column: 1 / -1; display: flex; gap: 2px 14px; flex-wrap: wrap; align-items: center; font-size: 14px; color: #ffffffcc; min-height: 20px; }

  .stagewrap { position: relative; }

  canvas#stage:focus-visible { outline: 3px dashed var(--yellow); outline-offset: 3px; }

  .log { margin: 12px 2px 0; min-height: 2.8em; font-size: 16px; padding: 9px 16px 10px; }
  .log b { font: 800 11px var(--body); letter-spacing: 1.2px; color: var(--paper); background: var(--blue); padding: 2px 7px 1px; margin-right: 8px; border-radius: 3px; text-transform: uppercase; }
  .log b.air { background: var(--teal); }
  .log b.call { background: var(--green); color: var(--deep); }
  .log b.board { background: var(--deep); color: var(--yellow); }
  .log.fresh { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translateY(3px); opacity: .5; } }

  aside { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; scrollbar-width: thin; padding: 2px 6px 8px 2px; }
  @media (max-width: 760px) { aside { position: static; max-height: none; overflow: visible; } }
  aside h2 { font: 400 23px/1 var(--head); margin: 2px 0 9px; color: var(--yellow); }
  #afford { font: 700 14px var(--body); color: var(--lime); }
  #calls { display: grid; gap: 8px; margin-bottom: 10px; }
  #calls:empty { display: none; }
  .call { text-align: left; font: 14px/1.25 var(--body); color: var(--deep); background: var(--yellow); border: 0; border-radius: 9px 12px 8px 11px; padding: 8px 12px 9px; cursor: pointer; box-shadow: 0 0 0 2px var(--deep), 0 0 0 4px var(--yellow); }

  .tab .dot { position: absolute; top: -4px; right: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--yellow); }
  .tab:focus-visible { outline: 3px dashed var(--yellow); outline-offset: 2px; }
  #shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 760px) and (min-width: 520px) { #shop { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .up {
    position: relative; display: flex; flex-direction: column; min-width: 0; text-align: left; font: 14px/1.15 var(--body); color: var(--blue);
    background: var(--paper); border: 0; border-radius: 8px 11px 7px 10px; padding: 7px 10px 8px; cursor: pointer; box-shadow: inset 0 0 0 2px #254d7044;
  }
  .up b { font-weight: 800; font-size: 14px; color: var(--deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up.can { box-shadow: inset 0 0 0 2px var(--green), 0 0 0 2px var(--deep), 0 0 0 4px var(--lime); }
  .up.can em { color: var(--teal); font-weight: 800; }
  .up[aria-disabled="true"] { cursor: default; }
  .up[aria-disabled="true"]:not(.can) { opacity: .62; }
  .up.odd { background: #fffde0; }
  .up.form { background: #eef6df; }
  .up.form::before { content: attr(data-no); position: absolute; top: 3px; right: 6px; font: 800 9px var(--body); letter-spacing: 1px; color: var(--teal); }
  .up .tag { position: absolute; top: -9px; right: 6px; font: 400 12px var(--head); font-style: normal; color: var(--deep); background: var(--yellow); padding: 0 6px 1px; border-radius: 3px; transform: rotate(4deg); }
  .up.new { animation: pulse 1.4s ease-in-out 4; }
  @keyframes pulse { 50% { box-shadow: inset 0 0 0 2px var(--yellow), 0 0 0 6px var(--yellow); } }
  .up:focus-visible, .bought:focus-visible { outline: 3px dashed var(--yellow); outline-offset: 2px; }
  #tip {
    position: fixed; z-index: 50; width: 274px; padding: 11px 15px 12px; pointer-events: none; font: 15px/1.35 var(--body); color: var(--deep);
    background: var(--paper); border-radius: 10px 14px 9px 13px; box-shadow: 0 0 0 2px var(--teal), 6px 7px 0 2px #00000055;
  }
  #tip b { display: block; font: 400 19px/1.15 var(--head); color: var(--teal); margin-bottom: 4px; }
  #tip .fx { display: block; margin-top: 6px; padding: 3px 8px; background: #b2d94244; border-radius: 6px; font-weight: 800; color: var(--blue); }
  #tip .void { display: block; margin-top: 6px; font-size: 13px; font-weight: 700; color: #7a2d6a; }
  #tip i { display: block; margin-top: 6px; padding-top: 5px; border-top: 2px dotted #166e7a66; }
  #tip small { display: block; margin-top: 6px; font: 800 14px var(--body); color: var(--teal); }
  #tip.inline { position: relative; width: auto; margin-top: 10px; box-shadow: 0 0 0 2px var(--teal); }
  #bought { margin: 12px 0 2px; }
  #bought summary { display: flex; align-items: center; gap: 6px; font: 400 18px/1 var(--head); color: var(--yellow); cursor: pointer; list-style: none; padding: 3px 2px; }
  #bought summary::-webkit-details-marker { display: none; }
  #bought summary::before { content: "\25B8"; font-size: 14px; color: var(--lime); transition: transform .2s; }
  #bought[open] summary::before { transform: rotate(90deg); }
  #bought summary:focus-visible { outline: 3px dashed var(--yellow); outline-offset: 2px; }
  .shelf { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 2px 2px; }
  .bought { max-width: 100%; font: 700 13px/1.2 var(--body); color: var(--deep); background: var(--paper); border: 0; border-radius: 6px; box-shadow: inset 0 0 0 2px #166e7a55; padding: 3px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bought.odd { background: #fffde0; box-shadow: inset 0 0 0 2px #b2d942; }
  .bought:hover, .bought.on { box-shadow: inset 0 0 0 2px var(--green); }

  #ending { margin: 22px auto 0; max-width: 700px; text-align: center; padding: 18px 26px 24px; }
  #ending h2 { font: 400 38px/1.1 var(--head); margin: 2px 0 8px; color: var(--teal); }
  #ending p { margin: 8px 0; text-align: left; }
  #ending .memo { font-size: 14px; color: var(--blue); background: #b2d94233; padding: 8px 12px; border-radius: 6px; }
  #shareBtn, #againBtn { font: 400 19px var(--head); color: var(--deep); background: var(--yellow); border: 0; border-radius: 9px 12px 8px 11px; box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--deep); padding: 6px 18px; margin: 14px 6px 0; cursor: pointer; }
  #againBtn { background: var(--lime); }
  #shareBtn:focus-visible, #againBtn:focus-visible { outline: 3px dashed var(--teal); outline-offset: 6px; }
  @media (prefers-reduced-motion: reduce) { .up.new, .call.ready, .log.fresh { animation: none; } .meter i, #bought summary::before { transition: none; } }

<body>

  </header>
  <div class="game">
    <main>
      <div class="hud">
        <div class="meter" id="meter" title="Form F-88, Replacement of a Sky: every constellation out in the dome. The ticks are where the Board sends a new form."><i id="meterFill"></i><span><em id="meterL">F-88: 0 / 88 constellations</em><em id="meterR"></em></span></div>
        <div class="cash"><span class="st" id="cashSt" title="Specks of static, collected at the hand-pour spout">0 static</span><span class="sr" id="cashSr" title="Woven stars">0 ★</span></div>

<script type="module">
import { createAudio, scale } from '/shared/kit/audio.mjs';
import { createMusic } from '/shared/kit/music.mjs';
import { createSoundtrack } from './music.mjs';
import * as Sprites from '/shared/kit/sprites.mjs';
import * as Fx from '/shared/kit/fx.mjs';
import * as E from './economy.mjs';

const $ = id => document.getElementById(id);
const fmt = E.fmt;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG = location.search.includes('debug');
const C = { white: '#ffffff', yellow: '#fcf660', lime: '#b2d942', green: '#52c33f', teal: '#166e7a', blue: '#254d70', indigo: '#252446', deep: '#201533', paper: '#fbfbf4' };
const HEAD = "'Permanent Marker', 'Comic Sans MS', cursive", BODY = "'Nunito', system-ui, sans-serif";

// ---------- State ----------
const KEY = window.DailyGame ? DailyGame.storageKey('save') : 'di:22:save';
let raw = null;
try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const S = E.load(raw);
if (!raw) S.static = 200;
const save = () => { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Sound: C whole tone, like the music ----------
const A = createAudio({ sfxTrim: 2.77, musicTrim: 4.2 });
const notes = scale('whole tone', 60);
const gate = {};
const every = (k, ms) => { const t = performance.now(); if (t - (gate[k] || 0) < ms) return false; gate[k] = t; return true; };
const sfx = {
  // Holding the pour: a soft hiss of static with a tone that climbs as the star fills.
  hiss(level = 0.5) { if (!every('hiss', 85)) return; A.noiseHit('shaker', { vol: 0.0931, dur: 0.12 }); A.tone({ type: 'sine', freq: notes(Math.round(level * 8) + 4), dur: 0.05, vol: 0.0665 }); },
  // Let go: a pluck for a good star, a little run for a perfect one.
  fill() { A.tone({ type: 'pluck', freq: notes(7), dur: 0.12, vol: 0.17 }); A.tone({ type: 'bell', freq: notes(9), dur: 0.14, vol: 0.0896, at: A.now + 0.06 }); },
  perfect() { [6, 8, 10, 12].forEach((d, i) => A.tone({ type: 'bell', freq: notes(d), dur: 0.16, vol: 0.11, at: A.now + i * 0.05 })); },
  spill() { A.tone({ type: 'triangle', freq: notes(5), dur: 0.18, vol: 0.0996, glide: 0.6 }); A.noiseHit('shaker', { vol: 0.0996, dur: 0.3 }); },
  dry() { if (!every('dry', 400)) return; A.noiseHit('snare', { vol: 0.096, dur: 0.06 }); A.tone({ type: 'triangle', freq: notes(1), dur: 0.06, vol: 0.16 }); },
  // Stringing a constellation: stars clicked onto a wire, one note per star.
  string(n = 5) { for (let i = 0; i < Math.min(n, 8); i++) A.tone({ type: 'pluck', freq: notes(4 + i), dur: 0.08, vol: 0.1353, at: A.now + i * 0.045 }); },
  // A constellation comes out: a slow whole-tone shimmer.
  out() { if (!every('out', 600)) return; [0, 2, 4, 6].forEach((d, i) => A.tone({ type: 'bell', freq: notes(d + 8), dur: 0.5, vol: 0.084, at: A.now + i * 0.12 })); },
  // The funnels and TVs working on their own: an occasional soft tick.
  idle() { A.tone({ type: 'sine', freq: notes(11), dur: 0.05, vol: 0.108 }); A.noiseHit('hat', { vol: 0.072 }); },
  buy() { [0, 2, 4, 6].forEach((d, i) => A.tone({ type: 'pluck', freq: notes(d + 5), dur: 0.12, vol: 0.1296, at: A.now + i * 0.06 })); },
  unlock() { A.tone({ type: 'bell', freq: notes(10), dur: 0.3, vol: 0.135 }); A.tone({ type: 'bell', freq: notes(12), dur: 0.4, vol: 0.108, at: A.now + 0.12 }); },
  // Florence: a thump on the desk and a bright bell.
  stamp() { A.noiseHit('kick', { vol: 0.18 }); A.tone({ type: 'bell', freq: notes(9), dur: 0.3, vol: 0.108, at: A.now + 0.05 }); A.tone({ type: 'bell', freq: notes(13), dur: 0.4, vol: 0.063, at: A.now + 0.15 }); },
  deny() { A.tone({ type: 'triangle', freq: notes(-2), dur: 0.07, vol: 0.196 }); },
  // Laying tape: a click per cell.
  tape() { if (!every('tape', 40)) return; A.tone({ type: 'pluck', freq: notes(8 + Math.floor(Math.random() * 3)), dur: 0.04, vol: 0.136 }); },
  // The Request Line: a phone ring.
  ring() { for (let i = 0; i < 4; i++) A.tone({ type: 'square', freq: i % 2 ? notes(10) : notes(9), dur: 0.05, vol: 0.14, cutoff: 2500, at: A.now + i * 0.07 }); },
  // The send-off: a march fanfare.
  fanfare() {
    [0, 2, 4, 6, 4, 6, 8].forEach((d, i) => A.tone({ type: 'pluck', freq: notes(d + 4), dur: 0.16, vol: 0.144, at: A.now + i * 0.13 }));
    [6, 10].forEach((d, i) => A.tone({ type: 'bell', freq: notes(d + 4), dur: 0.7, vol: 0.084, at: A.now + 0.95 + i * 0.25 }));
  },
  finale() {
    for (let i = 0; i < 13; i++) A.tone({ type: 'bell', freq: notes(i), dur: 0.3, vol: 0.098, at: A.now + i * 0.08 });
    [0, 2, 4].forEach(d => A.tone({ type: 'pad', freq: notes(d - 6), dur: 2.8, vol: 0.014, attack: 0.6, release: 1.8, cutoff: 900, at: A.now + 1 }));
    A.tone({ type: 'bell', freq: notes(14), dur: 1.4, vol: 0.098, at: A.now + 1.2 });
  },
};
if (DEBUG) window.__game = { A, sfx, long: ['finale', 'fanfare'], S: () => S, E };

// ---------- Music: one synthwave piece, arranged per stretch of the night ----------
let music = null, soundtrack = null;
const phaseKey = () => E.phase(S);
function song() { return (soundtrack ??= createSoundtrack(music.strudel))(phaseKey()); }
createMusic(A, { song }).then(m => { music = m; music.update(); if (DEBUG) window.__game.music = m; }).catch(e => console.warn('music', e));
const refreshMusic = () => { if (music) music.update(); };

// ---------- Watercolor ----------
let seed = 22;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const hexA = (h, a) => h + Math.round(a * 255).toString(16).padStart(2, '0');
// Paints a shape flat on its own sheet, then lets it bleed: soft edges with pigment pooled at the rim.
function paint(w, h, draw, { bleed = 1.6, edge = 0.3 } = {}) {
  const c = Sprites.canvas(w, h), x = c.getContext('2d');
  draw(x);
  const washed = Fx.wash(c, { bleed, edge });
  const out = Sprites.canvas(w, h), o = out.getContext('2d');
  const p = (washed.width - w) / 2;
  o.drawImage(washed, -p, -p);
  return out;
}
// A loose wash: overlapping soft blobs of one color.
function blobs(x, cx, cy, rx, ry, color, n = 14, a = 0.08) {
  for (let i = 0; i < n; i++) {
    const r = (0.4 + rnd() * 0.6);
    x.fillStyle = hexA(color, a * (0.6 + rnd() * 0.8));
    x.beginPath(); x.ellipse(cx + (rnd() - 0.5) * rx, cy + (rnd() - 0.5) * ry, rx * r, ry * r, rnd() * 3, 0, 7); x.fill();
  }
}
// Paper grain over everything.
function grainLayer(w, h, alpha = 0.06) {
  const c = Sprites.canvas(w, h), x = c.getContext('2d'), d = x.createImageData(w, h);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (rnd() - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255 * alpha * rnd(); }
  x.putImageData(d, 0, 0); return c;
}
function starPath(x, cx, cy, R, r = R * 0.45, pts = 5, rot = -Math.PI / 2) {
  x.beginPath();

// Where each constellation sits in the dome: best-candidate scatter, fixed forever.
const CONS_AT = (() => {
  let s = 88; const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const pts = [];
  const inside = (x, y) => ((x - DOME.cx) / (DOME.rx - 30)) ** 2 + ((y - DOME.cy) / (DOME.ry - 28)) ** 2 < 1 && y < 248 && !(Math.abs(x - 380) < 60 && y > 196);
  for (let k = 0; k < E.TOTAL; k++) {
    let best = null, bd = -1;
    for (let t = 0; t < 40; t++) {
      const x = 30 + r() * 700, y = 20 + r() * 230;
      if (!inside(x, y)) { t--; continue; }
      const d = Math.min(1e9, ...pts.map(p => (p.x - x) ** 2 + ((p.y - y) * 1.3) ** 2));
      if (d > bd) { bd = d; best = { x, y }; }
    }
    const n = E.CONS[k].n, stars = [];
    let a = r() * 6.28, px = 0, py = 0;
    for (let i = 0; i < n; i++) { stars.push([px, py, 1.6 + r() * 2.2]); a += (r() - 0.5) * 2.2; const d = 8 + r() * 9; px += Math.cos(a) * d; py += Math.sin(a) * d * 0.8; }
    const mx = stars.reduce((m, p) => m + p[0], 0) / n, my = stars.reduce((m, p) => m + p[1], 0) / n;
    pts.push({ x: best.x, y: best.y, stars: stars.map(([x, y, z]) => [x - mx, y - my, z]) });
  }
  return pts;
})();

  }

}

// ---------- Pouring ----------
let pour = null, pourFx = [], lastPour = null;
const starTop = () => STAR.y - STAR.R, starBot = () => STAR.y + STAR.R * 0.81;
function drawStation(x) {
  const { x: cx, y: cy, R } = STAR;
  // the spout: a curl of tape from the cassette down to above the star
  const big = S.form.t1 === 'b';
  x.strokeStyle = C.deep; x.lineWidth = big ? 9 : 5; x.lineCap = 'round';
  x.beginPath(); x.moveTo(TAPE.x + 4, TAPE.y + 34); x.bezierCurveTo(TAPE.x + 30, TAPE.y + 54, cx - 20, starTop() - 34, cx, starTop() - 16); x.stroke();
  x.fillStyle = C.deep; x.beginPath(); x.ellipse(cx, starTop() - 14, big ? 12 : 7, big ? 6 : 4, 0, 0, 7); x.fill();
  // the stream
  if (pour && !pour.dry) {
    for (let i = 0; i < 26; i++) {
      const yy = starTop() - 12 + ((clock * 260 + i * 17) % (starBot() - starTop() + 12));
      if (yy > starBot() - (starBot() - starTop()) * Math.min(1, pour.level)) continue;
      x.fillStyle = i % 3 ? hexA(C.white, 0.85) : hexA(C.lime, 0.8);
      x.fillRect(cx - 4 + Math.sin(i * 7.3 + clock * 20) * (big ? 6 : 3), yy, 2, 2);
    }
  }
  // the frame and its fill
  const level = pour ? pour.level : lastPour ? lastPour.level * Math.max(0, 1 - lastPour.t * 1.5) : 0;
  x.save(); starPath(x, cx, cy, R); x.clip();
  x.fillStyle = hexA(C.indigo, 0.85); x.fillRect(cx - R, cy - R, R * 2, R * 2);
  if (level > 0) {
    const top = starBot() - (starBot() - starTop()) * Math.min(1, level);
    const perfectNow = Math.abs(level - E.LINE) <= E.perfectBand(S);
    x.fillStyle = perfectNow ? hexA(C.yellow, 0.95) : hexA(C.paper, 0.85);
    x.fillRect(cx - R, top, R * 2, starBot() - top);
    for (let i = 0; i < 60; i++) { x.fillStyle = hexA(i % 2 ? C.deep : C.lime, 0.3); x.fillRect(cx - R + ((i * 37 + clock * 90) % (R * 2)), top + ((i * 53) % Math.max(1, starBot() - top)), 2, 2); }
  }
  x.restore();
  // the perfect band and the line
  const lineY = starBot() - (starBot() - starTop()) * E.LINE, band = (starBot() - starTop()) * E.perfectBand(S);
  x.fillStyle = hexA(C.yellow, 0.12); x.fillRect(cx - R - 14, lineY - band, R * 2 + 28, band * 2);
  x.setLineDash([6, 4]); x.strokeStyle = C.yellow; x.lineWidth = 2; x.beginPath(); x.moveTo(cx - R - 14, lineY); x.lineTo(cx + R + 14, lineY); x.stroke(); x.setLineDash([]);
  label(x, 'line', cx + R + 24, lineY, { size: 11, color: C.yellow });
  // the woven frame on top
  x.save(); starPath(x, cx, cy, R); x.strokeStyle = C.deep; x.lineWidth = 7; x.lineJoin = 'round'; x.stroke();
  x.strokeStyle = hexA(C.blue, 0.9); x.lineWidth = 2; x.stroke();
  // Finer Weave: a cross-strip of tape for every level, round the frame
  starPath(x, cx, cy, R); x.clip();
  x.strokeStyle = hexA(C.deep, 0.55); x.lineWidth = 2;
  for (let i = 0, n = Math.min(24, S.lv.frame); i < n; i++) { const a = i / Math.max(1, n) * Math.PI * 2 + 0.3, r0 = R * 0.2; x.beginPath(); x.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); x.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); x.stroke(); }
  x.restore();
  // the spill
  if (pour && pour.level > 1) for (let i = 0; i < 16; i++) { x.fillStyle = hexA(C.paper, 0.8); x.fillRect(cx - R + ((i * 29) % (R * 2)), starTop() + ((clock * 140 + i * 23) % (R * 2)), 2, 2); }
  // the hint
  if (S.pours < 3 && !pour) label(x, 'hold to pour · let go at the line', cx, cy + R + 6, { size: 12, color: C.yellow });
}
function startPour() {

function endPour() {

  if (!it.inline) for (const o of document.querySelectorAll('.bought.on')) o.classList.remove('on');
  if (inline) { if (tip.previousElementSibling !== $('bought')) $('bought').after(tip); } else if (tip.parentElement !== document.body) { document.body.append(tip); tipMoved = performance.now(); }

function hideTip(force) {

}
let tipMoved = 0;
addEventListener('scroll', () => { if (performance.now() - tipMoved > 400) hideTip(); }, true);
addEventListener('resize', () => { if (innerWidth > 760) hideTip(true); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.up, .call, .bought')) hideTip(); });
const explained = new Set();
function wireTip(b, info, act) {
  b.setAttribute('aria-describedby', 'tip');

// ---------- The Bought shelf ----------
const shelfEl = $('bought');
shelfEl.open = !!S.boughtOpen;
shelfEl.addEventListener('toggle', () => {
  if (!shelfEl.open) hideTip(true);
  if (!!S.boughtOpen === shelfEl.open) return;
  S.boughtOpen = shelfEl.open; save();
});
let shelfSig = null;
function renderShelf() {
  const list = S.ended ? [] : E.bought(S);
  const sig = list.map(i => i.id).join('|');
  if (sig === shelfSig) return;
  shelfSig = sig;
  shelfEl.hidden = !list.length;
  $('boughtN').textContent = list.length;
  $('shelf').replaceChildren(...list.map(it => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'bought' + (it.odd ? ' odd' : '');
    b.textContent = it.odd ? `✶ ${it.name}` : it.name; b.dataset.id = it.id;
    b.setAttribute('aria-describedby', 'tip');
    const show = () => { hideTip(true); b.classList.add('on'); showTip(b, { id: 'bought:' + it.id, name: it.name, desc: it.desc, joke: it.joke, foot: it.odd ? 'Bought · does very little · it’s in the booth' : 'Filed and stamped · it’s in the booth', inline: true }); };
    b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') show(); });
    b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
    b.addEventListener('focus', () => { if (!b.dataset.touch) show(); });
    b.addEventListener('blur', hideTip);
    b.addEventListener('pointerdown', e => { b.dataset.touch = e.pointerType !== 'mouse' ? '1' : ''; });
    b.addEventListener('click', () => { if (tipFor === 'bought:' + it.id && b.dataset.touch) hideTip(true); else show(); });

}
const MACH_LINES = {
  tv: n => n === 1 ? 'A TV, tuned to nothing, plugged in beside the VCR. Hear that hiss? That’s static, free, forever. It hums along to the show, too.' : n === 5 ? 'Five TVs. They’ve started humming in harmony. It’s whole-tone. It’s a little eerie. I love it.' : null,
  funnel: n => n === 1 ? 'A funnel on the tape! Static that passes it gets poured into stars on its own. Whatever gets past the last funnel still reaches my spout for hand-pouring.' : null,
  rew: n => n === 1 ? 'A rewinder on the line. Static that runs through it plays twice. Put it after the TVs, before the funnels.' : null,
  loom: n => n === 1 ? 'A loom on the line. Stars that pass it get re-woven tighter. It wants to sit after the funnels.' : null,
};
function doBuy(id) {
  const it = E.find(S, id);
  if (!E.buy(S, id)) { sfx.deny(); return; }
  delete newUntil[id];
  hideTip();
  if (it.kind === 'form') {
    stampAnim();
    const f = it.form, o = f.single ? { name: f.title, joke: f.joke } : f.opts[it.opt];
    say('board', 'FLORENCE', `Form ${f.no}: ${f.single ? 'APPROVED' : `“${o.name}”, APPROVED. The other box is VOID`}. ${o.joke}`);
    if (id === 'permit') { setTimeout(() => say('air', 'THE TAPE', 'The floor is open! The tape runs from the reel by the VCR to the hatch up to the dome. Drag from the reel to lay it through more cells. Drag a stack to move it. Static flows from the reel end: TVs first, funnels after.'), 4500); refreshMusic(); }
    if (id.startsWith('t4') || id.startsWith('t7')) boothBg = null;
  } else {
    sfx.buy();
    if (it.kind === 'one') { const o = E.ONE_BY_ID[id]; say('air', 'THE TAPE', o.joke); floatAt(380, 300, 'ta-da!', C.yellow, 16); }
    else if (it.kind === 'mach') { const l = MACH_LINES[id]?.(S.own[id]); if (l) say('air', 'THE TAPE', l); }
    else if (it.kind === 'level' && (S.lv[id] === 1 || S.lv[id] % 10 === 0)) say('air', 'THE TAPE', `${E.LEVELS[id].name}, level ${S.lv[id]}. ${E.LEVELS[id].joke}`);
  }
  save(); renderShop(); hud(); renderCalls();
}

// ---------- The ending ----------
function end(resumed) {
  S.ended = true; S.finale = false; save();
  $('ending').hidden = false;
  const h = Math.floor(S.t / 3600), m = Math.floor((S.t % 3600) / 60);
  $('endText').textContent = 'Every night since, the dome has shown its own woven sky, all 88 constellations, right on time, and Bylaw 1 has never been better kept. There is nobody inside to see it. The tape, the TVs, Florence, the old projector and every seat in row 14 are lying in a field on the hill, looking up at a sky that has never once been a rerun.';
  $('endMemo').textContent = `Form F-88, stamped. ${fmt(S.allStars)} stars woven from ${fmt(S.allStatic)} specks of static, ${fmt(S.pours)} hand pours (${fmt(S.perfects)} perfect), ${h ? `${h} h ` : ''}${m} min on the air.`;
  hideTip(true); renderShop(); renderCalls(); hud(); refreshMusic();
  if (!resumed) {
    sfx.finale();
    if (window.DailyGame) DailyGame.finish({ lines: [`📼 ${h ? `${h}h` : ''}${String(m).padStart(h ? 2 : 1, '0')}m on the air`, `✨ 88 constellations · ${fmt(S.allStars)} stars`, `🎉 a parade of ${marchers().length}`, '🚫 no reruns'] });
  }
}
document.getElementById('shareBtn').addEventListener('click', () => window.DailyGame && DailyGame.share());

// ---------- Loop ----------
let last = performance.now(), saveAcc = 0, uiAcc = 0, lastFrame = performance.now(), phaseWas = phaseKey(), idleAcc = 0, djT = 200;
function step(dt) {
  if (finale) stepFinale(dt);
  else if (!S.ended) {
    stepPour(dt);
    const ev = E.tick(S, dt);
    for (const kk of ev.came) cameOut(kk);
    if (ev.came.length) { renderCalls(); if (S.out >= E.TOTAL) { stampAnim(); say('board', 'FLORENCE', 'Form F-88, Replacement of a Sky: all 88 constellations, out and accounted for. APPROVED. (I stamped it very gently.) You’re free to go, dear.'); } }
    if (ev.stars > 0) { idleAcc += dt; if (idleAcc > 7) { idleAcc = 0; sfx.idle(); const [hx, hy] = hatchXY(); floatAt(hx, hy - 30, `+${fmt(E.flow(S).stars * 7)} ★`, C.yellow, 12); } }
    stepCalls(dt);
    djT -= dt;
    if (djT < 0 && S.t - lastSay > 60) { djT = 220 + rnd() * 120; say('air', 'THE TAPE', DJ[Math.floor(S.t / 200) % DJ.length]); }
  }
  const ph = phaseKey();
  if (ph !== phaseWas) { phaseWas = ph; refreshMusic(); }
  saveAcc += dt; if (saveAcc > 5) { saveAcc = 0; if (!finale) save(); }
  uiAcc += dt; if (uiAcc > 0.25) { uiAcc = 0; hud(); renderShop(); renderCalls(); }
}
function frame(now) {
  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now; lastFrame = now;
  step(dt);
  clock += dt;
  blink = blink > 0 ? blink - dt : (Math.random() < dt * 0.25 ? 0.12 : 0);
  yawn = yawn > 0 ? yawn - dt * 0.5 : (!pour && Math.random() < dt * 0.02 ? 1 : 0);
  mood = Math.max(0, mood - dt);
  florence.lift = florence.t > 0 ? Math.sin((0.6 - florence.t) / 0.6 * Math.PI) : 0; florence.t = Math.max(0, florence.t - dt);
  if (lastPour) lastPour.t += dt;
  stepParticles(dt);
  for (const f of floats) f.t += dt;
  for (let i = floats.length - 1; i >= 0; i--) if (floats[i].t > 1.4) floats.splice(i, 1);

}

setInterval(() => {

}, 250);
addEventListener('pagehide', save);

addEventListener('resize', layout);

makeSprites();
{

  }
}
